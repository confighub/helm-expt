apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "jaegertracing-jaeger-operator"
  version: "2.57.0"
spec:
  bases:
    -
      default: true
      description: "jaegertracing/jaeger-operator default variant rendered from jaegertracing/jaeger-operator@2.57.0"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD certificates.cert-manager.io"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD issuers.cert-manager.io"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
      name: "default"
      path: "bases/default"
    -
      description: "jaegertracing/jaeger-operator no-crds variant rendered from jaegertracing/jaeger-operator@2.57.0"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD jaegers.jaegertracing.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD certificates.cert-manager.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD issuers.cert-manager.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
      name: "no-crds"
      path: "bases/no-crds"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
