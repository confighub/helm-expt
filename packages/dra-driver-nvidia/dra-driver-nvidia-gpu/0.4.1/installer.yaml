apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "dra-driver-nvidia-dra-driver-nvidia-gpu"
  version: "0.4.1"
spec:
  bases:
    -
      default: true
      description: "dra-driver-nvidia-gpu GPU allocation off, because the chart refuses to render its own defaults variant rendered from dra-driver-nvidia/dra-driver-nvidia-gpu@0.4.1"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD computedomaincliques.resource.nvidia.com"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
          applyMode: "server-side"
        -
          kind: "ClusterFeature"
          name: "CRD computedomains.resource.nvidia.com"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
          applyMode: "server-side"
      name: "default"
      path: "bases/default"
    -
      description: "dra-driver-nvidia-gpu GPU allocation through DRA, for nodes without the standard GPU device plugin variant rendered from dra-driver-nvidia/dra-driver-nvidia-gpu@0.4.1"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD computedomaincliques.resource.nvidia.com"
          suggestedSource: "package://prerequisites/target-facts/gpu-resources-crds.yaml"
          applyMode: "server-side"
        -
          kind: "ClusterFeature"
          name: "CRD computedomains.resource.nvidia.com"
          suggestedSource: "package://prerequisites/target-facts/gpu-resources-crds.yaml"
          applyMode: "server-side"
      name: "gpu-resources"
      path: "bases/gpu-resources"
    -
      description: "dra-driver-nvidia-gpu AICR v0.20.0 EKS training values variant rendered from dra-driver-nvidia/dra-driver-nvidia-gpu@0.4.1"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD computedomaincliques.resource.nvidia.com"
          suggestedSource: "package://prerequisites/target-facts/aicr-eks-training-crds.yaml"
          applyMode: "server-side"
        -
          kind: "ClusterFeature"
          name: "CRD computedomains.resource.nvidia.com"
          suggestedSource: "package://prerequisites/target-facts/aicr-eks-training-crds.yaml"
          applyMode: "server-side"
      name: "aicr-eks-training"
      path: "bases/aicr-eks-training"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
