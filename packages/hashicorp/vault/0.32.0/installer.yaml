apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "hashicorp-vault"
  version: "0.32.0"
spec:
  bases:
    -
      default: true
      description: "vault dev server without init/unseal variant rendered from hashicorp/vault@0.32.0"
      name: "dev-mode"
      path: "bases/dev-mode"
    -
      description: "vault default server with injector variant rendered from hashicorp/vault@0.32.0"
      name: "default"
      path: "bases/default"
    -
      description: "vault HA Raft with UI variant rendered from hashicorp/vault@0.32.0"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "minimum schedulable nodes 3"
          suggestedSource: "use a target with at least 3 schedulable nodes before applying this base"
      name: "ha-raft-ui"
      path: "bases/ha-raft-ui"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
