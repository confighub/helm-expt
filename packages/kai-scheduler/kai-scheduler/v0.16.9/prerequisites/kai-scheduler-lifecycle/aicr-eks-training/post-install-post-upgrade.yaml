# Source: kai-scheduler/templates/hooks/post/kai-config-deployer/job.yaml
# Copyright 2025 NVIDIA CORPORATION
# SPDX-License-Identifier: Apache-2.0
apiVersion: batch/v1
kind: Job
metadata:
  name: kai-config-deployer
  namespace: kai-scheduler
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      labels:
        app: kai-config-deployer
    spec:
      serviceAccountName: kai-config-deployer
      restartPolicy: OnFailure
      nodeSelector:
        nodeGroup: system-worker
      tolerations:
        - operator: Exists
      containers:
      - name: deployer
        image: "ghcr.io/kai-scheduler/kai-scheduler/crd-upgrader:v0.16.9"
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        args:
        - |
          set -euo pipefail
          # Strip leftover Helm hook annotations from previous chart versions
          # where kai-config was managed as a Helm pre-install,pre-upgrade
          # hook (#1536). No-op when the CR doesn't exist or annotations are
          # already absent.
          kubectl annotate config kai-config \
            helm.sh/hook- helm.sh/hook-weight- 2>/dev/null || true
          kubectl apply --server-side --force-conflicts \
            --field-manager=kai-config-deployer \
            -f /manifest/kai-config.yaml
        volumeMounts:
        - name: manifest
          mountPath: /manifest
      volumes:
      - name: manifest
        configMap:
          name: kai-config-manifest
