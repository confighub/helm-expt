apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "argo-cd-argo-workflows"
  version: "1.0.14"
spec:
  bases:
    -
      default: true
      description: "argo-cd/argo-workflows default variant rendered from argo-cd/argo-workflows@1.0.14"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD clusterworkflowtemplates.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD cronworkflows.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD workflowartifactgctasks.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD workfloweventbindings.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD workflows.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD workflowtaskresults.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD workflowtasksets.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD workflowtemplates.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
      name: "default"
      path: "bases/default"
    -
      default: false
      description: "argo-cd/argo-workflows controller-default-reviewed useful base; aliases the default render with a named user start path"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD clusterworkflowtemplates.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/controller-default-reviewed-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD cronworkflows.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/controller-default-reviewed-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD workflowartifactgctasks.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/controller-default-reviewed-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD workfloweventbindings.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/controller-default-reviewed-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD workflows.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/controller-default-reviewed-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD workflowtaskresults.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/controller-default-reviewed-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD workflowtasksets.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/controller-default-reviewed-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD workflowtemplates.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/controller-default-reviewed-crds.yaml"
      name: "controller-default-reviewed"
      path: "bases/controller-default-reviewed"
    -
      description: "argo-cd/argo-workflows minimal-crds variant rendered from argo-cd/argo-workflows@1.0.14"
      name: "minimal-crds"
      path: "bases/minimal-crds"
  collector:
    args:
      - "collector/target-facts.sh"
    command: "/bin/sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
