apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "argo-cd-argo-cd"
  version: "9.5.15"
spec:
  bases:
    -
      default: true
      description: "argo-cd default variant rendered from argo-cd/argo-cd@9.5.15"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret argocd/argocd-redis key auth"
          namespace: "argocd"
          suggestedSource: "kubectl -n argocd create secret generic argocd-redis --from-literal=auth=<value>"
      name: "default"
      path: "bases/default"
    -
      description: "argo-cd CRDs disabled variant rendered from argo-cd/argo-cd@9.5.15"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret argocd/argocd-redis key auth"
          namespace: "argocd"
          suggestedSource: "kubectl -n argocd create secret generic argocd-redis --from-literal=auth=<value>"
        -
          kind: "ClusterFeature"
          name: "CRD applications.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD applicationsets.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD appprojects.argoproj.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
      name: "no-crds"
      path: "bases/no-crds"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
