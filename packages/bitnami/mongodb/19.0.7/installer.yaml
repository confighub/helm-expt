apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "bitnami-mongodb"
  version: "19.0.7"
spec:
  bases:
    -
      description: "mongodb static password demo variant rendered from bitnami/mongodb@19.0.7"
      name: "static-passwords"
      path: "bases/static-passwords"
    -
      description: "mongodb existing Secret default variant rendered from bitnami/mongodb@19.0.7"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret mongodb/mongodb-auth keys mongodb-root-password,mongodb-replica-set-key"
          namespace: "mongodb"
          suggestedSource: "kubectl -n mongodb create secret generic mongodb-auth --from-literal=mongodb-root-password=\"$(openssl rand -base64 32)\" --from-literal=mongodb-replica-set-key=\"$(openssl rand -base64 48)\""
      name: "existing-secret-replicaset"
      path: "bases/existing-secret-replicaset"
      default: true
  collector:
    args:
      - "collector/target-facts.sh"
    command: "/bin/sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
  transformers:
    -
      description: "Set the namespace on every namespaced resource."
      invocations:
        -
          args:
            - "{{ .Namespace }}"
          name: "set-namespace"
      toolchain: "Kubernetes/YAML"
      whereResource: ""
