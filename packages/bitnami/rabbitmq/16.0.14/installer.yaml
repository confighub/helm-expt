apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "bitnami-rabbitmq"
  version: "16.0.14"
spec:
  bases:
    -
      default: true
      description: "rabbitmq generated passwords variant rendered from bitnami/rabbitmq@16.0.14"
      name: "generated-passwords"
      path: "bases/generated-passwords"
    -
      description: "rabbitmq existing Secret variant rendered from bitnami/rabbitmq@16.0.14"
      name: "existing-secret"
      path: "bases/existing-secret"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret rabbitmq/rabbitmq-auth key rabbitmq-password"
          namespace: "rabbitmq"
          suggestedSource: "kubectl -n rabbitmq create secret generic rabbitmq-auth --from-literal=rabbitmq-password=<value>"
        -
          kind: "ClusterFeature"
          name: "Secret rabbitmq/rabbitmq-erlang-cookie key rabbitmq-erlang-cookie"
          namespace: "rabbitmq"
          suggestedSource: "kubectl -n rabbitmq create secret generic rabbitmq-erlang-cookie --from-literal=rabbitmq-erlang-cookie=<value>"
  transformers:
    # F1 fix: honour `cub installer --namespace X` instead of the frozen upstream
    # literal — set metadata.namespace on every namespaced resource and rename
    # the Namespace object. Pattern: installer examples/hello-app/installer.yaml.
    - toolchain: "Kubernetes/YAML"
      whereResource: ""
      description: "Set the namespace on every namespaced resource."
      invocations:
        - name: "set-namespace"
          args: ["{{ .Namespace }}"]
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check existing Secret requirements."
