apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "bitnami-rabbitmq"
  version: "16.0.14"
spec:
  bases:
    -
      description: "rabbitmq static password demo variant rendered from bitnami/rabbitmq@16.0.14"
      name: "static-passwords"
      path: "bases/static-passwords"
    -
      description: "rabbitmq existing Secret default variant rendered from bitnami/rabbitmq@16.0.14"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret rabbitmq/rabbitmq-auth key rabbitmq-password"
          namespace: "rabbitmq"
          suggestedSource: "kubectl -n rabbitmq create secret generic rabbitmq-auth --from-literal=rabbitmq-password=\"$(openssl rand -base64 32)\""
        -
          kind: "ClusterFeature"
          name: "Secret rabbitmq/rabbitmq-erlang-cookie key rabbitmq-erlang-cookie"
          namespace: "rabbitmq"
          suggestedSource: "kubectl -n rabbitmq create secret generic rabbitmq-erlang-cookie --from-literal=rabbitmq-erlang-cookie=\"$(openssl rand -base64 48)\""
      name: "existing-secret"
      path: "bases/existing-secret"
      default: true
  collector:
    args:
      - "collector/target-facts.sh"
    command: "/bin/sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
