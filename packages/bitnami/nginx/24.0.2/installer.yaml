apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "bitnami-nginx"
  version: "24.0.2"
spec:
  bases:
    -
      default: true
      description: "nginx plain HTTP ClusterIP variant rendered from bitnami/nginx@24.0.2"
      name: "http-clusterip"
      path: "bases/http-clusterip"
    -
      description: "nginx existing TLS with ingress variant rendered from bitnami/nginx@24.0.2"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret nginx/nginx-backend-tls keys tls.crt,tls.key,ca.crt"
          namespace: "nginx"
          suggestedSource: "kubectl -n nginx create secret generic nginx-backend-tls --from-literal=tls.crt=<value> --from-literal=tls.key=<value> --from-literal=ca.crt=<value>"
        -
          kind: "ClusterFeature"
          name: "Secret nginx/nginx-ingress-tls keys tls.crt,tls.key"
          namespace: "nginx"
          suggestedSource: "kubectl -n nginx create secret generic nginx-ingress-tls --from-literal=tls.crt=<value> --from-literal=tls.key=<value>"
      name: "existing-tls-ingress"
      path: "bases/existing-tls-ingress"
  transformers:
    # F1 fix: honour `cub installer --namespace X` instead of the frozen upstream
    # literal — set metadata.namespace on every namespaced resource and rename
    # the Namespace object. Pattern: installer examples/hello-app/installer.yaml.
    - toolchain: "Kubernetes/YAML"
      whereResource: ""
      description: "Set the namespace on every namespaced resource."
      invocations:
        - name: "set-namespace"
          args: ["{{ .Namespace }}"]
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check existing Secret requirements."
