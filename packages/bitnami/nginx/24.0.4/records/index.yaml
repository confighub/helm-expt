apiVersion: "catalog.confighub.com/v1alpha1"
kind: "InstallerPackageRecordIndex"
metadata:
  name: "bitnami-nginx-24.0.4"
spec:
  package:
    name: "bitnami-nginx"
    version: "24.0.4"
    role: "multi-preset-source-package"
  recordsAreDeployable: false
  repository:
    url: "https://github.com/confighub/helm-expt"
    evidenceBaseUrl: "https://github.com/confighub/helm-expt/blob/main/"
  bases:
    -
      name: "existing-tls-ingress"
      objects: "bases/existing-tls-ingress/upstream.yaml"
      sourceAndIntent: "records/existing-tls-ingress/source-and-intent.yaml"
      sourceSpecificIntent: "records/existing-tls-ingress/helm-render-intent.yaml"
    -
      name: "http-clusterip"
      objects: "bases/http-clusterip/upstream.yaml"
      sourceAndIntent: "records/http-clusterip/source-and-intent.yaml"
      sourceSpecificIntent: "records/http-clusterip/helm-render-intent.yaml"
