apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "bitnami-mysql"
  version: "14.0.3"
spec:
  bases:
    -
      default: true
      description: "mysql generated passwords variant rendered from bitnami/mysql@14.0.3"
      name: "generated-passwords"
      path: "bases/generated-passwords"
    -
      description: "mysql existing Secret variant rendered from bitnami/mysql@14.0.3"
      name: "existing-secret"
      path: "bases/existing-secret"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret mysql/mysql-auth keys mysql-root-password,mysql-password,mysql-replication-password"
          namespace: "mysql"
          suggestedSource: "kubectl -n mysql create secret generic mysql-auth --from-literal=mysql-root-password=<value> --from-literal=mysql-password=<value> --from-literal=mysql-replication-password=<value>"
  transformers:
    # F1 fix: honour `cub installer --namespace X` instead of the frozen upstream
    # literal — set metadata.namespace on every namespaced resource and rename
    # the Namespace object. Pattern: installer examples/hello-app/installer.yaml.
    - toolchain: "Kubernetes/YAML"
      whereResource: ""
      description: "Set the namespace on every namespaced resource."
      invocations:
        - name: "set-namespace"
          args: ["{{ .Namespace }}"]
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check existing Secret requirements."
