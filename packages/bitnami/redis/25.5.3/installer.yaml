apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "bitnami-redis"
  version: "25.5.3"
spec:
  bases:
    -
      default: true
      description: "Redis default variant rendered from bitnami/redis@25.5.3"
      name: "default"
      path: "bases/default"
    -
      description: "Redis variant that uses an existing Secret target fact"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret redis/redis-existing-secret key redis-password"
          namespace: "redis"
          suggestedSource: "kubectl -n redis create secret generic redis-existing-secret --from-literal=redis-password=<value>"
      name: "reuse-existing-secret"
      path: "bases/reuse-existing-secret"
  transformers:
    # F1 fix: honour `cub installer --namespace X` instead of the frozen upstream
    # literal — set metadata.namespace on every namespaced resource and rename
    # the Namespace object. Pattern: installer examples/hello-app/installer.yaml.
    - toolchain: "Kubernetes/YAML"
      whereResource: ""
      description: "Set the namespace on every namespaced resource."
      invocations:
        - name: "set-namespace"
          args: ["{{ .Namespace }}"]
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check existing Secret requirements."
