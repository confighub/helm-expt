apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "bitnami-redis"
  version: "25.5.3"
spec:
  bases:
    -
      description: "Redis static password demo variant rendered from bitnami/redis@25.5.3"
      name: "default"
      path: "bases/default"
    -
      description: "Redis existing Secret default variant rendered from bitnami/redis@25.5.3"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret redis/redis-existing-secret key redis-password"
          namespace: "redis"
          suggestedSource: "kubectl -n redis create secret generic redis-existing-secret --from-literal=redis-password=\"$(openssl rand -base64 32)\""
      name: "reuse-existing-secret"
      path: "bases/reuse-existing-secret"
      default: true
  collector:
    args:
      - "collector/target-facts.sh"
    command: "/bin/sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
