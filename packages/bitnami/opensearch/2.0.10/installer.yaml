apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "bitnami-opensearch"
  version: "2.0.10"
spec:
  bases:
    -
      name: "legacy"
      path: "bases/legacy"
      description: "bitnami/opensearch legacy variant (docker.io/bitnami -> docker.io/bitnamilegacy image remap) rendered from bitnami/opensearch@2.0.10"
    -
      default: true
      description: "bitnami/opensearch default variant rendered from bitnami/opensearch@2.0.10"
      name: "default"
      path: "bases/default"
    -
      name: "ha"
      path: "bases/ha"
      description: "bitnami/opensearch ha variant rendered from bitnami/opensearch@2.0.10"
