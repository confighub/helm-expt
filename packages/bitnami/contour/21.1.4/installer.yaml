apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "bitnami-contour"
  version: "21.1.4"
spec:
  bases:
    -
      name: "legacy"
      path: "bases/legacy"
      description: "bitnami/contour legacy variant (docker.io/bitnami -> docker.io/bitnamilegacy image remap) rendered from bitnami/contour@21.1.4"
    -
      default: true
      description: "bitnami/contour default variant rendered from bitnami/contour@21.1.4"
      name: "default"
      path: "bases/default"
    -
      name: "no-crds"
      path: "bases/no-crds"
      description: "bitnami/contour no-crds variant rendered from bitnami/contour@21.1.4"
