apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "bitnami-postgresql"
  version: "18.6.7"
spec:
  bases:
    -
      default: true
      description: "postgresql generated passwords variant rendered from bitnami/postgresql@18.6.7"
      name: "generated-passwords"
      path: "bases/generated-passwords"
    -
      description: "postgresql existing Secret variant rendered from bitnami/postgresql@18.6.7"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret postgresql/postgresql-auth key postgres-password"
          namespace: "postgresql"
          suggestedSource: "kubectl -n postgresql create secret generic postgresql-auth --from-literal=postgres-password=<value>"
      name: "existing-secret"
      path: "bases/existing-secret"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check existing Secret requirements."
