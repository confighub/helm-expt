apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "bitnami-elasticsearch"
  version: "22.1.6"
spec:
  bases:
    -
      name: "legacy"
      path: "bases/legacy"
      description: "bitnami/elasticsearch legacy variant (docker.io/bitnami -> docker.io/bitnamilegacy image remap) rendered from bitnami/elasticsearch@22.1.6"
    -
      default: true
      description: "bitnami/elasticsearch default variant rendered from bitnami/elasticsearch@22.1.6"
      name: "default"
      path: "bases/default"
    -
      name: "ha"
      path: "bases/ha"
      description: "bitnami/elasticsearch ha variant rendered from bitnami/elasticsearch@22.1.6"
