apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "karpenter-karpenter"
  version: "1.14.0"
spec:
  bases:
    -
      default: true
      description: "karpenter default variant rendered from karpenter/karpenter@1.14.0"
      name: "default"
      path: "bases/default"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "minimum schedulable nodes 2"
          suggestedSource: "use a target with at least 2 schedulable nodes before applying this base"
    -
      description: "karpenter EKS inference-demo platform variant rendered from karpenter/karpenter@1.14.0"
      name: "eks-inference"
      path: "bases/eks-inference"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "minimum schedulable nodes 1"
          suggestedSource: "use a target with at least 1 schedulable nodes before applying this base"
    -
      description: "karpenter platform values without CRDs variant rendered from karpenter/karpenter@1.14.0"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD capacitybuffers.autoscaling.x-k8s.io"
          suggestedSource: "package://prerequisites/target-facts/crds-managed-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD ec2nodeclasses.karpenter.k8s.aws"
          suggestedSource: "package://prerequisites/target-facts/crds-managed-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD nodeclaims.karpenter.sh"
          suggestedSource: "package://prerequisites/target-facts/crds-managed-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD nodeoverlays.karpenter.sh"
          suggestedSource: "package://prerequisites/target-facts/crds-managed-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD nodepools.karpenter.sh"
          suggestedSource: "package://prerequisites/target-facts/crds-managed-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "minimum schedulable nodes 1"
          suggestedSource: "use a target with at least 1 schedulable nodes before applying this base"
      name: "crds-managed"
      path: "bases/crds-managed"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
  inputs:
    -
      default: "confighubplaceholder"
      description: "Used by the default base. Replaces the confighubplaceholder sentinel in the CLUSTER_NAME env on the controller Deployment. The install gate stays blocked while the sentinel remains."
      name: "clusterName"
      prompt: "EKS cluster name for Karpenter (settings.clusterName)"
      type: "string"
    -
      default: "confighubplaceholder"
      description: "Used by the eks-inference and crds-managed bases. The chart supplies no AWS_REGION and EKS Pod Identity does not inject it; an unbound value panics the controller at startup, so the sentinel keeps the failure at release time."
      name: "awsRegion"
      prompt: "AWS region for the Karpenter controller (AWS_REGION env)"
      type: "string"
  transformers:
    -
      description: "Set the namespace on every namespaced resource."
      invocations:
        -
          args:
            - "{{ .Namespace }}"
          name: "set-namespace"
      toolchain: "Kubernetes/YAML"
      whereResource: ""
    -
      description: "Bind the CLUSTER_NAME env on the controller Deployment from the clusterName input."
      invocations:
        -
          args:
            - "apps/v1/Deployment"
            - "spec.template.spec.containers.?name=controller.env.?name=CLUSTER_NAME.value"
            - "{{ .Inputs.clusterName }}"
          name: "set-string-path"
      toolchain: "Kubernetes/YAML"
      whereResource: "{{ if eq .Selection.Base \"default\" }}ConfigHub.ResourceType = 'apps/v1/Deployment'{{ else }}ConfigHub.ResourceType = 'helm-expt.invalid/v1/Never'{{ end }}"
    -
      description: "Bind the AWS_REGION env on the controller Deployment from the awsRegion input."
      invocations:
        -
          args:
            - "apps/v1/Deployment"
            - "spec.template.spec.containers.?name=controller.env.?name=AWS_REGION.value"
            - "{{ .Inputs.awsRegion }}"
          name: "set-string-path"
      toolchain: "Kubernetes/YAML"
      whereResource: "{{ if or (eq .Selection.Base \"eks-inference\") (eq .Selection.Base \"crds-managed\") }}ConfigHub.ResourceType = 'apps/v1/Deployment'{{ else }}ConfigHub.ResourceType = 'helm-expt.invalid/v1/Never'{{ end }}"
