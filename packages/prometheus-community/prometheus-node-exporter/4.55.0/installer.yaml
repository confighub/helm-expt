apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "prometheus-community-prometheus-node-exporter"
  version: "4.55.0"
spec:
  bases:
    -
      default: true
      description: "prometheus-community/prometheus-node-exporter default variant rendered from prometheus-community/prometheus-node-exporter@4.55.0"
      name: "default"
      path: "bases/default"
    -
      description: "prometheus-community/prometheus-node-exporter cluster-metrics-readonly useful base rendered with Prometheus monitor values"
      name: "cluster-metrics-readonly"
      path: "bases/cluster-metrics-readonly"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD servicemonitors.monitoring.coreos.com"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check existing Secret requirements."
