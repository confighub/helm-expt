apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "kube-prometheus-stack-kube-prometheus-stack"
  version: "85.3.3"
spec:
  bases:
    -
      default: true
      description: "kube-prometheus-stack default with Grafana password bound variant rendered from prometheus-community/kube-prometheus-stack@85.3.3"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret monitoring/kube-prometheus-stack-admission keys cert,key"
          namespace: "monitoring"
          suggestedSource: "kubectl -n monitoring create secret generic kube-prometheus-stack-admission --from-literal=cert=<value> --from-literal=key=<value>"
      name: "default"
      path: "bases/default"
    -
      description: "kube-prometheus-stack CRDs disabled variant rendered from prometheus-community/kube-prometheus-stack@85.3.3"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret monitoring/kube-prometheus-stack-admission keys cert,key"
          namespace: "monitoring"
          suggestedSource: "kubectl -n monitoring create secret generic kube-prometheus-stack-admission --from-literal=cert=<value> --from-literal=key=<value>"
        -
          kind: "ClusterFeature"
          name: "CRD alertmanagerconfigs.monitoring.coreos.com"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD alertmanagers.monitoring.coreos.com"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD podmonitors.monitoring.coreos.com"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD probes.monitoring.coreos.com"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD prometheusagents.monitoring.coreos.com"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD prometheuses.monitoring.coreos.com"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD prometheusrules.monitoring.coreos.com"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD scrapeconfigs.monitoring.coreos.com"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD servicemonitors.monitoring.coreos.com"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD thanosrulers.monitoring.coreos.com"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
      name: "no-crds"
      path: "bases/no-crds"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check existing Secret requirements."
