apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "kube-prometheus-stack-kube-prometheus-stack"
  version: "85.3.3"
spec:
  bases:
    -
      name: "default"
      path: "bases/default"
      default: true
      description: "kube-prometheus-stack default with Grafana password bound variant rendered from prometheus-community/kube-prometheus-stack@85.3.3"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret monitoring/kube-prometheus-stack-admission keys cert,key"
          namespace: "monitoring"
          suggestedSource: "kubectl -n monitoring create secret generic kube-prometheus-stack-admission --from-literal=cert=<value> --from-literal=key=<value>"
    -
      name: "no-crds"
      path: "bases/no-crds"
      description: "kube-prometheus-stack CRDs disabled variant rendered from prometheus-community/kube-prometheus-stack@85.3.3"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret monitoring/kube-prometheus-stack-admission keys cert,key"
          namespace: "monitoring"
          suggestedSource: "kubectl -n monitoring create secret generic kube-prometheus-stack-admission --from-literal=cert=<value> --from-literal=key=<value>"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check existing Secret requirements."
