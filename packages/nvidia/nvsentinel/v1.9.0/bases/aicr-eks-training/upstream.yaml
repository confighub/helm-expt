spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 5%
  selector:
    matchLabels:
      app.kubernetes.io/name: nvsentinel
      app.kubernetes.io/instance: nvsentinel
  template:
    metadata:
      annotations:
        checksum/config: f7f3986ae45378eea88679ad99ea0bc4a0c6377c97c7d5fdbef38e04131b4656
      labels:
        app.kubernetes.io/name: nvsentinel
        app.kubernetes.io/instance: nvsentinel
    spec:
      serviceAccountName: platform-connectors
      containers:
        - name: platform-connector
          image: "ghcr.io/nvidia/nvsentinel/platform-connectors:v1.9.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            capabilities:
              drop:
              - ALL
          ports:
            - name: metrics
              containerPort: 2112
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          args:
          - "--config=/etc/config/config.json"
          - "--metrics-port=2112"
          - "--mongo-client-cert-mount-path=/etc/ssl/mongo-client"
          - "--socket=/var/run/nvsentinel.sock"
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: var-run-vol
              mountPath: /var/run
            - name: platform-connector-configmap
              mountPath: /etc/config/
            - name: mongo-app-client-cert
              mountPath: /etc/ssl/mongo-client
              readOnly: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOG_LEVEL
              value: "info"
            # App name for connection identification in logs and currentOp
            - name: APP_NAME
              value: "platform-connector"
            - name: MONGODB_CLIENT_CERT_MOUNT_PATH
              value: /etc/ssl/mongo-client
          envFrom:
            - configMapRef:
                name: mongodb-config
                optional: true

      volumes:
        - name: var-run-vol
          hostPath:
            path: /var/run/nvsentinel
            type: DirectoryOrCreate
        - name: platform-connector-configmap
          configMap:
            name: platform-connectors
        - name: mongo-app-client-cert
          secret:
            secretName: mongo-app-client-cert-secret
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
            optional: true
      tolerations:
        - operator: Exists
