apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nvsentinel
  labels:
    helm.sh/chart: nvsentinel-v1.9.0
    app.kubernetes.io/name: nvsentinel
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/version: "v1.9.0"
    app.kubernetes.io/managed-by: Helm
spec:
  selector:
    matchExpressions:
      - { key: "app.kubernetes.io/instance", operator: In, values: ["nvsentinel"] }
  namespaceSelector:
    matchNames:
      - nvsentinel
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
    - port: cleanup-metrics
      path: /metrics
      interval: 30s
