apiVersion: apps/v1
kind: Deployment
metadata:
  name: labeler
  labels:
    helm.sh/chart: labeler-0.1.0
    app.kubernetes.io/name: labeler
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: labeler
      app.kubernetes.io/instance: nvsentinel
  template:
    metadata:
      labels:
        helm.sh/chart: labeler-0.1.0
        app.kubernetes.io/name: labeler
        app.kubernetes.io/instance: nvsentinel
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: labeler
      containers:
        - name: labeler
          image: "ghcr.io/nvidia/nvsentinel/labeler:v1.9.0"
          imagePullPolicy: IfNotPresent
          args:
            - "--metrics-port"
            - "2112"
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          ports:
            - name: metrics
              containerPort: 2112
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOG_LEVEL
              value: "info"
      tolerations:
        - operator: Exists
