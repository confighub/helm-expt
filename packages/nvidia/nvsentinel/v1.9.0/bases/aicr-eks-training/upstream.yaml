# Single ConfigMap holding every file configuration owned by the
# syslog-health-monitor pod. Each data key becomes a file under the mount
# directory (/etc/syslog-health-monitor/) and is referenced by the matching
# CLI flag in the DaemonSet args.
apiVersion: v1
kind: ConfigMap
metadata:
  name: 'syslog-health-monitor-config'
  labels:
    helm.sh/chart: syslog-health-monitor-0.1.0
    app.kubernetes.io/name: syslog-health-monitor
    app.kubernetes.io/instance: nvsentinel
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
data:
  nic-driver.toml: |

    [[nicDriverDetection.patterns]]
    name = "cmd_exec_timeout"
    enabled = false


    [[nicDriverDetection.patterns]]
    name = "health_poll_failed"
    enabled = false


    [[nicDriverDetection.patterns]]
    name = "unrecoverable_err"
    enabled = false


    [[nicDriverDetection.patterns]]
    name = "netdev_watchdog"
    enabled = false


    [[nicDriverDetection.patterns]]
    name = "pci_power_insufficient"
    enabled = false


    [[nicDriverDetection.patterns]]
    name = "port_module_high_temp"
    enabled = false


    [[nicDriverDetection.patterns]]
    name = "access_reg_failed"
    enabled = false


    [[nicDriverDetection.patterns]]
    name = "module_unplugged"
    enabled = false

  cancellations.toml: |

    [[checks]]
      name    = "SysLogsXIDError"
      enabled = true

      [[checks.cancellations]]
        onErrorCode      = "162"
        cancelErrorCodes = ["163"]
---
