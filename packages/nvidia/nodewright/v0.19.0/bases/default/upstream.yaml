# Source: nodewright/templates/manager-rbac.yaml
# Least privilege: these are the kinds the operator only ever touches inside its own namespace,
# so they are a namespaced Role rather than part of the ClusterRole above.
#
#   secrets     only the operator's own webhook serving cert
#   jobs        package-stage Jobs, all created here and every list passes InNamespace
#   pods/log    read only off those Jobs' child pods, for the deadline failure snapshot
#
# Jobs and secrets each have a namespace-scoped informer in main.go and the two must stay in
# step: a cluster-wide informer under this Role is rejected at LIST/WATCH and the operator fails
# to start. pods/log has no informer — it is read through a namespaced Pods(ns).GetLogs call — but
# still needs the namespaced verb here.
# Pods and nodes stay in the ClusterRole — drain has to see workload pods on any node.
# ConfigMaps are also a candidate but stay cluster-wide for now: scoping them correlated with
# unexplained apply-to-config stalls in e2e/core.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nodewright-manager-role
  namespace: 'nodewright'
  labels:
    helm.sh/chart: nodewright-v0.19.0
    app.kubernetes.io/name: nodewright
    app.kubernetes.io/instance: nodewright-operator
    app.kubernetes.io/version: "v0.19.0"
    app.kubernetes.io/managed-by: Helm
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
