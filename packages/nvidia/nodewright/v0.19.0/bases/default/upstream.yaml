    app.kubernetes.io/version: "v0.19.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    # Deployment.spec.selector is immutable. These labels are sourced from the
    # shared chart.managerSelectorLabels helper so the selector-migration
    # pre-upgrade hook compares against the exact same set; if the chart name or
    # release name ever changes the selector, that hook deletes the stale
    # Deployment so `helm upgrade` can recreate it.
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: nodewright
      app.kubernetes.io/instance: nodewright-operator
  template:
    metadata:
      labels:
        app: nodewright-controller-manager
        control-plane: controller-manager
        app.kubernetes.io/name: nodewright
        app.kubernetes.io/instance: nodewright-operator
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:

      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - command:
        - /manager
        env:
        - name: METRICS_PORT
          value: ":8443"
        - name: PROBE_PORT
          value: ":8081"
        - name: LEADER_ELECTION
          value: "true"
        - name: LOG_LEVEL
          value: "info"
        - name: ENABLE_WEBHOOKS
          value: "true"
        - name: WEBHOOK_SECRET_NAME
          value: "webhook-cert"
        - name: WEBHOOK_SERVICE_NAME
          value: "nodewright-webhook-service"
        - name: NAMESPACE
          value: nodewright
        - name: IMAGE_PULL_SECRET
          value: ""
        - name: COPY_DIR_ROOT
          value: "/var/lib/skyhook"
        - name: REAPPLY_ON_REBOOT
          value: "false"
        - name: LEGACY_CLEANUP_DELAY
          value: "24h"
        - name: JOB_TTL_SUCCEEDED
          value: "1h"
        - name: JOB_TTL_FAILED
          value: "24h"
        - name: JOB_STAGE_TIMEOUT
          value: "1h"
        - name: JOB_BACKOFF_LIMIT
          value: "3"
        - name: PUBLISH_LEGACY_METRICS
          value: "true"
        - name: RUNTIME_REQUIRED_TAINT
          value: "nodewright.nvidia.com=runtime-required:NoSchedule"
        - name: PAUSE_IMAGE
          value: "registry.k8s.io/pause:3.10"
        - name: AGENT_IMAGE
          value: ghcr.io/nvidia/nodewright/agent:v6.4.2@sha256:7cd80f5ef351266dc08c3979e802f9dc936a1ed9fd02e199233e7968a3a0de3e
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: "cluster.local"
        image: ghcr.io/nvidia/nodewright/operator:v0.19.0@sha256:38e9a79125633aa633f8e499306b2219c582c6f62a7bfe4083928212e70f74a7
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
        - mountPath: /tmp
          name: webhook-certs
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 20
          successThreshold: 1
          failureThreshold: 2
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      imagePullSecrets:
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3607
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
      - name: webhook-certs
        emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: nodewright-controller-manager
      terminationGracePeriodSeconds: 10
