apiVersion: "catalog.confighub.com/v1alpha1"
kind: "InstallerPackageRecordIndex"
metadata:
  name: "nats-nats-2.14.0"
spec:
  package:
    name: "nats-nats"
    version: "2.14.0"
    role: "multi-preset-source-package"
  recordsAreDeployable: false
  repository:
    url: "https://github.com/confighub/helm-expt"
    evidenceBaseUrl: "https://github.com/confighub/helm-expt/blob/main/"
  bases:
    -
      name: "default"
      objects: "bases/default/upstream.yaml"
      sourceAndIntent: "records/default/source-and-intent.yaml"
      sourceSpecificIntent: "records/default/helm-render-intent.yaml"
    -
      name: "ha"
      objects: "bases/ha/upstream.yaml"
      sourceAndIntent: "records/ha/source-and-intent.yaml"
      sourceSpecificIntent: "records/ha/helm-render-intent.yaml"
