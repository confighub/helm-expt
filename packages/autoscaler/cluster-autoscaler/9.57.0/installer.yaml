apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "autoscaler-cluster-autoscaler"
  version: "9.57.0"
spec:
  bases:
    -
      default: true
      description: "autoscaler/cluster-autoscaler default variant rendered from autoscaler/cluster-autoscaler@9.57.0"
      name: "default"
      path: "bases/default"
    -
      default: false
      description: "autoscaler/cluster-autoscaler controller-default-reviewed useful base rendered with AWS autodiscovery values"
      name: "controller-default-reviewed"
      path: "bases/controller-default-reviewed"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
