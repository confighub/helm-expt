            httpGet:
              path: /health-check
              port: prometheus
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health-check
              port: prometheus
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - mountPath: /etc/tls-certs
              name: tls-certs
              readOnly: true
      volumes:
        - name: tls-certs
          secret:
            defaultMode: 420
            items:
            - key: ca
              path: caCert.pem
            - key: cert
              path: serverCert.pem
            - key: key
