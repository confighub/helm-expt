apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "kedacore-keda"
  version: "2.19.0"
spec:
  bases:
    -
      default: true
      description: "kedacore/keda default variant rendered from kedacore/keda@2.19.0"
      name: "default"
      path: "bases/default"
    -
      description: "kedacore/keda no-crds variant rendered from kedacore/keda@2.19.0"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD cloudeventsources.eventing.keda.sh"
          suggestedSource: "kubectl apply -f <keda-crds.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD clustercloudeventsources.eventing.keda.sh"
          suggestedSource: "kubectl apply -f <keda-crds.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD clustertriggerauthentications.keda.sh"
          suggestedSource: "kubectl apply -f <keda-crds.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD scaledjobs.keda.sh"
          suggestedSource: "kubectl apply -f <keda-crds.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD scaledobjects.keda.sh"
          suggestedSource: "kubectl apply -f <keda-crds.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD triggerauthentications.keda.sh"
          suggestedSource: "kubectl apply -f <keda-crds.yaml>"
      name: "no-crds"
      path: "bases/no-crds"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
