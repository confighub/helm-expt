apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "cloudnative-pg-cloudnative-pg"
  version: "0.28.2"
spec:
  bases:
    -
      default: true
      description: "cloudnative-pg/cloudnative-pg default variant rendered from cloudnative-pg/cloudnative-pg@0.28.2"
      name: "default"
      path: "bases/default"
    -
      description: "cloudnative-pg/cloudnative-pg no-crds variant rendered from cloudnative-pg/cloudnative-pg@0.28.2"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret default/cnpg-webhook-cert keys tls.crt,tls.key"
          namespace: "default"
          suggestedSource: "kubectl -n default create secret generic cnpg-webhook-cert --from-literal=tls.crt=<value> --from-literal=tls.key=<value>"
        -
          kind: "ClusterFeature"
          name: "CRD backups.postgresql.cnpg.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD clusterimagecatalogs.postgresql.cnpg.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD clusters.postgresql.cnpg.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD databases.postgresql.cnpg.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD failoverquorums.postgresql.cnpg.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD imagecatalogs.postgresql.cnpg.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD poolers.postgresql.cnpg.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD publications.postgresql.cnpg.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD scheduledbackups.postgresql.cnpg.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD subscriptions.postgresql.cnpg.io"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
      name: "no-crds"
      path: "bases/no-crds"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
