apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "kyverno-kyverno"
  version: "3.8.1"
spec:
  bases:
    -
      default: true
      description: "kyverno/kyverno default variant rendered from kyverno/kyverno@3.8.1"
      name: "default"
      path: "bases/default"
    -
      description: "kyverno/kyverno no-crds variant rendered from kyverno/kyverno@3.8.1"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD cleanuppolicies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD clustercleanuppolicies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD clusterpolicies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD globalcontextentries.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD policies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD policyexceptions.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD updaterequests.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD clusterephemeralreports.reports.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD ephemeralreports.reports.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD clusterpolicyreports.wgpolicyk8s.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD policyreports.wgpolicyk8s.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD deletingpolicies.policies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD generatingpolicies.policies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD imagevalidatingpolicies.policies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD mutatingpolicies.policies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD namespaceddeletingpolicies.policies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD namespacedgeneratingpolicies.policies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD namespacedimagevalidatingpolicies.policies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD namespacedmutatingpolicies.policies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD namespacedvalidatingpolicies.policies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD policyexceptions.policies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
        -
          kind: "ClusterFeature"
          name: "CRD validatingpolicies.policies.kyverno.io"
          suggestedSource: "kubectl apply -f <crd-manifest.yaml>"
      name: "no-crds"
      path: "bases/no-crds"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
