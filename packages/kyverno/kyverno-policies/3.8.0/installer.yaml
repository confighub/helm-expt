apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "kyverno-kyverno-policies"
  version: "3.8.0"
spec:
  bases:
    -
      default: true
      description: "kyverno/kyverno-policies default variant rendered from kyverno/kyverno-policies@3.8.0"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD clusterpolicies.kyverno.io"
          suggestedSource: "package://prerequisites/target-facts/default-crds.yaml"
      name: "default"
      path: "bases/default"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
