    -
      actions:
        -
          automatic: false
          evidenceState: "not-run"
          invokedBy: "packaged-requirement"
          phase: "pre-apply"
          name: "Install and establish the 3 CRDs before the master and the workers start"
          detail: "The workers write NodeFeature objects and the master reads NodeFeatureRule objects as soon as they start. The bundle holds exactly the CRDs this base renders. No object in the base is an instance of them."
          source: "prerequisites/target-facts/default-crds.yaml"
        -
          automatic: false
          evidenceState: "not-run"
          helmHook: "post-delete"
          invokedBy: "delivery-workflow"
          phase: "post-delete"
          name: "After a delete, remove what NFD put on the nodes"
          detail: "The prune Job runs nfd-master with -prune, which removes the labels, annotations, taints and extended resources NFD created on every node, with its own ServiceAccount, ClusterRole and ClusterRoleBinding. A workflow that deletes this base must apply these four objects afterwards, wait for the Job to complete, then delete them. Skipping it leaves the node labels in place."
