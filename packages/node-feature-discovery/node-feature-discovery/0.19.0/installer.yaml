apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "node-feature-discovery-node-feature-discovery"
  version: "0.19.0"
spec:
  bases:
    -
      default: true
      description: "node-feature-discovery chart defaults variant rendered from node-feature-discovery/node-feature-discovery@0.19.0"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD nodefeaturegroups.nfd.k8s-sigs.io"
