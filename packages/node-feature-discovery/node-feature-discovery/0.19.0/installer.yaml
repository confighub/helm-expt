          name: "CRD nodefeatures.nfd.k8s-sigs.io"
          suggestedSource: "package://prerequisites/target-facts/aicr-eks-training-v0-20-0-crds.yaml"
          applyMode: "server-side"
        -
          kind: "ClusterFeature"
          name: "CRD noderesourcetopologies.topology.node.k8s.io"
          suggestedSource: "package://prerequisites/target-facts/aicr-eks-training-v0-20-0-crds.yaml"
          applyMode: "server-side"
      name: "aicr-eks-training-v0-20-0"
      path: "bases/aicr-eks-training-v0-20-0"
    -
      description: "node-feature-discovery AICR v1.0.0 EKS training values variant rendered from node-feature-discovery/node-feature-discovery@0.19.0"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD nodefeaturegroups.nfd.k8s-sigs.io"
          suggestedSource: "package://prerequisites/target-facts/aicr-eks-training-v1-0-0-crds.yaml"
          applyMode: "server-side"
        -
          kind: "ClusterFeature"
          name: "CRD nodefeaturerules.nfd.k8s-sigs.io"
          suggestedSource: "package://prerequisites/target-facts/aicr-eks-training-v1-0-0-crds.yaml"
          applyMode: "server-side"
        -
          kind: "ClusterFeature"
          name: "CRD nodefeatures.nfd.k8s-sigs.io"
          suggestedSource: "package://prerequisites/target-facts/aicr-eks-training-v1-0-0-crds.yaml"
          applyMode: "server-side"
        -
          kind: "ClusterFeature"
          name: "CRD noderesourcetopologies.topology.node.k8s.io"
          suggestedSource: "package://prerequisites/target-facts/aicr-eks-training-v1-0-0-crds.yaml"
          applyMode: "server-side"
      name: "aicr-eks-training-v1-0-0"
      path: "bases/aicr-eks-training-v1-0-0"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
