apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "grafana-loki"
  version: "7.0.0"
spec:
  bases:
    -
      name: "single-binary-filesystem"
      path: "bases/single-binary-filesystem"
      default: true
      description: "loki single binary filesystem variant rendered from grafana/loki@7.0.0"
    -
      name: "simple-scalable-minio"
      path: "bases/simple-scalable-minio"
      description: "loki simple scalable with MinIO variant rendered from grafana/loki@7.0.0"
  transformers:
    # F1 fix: honour `cub installer --namespace X` instead of the frozen upstream
    # literal — set metadata.namespace on every namespaced resource and rename
    # the Namespace object. Pattern: installer examples/hello-app/installer.yaml.
    - toolchain: "Kubernetes/YAML"
      whereResource: ""
      description: "Set the namespace on every namespaced resource."
      invocations:
        - name: "set-namespace"
          args: ["{{ .Namespace }}"]
