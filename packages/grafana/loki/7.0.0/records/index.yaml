      name: "simple-scalable-minio"
      objects: "bases/simple-scalable-minio/upstream.yaml"
      sourceAndIntent: "records/simple-scalable-minio/source-and-intent.yaml"
      sourceSpecificIntent: "records/simple-scalable-minio/helm-render-intent.yaml"
    -
      name: "single-binary-filesystem"
      objects: "bases/single-binary-filesystem/upstream.yaml"
      sourceAndIntent: "records/single-binary-filesystem/source-and-intent.yaml"
      sourceSpecificIntent: "records/single-binary-filesystem/helm-render-intent.yaml"
