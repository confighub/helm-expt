apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "grafana-grafana"
  version: "10.5.15"
spec:
  bases:
    -
      default: true
      description: "grafana generated passwords variant rendered from grafana/grafana@10.5.15"
      name: "generated-passwords"
      path: "bases/generated-passwords"
    -
      description: "grafana existing Secret with ingress variant rendered from grafana/grafana@10.5.15"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret grafana/grafana-admin keys admin-user,admin-password"
          namespace: "grafana"
          suggestedSource: "kubectl -n grafana create secret generic grafana-admin --from-literal=admin-user=<value> --from-literal=admin-password=<value>"
      name: "existing-secret-ingress"
      path: "bases/existing-secret-ingress"
  transformers:
    # F1 fix: honour `cub installer --namespace X` instead of the frozen upstream
    # literal — set metadata.namespace on every namespaced resource and rename
    # the Namespace object. Pattern: installer examples/hello-app/installer.yaml.
    - toolchain: "Kubernetes/YAML"
      whereResource: ""
      description: "Set the namespace on every namespaced resource."
      invocations:
        - name: "set-namespace"
          args: ["{{ .Namespace }}"]
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check existing Secret requirements."
