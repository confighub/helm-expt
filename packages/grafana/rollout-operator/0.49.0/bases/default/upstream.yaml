# Source: rollout-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-operator
  namespace: "default"
  labels:
    helm.sh/chart: rollout-operator-0.49.0
    app.kubernetes.io/name: rollout-operator
    app.kubernetes.io/instance: rollout-operator
    app.kubernetes.io/version: "v0.36.2"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 10
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: rollout-operator
      app.kubernetes.io/instance: rollout-operator
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      namespace: "default"
      labels:
        app.kubernetes.io/name: rollout-operator
        app.kubernetes.io/instance: rollout-operator
    spec:
      serviceAccountName: rollout-operator
      securityContext:
        {}
      containers:
        - name: rollout-operator
          securityContext:
            {}
          image: docker.io/grafana/rollout-operator:v0.36.2
          imagePullPolicy: IfNotPresent
          args:
          - -kubernetes.namespace=default
          - -server-tls.enabled=true
          - -server-tls.self-signed-cert.secret-name=certificate
          - -server-tls.self-signed-cert.dns-name=rollout-operator.default.svc
          ports:
            - name: http-metrics
              containerPort: 8001
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 5
            timeoutSeconds: 1
          resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
