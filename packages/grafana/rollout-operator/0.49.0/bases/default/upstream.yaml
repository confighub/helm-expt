apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: replicatemplates.rollout-operator.grafana.com
spec:
  group: rollout-operator.grafana.com
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - description: Status replicas
          jsonPath: .status.replicas
          name: StatusReplicas
          type: string
        - description: Spec replicas
          jsonPath: .spec.replicas
          name: SpecReplicas
          type: string
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  default: 1
                  minimum: 0
                labelSelector:
                  type: string
            status:
              type: object
              properties:
                replicas:
                  type: integer
      subresources:
        status: { }
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
          labelSelectorPath: .spec.labelSelector
  scope: Namespaced
  names:
    plural: replicatemplates
    singular: replicatemplate
    kind: ReplicaTemplate
    categories:
      # Include in "kubectl get all" output
      - all

