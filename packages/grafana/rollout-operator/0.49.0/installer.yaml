apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "grafana-rollout-operator"
  version: "0.49.0"
spec:
  bases:
    -
      default: true
      description: "grafana/rollout-operator default variant rendered from grafana/rollout-operator@0.49.0"
      name: "default"
      path: "bases/default"
    -
      description: "grafana/rollout-operator no-crds variant rendered from grafana/rollout-operator@0.49.0"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD replicatemplates.rollout-operator.grafana.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD zoneawarepoddisruptionbudgets.rollout-operator.grafana.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
      name: "no-crds"
      path: "bases/no-crds"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
