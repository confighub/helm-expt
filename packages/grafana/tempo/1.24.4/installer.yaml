apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "grafana-tempo"
  version: "1.24.4"
spec:
  bases:
    -
      default: true
      description: "tempo local persistent single-binary variant rendered from grafana/tempo@1.24.4"
      name: "local-persistent"
      path: "bases/local-persistent"
    -
      description: "tempo S3 query and observability variant rendered from grafana/tempo@1.24.4"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret tempo/tempo-s3-credentials keys access_key,secret_key"
          namespace: "tempo"
          suggestedSource: "kubectl -n tempo create secret generic tempo-s3-credentials --from-literal=access_key=<value> --from-literal=secret_key=<value>"
        -
          kind: "ClusterFeature"
          name: "CRD servicemonitors.monitoring.coreos.com"
          suggestedSource: "package://prerequisites/target-facts/s3-query-observability-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "S3-compatible object store tempo/tempo-object-store"
          namespace: "tempo"
          suggestedSource: "create or bind an S3-compatible endpoint, bucket, and credentials before apply"
      name: "s3-query-observability"
      path: "bases/s3-query-observability"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
