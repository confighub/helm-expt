apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "elastic-filebeat"
  version: "8.5.1"
spec:
  bases:
    -
      default: true
      description: "elastic/filebeat default variant rendered from elastic/filebeat@8.5.1"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret default/elasticsearch-master-certs"
          namespace: "default"
          suggestedSource: "kubectl -n default create secret generic elasticsearch-master-certs --from-file=ca.crt=<path-to-ca.crt>"
        -
          kind: "ClusterFeature"
          name: "Secret default/elasticsearch-master-credentials keys username,password"
          namespace: "default"
          suggestedSource: "kubectl -n default create secret generic elasticsearch-master-credentials --from-literal=username=<username> --from-literal=password=<password>"
      name: "default"
      path: "bases/default"
    -
      default: false
      description: "elastic/filebeat node-or-cluster-collector useful base; aliases the default render with a named user start path"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret default/elasticsearch-master-certs"
          namespace: "default"
          suggestedSource: "kubectl -n default create secret generic elasticsearch-master-certs --from-file=ca.crt=<path-to-ca.crt>"
        -
          kind: "ClusterFeature"
          name: "Secret default/elasticsearch-master-credentials keys username,password"
          namespace: "default"
          suggestedSource: "kubectl -n default create secret generic elasticsearch-master-credentials --from-literal=username=<username> --from-literal=password=<password>"
      name: "node-or-cluster-collector"
      path: "bases/node-or-cluster-collector"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
