apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "percona-pg-operator"
  version: "3.0.0"
spec:
  bases:
    -
      default: true
      description: "percona/pg-operator default variant rendered from percona/pg-operator@3.0.0"
      name: "default"
      path: "bases/default"
    -
      description: "percona/pg-operator no-crds variant rendered from percona/pg-operator@3.0.0"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD crunchybridgeclusters.upstream.pgv2.percona.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD perconapgbackups.pgv2.percona.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD perconapgclusters.pgv2.percona.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD perconapgrestores.pgv2.percona.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD perconapgupgrades.pgv2.percona.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD pgadmins.upstream.pgv2.percona.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD pgupgrades.upstream.pgv2.percona.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD postgresclusters.upstream.pgv2.percona.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
      name: "no-crds"
      path: "bases/no-crds"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
