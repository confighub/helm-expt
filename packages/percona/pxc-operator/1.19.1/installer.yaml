apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "percona-pxc-operator"
  version: "1.19.1"
spec:
  bases:
    -
      default: true
      description: "percona/pxc-operator default variant rendered from percona/pxc-operator@1.19.1"
      name: "default"
      path: "bases/default"
    -
      description: "percona/pxc-operator no-crds variant rendered from percona/pxc-operator@1.19.1"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD perconaxtradbclusterbackups.pxc.percona.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD perconaxtradbclusterrestores.pxc.percona.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
        -
          kind: "ClusterFeature"
          name: "CRD perconaxtradbclusters.pxc.percona.com"
          suggestedSource: "package://prerequisites/target-facts/no-crds-crds.yaml"
      name: "no-crds"
      path: "bases/no-crds"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible requirements."
