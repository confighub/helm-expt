apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "jetstack-cert-manager"
  version: "v1.20.2"
spec:
  bases:
    -
      name: "default"
      path: "bases/default"
      default: true
      description: "cert-manager default variant rendered from jetstack/cert-manager@v1.20.2"
    -
      name: "crds-enabled"
      path: "bases/crds-enabled"
      description: "cert-manager CRDs enabled variant rendered from jetstack/cert-manager@v1.20.2"
  transformers:
    # F1 fix: honour `cub installer --namespace X` instead of the frozen upstream
    # literal — set metadata.namespace on every namespaced resource and rename
    # the Namespace object. Pattern: installer examples/hello-app/installer.yaml.
    - toolchain: "Kubernetes/YAML"
      whereResource: ""
      description: "Set the namespace on every namespaced resource."
      invocations:
        - name: "set-namespace"
          args: ["{{ .Namespace }}"]
