apiVersion: batch/v1
kind: Job
metadata:
  name: "nodewright-webhook-cleanup"
  namespace: "nodewright"
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      serviceAccountName: nodewright-controller-manager
      # Maintenance job: only talks to the API server, so it must be schedulable
      # anywhere and must NOT inherit the controller-manager's nodeSelector/nodeAffinity
      # (that would make this hook unschedulable, and stall, whenever the operator's
      # placement is restrictive). Only a bare os=linux selector is kept (the job image
      # is Linux-only) so it cannot land on a Windows node in a mixed-OS cluster.
      # Tolerations are kept so it can land on tainted nodes.
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3607
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
      # kubectl writes its discovery/http cache under KUBECACHEDIR; with a
      # read-only root filesystem it needs a writable mount.
      - name: kube-cache
        emptyDir: {}
      containers:
      - name: cleanup
        image: docker.io/alpine/kubectl:1.36.2@sha256:01d138ce994b684abc62d9cfdff44de42a4c8996dcc12626dd0193afc3fb5a95
        imagePullPolicy: Always
        env:
        - name: KUBECACHEDIR
          value: /tmp/kubecache
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
        - mountPath: /tmp/kubecache
          name: kube-cache
        # Guard against limitRange being disabled (set to null/false) with fallback defaults
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        command:
        - /bin/sh
        - -c
        - |
          NAMESPACE="nodewright"
          kubectl delete secret -n $NAMESPACE "webhook-cert" || true
          for name in "nodewright-validating-webhook" "skyhook-operator-validating-webhook"; do
            kubectl delete validatingwebhookconfiguration "$name" --ignore-not-found || true
          done
          for name in "nodewright-mutating-webhook" "skyhook-operator-mutating-webhook"; do
            kubectl delete mutatingwebhookconfiguration "$name" --ignore-not-found || true
          done
