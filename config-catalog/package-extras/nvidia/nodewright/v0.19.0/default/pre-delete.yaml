# Source: nodewright/templates/cleanup-skyhooks-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: "nodewright-skyhook-cleanup"
  namespace: "nodewright"
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "-5"
spec:
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      serviceAccountName: nodewright-controller-manager
      # Maintenance job: only talks to the API server, so it must be schedulable
      # anywhere and must NOT inherit the controller-manager's nodeSelector/nodeAffinity
      # (that would make this hook unschedulable, and stall, whenever the operator's
      # placement is restrictive). Only a bare os=linux selector is kept (the job image
      # is Linux-only) so it cannot land on a Windows node in a mixed-OS cluster.
      # Tolerations are kept so it can land on tainted nodes.
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3607
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
      # kubectl writes its discovery/http cache under KUBECACHEDIR; with a
      # read-only root filesystem it needs a writable mount.
      - name: kube-cache
        emptyDir: {}
      containers:
      - name: cleanup
        image: docker.io/alpine/kubectl:1.36.2@sha256:01d138ce994b684abc62d9cfdff44de42a4c8996dcc12626dd0193afc3fb5a95
        imagePullPolicy: Always
        env:
        - name: KUBECACHEDIR
          value: /tmp/kubecache
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
        - mountPath: /tmp/kubecache
          name: kube-cache
        # Guard against limitRange being disabled (set to null/false) with fallback defaults
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        command:
        - /bin/sh
        - -c
        - |
          # Delete all Skyhook/NodeWright resources (cluster-scoped) so the
          # operator can strip finalizers before it is torn down; otherwise the
          # CRD deletion during helm uninstall hangs on the finalizer.
          # Using || true to ensure job succeeds even if delete times out.
          kubectl delete skyhooks --all --ignore-not-found || true
          kubectl delete nodewrights --all --ignore-not-found || true
          # Delete all DeploymentPolicy resources (cluster-scoped). The plural
          # "deploymentpolicies" exists in both groups during the migration, so
          # fully qualify each to avoid an ambiguous short-name lookup.
          kubectl delete deploymentpolicies.skyhook.nvidia.com --all --ignore-not-found || true
          kubectl delete deploymentpolicies.nodewright.nvidia.com --all --ignore-not-found || true
          echo "Cleanup completed"
---
