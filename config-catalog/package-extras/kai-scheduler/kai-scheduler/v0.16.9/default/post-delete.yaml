apiVersion: v1
kind: ServiceAccount
metadata:
  name: post-delete-cleanup
  namespace: kai-scheduler
  labels:
    app: kai-operator
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-delete-policy": hook-succeeded
---
# Source: kai-scheduler/templates/rbac/post-delete-clusterrole.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: post-delete-cleanup
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-delete-policy": hook-succeeded
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - kai.scheduler
  resources:
  - configs
  verbs:
  - delete
---
# Source: kai-scheduler/templates/rbac/post-delete-binding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: post-delete-cleanup
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-delete-policy": hook-succeeded
subjects:
  - kind: ServiceAccount
    name: post-delete-cleanup
    namespace: kai-scheduler
roleRef:
  kind: ClusterRole
  name: post-delete-cleanup
  apiGroup: rbac.authorization.k8s.io
---
# Source: kai-scheduler/templates/hooks/post/post-delete-job.yaml
# Copyright 2025 NVIDIA CORPORATION
# SPDX-License-Identifier: Apache-2.0
apiVersion: batch/v1
kind: Job
metadata:
  name: post-delete-cleanup
  namespace: kai-scheduler
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: post-delete-cleanup
    spec:
      serviceAccountName: post-delete-cleanup
      restartPolicy: Never
      containers:
        - name: deleter
          image: "ghcr.io/kai-scheduler/kai-scheduler/crd-upgrader:v0.16.9"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Deleting KAI operator-managed deployments..."
              kubectl -n kai-scheduler delete deployment --selector=app.kubernetes.io/managed-by=kai-operator --ignore-not-found=true
              echo "Deleting kai-config..."
              kubectl delete Config kai-config --ignore-not-found
              echo "Cleanup complete."
