apiVersion: catalog.confighub.com/v1alpha1
kind: ApplyPolicyProfile
metadata:
  name: catalog-standard
spec:
  sourceTypes:
    - helm
    - aicr
    - cub-installer
    - kubara
    - sveltos
    - rendered-config
  triggerDefinitions:
    - ref: platform/digest-pinned-images
      event: Mutation
      toolchain: Kubernetes/YAML
      functionName: vet-cel
      effect: warn
      description: Warn when a workload image is not pinned by digest.
      arguments:
        - name: expression
          value: '!has(r.spec) || !has(r.spec.template) || !has(r.spec.template.spec) || r.spec.template.spec.containers.all(c, c.image.contains("@sha256:"))'
    - ref: platform/lifecycle-route-evidence
      event: Mutation
      toolchain: Kubernetes/YAML
      functionName: vet-cel
      effect: block
      description: Require every LifecycleRoute to name its scope, executor, evidence, and whether automatic execution has been proved.
      arguments:
        - name: expression
          value: >-
            !has(r.kind) || r.kind != "LifecycleRoute" ||
            (has(r.spec) &&
            has(r.spec.chart) && r.spec.chart != "" &&
            has(r.spec.version) && r.spec.version != "" &&
            has(r.spec.base) && r.spec.base != "" &&
            has(r.spec.routeName) && r.spec.routeName != "" &&
            has(r.spec.executionMode) &&
            r.spec.executionMode in ["product-executes", "user-executes", "target-owned", "not-yet-executable"] &&
            has(r.spec.automatic) &&
            has(r.spec.disposition) &&
            has(r.spec.evidence) && size(r.spec.evidence) > 0 &&
            (!r.spec.automatic || r.spec.disposition == "observed"))
    - ref: platform/probes-declared
      event: Mutation
      toolchain: Kubernetes/YAML
      functionName: vet-cel
      effect: warn
      description: Warn when a workload container has no liveness or readiness probe.
      arguments:
        - name: expression
          value: '!has(r.spec) || !has(r.spec.template) || !has(r.spec.template.spec) || r.spec.template.spec.containers.all(c, has(c.livenessProbe) && has(c.readinessProbe))'
    - ref: platform/require-approval
      event: Mutation
      toolchain: Kubernetes/YAML
      functionName: vet-approvedby
      effect: block
      description: Require one recorded approval before a controlled apply.
      arguments:
        - name: num-approvers
          value: "1"
    - ref: platform/vet-placeholders
      event: Mutation
      toolchain: Kubernetes/YAML
      functionName: vet-placeholders
      effect: block
      description: Block unresolved ConfigHub placeholders.
      arguments: []
    - ref: platform/vet-schemas
      event: Mutation
      toolchain: Kubernetes/YAML
      functionName: vet-schemas
      effect: block
      description: Block Kubernetes data that fails its declared schema.
      arguments: []
  baseline:
    filter: platform/helm-catalog-checks
    filterWhere: "Space.Slug = 'platform' AND Slug ~ '^(digest-pinned-images|lifecycle-route-evidence|probes-declared|vet-placeholders|vet-schemas)$'"
    spaceSelector:
      labels:
        ApplyPolicyProfile: catalog-standard
    checks:
      - id: schema-valid
        trigger: platform/vet-schemas
        effect: block
        reason: Do not apply Kubernetes data that fails its declared schema.
      - id: no-placeholder-values
        trigger: platform/vet-placeholders
        effect: block
        reason: Do not apply placeholder credentials or unfinished values.
      - id: lifecycle-route-evidence
        trigger: platform/lifecycle-route-evidence
        effect: block
        reason: Do not apply a lifecycle route that omits its scope or evidence, or claims automatic execution without an observed receipt.
      - id: images-pinned-by-digest
        trigger: platform/digest-pinned-images
        effect: warn
        reason: Report images that can change without a configuration revision.
      - id: workload-probes-declared
        trigger: platform/probes-declared
        effect: warn
        reason: Report workload containers that have no readiness or liveness probe.
  approvalRequired:
    filter: platform/helm-catalog-prod-gates
    filterWhere: "Space.Slug = 'platform' AND Slug ~ '^(digest-pinned-images|lifecycle-route-evidence|probes-declared|require-approval|vet-placeholders|vet-schemas)$'"
    spaceSelector:
      anyOf:
        - labels:
            ApplyPolicyProfile: catalog-standard
            Environment: Prod
        - labels:
            ApplyPolicyProfile: catalog-standard
            ResourceClass: system-configuration
    checks:
      - id: schema-valid
        trigger: platform/vet-schemas
        effect: block
        reason: Do not apply Kubernetes data that fails its declared schema.
      - id: no-placeholder-values
        trigger: platform/vet-placeholders
        effect: block
        reason: Do not apply placeholder credentials or unfinished values.
      - id: lifecycle-route-evidence
        trigger: platform/lifecycle-route-evidence
        effect: block
        reason: Do not apply a lifecycle route that omits its scope or evidence, or claims automatic execution without an observed receipt.
      - id: images-pinned-by-digest
        trigger: platform/digest-pinned-images
        effect: warn
        reason: Report images that can change without a configuration revision.
      - id: workload-probes-declared
        trigger: platform/probes-declared
        effect: warn
        reason: Report workload containers that have no readiness or liveness probe.
      - id: human-approval
        trigger: platform/require-approval
        effect: block
        reason: Require one recorded approval before production or system configuration is applied.
  operationalClasses:
    - name: user-workload
      normalPolicy: baseline
      productionPolicy: approvalRequired
      reason: Application teams can revise workloads frequently; production still needs an explicit approval.
    - name: system-service
      normalPolicy: baseline
      productionPolicy: approvalRequired
      reason: Shared services such as DNS or monitoring use the common checks and add approval in production.
    - name: system-configuration
      normalPolicy: approvalRequired
      productionPolicy: approvalRequired
      reason: Cluster-wide platform choices have broad impact, so approval is required in every environment.
  scopeAssertions:
    - Every supported configuration source type is named by this profile.
    - Every Trigger is defined here with its function, arguments, effect, and description.
    - The baseline filter selects exactly the five baseline triggers and never selects require-approval.
    - The approval-required filter selects the same five baseline triggers plus require-approval.
    - Production and system-configuration Spaces receive the approval-required filter.
    - Other non-production Spaces remain on the baseline filter.
    - A Space must not lose the five baseline checks when approval is added.
    - The profile is selected by labels or an explicit builder decision, not by a broad match on every platform trigger.
status:
  lastRecorded: "2026-07-26"
  liveReverified: true
  evidence:
    - data/helm-org/summary.md
    - data/apply-policy-profiles/live-helm-catalog.yaml
    - scripts/sync-helm-org.mjs
  limits:
    - The live receipt proves Trigger definitions, filter definitions, and assigned Spaces. The Hooks and CRDs App receipt separately records a dry-run apply that the policy blocked.
    - The builder rewires production and system-configuration Spaces explicitly because cub variant create copies the template TriggerFilterID.
