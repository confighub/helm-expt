apiVersion: catalog.confighub.com/v1alpha1
kind: WorkshopPluginRegistry
metadata:
  name: workshop-plugins
spec:
  description: >-
    Every public cub plugin, each marked by its state. Kept by hand, outside the
    generated site. The site generator turns it into site/plugins.json.
    `node scripts/generate-workshop-sections.mjs --verify-upstream` checks each
    released row against its repository's latest GitHub release.
  checkedAt: "2026-09-30"
  plugins:
    - id: workshop
      name: ConfigHub Workshop
      commands: [cub config, cub app, cub stack, cub fleet]
      summary: Checks, composes and publishes configuration from the Catalog.
      repository: confighub/cub-workshop
      state: released
      release: {tag: v0.6.58, date: "2026-10-09"}
      install: cub plugin install confighub/cub-workshop
    - id: kubara
      name: Kubara
      commands: [cub kubara]
      summary: Brings the add-ons Kubara manages for your clusters into ConfigHub. Plans and renders them offline, then hands the hub to approved releases, checks each cluster and hands back to Git.
      guide: {address: "https://github.com/confighub/kubara-confighub/blob/main/docs/user/cub-kubara.md", title: "Run a Kubara platform through ConfigHub"}
      note: Tested on kind only. Handover needs cub and ConfigHub v0.8.2 or newer, where argobot records live status on each release. The grant argobot gets also covers a release's labels, annotations and withdrawal.
      repository: confighub/kubara-confighub
      state: released
      release: {tag: v0.4.0, date: "2026-10-09"}
      install: cub plugin install confighub/kubara-confighub
    - id: sveltos
      name: Sveltos
      commands: [cub sveltos]
      summary: Brings a Sveltos fleet into ConfigHub with management-cluster delivery, health reporting and target facts.
      guide: {address: "https://confighub.github.io/helm-expt/site/bring-sveltos-into-confighub.html", title: "Onboard a Sveltos fleet"}
      note: Handover rollback and chart-rendered Secret handling remain open upstream work; review those limits before importing a fleet.
      repository: confighub/sveltos-confighub
      state: released
      release: {tag: v0.14.0, date: "2026-10-09"}
      install: cub plugin install confighub/sveltos-confighub
    - id: eks-inference
      name: EKS inference
      commands: [cub eksinf]
      summary: Runs the eks-inference stack on EKS.
      stack: eks-inference
      repository: confighub/eks-inference
      state: released
      release: {tag: v0.12.0, date: "2026-08-13"}
      install: cub plugin install confighub/eks-inference
    - id: installer
      name: Installer
      commands: [cub installer]
      summary: Renders and installs configuration-as-data packages.
      repository: confighub/installer
      state: released
      release: {tag: v0.1.0, date: "2026-07-29"}
      install: cub plugin install confighub/installer
    - id: helm
      name: Helm
      commands: [cub helm]
      summary: Installs Helm charts as ConfigHub components.
      repository: confighub/cub-helm
      state: released
      release: {tag: v0.1.2, date: "2026-10-07"}
      install: cub plugin install confighub/cub-helm
    - id: scout
      name: Scout
      commands: [cub scout]
      summary: Explores and maps GitOps in your clusters.
      repository: confighub/cub-scout
      state: released
      release: {tag: v2.13.2, date: "2026-10-07"}
      install: cub plugin install confighub/cub-scout
    - id: scan
      name: Scan
      commands: [cub scan, cub check]
      summary: Checks Kubernetes and GitOps configuration for known risks.
      repository: confighub/homebrew-tap
      state: released
      release: {tag: cub-scan-v0.7.3, date: "2026-08-24"}
      install: cub plugin install confighub/homebrew-tap@cub-scan-v0.7.3 --name scan
    - id: server
      name: ConfigHub Server
      commands: [cub server]
      summary: Installs a self-hosted ConfigHub server.
      repository: confighub/cub-server
      state: released
      release: {tag: v0.2.3, date: "2026-10-05"}
      install: cub plugin install confighub/cub-server
    - id: demo
      name: Demo
      commands: [cub demo]
      summary: Seeds a ConfigHub organisation with a demo dataset.
      repository: confighub/cub-demo
      state: released
      release: {tag: v0.2.4, date: "2026-10-07"}
      install: cub plugin install confighub/cub-demo
    - id: argo
      name: Argo CD
      commands: [cub argo]
      repository: confighub/examples
      address: https://github.com/confighub/examples/tree/main/cub-argo
      summary: Onboards an Argo CD estate into ConfigHub and hands it over without recreating anything; each generated Application becomes a Unit reading its own Space, and argobot reports live status back.
      guide: {address: "https://confighub.github.io/helm-expt/site/bring-argo-into-confighub.html", title: "Bring your Argo CD apps into ConfigHub"}
      state: released
      release: {tag: cub-argo-v0.3.2, date: "2026-10-09"}
      install: cub plugin install confighub/examples@cub-argo-v0.3.2 --name argo
      note: Start with plan, which needs no account and changes no cluster. Live status is recorded on each release by argobot (argobot.sh installs v0.1.9), or by cub argo status --watch --hard-refresh where argobot is not running; both make each release land at once. Needs cub v0.7.0 or newer; live status needs ConfigHub v0.8.2 or newer.
    - id: flux
      name: Flux
      commands: [cub flux]
      repository: confighub/examples
      address: https://github.com/confighub/examples/tree/main/cub-flux
      summary: Onboards a Flux fleet into ConfigHub with one root per cluster reading its layers Space, records each layer's live status on the release it applied, from a reporter that runs on the cluster, and proposes each cluster that joins.
      guide: {address: "https://confighub.github.io/helm-expt/site/bring-flux-into-confighub.html", title: "Bring your Flux fleet into ConfigHub"}
      state: released
      release: {tag: cub-flux-v0.4.0, date: "2026-10-09"}
      install: cub plugin install confighub/examples@cub-flux-v0.4.0 --name flux
      note: Start with plan, which changes no cluster. Healthy is reported only for layers that check their workloads with wait or healthChecks; review bootstrap ownership before handover. fluxbot.sh runs the live-status reporter on the cluster, as one pod; cub flux status --watch is the same reporter run by hand. The Healthy gate reads what they record. Needs cub v0.7.0 or newer; live status needs ConfigHub v0.8.2 or newer.
