  evidence:
    renderedObjects: "recipes/prometheus-community/alertmanager/1.37.0/revisions/default/r001/rendered/release-objects.yaml"
    objectInventory: "recipes/prometheus-community/alertmanager/1.37.0/revisions/default/r001/rendered/object-inventory.yaml"
    helmPainReport: "recipes/prometheus-community/alertmanager/1.37.0/helm-pain-report.yaml"
    installGate: "recipes/prometheus-community/alertmanager/1.37.0/revisions/default/r001/receipts/install-gate.yaml"
    twoClusterKindParityReceipt: "runs/live-kind-parity/prometheus-community-alertmanager-default/receipt.yaml"
    liveHelmConfigHubParityReceipt: "runs/live-helm-confighub-compare/prometheus-community-alertmanager-default/receipt.yaml#configHubOciArgo"
    promotionReviewPacket: "data/top100-promotion-wave/fast-track-reviews/prometheus-community-alertmanager.yaml"
  decisionsStillNeeded:
    - "storage class fit for target"
    - "backup and restore procedure"
    - "data retention and deletion policy"
    - "rollback runbook for the selected base"
    - "target-scoped support decision"
  boundaries:
    - "This review records the rendered storage shape; it is not a production acceptance."
    - "Render parity does not prove backup, restore, retention, or application data safety."
    - "If an HA or persistence choice changes the rendered object set, promote that choice through the reviewed base path."
