    workloads:
      -
        kind: "StatefulSet"
        name: "alertmanager"
        namespace: "default"
        replicas: 1
        updateStrategy: "unspecified"
        volumeClaimTemplates:
          -
            name: "storage"
            accessModes:
              - "ReadWriteOnce"
            requestedStorage: "50Mi"
            storageClassName: "cluster-default"
    volumeClaimTemplates:
      -
        workload: "StatefulSet/alertmanager"
        name: "storage"
        accessModes:
          - "ReadWriteOnce"
        requestedStorage: "50Mi"
        storageClassName: "cluster-default"
