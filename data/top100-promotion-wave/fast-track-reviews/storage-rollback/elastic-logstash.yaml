apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "PromotionStorageRollbackReview"
metadata:
  name: "elastic-logstash-default-storage-rollback-review"
spec:
  chart: "elastic/logstash"
  version: "8.5.1"
  selectedBase: "default"
  decisionState: "review-input-only"
  catalogSupportClaimAllowed: false
  storageShape:
    summary: "StatefulSet rendered with no volumeClaimTemplates in selected base"
    workloads:
      -
        kind: "StatefulSet"
        name: "logstash-logstash"
        namespace: ""
        replicas: 1
        updateStrategy: "RollingUpdate"
        podManagementPolicy: "Parallel"
        volumeClaimTemplates:
          []
    volumeClaimTemplates:
      []
  rollbackBoundary: "manifest rollback only; no PVC-backed data durability claim in selected base"
  evidence:
    renderedObjects: "recipes/elastic/logstash/8.5.1/revisions/default/r001/rendered/release-objects.yaml"
    objectInventory: "recipes/elastic/logstash/8.5.1/revisions/default/r001/rendered/object-inventory.yaml"
    helmPainReport: "recipes/elastic/logstash/8.5.1/helm-pain-report.yaml"
    installGate: "recipes/elastic/logstash/8.5.1/revisions/default/r001/receipts/install-gate.yaml"
    twoClusterKindParityReceipt: "runs/live-kind-parity/elastic-logstash-default/receipt.yaml"
    liveHelmConfigHubParityReceipt: "runs/live-helm-confighub-compare/elastic-logstash-default/receipt.yaml#configHubOciArgo"
    promotionReviewPacket: "data/top100-promotion-wave/fast-track-reviews/elastic-logstash.yaml"
  decisionsStillNeeded:
    - "storage class fit for target"
    - "backup and restore procedure"
    - "data retention and deletion policy"
    - "rollback runbook for the selected base"
    - "target-scoped support decision"
  boundaries:
    - "This review records the rendered storage shape; it is not a production acceptance."
    - "Render parity does not prove backup, restore, retention, or application data safety."
    - "If an HA or persistence choice changes the rendered object set, promote that choice through the reviewed base path."
