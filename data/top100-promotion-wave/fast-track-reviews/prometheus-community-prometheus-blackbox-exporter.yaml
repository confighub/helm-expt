apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "PromotionReviewPacket"
metadata:
  name: "prometheus-community-prometheus-blackbox-exporter-fast-track-review"
spec:
  chart: "prometheus-community/prometheus-blackbox-exporter"
  version: "11.10.0"
  selectedBaseCandidate: "cluster-metrics-readonly"
  candidateVariants:
    - "default"
    - "cluster-metrics-readonly"
  decisionState: "review-input-only"
  catalogSupportClaimAllowed: false
  whyFastTrack:
    - "two-cluster kind parity passes for the selected base"
    - "scan/gate state is clean for the selected base"
    - "current feature model has no CRD or webhook lifecycle class for this row"
    - "remaining work is a bounded operating review plus live evidence"
  currentEvidence:
    catalog: "recipes/prometheus-community/prometheus-blackbox-exporter/11.10.0/CATALOG.md"
    twoClusterKindParityReceipt: "runs/live-kind-parity/prometheus-community-prometheus-blackbox-exporter-cluster-metrics-readonly/receipt.yaml"
    liveHelmConfigHubParityReceipt: ""
    helmPainReport: "recipes/prometheus-community/prometheus-blackbox-exporter/11.10.0/helm-pain-report.yaml"
    controlPoints: "recipes/prometheus-community/prometheus-blackbox-exporter/11.10.0/control-points.yaml"
    scanReceipt: "recipes/prometheus-community/prometheus-blackbox-exporter/11.10.0/revisions/cluster-metrics-readonly/r001/receipts/scan-receipt.yaml"
    installGate: "recipes/prometheus-community/prometheus-blackbox-exporter/11.10.0/revisions/cluster-metrics-readonly/r001/receipts/install-gate.yaml"
    storageRollbackReview: "data/top100-promotion-wave/fast-track-reviews/storage-rollback/prometheus-community-prometheus-blackbox-exporter.yaml"
  decisionsNeeded:
    -
      decision: "storage-and-rollback-support-boundary"
      required: true
      reason: "The generated storage review records the rendered shape. A target owner still has to accept or narrow backup, restore, rollback, storage-class fit, and data-retention behavior."
    -
      decision: "extension-slot-policy"
      required: true
      reason: "The chart exposes template or extension surfaces. Populated slots that change the object set need a reviewed base, not an untracked derived variant."
    -
      decision: "target-scoped-support"
      required: true
      reason: "Catalog support is target-scoped and cannot be inferred from machine proof alone."
  missingProofLanes:
    - "GitOps/OCI live observation"
    - "live Helm-vs-ConfigHub parity"
  nextActions:
    - "review and accept/narrow storage/rollback boundary for selected target"
    - "complete GitOps/OCI live observation"
    - "complete live Helm-vs-ConfigHub parity"
    - "record target-scoped support decision"
  boundaries:
    - "This packet is not a catalog status change."
    - "The HA variant remains a candidate until it has selected evidence of its own."
    - "Production backup, restore, retention, and rollback procedures remain target decisions."
