apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Top100PromotionReviewPacket"
metadata:
  name: "traefik-traefik-40-2-0-promotion-review"
spec:
  chart: "traefik/traefik"
  version: "40.2.0"
  selectedBaseCandidate: "default"
  candidateVariants:
    - "default"
    - "no-crds"
  decisionState: "review-input-only"
  catalogSupportClaimAllowed: false
  whyThisChartIsInTheWave:
    - "The chart is proof-grade in the maintained top-100 corpus."
    - "The chart has multiple named variants, so there is a real selection question."
    - "The selected base has strict parity evidence."
    - "No named limitation currently blocks promotion review."
  currentEvidence:
    catalog: "recipes/traefik/traefik/40.2.0/CATALOG.md"
    helmPainReport: "recipes/traefik/traefik/40.2.0/helm-pain-report.yaml"
    controlPoints: "recipes/traefik/traefik/40.2.0/control-points.yaml"
    valueModel: "recipes/traefik/traefik/40.2.0/value-model.yaml"
    helmPlan: "recipes/traefik/traefik/40.2.0/helm-plan.yaml"
    variant: "recipes/traefik/traefik/40.2.0/variants/default/variant.yaml"
    variantRevision: "recipes/traefik/traefik/40.2.0/revisions/default/r001/variant-revision.yaml"
    helmEquivalence: "recipes/traefik/traefik/40.2.0/revisions/default/r001/receipts/helm-equivalence-receipt.yaml"
    scanReceipt: "recipes/traefik/traefik/40.2.0/revisions/default/r001/receipts/scan-receipt.yaml"
    installGate: "recipes/traefik/traefik/40.2.0/revisions/default/r001/receipts/install-gate.yaml"
    packageBase: "packages/traefik/traefik/40.2.0/bases/default/kustomization.yaml"
    twoClusterKindParity: "runs/live-kind-parity/traefik-traefik-default/receipt.yaml"
    liveHelmConfigHubParity: "runs/live-helm-confighub-compare/traefik-traefik-default/receipt.yaml"
  currentState:
    supportLevel: "machine-proof-only"
    productionReadiness: "not-reviewed-for-production"
    catalogStatus: "proof-grade"
    strongestEvidence: "live-helm-vs-confighub-parity"
    scanHigh: 0
    scanMedium: 27
    gateDecisions:
      - "allow"
      - "warn"
    featureFocus:
      - "lookup"
      - "generated-facts"
      - "tpl"
      - "capabilities"
      - "crds"
      - "cluster-rbac"
      - "webhooks"
      - "stateful-storage"
  decisionsNeeded:
    -
      workType: "variant-selection"
      reviewer: "catalog reviewer"
      reason: "Confirm the promoted base is a real Helm-user path, not merely the first rendered baseline."
      doneWhen: "A selected variant is named from default;no-crds and the non-selected variants have a written promote/defer reason."
      evidence: "recipes/traefik/traefik/40.2.0/CATALOG.md"
    -
      workType: "scan-and-gate-disposition"
      reviewer: "security reviewer"
      reason: "Scan/gate state is high=0, medium=27, gates=allow;warn."
      doneWhen: "Every warning is fixed, accepted with rationale, or routed to a narrower base before catalog support."
      evidence: "data/catalog-promotion-review/review.csv"
    -
      workType: "crd-lifecycle"
      reviewer: "platform reviewer"
      reason: "The chart includes CRDs or CRD-like lifecycle concerns."
      doneWhen: "CRD install, upgrade, ownership, and no-CRDs behavior are recorded or explicitly deferred for the selected base."
      evidence: "recipes/traefik/traefik/40.2.0/helm-pain-report.yaml"
    -
      workType: "webhook-readiness"
      reviewer: "platform reviewer"
      reason: "The chart includes webhook resources or webhook runtime dependencies."
      doneWhen: "Webhook readiness, CA/material injection, failure policy, and observation path are recorded or explicitly deferred."
      evidence: "recipes/traefik/traefik/40.2.0/helm-pain-report.yaml"
    -
      workType: "storage-and-rollback-policy"
      reviewer: "operator reviewer"
      reason: "The chart has persistent or stateful behavior."
      doneWhen: "Storage class assumptions, PVC behavior, backup/rollback boundary, and destructive-change policy are written for the selected base."
      evidence: "recipes/traefik/traefik/40.2.0/helm-pain-report.yaml"
    -
      workType: "generated-fact-policy"
      reviewer: "catalog reviewer"
      reason: "The chart has generated or once-only values that can affect repeatability."
      doneWhen: "Generated facts are persisted, replaced by target facts, or explicitly scoped out of the promoted base."
      evidence: "recipes/traefik/traefik/40.2.0/control-points.yaml"
    -
      workType: "rbac-scope"
      reviewer: "security reviewer"
      reason: "The chart creates cluster-scoped RBAC or similar permissions."
      doneWhen: "Cluster permissions are accepted for the support scope or a narrower base is selected."
      evidence: "recipes/traefik/traefik/40.2.0/helm-pain-report.yaml"
    -
      workType: "template-and-capability-boundary"
      reviewer: "catalog reviewer"
      reason: "The chart has template-powered inputs or Kubernetes capability branches."
      doneWhen: "The supported values, capability profile, and extension-slot policy are catalog-readable for the selected base."
      evidence: "recipes/traefik/traefik/40.2.0/helm-plan.yaml"
    -
      workType: "selected-live-evidence"
      reviewer: "operator reviewer"
      reason: "Strict parity evidence exists (live-helm-vs-confighub-parity); catalog promotion needs the selected runtime evidence boundary."
      doneWhen: "The selected base has linked live evidence, GitOps/OCI evidence, live parity evidence, or a routed deferral with rationale."
      evidence: "data/live-kind-parity/summary.csv;data/live-helm-confighub-compare/summary.csv"
    -
      workType: "target-scoped-support-decision"
      reviewer: "catalog owner"
      reason: "Catalog support is not implied by machine proof."
      doneWhen: "A target-scoped support decision exists with supported, deferred, superseded, or blocked outcome."
      evidence: "data/production-support-decisions/summary.md"
  claimsNotMade:
    - "catalog support"
    - "production support"
    - "support for non-selected variants"
    - "support for private values overlays or wrapper charts"
    - "support outside the eventual target scope"
    - "CRD upgrade or uninstall safety"
    - "webhook certificate and readiness behavior beyond the selected evidence scope"
    - "backup, restore, storage-class fit, or data-retention behavior"
    - "least-privilege RBAC hardening"
  nextAction: "Use this packet to choose the promoted base, close the listed review decisions, link selected live evidence or a routed deferral, then write a target-scoped support decision before changing catalog status."
