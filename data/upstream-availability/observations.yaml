apiVersion: catalog.confighub.com/v1alpha1
kind: UpstreamAvailabilityObservations
metadata:
  name: upstream-availability
spec:
  description: >-
    Where a Catalog entry's upstream chart source no longer serves what its
    source lock records. Each observation is dated and names what was measured.
    The source lock and the receipts keep the address the Catalog fetched from
    at the time, because that is what happened; this file says what is true
    now, and scripts/lib/upstream-availability.mjs gives the address a new
    fetch should use.
  method: >-
    Every source lock with an https repository was checked against that
    repository's index.yaml: is the locked version listed, and where a
    repository did not answer, where the project says it moved. Re-run with
    node scripts/verify-upstream-availability.mjs --check-live.
  observations:
    - lock: recipes/mysql/mysql-operator/2.3.0/source-lock.yaml
      chart: mysql/mysql-operator
      version: "2.3.0"
      observedOn: "2026-10-26"
      status: removed-upstream
      detail: >-
        The repository index lists only 2.3.1, published 2026-10-22, and
        mysql-operator-2.3.0.tgz returns 404. The repository keeps only its
        latest release.
      catalogCopy: >-
        The Catalog's installer package and bundle for this entry, pinned by
        digest, still hold 2.3.0, and its image still pulls.
      upstreamLatest: "2.3.1"
    - lock: recipes/sealed-secrets/sealed-secrets/2.18.6/source-lock.yaml
      chart: sealed-secrets/sealed-secrets
      version: "2.18.6"
      observedOn: "2026-10-26"
      status: moved
      detail: >-
        https://bitnami-labs.github.io/sealed-secrets/index.yaml returns 404.
        The project README names https://bitnami.github.io/sealed-secrets,
        whose index lists 2.18.6 with the SHA-256 the source lock records.
      fetchFrom: https://bitnami.github.io/sealed-secrets
      sha256: 4af8cb2b150b83460f15242e36706159cb77f6ba834f79a7bd172cb2f5debc72
