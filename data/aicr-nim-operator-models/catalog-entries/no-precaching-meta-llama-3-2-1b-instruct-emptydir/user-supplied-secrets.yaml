apiVersion: "evidence.confighub.com/v1alpha1"
kind: "BundleRoute"
metadata:
  name: "nimservice-no-precaching-meta-llama-3-2-1b-instruct-emptydir-user-supplied-secrets"
spec:
  quirkClass: "generated-secrets"
  routeKind: "external-secret-reference"
  discharges: "Without these Secrets the image cannot be pulled and the model cannot be fetched, because both are gated and the sample carries Secret names and no values."
  declaration:
    namespace: "nim-service"
    secrets:
      -
        name: "ngc-secret"
        role: "image-pull"
        namedBy:
          - "NIMService spec.image.pullSecrets"
        suppliedBy: "the user, from their own NVIDIA or model-hub entitlement"
        valueHeldHere: false
      -
        name: "ngc-api-secret"
        role: "model-auth"
        namedBy:
          - "NIMService spec.authSecret"
        suppliedBy: "the user, from their own NVIDIA or model-hub entitlement"
        valueHeldHere: false
  executedBy:
    runtimes:
      -
        name: "the user's secret manager"
        mechanism: "create each named Secret in the sample's namespace before the sample is applied"
        proven: false
      -
        name: "direct apply"
        mechanism: "kubectl create secret, run by the user with their own credential"
        proven: false
    automatic: false
  boundedness:
    - "The sample carries Secret names only. No Secret value is in this repository, and no key or token was used to build this entry."
    - "The keys each Secret must hold are not declared by the retained objects, so this route names the Secrets and does not name their keys."
    - "The container image nvcr.io/nim/meta/llama-3.2-1b-instruct:1.12.0 and the model weights are gated by NVIDIA. This entry did not pull them, does not hold them and will never redistribute them."
    - "No runtime has executed this route."
  provenance:
    emittedBy: "scripts/generate-aicr-nim-operator-models.mjs"
    generatedFrom:
      - "data/aicr-nim-operator-models/upstream/serving/standalone/no-precaching/llm-emptydir.yaml"
    verdictRef: "data/aicr-nim-operator-models/catalog-entries/no-precaching-meta-llama-3-2-1b-instruct-emptydir/flattening-safety-verdict.yaml"
