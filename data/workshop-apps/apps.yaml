apiVersion: catalog.confighub.com/v1alpha1
kind: WorkshopAppRegistry
metadata:
  name: workshop-apps
spec:
  description: Worked example applications, kept by hand outside the generated site. The site generator
    turns this into site/apps.json. Each row links to its repository's default branch and records the
    commit at which it was last checked. `node scripts/verify-workshop-sections.mjs --verify-upstream`
    flags any row whose example has changed on its branch since. The cub-workshop fixtures conflict-a
    and conflict-b exist to show a refusal, so they belong to Guides, not this list.
  checkedAt: '2026-09-28'
  apps:
  - id: workshop-demo
    name: The shop app, five journeys
    summary: 'A small shop app built with an AI assistant, followed through the five journeys: values
      that did nothing, fixes that survive, what the app needs, before GitOps takes over, and an image
      that no longer exists.'
    delivery: plain
    repository: monadic/workshop-demo
    path: ''
    branch: main
    checkedCommit: 6e56b6707e13358f50f4257a6030cf5e951778b2
  - id: shop-storefront
    name: storefront
    summary: 'A shop service for the storefront: a Deployment and a Service in namespace retail.'
    delivery: plain
    repository: confighub/cub-workshop
    path: apps/storefront.yaml
    branch: main
    checkedCommit: 8f4c207a134c74e0d94c228c11b2c4b202ffed19
