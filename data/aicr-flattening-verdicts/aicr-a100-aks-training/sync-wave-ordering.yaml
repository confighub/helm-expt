apiVersion: "evidence.confighub.com/v1alpha1"
kind: "BundleRoute"
metadata:
  name: "aicr-a100-aks-training-sync-wave-ordering"
spec:
  quirkClass: "crd-ordering"
  routeKind: "apply-ordering"
  discharges: "The components of a platform install in a dependency order. Without an ordering declaration the Applications would apply in no guaranteed order, and a component would reach the cluster before the one it depends on."
  declaration:
    stages:
      -
        order: 1
        name: "sync-wave-1"
        observedSyncWave: 1
        objectCount: 4
        selector:
          kinds:
            - "Application"
          names:
            - "cert-manager"
            - "nfd"
            - "nodewright-operator"
            - "prometheus-operator-crds"
      -
        order: 2
        name: "sync-wave-5"
        observedSyncWave: 5
        objectCount: 3
        selector:
          kinds:
            - "Application"
          names:
            - "kube-prometheus-stack"
            - "network-operator"
            - "nodewright-customizations"
      -
        order: 3
        name: "sync-wave-6"
        observedSyncWave: 6
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "network-operator-post"
      -
        order: 4
        name: "sync-wave-9"
        observedSyncWave: 9
        objectCount: 3
        selector:
          kinds:
            - "Application"
          names:
            - "gpu-operator"
            - "k8s-ephemeral-storage-metrics"
            - "prometheus-adapter"
      -
        order: 5
        name: "sync-wave-10"
        observedSyncWave: 10
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "gpu-operator-post"
      -
        order: 6
        name: "sync-wave-13"
        observedSyncWave: 13
        objectCount: 3
        selector:
          kinds:
            - "Application"
          names:
            - "kai-scheduler"
            - "nvidia-dra-driver-gpu"
            - "nvsentinel"
  executedBy:
    runtimes:
      -
        name: "Argo CD"
        mechanism: "the sync-wave annotation each Application carries"
        proven: false
    automatic: false
  boundedness:
    - "The order is AICR's and not this project's. It is read from the sync-wave annotations on 15 rendered Applications, which fall into 6 waves. The recipe the bundle carries deploys 13 components, and 17 of the 17 dependency edges between them hold in those waves."
    - "The selected recipe also names 1 component the bundle leaves out (dra-node-labeler), and the generation receipt records the reason AICR logged for it. The selected recipe makes nvidia-dra-driver-gpu depend on dra-node-labeler. The recipe the bundle carries declares no such edge, so no sync-wave was asked to hold it. That edge is recorded and not checked, and no route of this entry decides it, so the entry is flagged. The route that lists the omitted components records the decision a destination has to make."
    - "2 waved Applications render without appearing in the recipe's deployment order (network-operator-post, gpu-operator-post). They are companions of a component, and they are named here so the comparison does not drop them silently."
    - "The ordering-parity lane in data/aicr-ordering-parity/summary.md covers four hand-retained entries and does not cover this one. The comparison above applies the same dependency-edge rule to this entry's own recipe."
    - "No runtime has executed this route. Nothing in this repository has synced this Application set on any cluster."
    - "4 of the 16 Applications take their source from oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/aicr-a100-aks-training/aicr-bundle at 1.0.0. The entry retains that bundle at examples/aicr/a100-aks-training/argocd-helm-bundle, and the entry's Catalog record says whether the package is in the registry. Argo CD can resolve those sources only when it is."
  provenance:
    emittedBy: "scripts/generate-certified-bundle-receipts.mjs"
    generatedFrom:
      - "examples/aicr/a100-aks-training/argocd-rendered/templates"
      - "examples/aicr/a100-aks-training/argocd-helm-bundle/recipe.yaml"
