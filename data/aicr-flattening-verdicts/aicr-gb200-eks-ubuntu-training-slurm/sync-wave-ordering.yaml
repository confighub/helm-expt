apiVersion: "evidence.confighub.com/v1alpha1"
kind: "BundleRoute"
metadata:
  name: "aicr-gb200-eks-ubuntu-training-slurm-sync-wave-ordering"
spec:
  quirkClass: "crd-ordering"
  routeKind: "apply-ordering"
  discharges: "The components of a platform install in a dependency order. Without an ordering declaration the Applications would apply in no guaranteed order, and a component would reach the cluster before the one it depends on."
  declaration:
    stages:
      -
        order: 1
        name: "sync-wave-1"
        observedSyncWave: 1
        objectCount: 7
        selector:
          kinds:
            - "Application"
          names:
            - "aws-ebs-csi-driver"
            - "aws-efa"
            - "cert-manager"
            - "nfd"
            - "nodewright-operator"
            - "prometheus-operator-crds"
            - "slinky-slurm-operator-crds"
      -
        order: 2
        name: "sync-wave-5"
        observedSyncWave: 5
        objectCount: 3
        selector:
          kinds:
            - "Application"
          names:
            - "kube-prometheus-stack"
            - "nodewright-customizations"
            - "slinky-slurm-operator"
      -
        order: 3
        name: "sync-wave-8"
        observedSyncWave: 8
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "gpu-operator-pre"
      -
        order: 4
        name: "sync-wave-9"
        observedSyncWave: 9
        objectCount: 3
        selector:
          kinds:
            - "Application"
          names:
            - "gpu-operator"
            - "k8s-ephemeral-storage-metrics"
            - "prometheus-adapter"
      -
        order: 5
        name: "sync-wave-13"
        observedSyncWave: 13
        objectCount: 3
        selector:
          kinds:
            - "Application"
          names:
            - "kai-scheduler"
            - "nvidia-dra-driver-gpu"
            - "nvsentinel"
      -
        order: 6
        name: "sync-wave-16"
        observedSyncWave: 16
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "slinky-slurm-pre"
      -
        order: 7
        name: "sync-wave-17"
        observedSyncWave: 17
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "slinky-slurm"
  executedBy:
    runtimes:
      -
        name: "Argo CD"
        mechanism: "the sync-wave annotation each Application carries"
        proven: false
    automatic: false
  boundedness:
    - "The order is AICR's and not this project's. It is read from the sync-wave annotations on 19 rendered Applications, which fall into 7 waves. The retained recipe deploys 17 components, and 19 of the 19 dependency edges between them hold in those waves."
    - "4 further dependency edges in the recipe name a component the recipe does not deploy (mariadb-operator, mariadb-operator-crds, slurm-accounting-mariadb). No sync-wave exists for those components, so these edges are recorded and not checked."
    - "1 of them is a deployed component depending on one that is not deployed: slinky-slurm on slurm-accounting-mariadb. That is an open question about the recipe, and this entry does not answer it."
    - "2 waved Applications render without appearing in the recipe's deployment order (gpu-operator-pre, slinky-slurm-pre). They are companions of a component, and they are named here so the comparison does not drop them silently."
    - "The ordering-parity lane in data/aicr-ordering-parity/summary.md covers four hand-retained entries and does not cover this one. The comparison above applies the same dependency-edge rule to this entry's own recipe."
    - "No runtime has executed this route. Nothing in this repository has synced this Application set on any cluster."
    - "4 of the 20 Applications take their source from oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/aicr-bundle at 0.21.0. That package has not been published, and this entry does not retain it, so Argo CD could not resolve those sources today."
  provenance:
    emittedBy: "scripts/generate-certified-bundle-receipts.mjs"
    generatedFrom:
      - "examples/aicr/gb200-eks-ubuntu-training-slurm/argocd-rendered/templates"
      - "examples/aicr/gb200-eks-ubuntu-training-slurm/recipe.yaml"
