      disposition: "none required"
    -
      class: "lookup"
      finding: "not-evaluated"
      detail: "not evaluated for this bundle: the charts these Applications reference are rendered by Argo CD at sync time, so no template-time construct is flattened here"
      disposition: "carried by the referenced chart's own catalog verdict"
    -
      class: "webhook-ca"
      finding: "absent"
      detail: "no webhook configuration in the rendered Application set"
      disposition: "none required"
    -
      class: "capabilities-api-versions"
      finding: "not-evaluated"
      detail: "not evaluated for this bundle: the charts these Applications reference are rendered by Argo CD at sync time, so no template-time construct is flattened here"
      disposition: "carried by the referenced chart's own catalog verdict"
    -
      class: "generated-secrets"
      finding: "absent"
      detail: "no Secret object in the rendered Application set"
      disposition: "none required"
    -
      class: "crd-ordering"
      finding: "present"
      detail: "19 Applications carry a sync-wave, and the order they declare is AICR's own deploymentOrder"
      disposition: "route this bundle ships at data/certified-bundles/routes/aicr/aicr-eks-h100-inference-nim/sync-wave-ordering.yaml"
      companionRequired: "apply-ordering"
    -
      class: "immutable-fields"
      finding: "not-evaluated"
      detail: "not evaluated for this bundle: the charts these Applications reference are rendered by Argo CD at sync time, so no template-time construct is flattened here"
      disposition: "carried by the referenced chart's own catalog verdict"
    -
      class: "namespace-creation"
      finding: "absent"
      detail: "no Namespace object ships in the bundle; the target namespace must exist before apply"
      disposition: "declared at ingest"
    -
      class: "subchart-conditions"
      finding: "not-evaluated"
      detail: "not evaluated for this bundle: the charts these Applications reference are rendered by Argo CD at sync time, so no template-time construct is flattened here"
      disposition: "carried by the referenced chart's own catalog verdict"
    -
      class: "test-hooks"
      finding: "absent"
      detail: "no test hook in the rendered Application set"
      disposition: "none required"
  componentScope:
