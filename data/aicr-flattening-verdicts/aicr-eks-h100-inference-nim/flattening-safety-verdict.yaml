      - "nvidia-dra-driver-gpu"
      - "nvsentinel"
      - "prometheus-adapter"
      - "prometheus-operator-crds"
      - "skyhook-operator"
    statement: "Each Application points at a chart that Argo CD renders at sync time. No chart is flattened by this shape, so no chart's flattening verdict is decided here. Those verdicts belong to the chart catalog and are read per chart."
  verdict:
    lane: "flatten-with-routes"
    rationale: "The Application set is flattened output that carries an ordering declaration the delivery runtime executes. Ordering declarations are what this lane covers. Nothing else in the set needs a companion, because the constructs a flattening audit looks for live in the charts, and the charts are not flattened here."
    routes:
      - "sync-wave ordering across the platform components"
  boundedness:
    - "This verdict decides the wrapper, not the components. A component chart can be do-not-flatten and still ship inside this shape safely, because this shape does not flatten it."
    - "The ordering is upstream's. AICR computes deploymentOrder from the dependency graph, and the ordering-parity lane checks these sync-waves preserve it."
    - "The Applications carry automated sync policies. That is a delivery decision, not a flattening hazard, and the delivery proof holds the controller at zero rather than inheriting it silently."
    - "No workload ran. This verdict is config-plane only, like every AICR receipt."
  provenance:
