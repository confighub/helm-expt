    note: "The subject is a platform shape rather than a chart. It is the rendered Argo CD Application set produced from AICR's argocd-helm bundle chart."
  dispositions:
    -
      class: "helm-hooks"
      finding: "absent"
      detail: "no helm.sh/hook annotation in the rendered Application set"
