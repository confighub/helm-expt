apiVersion: "evidence.confighub.com/v1alpha1"
kind: "BundleRoute"
metadata:
  name: "aicr-ocp-inference-nim-sync-wave-ordering"
spec:
  quirkClass: "crd-ordering"
  routeKind: "apply-ordering"
  discharges: "The components of a platform install in a dependency order. Without an ordering declaration the Applications would apply in no guaranteed order, and a component would reach the cluster before the one it depends on."
  declaration:
    stages:
      -
        order: 1
        name: "sync-wave-0"
        observedSyncWave: 0
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "prometheus-adapter-ocp-pre"
      -
        order: 2
        name: "sync-wave-1"
        observedSyncWave: 1
        objectCount: 2
        selector:
          kinds:
            - "Application"
          names:
            - "nfd-ocp-olm"
            - "prometheus-adapter-ocp"
      -
        order: 3
        name: "sync-wave-2"
        observedSyncWave: 2
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "prometheus-adapter-ocp-post"
      -
        order: 4
        name: "sync-wave-5"
        observedSyncWave: 5
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "nfd-ocp"
      -
        order: 5
        name: "sync-wave-9"
        observedSyncWave: 9
        objectCount: 3
        selector:
          kinds:
            - "Application"
          names:
            - "cert-manager-ocp-olm"
            - "gpu-operator-ocp-olm"
            - "network-operator-ocp-olm"
      -
        order: 6
        name: "sync-wave-13"
        observedSyncWave: 13
        objectCount: 2
        selector:
          kinds:
            - "Application"
          names:
            - "cert-manager-ocp"
            - "network-operator-ocp"
      -
        order: 7
        name: "sync-wave-17"
        observedSyncWave: 17
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "gpu-operator-ocp"
      -
        order: 8
        name: "sync-wave-20"
        observedSyncWave: 20
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "nvidia-dra-driver-gpu-ocp-pre"
      -
        order: 9
        name: "sync-wave-21"
        observedSyncWave: 21
        objectCount: 2
        selector:
          kinds:
            - "Application"
          names:
            - "k8s-nim-operator-ocp"
            - "nvidia-dra-driver-gpu-ocp"
      -
        order: 10
        name: "sync-wave-22"
        observedSyncWave: 22
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "k8s-nim-operator-ocp-post"
  executedBy:
    runtimes:
      -
        name: "Argo CD"
        mechanism: "the sync-wave annotation each Application carries"
        proven: false
    automatic: false
  boundedness:
    - "The order is AICR's and not this project's. It is read from the sync-wave annotations on 15 rendered Applications, which fall into 10 waves. The recipe the bundle carries deploys 11 components, and 11 of the 11 dependency edges between them hold in those waves."
    - "The selected recipe also names 12 components the bundle leaves out (cert-manager, dra-node-labeler, gpu-operator, k8s-ephemeral-storage-metrics, kai-scheduler, kube-prometheus-stack, nfd, nodewright-operator, nvidia-dra-driver-gpu, nvsentinel, prometheus-adapter, prometheus-operator-crds), and the generation receipt records the reason AICR logged for each. No component the bundle deploys depends on one of them in the selected recipe."
    - "4 waved Applications render without appearing in the recipe's deployment order (prometheus-adapter-ocp-pre, prometheus-adapter-ocp-post, nvidia-dra-driver-gpu-ocp-pre, k8s-nim-operator-ocp-post). They are companions of a component, and they are named here so the comparison does not drop them silently."
    - "The ordering-parity lane in data/aicr-ordering-parity/summary.md covers four hand-retained entries and does not cover this one. The comparison above applies the same dependency-edge rule to this entry's own recipe."
    - "No runtime has executed this route. Nothing in this repository has synced this Application set on any cluster."
    - "13 of the 16 Applications take their source from oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/aicr-ocp-inference-nim/aicr-bundle at 1.0.0. The entry retains that bundle at examples/aicr/ocp-inference-nim/argocd-helm-bundle, and the entry's Catalog record says whether the package is in the registry. Argo CD can resolve those sources only when it is."
  provenance:
    emittedBy: "scripts/generate-certified-bundle-receipts.mjs"
    generatedFrom:
      - "examples/aicr/ocp-inference-nim/argocd-rendered/templates"
      - "examples/aicr/ocp-inference-nim/argocd-helm-bundle/recipe.yaml"
