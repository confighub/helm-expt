apiVersion: "evidence.confighub.com/v1alpha1"
kind: "BundleRoute"
metadata:
  name: "aicr-h100-gke-cos-inference-dynamo-sync-wave-ordering"
spec:
  quirkClass: "crd-ordering"
  routeKind: "apply-ordering"
  discharges: "The components of a platform install in a dependency order. Without an ordering declaration the Applications would apply in no guaranteed order, and a component would reach the cluster before the one it depends on."
  declaration:
    stages:
      -
        order: 1
        name: "sync-wave-1"
        observedSyncWave: 1
        objectCount: 7
        selector:
          kinds:
            - "Application"
          names:
            - "agentgateway-crds"
            - "cert-manager"
            - "gcp-driver-installer"
            - "grove"
            - "nfd"
            - "nodewright-operator"
            - "prometheus-operator-crds"
      -
        order: 2
        name: "sync-wave-2"
        observedSyncWave: 2
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "agentgateway-crds-post"
      -
        order: 3
        name: "sync-wave-5"
        observedSyncWave: 5
        objectCount: 3
        selector:
          kinds:
            - "Application"
          names:
            - "agentgateway"
            - "kube-prometheus-stack"
            - "nodewright-customizations"
      -
        order: 4
        name: "sync-wave-6"
        observedSyncWave: 6
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "agentgateway-post"
      -
        order: 5
        name: "sync-wave-8"
        observedSyncWave: 8
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "gpu-operator-pre"
      -
        order: 6
        name: "sync-wave-9"
        observedSyncWave: 9
        objectCount: 3
        selector:
          kinds:
            - "Application"
          names:
            - "gpu-operator"
            - "k8s-ephemeral-storage-metrics"
            - "prometheus-adapter"
      -
        order: 7
        name: "sync-wave-13"
        observedSyncWave: 13
        objectCount: 3
        selector:
          kinds:
            - "Application"
          names:
            - "kai-scheduler"
            - "nvidia-dra-driver-gpu"
            - "nvsentinel"
      -
        order: 8
        name: "sync-wave-17"
        observedSyncWave: 17
        objectCount: 1
        selector:
          kinds:
            - "Application"
          names:
            - "dynamo-platform"
  executedBy:
    runtimes:
      -
        name: "Argo CD"
        mechanism: "the sync-wave annotation each Application carries"
        proven: false
    automatic: false
  boundedness:
    - "The order is AICR's and not this project's. It is read from the sync-wave annotations on 20 rendered Applications, which fall into 8 waves. The recipe the bundle carries deploys 17 components, and 22 of the 22 dependency edges between them hold in those waves."
    - "The selected recipe also names 2 components the bundle leaves out (dra-node-labeler, k8s-aibom), and the generation receipt records the reason AICR logged for each. The selected recipe makes nvidia-dra-driver-gpu depend on dra-node-labeler. The recipe the bundle carries declares no such edge, so no sync-wave was asked to hold it, and a route records the decision a destination has to make."
    - "3 waved Applications render without appearing in the recipe's deployment order (agentgateway-crds-post, agentgateway-post, gpu-operator-pre). They are companions of a component, and they are named here so the comparison does not drop them silently."
    - "The ordering-parity lane in data/aicr-ordering-parity/summary.md covers four hand-retained entries and does not cover this one. The comparison above applies the same dependency-edge rule to this entry's own recipe."
    - "No runtime has executed this route. Nothing in this repository has synced this Application set on any cluster."
    - "6 of the 21 Applications take their source from oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/aicr-h100-gke-cos-inference-dynamo/aicr-bundle at 1.0.0. The entry retains that bundle at examples/aicr/h100-gke-cos-inference-dynamo/argocd-helm-bundle, and the entry's Catalog record says whether the package is in the registry. Argo CD can resolve those sources only when it is."
  provenance:
    emittedBy: "scripts/generate-certified-bundle-receipts.mjs"
    generatedFrom:
      - "examples/aicr/h100-gke-cos-inference-dynamo/argocd-rendered/templates"
      - "examples/aicr/h100-gke-cos-inference-dynamo/argocd-helm-bundle/recipe.yaml"
