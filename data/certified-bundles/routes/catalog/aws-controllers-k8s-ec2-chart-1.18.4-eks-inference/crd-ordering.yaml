apiVersion: "evidence.confighub.com/v1alpha1"
kind: "BundleRoute"
metadata:
  name: "aws-controllers-k8s-ec2-chart-1.18.4-eks-inference-crd-ordering"
spec:
  quirkClass: "crd-ordering"
  routeKind: "apply-ordering"
  discharges: "Without an ordering declaration, per-file Units apply in no guaranteed order, so a custom resource can reach the cluster before the definition that gives it meaning."
  declaration:
    stages:
      -
        order: 1
        name: "custom-resource-definitions"
        selector:
          kinds:
            - "CustomResourceDefinition"
          names:
            - "capacityreservations.ec2.services.k8s.aws"
            - "dhcpoptions.ec2.services.k8s.aws"
            - "egressonlyinternetgateways.ec2.services.k8s.aws"
            - "elasticipaddresses.ec2.services.k8s.aws"
            - "fieldexports.services.k8s.aws"
            - "flowlogs.ec2.services.k8s.aws"
            - "iamroleselectors.services.k8s.aws"
            - "instances.ec2.services.k8s.aws"
            - "internetgateways.ec2.services.k8s.aws"
            - "launchtemplates.ec2.services.k8s.aws"
            - "managedprefixlists.ec2.services.k8s.aws"
            - "natgateways.ec2.services.k8s.aws"
            - "networkacls.ec2.services.k8s.aws"
            - "routetables.ec2.services.k8s.aws"
            - "securitygroups.ec2.services.k8s.aws"
            - "subnets.ec2.services.k8s.aws"
            - "transitgateways.ec2.services.k8s.aws"
            - "transitgatewayvpcattachments.ec2.services.k8s.aws"
            - "vpcendpoints.ec2.services.k8s.aws"
            - "vpcendpointserviceconfigurations.ec2.services.k8s.aws"
            - "vpcpeeringconnections.ec2.services.k8s.aws"
            - "vpcs.ec2.services.k8s.aws"
        waitFor: "every named definition reports the Established condition"
        objectCount: 22
      -
        order: 2
        name: "everything-else"
        selector:
          kinds:
            - "*"
        objectCount: 10
  executedBy:
    runtimes:
      -
        name: "Argo CD"
        mechanism: "sync waves, the earlier stage at the lower wave number"
        proven: false
      -
        name: "Flux"
        mechanism: "dependsOn between the definitions Kustomization and the rest"
        proven: false
      -
        name: "cub-direct applier"
        mechanism: "apply stage one and wait for establishment before stage two"
        proven: false
    automatic: true
  boundedness:
    - "the route orders what the bundle contains; a definition this bundle does not ship must already exist on the target"
    - "establishment is observed by the delivery runtime, so this route declares the wait rather than proving it happened"
  provenance:
    emittedBy: "scripts/generate-certified-bundle-receipts.mjs"
    generatedFrom:
      - "recipes/aws-controllers-k8s/ec2-chart/1.18.4/revisions/eks-inference/r001/rendered/object-inventory.yaml"
    verdictRef: "recipes/aws-controllers-k8s/ec2-chart/1.18.4/publication/flattening-safety-verdict.yaml"
