apiVersion: "evidence.confighub.com/v1alpha1"
kind: "BundleRoute"
metadata:
  name: "rook-release-rook-ceph-v1.19.5-default-crd-ordering"
spec:
  quirkClass: "crd-ordering"
  routeKind: "apply-ordering"
  discharges: "Without an ordering declaration, per-file Units apply in no guaranteed order, so a custom resource can reach the cluster before the definition that gives it meaning."
  declaration:
    stages:
      -
        order: 1
        name: "custom-resource-definitions"
        selector:
          kinds:
            - "CustomResourceDefinition"
          names:
            - "cephblockpoolradosnamespaces.ceph.rook.io"
            - "cephblockpools.ceph.rook.io"
            - "cephbucketnotifications.ceph.rook.io"
            - "cephbuckettopics.ceph.rook.io"
            - "cephclients.ceph.rook.io"
            - "cephclusters.ceph.rook.io"
            - "cephconnections.csi.ceph.io"
            - "cephcosidrivers.ceph.rook.io"
            - "cephfilesystemmirrors.ceph.rook.io"
            - "cephfilesystems.ceph.rook.io"
            - "cephfilesystemsubvolumegroups.ceph.rook.io"
            - "cephnfses.ceph.rook.io"
            - "cephnvmeofgateways.ceph.rook.io"
            - "cephobjectrealms.ceph.rook.io"
            - "cephobjectstores.ceph.rook.io"
            - "cephobjectstoreusers.ceph.rook.io"
            - "cephobjectzonegroups.ceph.rook.io"
            - "cephobjectzones.ceph.rook.io"
            - "cephrbdmirrors.ceph.rook.io"
            - "clientprofilemappings.csi.ceph.io"
            - "clientprofiles.csi.ceph.io"
            - "drivers.csi.ceph.io"
            - "objectbucketclaims.objectbucket.io"
            - "objectbuckets.objectbucket.io"
            - "operatorconfigs.csi.ceph.io"
        waitFor: "every named definition reports the Established condition"
        objectCount: 25
      -
        order: 2
        name: "everything-else"
        selector:
          kinds:
            - "*"
        objectCount: 108
  executedBy:
    runtimes:
      -
        name: "Argo CD"
        mechanism: "sync waves, the earlier stage at the lower wave number"
        proven: false
      -
        name: "Flux"
        mechanism: "dependsOn between the definitions Kustomization and the rest"
        proven: false
      -
        name: "cub-direct applier"
        mechanism: "apply stage one and wait for establishment before stage two"
        proven: false
    automatic: true
  boundedness:
    - "the route orders what the bundle contains; a definition this bundle does not ship must already exist on the target"
    - "establishment is observed by the delivery runtime, so this route declares the wait rather than proving it happened"
  provenance:
    emittedBy: "scripts/generate-certified-bundle-receipts.mjs"
    generatedFrom:
      - "recipes/rook-release/rook-ceph/v1.19.5/revisions/default/r001/rendered/object-inventory.yaml"
    verdictRef: "recipes/rook-release/rook-ceph/v1.19.5/publication/flattening-safety-verdict.yaml"
