    -
      step: "namespace-before-apply"
      phase: "pre-apply"
      invokedBy: "operator"
      statement: "Namespace cert-manager must exist before apply. trust-manager uses cert-manager as the default trust namespace and regular Helm does not create it for the no-crds base."
