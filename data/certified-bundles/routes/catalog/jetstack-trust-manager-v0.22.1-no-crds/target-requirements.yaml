    -
      step: "secret-before-apply"
      phase: "pre-apply"
      invokedBy: "operator"
      statement: "Secret default/trust-manager-tls must exist before apply. trust-manager admission webhook TLS material normally produced by the rendered cert-manager Certificate lifecycle."
      names:
        -
          id: "default/trust-manager-tls"
          detail: "trust-manager admission webhook TLS material normally produced by the rendered cert-manager Certificate lifecycle"
      checks:
        []
      automatic: false
      evidenceState: "not-run"
      recorded:
        status: "requires-destination-resolution"
        sourceStatus: "recorded-not-run"
      evidence:
