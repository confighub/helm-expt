apiVersion: "evidence.confighub.com/v1alpha1"
kind: "BundleRoute"
metadata:
  name: "traefik-traefik-41.0.2-default-crd-ordering"
spec:
  quirkClass: "crd-ordering"
  routeKind: "apply-ordering"
  discharges: "Without an ordering declaration, per-file Units apply in no guaranteed order, so a custom resource can reach the cluster before the definition that gives it meaning."
  declaration:
    stages:
      -
        order: 1
        name: "custom-resource-definitions"
        selector:
          kinds:
            - "CustomResourceDefinition"
          names:
            - "accesscontrolpolicies.hub.traefik.io"
            - "aiservices.hub.traefik.io"
            - "apiauths.hub.traefik.io"
            - "apibundles.hub.traefik.io"
            - "apicatalogitems.hub.traefik.io"
            - "apiplans.hub.traefik.io"
            - "apiportalauths.hub.traefik.io"
            - "apiportals.hub.traefik.io"
            - "apiratelimits.hub.traefik.io"
            - "apis.hub.traefik.io"
            - "apiversions.hub.traefik.io"
            - "contentitems.hub.traefik.io"
            - "ingressroutes.traefik.io"
            - "ingressroutetcps.traefik.io"
            - "ingressrouteudps.traefik.io"
            - "managedapplications.hub.traefik.io"
            - "managedsubscriptions.hub.traefik.io"
            - "middlewares.traefik.io"
            - "middlewaretcps.traefik.io"
            - "serverstransports.traefik.io"
            - "serverstransporttcps.traefik.io"
            - "tlsoptions.traefik.io"
            - "tlsstores.traefik.io"
            - "traefikservices.traefik.io"
            - "uplinks.hub.traefik.io"
        waitFor: "every named definition reports the Established condition"
        objectCount: 25
      -
        order: 2
        name: "everything-else"
        selector:
          kinds:
            - "*"
        objectCount: 6
  executedBy:
    runtimes:
      -
        name: "Argo CD"
        mechanism: "sync waves, the earlier stage at the lower wave number"
        proven: false
      -
        name: "Flux"
        mechanism: "dependsOn between the definitions Kustomization and the rest"
        proven: false
      -
        name: "cub-direct applier"
        mechanism: "apply stage one and wait for establishment before stage two"
        proven: false
    automatic: true
  boundedness:
    - "the route orders what the bundle contains; a definition this bundle does not ship must already exist on the target"
    - "establishment is observed by the delivery runtime, so this route declares the wait rather than proving it happened"
  provenance:
    emittedBy: "scripts/generate-certified-bundle-receipts.mjs"
    generatedFrom:
      - "recipes/traefik/traefik/41.0.2/revisions/default/r001/rendered/object-inventory.yaml"
    verdictRef: "recipes/traefik/traefik/41.0.2/publication/flattening-safety-verdict.yaml"
