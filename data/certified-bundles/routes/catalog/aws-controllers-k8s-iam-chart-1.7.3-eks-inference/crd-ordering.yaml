apiVersion: "evidence.confighub.com/v1alpha1"
kind: "BundleRoute"
metadata:
  name: "aws-controllers-k8s-iam-chart-1.7.3-eks-inference-crd-ordering"
spec:
  quirkClass: "crd-ordering"
  routeKind: "apply-ordering"
  discharges: "Without an ordering declaration, per-file Units apply in no guaranteed order, so a custom resource can reach the cluster before the definition that gives it meaning."
  declaration:
    stages:
      -
        order: 1
        name: "custom-resource-definitions"
        selector:
          kinds:
            - "CustomResourceDefinition"
          names:
            - "fieldexports.services.k8s.aws"
            - "groups.iam.services.k8s.aws"
            - "iamroleselectors.services.k8s.aws"
            - "instanceprofiles.iam.services.k8s.aws"
            - "openidconnectproviders.iam.services.k8s.aws"
            - "policies.iam.services.k8s.aws"
            - "roles.iam.services.k8s.aws"
            - "servicelinkedroles.iam.services.k8s.aws"
            - "users.iam.services.k8s.aws"
        waitFor: "every named definition reports the Established condition"
        objectCount: 9
      -
        order: 2
        name: "everything-else"
        selector:
          kinds:
            - "*"
        objectCount: 10
  executedBy:
    runtimes:
      -
        name: "Argo CD"
        mechanism: "sync waves, the earlier stage at the lower wave number"
        proven: false
      -
        name: "Flux"
        mechanism: "dependsOn between the definitions Kustomization and the rest"
        proven: false
      -
        name: "cub-direct applier"
        mechanism: "apply stage one and wait for establishment before stage two"
        proven: false
    automatic: true
  boundedness:
    - "the route orders what the bundle contains; a definition this bundle does not ship must already exist on the target"
    - "establishment is observed by the delivery runtime, so this route declares the wait rather than proving it happened"
  provenance:
    emittedBy: "scripts/generate-certified-bundle-receipts.mjs"
    generatedFrom:
      - "recipes/aws-controllers-k8s/iam-chart/1.7.3/revisions/eks-inference/r001/rendered/object-inventory.yaml"
    verdictRef: "recipes/aws-controllers-k8s/iam-chart/1.7.3/publication/flattening-safety-verdict.yaml"
