apiVersion: "evidence.confighub.com/v1alpha1"
kind: "BundleRoute"
metadata:
  name: "aicr-cpu-starter-sync-wave-ordering"
spec:
  quirkClass: "crd-ordering"
  routeKind: "apply-ordering"
  discharges: "The components of a platform install in a dependency order. Without an ordering declaration the Applications would apply in no guaranteed order, and a component would reach the cluster before the one it depends on."
  declaration:
    stages:
      -
        order: 1
        name: "cert-manager"
        observedSyncWave: 2
        selector:
          kinds:
            - "Application"
          names:
            - "cert-manager"
      -
        order: 2
        name: "nfd"
        observedSyncWave: 3
        selector:
          kinds:
            - "Application"
          names:
            - "nfd"
      -
        order: 3
        name: "prometheus-operator-crds"
        observedSyncWave: 6
        selector:
          kinds:
            - "Application"
          names:
            - "prometheus-operator-crds"
      -
        order: 4
        name: "kube-prometheus-stack"
        observedSyncWave: 7
        selector:
          kinds:
            - "Application"
          names:
            - "kube-prometheus-stack"
      -
        order: 5
        name: "k8s-ephemeral-storage-metrics"
        observedSyncWave: 9
        selector:
          kinds:
            - "Application"
          names:
            - "k8s-ephemeral-storage-metrics"
      -
        order: 6
        name: "kai-scheduler"
        observedSyncWave: 10
        selector:
          kinds:
            - "Application"
          names:
            - "kai-scheduler"
      -
        order: 7
        name: "prometheus-adapter"
        observedSyncWave: 15
        selector:
          kinds:
            - "Application"
          names:
            - "prometheus-adapter"
  executedBy:
    runtimes:
      -
        name: "Argo CD"
        mechanism: "the sync-wave annotation each Application carries"
        proven: true
    automatic: true
  boundedness:
    - "The order is not this project's invention. AICR computes deploymentOrder from the component dependency graph, and the ordering-parity lane checks that these sync-waves preserve it exactly."
  provenance:
    emittedBy: "scripts/generate-certified-bundle-receipts.mjs"
    generatedFrom:
      - "examples/aicr/cpu-starter/argocd-rendered/templates"
      - "examples/aicr/cpu-starter/recipe.yaml"
      - "data/aicr-ordering-parity/summary.md"
