apiVersion: "evidence.confighub.com/v1alpha1"
kind: "BundleRoute"
metadata:
  name: "aicr-eks-h100-training-kubeflow-sync-wave-ordering"
spec:
  quirkClass: "crd-ordering"
  routeKind: "apply-ordering"
  discharges: "The components of a platform install in a dependency order. Without an ordering declaration the Applications would apply in no guaranteed order, and a component would reach the cluster before the one it depends on."
  declaration:
    stages:
      -
        order: 1
        name: "aws-ebs-csi-driver"
        syncWave: 0
        selector:
          kinds:
            - "Application"
          names:
            - "aws-ebs-csi-driver"
      -
        order: 2
        name: "aws-efa"
        syncWave: 1
        selector:
          kinds:
            - "Application"
          names:
            - "aws-efa"
      -
        order: 3
        name: "cert-manager"
        syncWave: 2
        selector:
          kinds:
            - "Application"
          names:
            - "cert-manager"
      -
        order: 4
        name: "nfd"
        syncWave: 3
        selector:
          kinds:
            - "Application"
          names:
            - "nfd"
      -
        order: 5
        name: "nodewright-operator"
        syncWave: 4
        selector:
          kinds:
            - "Application"
          names:
            - "nodewright-operator"
      -
        order: 6
        name: "nodewright-customizations"
        syncWave: 5
        selector:
          kinds:
            - "Application"
          names:
            - "nodewright-customizations"
      -
        order: 7
        name: "prometheus-operator-crds"
        syncWave: 6
        selector:
          kinds:
            - "Application"
          names:
            - "prometheus-operator-crds"
      -
        order: 8
        name: "kube-prometheus-stack"
        syncWave: 7
        selector:
          kinds:
            - "Application"
          names:
            - "kube-prometheus-stack"
      -
        order: 9
        name: "gpu-operator"
        syncWave: 8
        selector:
          kinds:
            - "Application"
          names:
            - "gpu-operator"
      -
        order: 10
        name: "k8s-ephemeral-storage-metrics"
        syncWave: 9
        selector:
          kinds:
            - "Application"
          names:
            - "k8s-ephemeral-storage-metrics"
      -
        order: 11
        name: "kai-scheduler"
        syncWave: 10
        selector:
          kinds:
            - "Application"
          names:
            - "kai-scheduler"
      -
        order: 12
        name: "kubeflow-trainer"
        syncWave: 11
        selector:
          kinds:
            - "Application"
          names:
            - "kubeflow-trainer"
      -
        order: 13
        name: "kubeflow-trainer-post"
        syncWave: 12
        selector:
          kinds:
            - "Application"
          names:
            - "kubeflow-trainer-post"
      -
        order: 14
        name: "nvidia-dra-driver-gpu"
        syncWave: 13
        selector:
          kinds:
            - "Application"
          names:
            - "nvidia-dra-driver-gpu"
      -
        order: 15
        name: "nvsentinel"
        syncWave: 14
        selector:
          kinds:
            - "Application"
          names:
            - "nvsentinel"
      -
        order: 16
        name: "prometheus-adapter"
        syncWave: 15
        selector:
          kinds:
            - "Application"
          names:
            - "prometheus-adapter"
  executedBy:
    runtimes:
      -
        name: "Argo CD"
        mechanism: "the sync-wave annotation each Application carries"
        proven: true
    automatic: true
  boundedness:
    - "The order is not this project's invention. AICR computes deploymentOrder from the component dependency graph, and the ordering-parity lane checks that these sync-waves preserve it exactly."
  provenance:
    emittedBy: "scripts/generate-certified-bundle-receipts.mjs"
    generatedFrom:
      - "examples/aicr/eks-h100-training-kubeflow/argocd-rendered/templates"
      - "examples/aicr/eks-h100-training-kubeflow/recipe.yaml"
      - "data/aicr-ordering-parity/summary.md"
