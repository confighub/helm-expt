apiVersion: helm-expt.confighub.com/v1alpha1
kind: ProductionSupportDecision
metadata:
  name: "prometheus-community-prometheus-default-public-oci-draft"
spec:
  chart: "prometheus-community/prometheus"
  version: "29.8.0"
  decision: draft
  decisionDate: "2026-06-09"
  supportedBase: "default"
  targetScope:
    clusterClass: vanilla-kubernetes
    namespace: "prometheus"
    deliveryPath: confighub-oci
    gitopsController: argo-or-flux
    storageAssumptions:
      - "Use the chart's recorded storage behavior for the candidate base unless this draft is narrowed before final support."
    networkAssumptions:
      - "Use the service, ingress, DNS, and certificate behavior recorded by the candidate base unless this draft is narrowed before final support."
    requiredTargetFacts: []
  supportBoundary:
    includes:
      - "prometheus-community/prometheus@29.8.0 default base"
      - ConfigHub OCI delivery for the declared target scope after fresh target evidence is recorded
      - rendered objects, labels, gates, receipts, and support objects produced by the recorded base
    excludes:
      - "private values overlays, wrapper charts, and populated extension slots unless separately reviewed"
      - "non-vanilla Kubernetes distributions unless separately reviewed"
      - "other delivery controllers or target scopes unless separately reviewed"
  decisions:
    imageDecision:
      state: "needs-image-digest-resolution-or-exception"
      detail: "resolve image digests or record explicit exception before production OCI support"
    scanDecision:
      state: "needs-security-acceptance-or-hardened-base"
      detail: "record security acceptance or create hardened base"
    lifecycleDecision:
      state: "no-lifecycle-specific-decision"
      detail: "no lifecycle-specific decision beyond standard support boundary"
    targetFactDecision:
      state: "no-unresolved-target-prerequisite-in-candidate-base"
      detail: "no unresolved target prerequisite in candidate base"
    liveEvidenceDecision:
      state: "needs-missing-live-or-confighub-lanes-before-final"
      detail: "complete missing live or ConfigHub lanes, then refresh target-scoped evidence"
  evidence:
    - path: "recipes/prometheus-community/prometheus/29.8.0/revisions/default/r001/receipts/helm-equivalence-receipt.yaml"
      claim: "The candidate base is Helm-equivalent under recorded inputs."
    - path: "recipes/prometheus-community/prometheus/29.8.0/revisions/default/r001/receipts/scan-receipt.yaml"
      claim: "The rendered-object scan receipt exists for the candidate base."
    - path: "runs/live-kind-parity/prometheus-community-prometheus-default/receipt.yaml"
      claim: "The two-cluster Helm-vs-installer parity receipt exists for the candidate base."
    - path: "data/production-disposition/receipts/prometheus-community-prometheus/cluster-rbac-review.yaml"
      claim: "The cluster rbac review disposition exists for this chart."
    - path: "data/production-disposition/receipts/prometheus-community-prometheus/extension-slot-provenance-and-scan-policy.yaml"
      claim: "The extension slot provenance and scan policy disposition exists for this chart."
    - path: "data/production-disposition/receipts/prometheus-community-prometheus/scan-gate-warning-disposition.yaml"
      claim: "The scan gate warning disposition disposition exists for this chart."
  requiredBeforeFinal:
    - "Choose the final target scope, exact GitOps controller, namespace, and artifact digest."
    - "Refresh target-scoped ConfigHub OCI/GitOps and live/e2e evidence for the declared scope."
    - "resolve image digests or record explicit exception before production OCI support"
    - "record security acceptance or create hardened base"
  nextAction: "choose the supported production base, then record explicit security acceptance or create a hardened base before claiming production support"
