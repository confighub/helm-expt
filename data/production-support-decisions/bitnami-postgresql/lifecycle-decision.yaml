apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ProductionLifecycleDecision"
metadata:
  name: "bitnami-postgresql-public-oci-lifecycle-decision"
spec:
  chart: "bitnami/postgresql"
  version: "18.6.7"
  targetScope:
    clusterClass: "cub-lk-kind-vanilla"
    namespace: "postgresql"
    deliveryPath: "confighub-oci"
    gitopsController: "argo"
  supportedBaseCandidate: "generated-passwords"
  variantsCovered:
    - "existing-secret"
    - "generated-passwords"
  decision: "lifecycle-observed-for-proof-scope"
  decidedAt: "2026-06-09"
  claim: "The PostgreSQL generated-passwords base has no Helm hook objects and reaches readiness through regular Helm, cub installer apply, and ConfigHub OCI/Argo. The generated postgres password is bound before render and the rendered Secret is separated by cub installer rather than hidden in workload units."
  lifecycleModel:
    hookPolicy: "no-chart-hooks"
    selectedTopology: "standalone-statefulset-generated-passwords"
    generatedFacts: "auth.postgresPassword is generated and bound before render; the rendered Secret is deterministic and separated during cub installer output."
    storagePolicy: "The public proof uses the chart's standalone StatefulSet PVC posture. StorageClass, backup, restore, high availability, and rollback remain target decisions."
    excludedTopology: "existing-secret is a useful target-fact path but remains outside this production-support claim until target credential custody and rotation are separately reviewed."
  observedLifecycleSignals:
    twoClusterParity:
      result: "pass"
      observedAt: "2026-06-06T08:23:49Z"
      regularHelmRuntime: "pass"
      installerRuntime: "pass"
      semanticParity: "pass"
    confighubOciArgo:
      result: "pass"
      observedAt: "2026-06-05T18:19:50Z"
      regularHelmRuntime: "pass"
      confighubApplyRuntime: "pass"
      confighubOciRuntime: "pass"
      argoSync: "Synced"
      argoHealth: "Healthy"
      semanticParity: "pass"
      separatedSecrets:
        - "secret-postgresql-oci-postgresql.yaml"
  limits:
    - "This supports the generated-passwords public proof base, not every PostgreSQL deployment topology."
    - "This proof does not test PostgreSQL backup, restore, point-in-time recovery, failover, replication, or high-availability operation."
    - "Credential rotation and secret custody are target operating procedures outside this public proof."
    - "Populated init scripts or extended configuration slots require a new reviewed base."
  evidence:
    -
      path: "runs/live-kind-parity/bitnami-postgresql-generated-passwords/receipt.yaml"
      claim: "Two-cluster Helm-vs-installer parity passes for generated-passwords."
    -
      path: "runs/live-helm-confighub-compare/bitnami-postgresql-generated-passwords/receipt.yaml"
      claim: "ConfigHub OCI/Argo live parity passes for generated-passwords."
    -
      path: "data/production-disposition/receipts/bitnami-postgresql/generated-fact-ownership.yaml"
      claim: "Records generated credential ownership and the separated Secret policy."
    -
      path: "data/production-disposition/receipts/bitnami-postgresql/hook-and-lifecycle-phase-policy.yaml"
      claim: "Records the no-hooks lifecycle boundary for PostgreSQL."
    -
      path: "data/production-disposition/receipts/bitnami-postgresql/storage-backup-restore-and-rollback-policy.yaml"
      claim: "Records PostgreSQL storage, backup, restore, and rollback boundaries."
    -
      path: "data/production-disposition/receipts/bitnami-postgresql/target-fact-preflight.yaml"
      claim: "Records the existing-secret target-fact path that remains outside this support claim."
  remainingSupportBlockers:
    - "Record image policy, scan/PDB acceptance, and fresh target-scoped ConfigHub OCI/GitOps evidence."
