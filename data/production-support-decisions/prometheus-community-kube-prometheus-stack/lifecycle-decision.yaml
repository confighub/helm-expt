        result: "pass"
        verdict: "PASS"
        exitCode: 0
        evidencePath: "cub-scout.prerequisites.receipt.json"
        evidenceSHA256: "a98a55bad8400f0ae41e473acc4239c89908d790e19e84154d24b9273fa89703"
        stderrPath: "cub-scout.prerequisites.stderr.txt"
        stderrSHA256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      cubScoutWorkloads:
