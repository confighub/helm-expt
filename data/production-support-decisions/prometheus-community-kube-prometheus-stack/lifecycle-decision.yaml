        stderrSHA256: "2d5612bf3580660df88b77f34676a9461a09b7682dcbfe827f0c458023f643e5"
    twoClusterParity:
      status: "not-used"
      checkedPath: "runs/live-kind-parity/prometheus-community-kube-prometheus-stack-default/receipt.yaml"
      reason: "No matching-version two-cluster kind parity receipt is retained for prometheus-community/kube-prometheus-stack@85.3.3; later-version kind parity rows are deliberately excluded from this lifecycle decision."
