apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ProductionLifecycleDecision"
metadata:
  name: "prometheus-community-kube-prometheus-stack-public-oci-lifecycle-decision"
spec:
  chart: "prometheus-community/kube-prometheus-stack"
  version: "85.3.3"
  targetScope:
    clusterClass: "vanilla-kubernetes"
    namespace: "monitoring"
    deliveryPath: "confighub-oci"
    gitopsController: "argo-or-flux"
  supportedBaseCandidate: "default"
  variantsCovered:
    - "default"
  decision: "lifecycle-observed-for-proof-scope"
  decidedAt: "2026-06-09"
  claim: "The selected KPS hook/lifecycle route has observed evidence for the public monitoring proof scope: webhook TLS prerequisite staging, CRD bootstrap and Established checks, operator and workload rollout, and ConfigHub OCI/Argo runtime health. This closes the lifecycle decision for the current proof scope, but not for every production target or upgrade path."
  route:
    result: "observed"
    summary: "Admission webhook patch hooks are handled as explicit lifecycle work, not as hidden render parity."
    phases:
      -
        action: "preflight-or-presync"
        hookTypes:
          - "pre-install"
          - "pre-upgrade"
        reason: "The hook creates webhook patch prerequisites before admission configuration is safe to use."
      -
        action: "postsync-readiness-observation"
        hookTypes:
          - "post-install"
          - "post-upgrade"
        reason: "Webhook TLS and readiness must be observed after apply."
      -
        action: "upgrade-action-with-receipt"
        hookTypes:
          - "pre-upgrade"
          - "post-upgrade"
        reason: "Upgrade behavior must be recorded separately from initial render parity."
  observedLifecycleSignals:
    localKindObservation:
      result: "pass"
      observedAt: "2026-06-09T13:09:35.333Z"
      targetNamespace: "monitoring"
      supportSecret:
        name: "support-secret-kube-prometheus-stack-admission"
        result: "pass"
        reason: "Prometheus Operator admission webhook TLS Secret is normally created by Helm hook lifecycle"
