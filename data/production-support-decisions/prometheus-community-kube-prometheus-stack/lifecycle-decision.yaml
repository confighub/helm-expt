        result: "pass"
        verdict: "PASS"
        exitCode: 0
        evidencePath: "cub-scout.workloads.receipt.json"
        evidenceSHA256: "55e3ee941f1658cba8576c7b290e33c7736b6257aec735357ae06dcfd9a117ad"
