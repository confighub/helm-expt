apiVersion: helm-expt.confighub.com/v1alpha1
kind: ProductionSupportDecision
metadata:
  name: "prometheus-community-kube-prometheus-stack-default-public-oci-draft"
spec:
  chart: "prometheus-community/kube-prometheus-stack"
  version: "85.3.3"
  decision: draft
  decisionDate: "2026-06-09"
  supportedBase: "default"
  targetScope:
    clusterClass: vanilla-kubernetes
    namespace: "monitoring"
    deliveryPath: confighub-oci
    gitopsController: argo-or-flux
    storageAssumptions:
      - "Use the chart's recorded storage behavior for the candidate base unless this draft is narrowed before final support."
    networkAssumptions:
      - "Use the service, ingress, DNS, and certificate behavior recorded by the candidate base unless this draft is narrowed before final support."
    requiredTargetFacts:
      - kind: Secret
        namespace: monitoring
        name: kube-prometheus-stack-admission
        keys:
          - cert
          - key
        purpose: Prometheus Operator admission webhook TLS material normally created by Helm hook lifecycle.
  supportBoundary:
    includes:
      - "prometheus-community/kube-prometheus-stack@85.3.3 default base"
      - ConfigHub OCI delivery for the declared target scope after fresh target evidence is recorded
      - rendered objects, labels, gates, receipts, and support objects produced by the recorded base
      - declared target-fact preflight for the Prometheus Operator admission webhook TLS Secret
    excludes:
      - "private values overlays, wrapper charts, and populated extension slots unless separately reviewed"
      - "non-vanilla Kubernetes distributions unless separately reviewed"
      - "other delivery controllers or target scopes unless separately reviewed"
  decisions:
    imageDecision:
      state: "mutable-image-exception-accepted-for-target-scope"
      detail: "both recorded base variants have digest-resolution receipts; mutable image tags are accepted only for the declared public monitoring support draft, while stricter scopes may require digest-pinned bases or image overrides"
    scanDecision:
      state: "security-accepted-for-target-scope"
      detail: "scan findings are accepted for the declared public monitoring support draft; stricter environments may still require a hardened base"
    lifecycleDecision:
      state: "route-selected-observation-needed"
      detail: "the hook lifecycle route is selected; final support still needs execution or observation receipt for webhook TLS/readiness, cleanup, ordering, and upgrade behavior"
    targetFactDecision:
      state: "no-unresolved-target-prerequisite-in-candidate-base"
      detail: "the candidate base declares monitoring/kube-prometheus-stack-admission cert and key as target facts; final support must stage or observe them in the target scope"
    liveEvidenceDecision:
      state: "needs-fresh-target-evidence-before-final"
      detail: "default has broad committed proof lanes; final support still needs fresh target-scoped ConfigHub OCI/GitOps and live evidence after image, security, and lifecycle decisions are closed"
  evidence:
    - path: "recipes/prometheus-community/kube-prometheus-stack/85.3.3/revisions/default/r001/receipts/helm-equivalence-receipt.yaml"
      claim: "The candidate base is Helm-equivalent under recorded inputs."
    - path: "recipes/prometheus-community/kube-prometheus-stack/85.3.3/revisions/default/r001/receipts/scan-receipt.yaml"
      claim: "The rendered-object scan receipt exists for the candidate base."
    - path: "runs/live-kind-parity/prometheus-community-kube-prometheus-stack-default/receipt.yaml"
      claim: "The two-cluster Helm-vs-installer parity receipt exists for the candidate base."
    - path: "runs/live-helm-confighub-compare/prometheus-community-kube-prometheus-stack-default/receipt.yaml"
      claim: "The selected live Helm-vs-ConfigHub comparison receipt exists for the candidate base."
    - path: "data/image-digest-workdown/receipts/prometheus-community-kube-prometheus-stack/default/image-digest-resolution.yaml"
      claim: "The rendered mutable image references for the candidate base have registry digest-resolution evidence."
    - path: "data/production-support-decisions/prometheus-community-kube-prometheus-stack/image-policy-decision.yaml"
      claim: "The target-scoped image policy decision accepts mutable rendered tags for this public monitoring support draft with explicit limits."
    - path: "data/production-support-decisions/prometheus-community-kube-prometheus-stack/security-decision.yaml"
      claim: "The target-scoped production security decision accepts the recorded scan findings for this public monitoring support draft."
    - path: "data/production-disposition/receipts/prometheus-community-kube-prometheus-stack/cluster-rbac-review.yaml"
      claim: "The cluster rbac review disposition exists for this chart."
    - path: "data/production-disposition/receipts/prometheus-community-kube-prometheus-stack/crd-lifecycle-and-upgrade-policy.yaml"
      claim: "The crd lifecycle and upgrade policy disposition exists for this chart."
    - path: "data/production-disposition/receipts/prometheus-community-kube-prometheus-stack/extension-slot-provenance-and-scan-policy.yaml"
      claim: "The extension slot provenance and scan policy disposition exists for this chart."
    - path: "data/production-disposition/receipts/prometheus-community-kube-prometheus-stack/generated-fact-ownership.yaml"
      claim: "The generated fact ownership disposition exists for this chart."
    - path: "data/production-disposition/receipts/prometheus-community-kube-prometheus-stack/scan-gate-warning-disposition.yaml"
      claim: "The scan gate warning disposition disposition exists for this chart."
    - path: "data/production-disposition/receipts/prometheus-community-kube-prometheus-stack/target-fact-preflight.yaml"
      claim: "The target fact preflight disposition exists for this chart."
    - path: "data/production-disposition/receipts/prometheus-community-kube-prometheus-stack/webhook-readiness-and-failure-policy.yaml"
      claim: "The webhook readiness and failure policy disposition exists for this chart."
    - path: "data/hook-lifecycle/receipts/prometheus-community-kube-prometheus-stack/default/latest.yaml"
      claim: "The hook lifecycle route is selected; execution or observation is still pending."
  requiredBeforeFinal:
    - "Choose the final target scope, exact GitOps controller, namespace, and artifact digest."
    - "Execute or observe the selected hook lifecycle route, including webhook TLS/readiness, cleanup, ordering, and upgrade behavior."
    - "Refresh target-scoped ConfigHub OCI/GitOps and live/e2e evidence for the declared scope after the lifecycle decision is closed."
  nextAction: "treat kube-prometheus-stack as the serious-chart proof: execute or observe lifecycle behavior next, then refresh scoped ConfigHub OCI/GitOps evidence for the monitoring namespace"
