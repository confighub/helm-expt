apiVersion: helm-expt.confighub.com/v1alpha1
kind: ProductionSupportDecision
metadata:
  name: "hashicorp-vault-default-public-oci-rejected"
spec:
  chart: "hashicorp/vault"
  version: "0.32.0"
  decision: rejected
  decisionDate: "2026-06-09"
  supportedBase: "default"
  targetScope:
    clusterClass: vanilla-kubernetes
    namespace: "vault"
    deliveryPath: confighub-oci
    gitopsController: argo-or-flux
    storageAssumptions:
      - "Use the chart's recorded storage behavior for the candidate base unless this draft is narrowed before final support."
    networkAssumptions:
      - "Use the service, ingress, DNS, and certificate behavior recorded by the candidate base unless this draft is narrowed before final support."
    requiredTargetFacts: []
  supportBoundary:
    includes:
      - "hashicorp/vault@0.32.0 default base"
      - ConfigHub OCI delivery for the declared target scope after fresh target evidence is recorded
      - rendered objects, labels, gates, receipts, and support objects produced by the recorded base
    excludes:
      - "private values overlays, wrapper charts, and populated extension slots unless separately reviewed"
      - "non-vanilla Kubernetes distributions unless separately reviewed"
      - "other delivery controllers or target scopes unless separately reviewed"
  decisions:
    imageDecision:
      state: "not-reviewed-because-default-base-is-runtime-incomplete"
      detail: "image digest work should be done for a production Vault base that includes the required init, unseal, storage, TLS, and operating model"
    scanDecision:
      state: "not-reviewed-because-default-base-is-runtime-incomplete"
      detail: "scanner findings remain useful proof data, but the default base is not promoted as a production-supported Vault scope"
    lifecycleDecision:
      state: "vault-init-unseal-required-before-production-support"
      detail: "the default base reaches object parity, but Vault remains unready until init/unseal and the production storage/TLS/operator model are defined"
    targetFactDecision:
      state: "no-unresolved-target-prerequisite-in-candidate-base"
      detail: "no unresolved target prerequisite in candidate base"
    liveEvidenceDecision:
      state: "not-production-supported-because-vault-default-is-unready"
      detail: "regular Helm and ConfigHub paths both show the Vault StatefulSet unready for the default base, so this is a correct parity result but not a supported production scope"
  evidence:
    - path: "recipes/hashicorp/vault/0.32.0/revisions/default/r001/receipts/helm-equivalence-receipt.yaml"
      claim: "The candidate base is Helm-equivalent under recorded inputs."
    - path: "recipes/hashicorp/vault/0.32.0/revisions/default/r001/receipts/scan-receipt.yaml"
      claim: "The rendered-object scan receipt exists for the candidate base."
    - path: "runs/live-kind-parity/hashicorp-vault-default/receipt.yaml"
      claim: "The two-cluster Helm-vs-installer parity receipt exists for the candidate base."
    - path: "runs/live-helm-confighub-compare/hashicorp-vault-default/receipt.yaml"
      claim: "The selected live Helm-vs-ConfigHub comparison receipt exists for the candidate base."
    - path: "data/production-disposition/receipts/hashicorp-vault/cluster-rbac-review.yaml"
      claim: "The cluster rbac review receipt exists for this chart."
    - path: "data/production-disposition/receipts/hashicorp-vault/extension-slot-provenance-and-scan-policy.yaml"
      claim: "The extension slot provenance and scan policy receipt exists for this chart."
    - path: "data/production-disposition/receipts/hashicorp-vault/scan-gate-warning-disposition.yaml"
      claim: "The scan gate warning disposition receipt exists for this chart."
    - path: "data/production-disposition/receipts/hashicorp-vault/storage-backup-restore-and-rollback-policy.yaml"
      claim: "The storage backup restore and rollback policy receipt exists for this chart."
    - path: "data/production-disposition/receipts/hashicorp-vault/webhook-readiness-and-failure-policy.yaml"
      claim: "The webhook readiness and failure policy receipt exists for this chart."
  requiredBeforeFinal: []
  nextAction: "Keep this default base as parity evidence only; create a separate Vault production base with init/unseal, storage, TLS, backup/restore, and operator runbook evidence before making a support claim."
