    # Promote the reviewed AICR v0.19.0 change

    Staging receives the reviewed Grafana Secret-reference change from development while the other 16 Applications remain unchanged.

    Start here when you open this Space in Hub. This page explains the problem this example is meant to show, what to inspect, why it matters, and where the evidence lives.

    ## Why this example exists

    Copying a large generated platform bundle into staging would hide the one intended change.

    The linked variants show where the change began and which exact revision staging accepted.

    ## What this example shows

    - Staging starts from the same v0.19.0 base as development.
    - The promotion preview identifies the configuration Unit that will change and does not change stored data.
    - The completed promotion makes staging match the reviewed development configuration.
    - ConfigHub refused an unapproved release. After both current Units were approved, it published the reviewed configuration as a release OCI.
    - An authenticated pull resolved the exact release manifest digest and matched all 17 promoted Applications.

    ## Where each setting comes from

    | Place | What this Space records |
    | --- | --- |
    | Starting configuration | Open the upstream Space or source link named on this page. That is the configuration this Space started from. |
    | ConfigHub changes | Open Unit revision history. It records changes made after the starting configuration was saved. |
    | Install work | Use the linked chart or route evidence for required Secrets, CRDs, hooks, setup jobs, and target facts. |
    | Live cluster | Use target observations to compare the cluster with the reviewed Units. A live-only edit is drift until it is recorded or removed. |

    If an upstream change and a local ConfigHub revision touch the same field, review the overlap before promotion.

    ## What to inspect in Hub

    - This README.
    - The `aicr-eks-h100-training-kubeflow` Unit to inspect the promoted result.
    - The Unit revision history to see the promotion.
    - The development Space for the upstream review.
    - The staging route resolution to see what is required before this can run on EKS and H100.

    ## Evidence and source

    - [AICR v0.19.0 guide](https://github.com/confighub/helm-expt/blob/main/docs/demo/aicr/eks-h100-training-kubeflow-v0-19-0.md)
    - [Development and staging promotion](https://github.com/confighub/helm-expt/blob/main/examples/aicr/eks-h100-training-kubeflow-v0-19-0/promotion-readiness-receipt.yaml)
    - [Required-approval check](https://github.com/confighub/helm-expt/blob/main/examples/aicr/eks-h100-training-kubeflow-v0-19-0/apply-policy-receipt.yaml)
    - [Approved ConfigHub release OCI](https://github.com/confighub/helm-expt/blob/main/examples/aicr/eks-h100-training-kubeflow-v0-19-0/confighub-release-oci-receipt.yaml)
    - [Staging route resolution](https://github.com/confighub/helm-expt/blob/main/data/lifecycle-route-resolutions/aicr-eks-h100-training-kubeflow-v0-19-0-staging-argo-cd.yaml)

    ## Limits

    - The target must provide `monitoring/aicr-grafana-admin` before delivery.
    - The promotion and release OCI are complete. Argo CD reconciliation, EKS/H100 execution, workload health, observation, and rollback are not.
