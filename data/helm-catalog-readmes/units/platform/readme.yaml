    # Shared checks and gates for the demo org

    Shared platform plumbing used by the demo Spaces: checks, gates, and filters that keep the examples honest.

    Start here when you open this Space in Hub. This page explains the problem this example is meant to show, what to inspect, why it matters, and where the evidence lives.

    ## Why this example exists

    A catalog is not only rendered YAML. It also needs the rules that say when a change is safe to move.

    The platform Space shows those rules separately so chart examples do not hide policy decisions inside prose.

    ## What this example shows

    - Production releases require approval. Cluster-wide system configuration also requires approval in development and staging because one change can affect every workload.
    - The demo uses checks such as placeholder detection and vetting to keep unsafe examples out of the happy path.

    ## Where each setting comes from

    | Place | What this Space records |
    | --- | --- |
    | Starting configuration | Open the upstream Space or source link named on this page. That is the configuration this Space started from. |
    | ConfigHub changes | Open Unit revision history. It records changes made after the starting configuration was saved. |
    | Install work | Use the linked chart or route evidence for required Secrets, CRDs, hooks, setup jobs, and target facts. |
    | Live cluster | Use target observations to compare the cluster with the reviewed Units. A live-only edit is drift until it is recorded or removed. |

    If an upstream change and a local ConfigHub revision touch the same field, review the overlap before promotion.

    ## What to inspect in Hub

    - This README.
    - The checks and filters used by the demo org.
    - Production Spaces such as `bitnami-redis-prod` and `hashicorp-vault-env-prod` to see where gates matter.

    ## Evidence and source

    - [Gate-scope fix in org summary](https://github.com/confighub/helm-expt/blob/main/data/helm-org/summary.md)
    - [Verification landing page](https://confighub.github.io/helm-expt/site/verification.html)

    ## Limits

    - This example explains shared demo mechanics. It is not a replacement for a company policy model.
