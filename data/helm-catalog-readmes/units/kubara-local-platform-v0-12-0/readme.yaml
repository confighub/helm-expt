    - [Generation receipt](https://github.com/confighub/helm-expt/blob/main/examples/kubara/local-platform/generation-receipt.yaml)
    - [ConfigHub upload receipt](https://github.com/confighub/helm-expt/blob/main/examples/kubara/local-platform/confighub-upload-receipt.yaml)
    - [CRD, hook, Secret, and prerequisite record](https://github.com/confighub/helm-expt/blob/main/examples/kubara/local-platform/route-intent.yaml)
    - [Apply policy and live assignments](https://github.com/confighub/helm-expt/blob/main/data/apply-policy-profiles/summary.md)

    ## Limits

    - The public OCI copy has not been published.
    - The CRD, hook, Secret, and External Secrets work is recorded but has not been executed for this example.
    - No Argo CD reconciliation or live platform-health result is claimed.
