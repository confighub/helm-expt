    - [Eight-component EKS inference guide](https://github.com/confighub/helm-expt/blob/main/data/certified-bundles/eks-inference-stack.md)
    - [ConfigHub sandbox result](https://github.com/confighub/helm-expt/blob/main/data/eks-inference-sandbox-proof/summary.md)

    ## Limits

    - This Space proves the retained configuration and source identity. It does not prove that the component ran on AWS or Kubernetes.
