    # Karpenter: checked source configuration

    This Space keeps the checked karpenter configuration used by the EKS inference example. It is the unchanged starting point for later environments.

    Start here when you open this Space in Hub. This page explains the problem this example is meant to show, what to inspect, why it matters, and where the evidence lives.

    ## Why this example exists

    This component installs Karpenter's controller, CRDs, NodePools, and EC2NodeClasses for creating workload and GPU nodes.

    The source stays separate from environment settings, so a reviewer can see exactly what ConfigHub changes later.

    ## What this example shows

    - The exact public source is `oci://ghcr.io/confighub/configs/eks-inference/karpenter@sha256:d182fce8c942d0a40497b1d13ec067e4707c0c31027fc049d256afab01b1814e`.
    - 4 ConfigHub Units hold the Kubernetes configuration for this component.
    - The source is a Helm chart. Its output is retained as exact Kubernetes objects. Delivery must also handle installing CRDs before the objects that use them.
    - This component belongs in the EKS workload cluster. It is step 1 for that part of the installation.

    ## Where each setting comes from

    | Place | What this Space records |
    | --- | --- |
    | Starting configuration | The base was uploaded from `oci://ghcr.io/confighub/configs/eks-inference/karpenter@sha256:d182fce8c942d0a40497b1d13ec067e4707c0c31027fc049d256afab01b1814e`. The source digest is recorded on the Space. |
    | ConfigHub changes | This base has no environment-specific edit. ConfigHub variants start from these Units and record later changes separately. |
    | Install work | Delivery must also handle installing CRDs before the objects that use them. |
    | Live cluster | This base was inspected in ConfigHub. The sandbox did not create AWS resources, a Kubernetes cluster, a GPU node, or a model endpoint. |

    If an upstream change and a local ConfigHub revision touch the same field, review the overlap before promotion.

    ## What to inspect in Hub

    - This README.
    - The Kubernetes Units to inspect the exact source configuration.
    - `karpenter-workshop-proof` to see the linked workshop configuration.

    ## Evidence and source

