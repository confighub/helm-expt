    # Timoni Redis development variant

    A linked development variant of the retained Timoni Redis base, ready for a destination-specific change and lifecycle test.

    Start here when you open this Space in Hub. This page explains the problem this example is meant to show, what to inspect, why it matters, and where the evidence lives.

    ## Why this example exists

    An environment variant should not silently change the source identity or discard the module's operating requirements.

    This empty development branch establishes the relationship first. A later test can add one deliberate change and bind the route to a real destination.

    ## What this example shows

    - All seven workload Units link back to the retained base.
    - The development variant currently changes environment metadata only, so its Kubernetes object-set hash matches the base.
    - A later object change can be reviewed separately from the original Timoni values and module digest.
    - Lifecycle work must be resolved again when a destination or lifecycle-sensitive change is selected.

    ## Where each setting comes from

    | Place | What this Space records |
    | --- | --- |
    | Starting configuration | The upstream base records the immutable Timoni module, typed values, exact seven-object output, and public configuration OCI. |
    | ConfigHub changes | This variant adds the Development environment label. It deliberately makes no Kubernetes field change yet. |
    | Install work | The master-first wait, replica ordering, optional PING test, namespace, Kubernetes version, and StorageClass requirements are inherited from the base and still need a selected executor. |
    | Live cluster | No target or cluster is attached, so there is no admission, readiness, PING, delivery, or rollback result. |

    If an upstream change and a local ConfigHub revision touch the same field, review the overlap before promotion.

    ## What to inspect in Hub

    - This README.
    - The linked workload Units and their upstream base Units.
    - The base Space for the source OCI, typed inputs, and lifecycle record.

    ## Evidence and source

    - [Timoni example guide](https://github.com/confighub/helm-expt/blob/main/examples/timoni/redis-8-10-1/README.md)
    - [Lifecycle route intent](https://github.com/confighub/helm-expt/blob/main/examples/timoni/redis-8-10-1/lifecycle-route-intent.yaml)
    - [ConfigHub receipt](https://github.com/confighub/helm-expt/blob/main/runs/timoni-redis-catalog-proof/confighub-receipt.yaml)
    - [Combined proof summary](https://github.com/confighub/helm-expt/blob/main/data/timoni-redis-catalog-proof/summary.md)

    ## Limits

    - This proves the linked variant structure and matching object sets, not a deployed development environment.
