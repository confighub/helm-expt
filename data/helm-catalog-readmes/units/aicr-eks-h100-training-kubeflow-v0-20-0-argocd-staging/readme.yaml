    # Test the reviewed AICR v0.20.0 change in staging

    Staging receives the named Grafana Secret change from development while the other 16 Applications remain unchanged.

    Use this Space to check what staging received and which target requirements remain before deployment.

    ## Why this example exists

    A staging review should show the intended change and the setup needed on the destination before the same change reaches production.

    The linked variant preserves the source revision and avoids copying the large generated bundle by hand.

    ## What this example shows

    - The ChangeOrder preview identifies one configuration Unit and does not change stored data.
    - The completed promotion makes staging match the reviewed development configuration.
    - The lifecycle plan still requires an EKS destination, Argo CD or Flux, storage, GPU, EFA/RDMA, and Secret checks before deployment.
    - Approval and the other system-configuration checks remain attached.

    ## Where each setting comes from

    | Place | What this Space records |
    | --- | --- |
    | Starting configuration | Open the upstream Space or source link named on this page. That is the configuration this Space started from. |
    | ConfigHub changes | Open Unit revision history. It records changes made after the starting configuration was saved. |
    | Install work | Use the linked chart or route evidence for required Secrets, CRDs, hooks, setup jobs, and target facts. |
    | Live cluster | Use target observations to compare the cluster with the reviewed Units. A live-only edit is drift until it is recorded or removed. |

    If an upstream change and a local ConfigHub revision touch the same field, review the overlap before promotion.

    ## What to inspect in Hub

    - This README.
    - The configuration Unit to inspect the promoted result.
    - The revision history to see the ChangeOrder promotion.
    - The development Space for the source change.
    - The Argo CD and Flux route plans before choosing a destination.

    ## Evidence and source

    - [AICR v0.20.0 guide](https://github.com/confighub/helm-expt/blob/main/docs/demo/aicr/eks-h100-training-kubeflow-v0-20-0.md)
    - [Development-to-production promotion](https://github.com/confighub/helm-expt/blob/main/examples/aicr/eks-h100-training-kubeflow-v0-20-0/promotion-readiness-receipt.yaml)
    - [Argo CD route plan](https://github.com/confighub/helm-expt/blob/main/data/lifecycle-route-resolutions/aicr-eks-h100-training-kubeflow-v0-20-0-staging-argo-cd.yaml)
    - [Flux route plan](https://github.com/confighub/helm-expt/blob/main/data/lifecycle-route-resolutions/aicr-eks-h100-training-kubeflow-v0-20-0-staging-flux.yaml)

    ## Limits

    - The target must provide `monitoring/aicr-grafana-admin` before deployment.
    - The promotion is recorded in ConfigHub. No staging cluster was contacted.
