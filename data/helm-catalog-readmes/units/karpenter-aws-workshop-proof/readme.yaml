    # Karpenter AWS identity: workshop configuration

    This Space starts from `karpenter-aws-base` and records the settings used by the EKS inference workshop. The workshop runs in ConfigHub without creating AWS or Kubernetes resources.

    Start here when you open this Space in Hub. This page explains the problem this example is meant to show, what to inspect, why it matters, and where the evidence lives.

    ## Why this example exists

    A reusable source still needs the AWS, cluster, network, and workload settings for its destination.

    This Space records those settings separately from the public base. A reviewer can inspect the changes without rebuilding the source.

    ## What this example shows

    - The Unit retains an upstream link to `karpenter-aws-base`.
    - This component does not need a linked destination field in the workshop sandbox.
    - The placeholder check found 0 unfinished values.
    - ConfigHub published release OCI #1 with manifest digest `sha256:9b0935642dca7a733960da575c9c35ccb51b23043dc77ec2ac6707d2b3856faa`.

    ## Where each setting comes from

    | Place | What this Space records |
    | --- | --- |
    | Starting configuration | This Space is derived from `karpenter-aws-base`, which is pinned to `oci://ghcr.io/confighub/configs/eks-inference/karpenter-aws@sha256:535376df49b0fe8f11f0cda012fb5399a7c70f59f4932335faee92a3cf0ad194`. |
    | ConfigHub changes | This component does not need a linked destination field in the workshop sandbox. |
    | Install work | No separate lifecycle route is recorded for this component. |
    | Live cluster | The workshop checked ConfigHub records and OCI publication only. It did not create AWS, EKS, GPU, or model-serving resources. |

    If an upstream change and a local ConfigHub revision touch the same field, review the overlap before promotion.

    ## What to inspect in Hub

    - This README.
    - Unit revision history to see the fields supplied for the workshop.
    - `karpenter-aws-base` to inspect the unchanged public starting configuration.

    ## Evidence and source

    - [Exact source and package receipt](https://github.com/confighub/helm-expt/blob/main/data/certified-bundles/receipts/eks-inference/karpenter-aws/receipt.yaml)
    - [Eight-component EKS inference guide](https://github.com/confighub/helm-expt/blob/main/data/certified-bundles/eks-inference-stack.md)
    - [ConfigHub sandbox result](https://github.com/confighub/helm-expt/blob/main/data/eks-inference-sandbox-proof/summary.md)

    ## Limits

    - A published OCI is a configuration result, not proof that Argo CD, Flux, Kubernetes, a GPU, or a model consumed it.
