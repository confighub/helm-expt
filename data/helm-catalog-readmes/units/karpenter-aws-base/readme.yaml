    # Karpenter AWS identity: checked source configuration

    This Space keeps the checked karpenter aws identity configuration used by the EKS inference example. It is the unchanged starting point for later environments.

    Start here when you open this Space in Hub. This page explains the problem this example is meant to show, what to inspect, why it matters, and where the evidence lives.

    ## Why this example exists

    This component defines the AWS IAM role and EKS Pod Identity association used by Karpenter.

    The source stays separate from environment settings, so a reviewer can see exactly what ConfigHub changes later.

    ## What this example shows

    - The exact public source is `oci://ghcr.io/confighub/configs/eks-inference/karpenter-aws@sha256:535376df49b0fe8f11f0cda012fb5399a7c70f59f4932335faee92a3cf0ad194`.
    - 1 ConfigHub Unit holds the Kubernetes configuration for this component.
    - The source already contains literal Kubernetes YAML, so no renderer runs for this component. No separate lifecycle route is recorded for this component.
    - This component belongs in the management cluster. It is step 4 for that part of the installation.

    ## Where each setting comes from

    | Place | What this Space records |
    | --- | --- |
    | Starting configuration | The base was uploaded from `oci://ghcr.io/confighub/configs/eks-inference/karpenter-aws@sha256:535376df49b0fe8f11f0cda012fb5399a7c70f59f4932335faee92a3cf0ad194`. The source digest is recorded on the Space. |
    | ConfigHub changes | This base has no environment-specific edit. ConfigHub variants start from these Units and record later changes separately. |
    | Install work | No separate lifecycle route is recorded for this component. |
    | Live cluster | This base was inspected in ConfigHub. The sandbox did not create AWS resources, a Kubernetes cluster, a GPU node, or a model endpoint. |

    If an upstream change and a local ConfigHub revision touch the same field, review the overlap before promotion.

