            - "nimbuilds.apps.nvidia.com"
            - "nimcaches.apps.nvidia.com"
            - "nimpipelines.apps.nvidia.com"
            - "nimservices.apps.nvidia.com"
        waitFor: "every named definition reports the Established condition"
        applyMode: "server-side"
        objectCount: 9
      -
        order: 2
        name: "everything-else"
        selector:
          kinds:
            - "*"
        objectCount: 8
