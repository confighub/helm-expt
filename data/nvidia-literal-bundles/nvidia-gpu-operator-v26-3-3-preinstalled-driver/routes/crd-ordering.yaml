            - "nodefeaturerules.nfd.k8s-sigs.io"
            - "nodefeatures.nfd.k8s-sigs.io"
            - "nvidiadrivers.nvidia.com"
        waitFor: "every named definition reports the Established condition"
        objectCount: 5
      -
        order: 2
        name: "everything-else"
        selector:
          kinds:
            - "*"
        objectCount: 19
    packagedCopy:
