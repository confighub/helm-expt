apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "SuccessorTrackCorpus"
metadata:
  name: "successor-track"
spec:
  charts:
    - rank: 1
      key: "cloudpirates/nginx"
      publisher: "cloudpirates"
      chart: "nginx"
      version: "0.16.1"
      appVersion: "1.31.3"
      ociRef: "oci://registry-1.docker.io/cloudpirates/nginx"
      category: "web server"
      proofFocus: "web server workload, ClusterIP Service exposure, digest-pinned default image"
      licenses:
        chart:
          spdx: "Apache-2.0"
          evidence: "artifacthub license annotation read from the pulled chart"
        images:
          - component: "nginx"
            spdx: "BSD-2-Clause"
            note: "upstream nginx source license; image digest-pinned by the chart default"
    - rank: 2
      key: "cloudpirates/rabbitmq"
      publisher: "cloudpirates"
      chart: "rabbitmq"
      version: "0.21.13"
      appVersion: "4.3.4"
      ociRef: "oci://registry-1.docker.io/cloudpirates/rabbitmq"
      category: "message broker"
      proofFocus: "message broker StatefulSet, rendered credential Secret, headless plus client Services"
      values:
        auth:
          password: "confighub-rabbitmq-password"
          erlangCookie: "confighub-rabbitmq-erlang-cookie"
      licenses:
        chart:
          spdx: "Apache-2.0"
          evidence: "artifacthub license annotation read from the pulled chart"
        images:
          - component: "rabbitmq"
            spdx: "MPL-2.0"
            note: "upstream RabbitMQ server license; management image digest-pinned by the chart default"
    - rank: 3
      key: "cloudpirates/redis"
      publisher: "cloudpirates"
      chart: "redis"
      version: "0.34.11"
      appVersion: "8.10.0"
      ociRef: "oci://registry-1.docker.io/cloudpirates/redis"
      category: "database"
      proofFocus: "database StatefulSet, rendered credential Secret, headless plus client Services"
      values:
        auth:
          password: "confighub-redis-password"
      allowedSemanticDiffs:
        - identity: "apps/v1|StatefulSet|default|redis"
          rule: "leading-blank-line-pruned-by-kustomize"
          reason: "the chart's probe scripts start with a template-emitted blank first line; the installer's Kustomize round trip prunes that blank line and sh ignores it"
      licenses:
        chart:
          spdx: "Apache-2.0"
          evidence: "artifacthub license annotation read from the pulled chart"
        images:
          - component: "redis"
            spdx: "RSALv2 OR SSPLv1 OR AGPL-3.0-only"
            note: "Redis 8 tri-license; AGPLv3 is the open-source option; image digest-pinned by the chart default"
    - rank: 4
      key: "valkey/valkey"
      publisher: "valkey"
      chart: "valkey"
      version: "0.11.0"
      appVersion: "9.1.1"
      repository: "valkey"
      repositoryURL: "https://valkey.io/valkey-helm/"
      category: "database"
      proofFocus: "database workload, classic helm repository source, ConfigMap-driven configuration"
      licenses:
        chart:
          spdx: "BSD-3-Clause"
          evidence: "repository LICENSE file; the pulled Chart.yaml carries no license field"
        images:
          - component: "valkey"
            spdx: "BSD-3-Clause"
            note: "upstream Valkey license"
    - rank: 5
      key: "mysql/mysql-operator"
      publisher: "mysql"
      chart: "mysql-operator"
      version: "2.3.0"
      appVersion: "26.7.0-2.3.0"
      repository: "mysql"
      repositoryURL: "https://mysql.github.io/mysql-operator/"
      namespace: "mysql-operator"
      category: "database operator"
      proofFocus: "operator-only deployment and CRDs in a dedicated namespace; the companion InnoDBCluster chart and database readiness are separate work"
      licenses:
        chart:
          spdx: "UPL-1.0"
          evidence: "Release repository LICENSE: https://github.com/mysql/mysql-operator/blob/26.7.0-2.3.0/LICENSE; no LICENSE file is shipped inside the chart archive."
        images:
          - component: "MySQL Operator for Kubernetes 26.7.0 Community"
            spdx: "UPL-1.0"
            note: "Operator product license: https://github.com/mysql/mysql-operator/blob/26.7.0-2.3.0/LICENSE; the same file lists separate third-party notices. MySQL Server images are separate and are not installed by this operator-only entry."
      key: "cloudnative-pg/cloudnative-pg"
      publisher: "cloudnative-pg"
      repository: "cloudnative-pg"
      repositoryURL: "https://cloudnative-pg.github.io/charts"
      chart: "cloudnative-pg"
      version: "0.29.0"
      appVersion: "1.30.0"
      namespace: "cnpg-system"
      releaseName: "cloudnative-pg"
      category: "database operator"
      proofFocus: "operator installation with CRDs, cluster RBAC and admission webhooks; database Cluster custom resources require a separate deployment"
      licenses:
        chart:
          spdx: "Apache-2.0"
          evidence: "LICENSE bundled in cloudnative-pg-0.29.0.tgz, archive SHA-256 668e065ff53508d58238788fd35b355a925060843629a951df0e6a9362e6d32f"
          sourceURL: "https://github.com/cloudnative-pg/charts/blob/cloudnative-pg-v0.29.0/LICENSE"
        images:
          - component: "CloudNativePG operator"
            spdx: "Apache-2.0"
            sourceURL: "https://github.com/cloudnative-pg/cloudnative-pg/blob/v1.30.0/LICENSE"
            note: "Operator source license at v1.30.0; this entry does not install a PostgreSQL database image or claim licenses for all container dependencies."
      key: "percona/psmdb-operator"
      publisher: "percona"
      chart: "psmdb-operator"
      version: "1.23.0"
      repository: "percona"
      repositoryURL: "https://percona.github.io/percona-helm-charts/"
      category: "database operator"
      proofFocus: "MongoDB operator workload, CRDs, RBAC"
      licenses:
        chart:
          spdx: "Apache-2.0"
          evidence: "Chart release LICENSE: https://github.com/percona/percona-helm-charts/blob/psmdb-operator-1.23.0/LICENSE"
        images:
          - component: "Percona MongoDB operator 1.23.0"
            spdx: "Apache-2.0"
            note: "Operator source LICENSE: https://github.com/percona/percona-server-mongodb-operator/blob/v1.23.0/LICENSE. Percona Server for MongoDB is a separate database image and license; this operator-only chart does not render it."
