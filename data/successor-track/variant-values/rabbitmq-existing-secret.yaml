# Requires one externally provisioned Secret with both named keys in the release namespace.
# With peer discovery disabled, this chart does not emit a ServiceAccount.
# The values-owned extra object supplies it without enabling discovery or token mounts.
replicaCount: 1
peerDiscoveryK8sPlugin:
  enabled: false
serviceAccount:
  create: false
  name: rabbitmq-existing-secret
  automountServiceAccountToken: false
auth:
  existingSecret: rabbitmq-consolidated
  existingPasswordKey: rabbitmq-password
  existingErlangCookieKey: rabbitmq-erlang-cookie
extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: rabbitmq-existing-secret
      namespace: '{{ .Release.Namespace }}'
    automountServiceAccountToken: false
