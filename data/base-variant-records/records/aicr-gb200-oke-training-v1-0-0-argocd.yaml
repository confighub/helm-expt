status:
  level: "partial"
  claim: "AICR v1.0.0 generated the gb200-oke-training overlay as 15 Argo CD Applications. It is a base overlay, a shared substrate that 2 other retained entries build on. They are retained and rendered with the bundle AICR generated, not published, not deployed."
  limits:
    - "Flattened covers the Application wrapper only. Argo CD renders the nested charts at sync time, and their flattening verdicts are outside this record."
    - "3 of the 15 Applications take their source from oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/aicr-gb200-oke-training/aicr-bundle, which is not published. This entry cannot be delivered until that package and its literal configuration bundle are."
    - "Both artifacts are built from committed bytes and planned by digest in data/aicr-mirror-artifacts/gb200-oke-training/source-package-oci.yaml and data/aicr-mirror-artifacts/gb200-oke-training/literal-config-oci.yaml. No OCI artifact is published for this entry."
    - "Nothing was uploaded to ConfigHub, and no variant, promotion or release exists for this entry."
    - "The sync-wave order is recorded as a route. No Argo CD instance has executed it."
    - "The generation input systemNodeSelector=nodeGroup=system-worker is a placeholder, confirmed as one on 2026-10-08. It is the value upstream's own v1.0.0 EKS training demo uses for its reference clusters (demos/cuj1-training.md in NVIDIA/aicr at tag v1.0.0), and that demo says its selector values are examples to be updated to match the cluster. The demo file is not retained in this repository. The value was not chosen from a real cluster, and it is carried for every service this mirror covers because it is a placeholder and not a claim about any of them. Change it to the label on your own cluster's system node group. A different value changes the bundle bytes and every digest in this entry, so the entry must be regenerated with the new value or a variant must be made from it."
    - "The selected recipe also names 1 component the bundle leaves out (dra-node-labeler), and the generation receipt records the reason AICR logged for it. The selected recipe makes nvidia-dra-driver-gpu depend on dra-node-labeler. The recipe the bundle carries declares no such edge, so no sync-wave was asked to hold it, and a route records the decision a destination has to make."
    - "2 waved Applications render without appearing in the recipe's deployment order (network-operator-post, gpu-operator-pre). They are companions of a component, and they are named here so the comparison does not drop them silently."
    - "The recipe criteria are accelerator=gb200, intent=training, os=ol, platform=any, service=oke. No cluster, cloud service, accelerator, model or workload was contacted or run for this entry."
