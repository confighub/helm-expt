apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "PackagesPendingPublication"
metadata:
  name: "packages-pending-publication"
spec:
  description: >-
    Package versions built and checked in this repository that the catalog
    registry does not hold yet. scripts/package-updates.mjs adds each version it
    builds. The catalog maps leave a version listed here out until its
    publication receipt exists. The nightly job records the GHCR receipt of
    each version published since its last run and removes the version from
    this list; an entry whose receipt exists fails the chain until it is
    removed.
  packages:
    - chart: "argo-cd/argocd-image-updater"
      version: "1.5.0"
    - chart: "aws-ebs-csi-driver/aws-ebs-csi-driver"
      version: "2.68.1"
    - chart: "bitnami/memcached"
      version: "8.8.8"
