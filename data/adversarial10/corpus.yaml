apiVersion: helm-expt.confighub.com/v1alpha1
kind: AdversarialCorpus
metadata:
  name: public-helm-adversarial-10
spec:
  purpose: First public chart harness after the Redis proof slice.
  scope: Public Helm charts only; enterprise-internal broken forks are out of scope.
  kubeVersion: 1.30.0
  renderPolicy:
    includeCRDs: true
    skipTests: true
    noHooks: true
    valuesProfile: chart-defaults
  charts:
    - rank: 1
      id: bitnami-redis
      repository: bitnami
      repositoryURL: https://charts.bitnami.com/bitnami
      chart: redis
      version: 25.5.3
      releaseName: redis
      namespace: redis
      stress:
        - generated-facts
        - stateful
        - pvc
        - existing-secret-variant
      proofFocus: Generated facts, existing-secret variant, Helm equivalence.
    - rank: 2
      id: jetstack-cert-manager
      repository: jetstack
      repositoryURL: https://charts.jetstack.io
      chart: cert-manager
      version: v1.20.2
      releaseName: cert-manager
      namespace: cert-manager
      stress:
        - crds
        - webhooks
        - cluster-rbac
      proofFocus: CRD readiness, webhook/admission risk, lifecycle policy.
    - rank: 3
      id: ingress-nginx-ingress-nginx
      repository: ingress-nginx
      repositoryURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      version: 4.15.1
      releaseName: ingress-nginx
      namespace: ingress-nginx
      stress:
        - capabilities
        - admission-webhooks
        - cluster-rbac
      proofFocus: Capability profile, admission webhook, cluster permissions.
    - rank: 4
      id: external-secrets-external-secrets
      repository: external-secrets
      repositoryURL: https://charts.external-secrets.io
      chart: external-secrets
      version: 2.5.0
      releaseName: external-secrets
      namespace: external-secrets
      stress:
        - crds
        - webhooks
        - cluster-rbac
      proofFocus: CRD/webhook/RBAC control points.
    - rank: 5
      id: prometheus-community-kube-prometheus-stack
      repository: prometheus-community
      repositoryURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      version: 85.3.3
      releaseName: kube-prometheus-stack
      namespace: monitoring
      stress:
        - umbrella
        - crds
        - webhooks
        - cluster-rbac
        - scale
      proofFocus: Large object graph, CRD ordering, dependency closure, policy scans.
    - rank: 6
      id: argo-cd-argo-cd
      repository: argo-cd
      repositoryURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      version: 9.5.15
      releaseName: argo-cd
      namespace: argocd
      stress:
        - crds
        - raw-extension-slots
        - gitops
        - cluster-rbac
      proofFocus: ConfigHub OCI to GitOps handoff and explicit extension slots.
    - rank: 7
      id: grafana-loki
      repository: grafana
      repositoryURL: https://grafana.github.io/helm-charts
      chart: loki
      version: 7.0.0
      releaseName: loki
      namespace: loki
      stress:
        - storage-modes
        - generated-config
        - required-values
      proofFocus: Values readiness, storage variants, graph checks.
    - rank: 8
      id: metrics-server-metrics-server
      repository: metrics-server
      repositoryURL: https://kubernetes-sigs.github.io/metrics-server/
      chart: metrics-server
      version: 3.13.0
      releaseName: metrics-server
      namespace: kube-system
      stress:
        - apiservice
        - cluster-rbac
        - capabilities
      proofFocus: APIService and cluster capability readiness.
    - rank: 9
      id: bitnami-postgresql
      repository: bitnami
      repositoryURL: https://charts.bitnami.com/bitnami
      chart: postgresql
      version: 18.6.7
      releaseName: postgresql
      namespace: postgresql
      stress:
        - generated-facts
        - stateful
        - pvc
        - upgrade-sensitive
      proofFocus: Generated credentials, storage policy, upgrade/rollback receipts.
    - rank: 10
      id: bitnami-rabbitmq
      repository: bitnami
      repositoryURL: https://charts.bitnami.com/bitnami
      chart: rabbitmq
      version: 16.0.14
      releaseName: rabbitmq
      namespace: rabbitmq
      stress:
        - generated-facts
        - stateful
        - pvc
        - cluster-rbac
      proofFocus: Generated credentials, stateful object graph, policy scans.
