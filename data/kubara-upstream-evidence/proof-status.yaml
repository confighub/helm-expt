    repository: confighub/kubara-confighub
    release: v0.2.4
    commit: fdae8a233fec57bf2f4102b8fea43c3bf557e35e
    path: examples/kind-lab/
    url: https://github.com/confighub/kubara-confighub/tree/fdae8a233fec57bf2f4102b8fea43c3bf557e35e/examples/kind-lab
    logs:
      - path: examples/kind-lab/run-2026-09-30.log
