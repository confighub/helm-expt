      - path: examples/kind-lab/handback-2026-09-30.log
        title: recorded hand-back
      - path: examples/kind-lab/run-v0.16-2026-09-30.log
        title: recorded run and catalog upgrade on Kubara v0.16
      - path: examples/kind-lab/run-approve-2026-09-30.log
