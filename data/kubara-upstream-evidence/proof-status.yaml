  # consistent, never that it is current or live.
  state: historical
  decidedAt: "2026-09-30"
  reference:
    kubaraVersion: v0.13.0
    organization: Kubara
    clusters:
      - hx-app-dev
      - hx-app-staging
      - hx-app-prod-a
      - hx-app-prod-b
    recorded: "2026-08"
    retired: true
    rerun: false
    predates: cub 0.4 field renames
