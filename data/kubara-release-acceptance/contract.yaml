      - "longhorn/longhorn/1.12.0"
      - "metallb/metallb/0.16.1"
      - "kyverno/kyverno/3.8.2"
    requiredOciPublicationPackages:
      - "packages/argo-cd/argo-cd/10.1.3"
      - "packages/external-secrets/external-secrets/2.7.0"
      - "packages/jetstack/cert-manager/v1.21.0"
      - "packages/metrics-server/metrics-server/3.13.1"
      - "packages/prometheus-community/kube-prometheus-stack/87.15.1"
      - "packages/prometheus-community/prometheus-blackbox-exporter/11.15.1"
      - "packages/traefik/traefik/41.0.2"
      - "packages/argo-cd/argo-cd/10.2.1"
      - "packages/external-secrets/external-secrets/2.8.0"
      - "packages/prometheus-community/kube-prometheus-stack/87.19.2"
      - "packages/grafana/loki/7.1.0"
      - "packages/grafana/alloy/1.11.0"
