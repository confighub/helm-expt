apiVersion: helm-expt.confighub.com/v1alpha1
kind: ChartLicenseRecord
metadata:
  name: chart-licenses
  researchedAt: '2026-08-08'
  method: Each chart license was read live from its own release evidence (release-commit Chart.yaml, publisher
    OCI config blob, source repository LICENSE, or the Artifact Hub package record), then independently
    re-fetched and confirmed by a second pass. Licenses describe the chart templates, not the packaged
    application or its images.
  scope: chart-license-only; image licenses are recorded separately per entry in recipes/*/artifact-index.yaml
    where known
