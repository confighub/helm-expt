  - chart: aqua/trivy-operator
    spdx: Apache-2.0
    evidence:
      source: upstream-repo-license
      label: the chart source repository's LICENSE
      url: https://raw.githubusercontent.com/aquasecurity/trivy-operator/v0.30.1/LICENSE
      quote: Apache License / Version 2.0, January 2004
    confidence: high
    verifiedIndependently: true
    researchNote: 'Chart 0.32.1 source lives in aquasecurity/trivy-operator under deploy/helm: deploy/helm/Chart.yaml
      at app tag v0.30.1 (fetched) shows exactly version: 0.32.1 / appVersion: 0.30.1, and that repo''s
      LICENSE at the same tag is Apache-2.0. The publisher repo aquasecurity/helm-charts (which hosts
      the released tgz as a GitHub release asset) also carries an Apache-2.0 LICENSE (fetched). Artifact
      Hub (repo ''trivy-operator'', repository URL https://aquasecurity.github.io/helm-charts/, matching
      ours) reports license: null, and the packaged 0.32.1 tgz (downloaded) ships no license field or
      LICENSE file.'
