apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "LatestRefreshActionQueue"
metadata:
  name: "latest-top20-refresh-action-queue"
  generatedBy: "scripts/generate-latest-refresh-action-queue.mjs"
spec:
