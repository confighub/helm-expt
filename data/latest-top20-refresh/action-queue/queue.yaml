      chart: "argo-cd/argo-cd"
      currentVersion: "9.5.15"
      latestUpstreamVersion: "9.5.17"
      retainedCandidateVersion: "9.5.17"
      action: "write-replacement-decision"
      priority: "p1"
      firstStep: "review target-scoped replacement decision for argo-cd/argo-cd@9.5.17"
      doneWhen: "replacement decision records replace, defer, or keep-both and names fresh live evidence requirements"
      evidence:
        - "data/latest-top20-refresh/replacement-decisions/summary.md"
        - "data/production-support-decisions/argo-cd-argo-cd/support-decision.yaml"
        - "recipes/argo-cd/argo-cd/9.5.17"
        - "packages/argo-cd/argo-cd/9.5.17"
      command: "npm run top20:latest-replacement-decisions:verify"
