      chart: "bitnami/mongodb"
      currentVersion: "19.0.7"
      latestUpstreamVersion: "19.1.0"
      retainedCandidateVersion: "19.0.9"
      action: "refresh-retained-candidate"
      priority: "p0"
      firstStep: "refresh retained bitnami/mongodb@19.0.9 proof to upstream 19.1.0"
      doneWhen: "candidate-status.csv records bitnami/mongodb@19.1.0, root paths exist, and replacement decision queue marks it latest-upstream-aligned"
      evidence:
        - "data/refresh-survival/summary.md"
        - "data/latest-top20-refresh/candidates/mongodb-19.0.9"
