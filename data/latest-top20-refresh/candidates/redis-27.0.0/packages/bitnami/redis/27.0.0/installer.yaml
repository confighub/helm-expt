apiVersion: installer.confighub.com/v1alpha1
kind: Package
metadata:
  name: bitnami-redis
  version: "27.0.0"
spec:
  bases:
    - name: default
      path: bases/default
      description: "Redis static password demo variant rendered from bitnami/redis@27.0.0"
    - name: reuse-existing-secret
      path: bases/reuse-existing-secret
      default: true
      description: "Redis existing Secret default variant rendered from bitnami/redis@27.0.0"
      externalRequires:
        - kind: ClusterFeature
          name: "Secret redis/redis-existing-secret key redis-password"
          namespace: redis
          suggestedSource: 'kubectl -n redis create secret generic redis-existing-secret --from-literal=redis-password="$(openssl rand -base64 32)"'
  collector:
    command: /bin/sh
    args:
      - collector/target-facts.sh
    description: "Records Redis target-fact bindings and can live-check the existing Secret variant."
