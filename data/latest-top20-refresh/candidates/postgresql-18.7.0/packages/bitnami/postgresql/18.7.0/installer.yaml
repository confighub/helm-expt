apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "bitnami-postgresql"
  version: "18.7.0"
spec:
  bases:
    -
      name: "generated-passwords"
      path: "bases/generated-passwords"
      default: true
      description: "postgresql generated passwords variant rendered from bitnami/postgresql@18.7.0"
    -
      name: "existing-secret"
      path: "bases/existing-secret"
      description: "postgresql existing Secret variant rendered from bitnami/postgresql@18.7.0"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "Secret postgresql/postgresql-auth key postgres-password"
          namespace: "postgresql"
          suggestedSource: "kubectl -n postgresql create secret generic postgresql-auth --from-literal=postgres-password=<value>"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible Secret and CRD requirements."
  transformers:
    -
      description: "Set the namespace on every namespaced resource."
      invocations:
        -
          name: "set-namespace"
          args:
            - "{{ .Namespace }}"
      toolchain: "Kubernetes/YAML"
      whereResource: ""
