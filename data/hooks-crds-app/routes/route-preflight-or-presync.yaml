apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "LifecycleRoute"
metadata:
  name: "preflight-or-presync"
  labels:
    app: "hooks-crds"
    chart: "prometheus-community-kube-prometheus-stack"
    base: "no-crds"
    lifecyclePhase: "preflight"
spec:
  chart: "prometheus-community/kube-prometheus-stack"
  version: "85.3.3"
  base: "no-crds"
  routeName: "preflight-or-presync"
  quirkClass: "hook-phase"
  lifecyclePhase: "preflight"
  actionKind: "run-preflight"
  executionMode: "user-executes"
  automatic: false
  whoRuns: "Your delivery — a preflight step before apply (receipted)"
  command: "kubectl apply -f <preflight-job>; kubectl wait --for=condition=complete job/<name>"
  disposition: "observed"
  alternatives:
    []
  evidence:
    - "data/hook-lifecycle/receipts/prometheus-community-kube-prometheus-stack/no-crds/latest.yaml"
    - "runs/kps-lifecycle-route-proof/no-crds-receipt.yaml"
    - "packages/prometheus-community/kube-prometheus-stack/85.3.3/prerequisites/kube-prometheus-stack-lifecycle/generation-receipt.yaml"
    - "recipes/prometheus-community/kube-prometheus-stack/85.3.3/revisions/no-crds/r001/rendered/release-objects.yaml"
    - "runs/kps-gitops-lifecycle-proof/receipt.yaml"
  evidenceRequired: "already has a live receipt; keep it fresh when chart, base, or cluster version changes"
  gitOps:
    argoCd: "PreSync · sync-wave -1"
    argoCdSnippet: "metadata:\n  annotations:\n    argocd.argoproj.io/hook: PreSync\n    argocd.argoproj.io/hook-delete-policy: HookSucceeded\n    argocd.argoproj.io/sync-wave: \"-1\""
    emitsControllerStep: true
    flux: "apply before the release (Kustomization dependsOn)"
  origin:
    type: "helm-render-intent"
    record: "data/helm-render-intents/intents/prometheus-community-kube-prometheus-stack-85-3-3-no-crds.yaml"
    routeSourceVersion: "85.3.3"
  implementations:
    directApply:
      result: "pass"
      automatic: true
      executor: "scripts/run-kps-lifecycle-route-proof.mjs"
      evidence: "runs/kps-lifecycle-route-proof/no-crds-receipt.yaml"
      observation: "Ran the chart's admission-create Job and observed the ca, cert, and key Secret."
    argoCd:
      result: "pass"
      automatic: false
      evidence: "runs/kps-gitops-lifecycle-proof/receipt.yaml"
      observation: "Argo CD pulled the recorded OCI digest and passed the required fresh-install stage and runtime checks."
    flux:
      result: "pass"
      automatic: false
      evidence: "runs/kps-gitops-lifecycle-proof/receipt.yaml"
      observation: "Flux pulled the recorded OCI digest and passed the required fresh-install stage and runtime checks."
