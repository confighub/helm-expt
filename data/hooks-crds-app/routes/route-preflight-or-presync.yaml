apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "LifecycleRoute"
metadata:
  name: "preflight-or-presync"
  labels:
    app: "hooks-crds"
    chart: "prometheus-community-kube-prometheus-stack"
    base: "default"
    lifecyclePhase: "preflight"
spec:
  chart: "prometheus-community/kube-prometheus-stack"
  version: "85.3.3"
  base: "default"
  routeName: "preflight-or-presync"
  quirkClass: "hook-phase"
  lifecyclePhase: "preflight"
  actionKind: "run-preflight"
  executionMode: "user-executes"
  automatic: false
  whoRuns: "Your delivery — a preflight step before apply (receipted)"
  command: "kubectl apply -f <preflight-job>; kubectl wait --for=condition=complete job/<name>"
  disposition: "observed"
  alternatives:
    []
  evidence:
    - "data/hook-lifecycle/receipts/prometheus-community-kube-prometheus-stack/default/latest.yaml"
    - "data/hook-lifecycle/top100-hooks.csv"
    - "recipes/prometheus-community/kube-prometheus-stack/85.3.3/helm-pain-report.yaml"
    - "data/production-disposition/receipts/prometheus-community-kube-prometheus-stack/crd-lifecycle-and-upgrade-policy.yaml"
    - "data/production-disposition/receipts/prometheus-community-kube-prometheus-stack/webhook-readiness-and-failure-policy.yaml"
    - "runs/live-helm-confighub-compare/prometheus-community-kube-prometheus-stack-default/receipt.yaml"
    - "data/production-support-decisions/prometheus-community-kube-prometheus-stack/lifecycle-decision.yaml"
    - "runs/top20-local-kind/kube-prometheus-stack-default/observation-receipt.json"
    - "runs/live-kind-parity/prometheus-community-kube-prometheus-stack-default/receipt.yaml"
    - "runs/kps-lifecycle-route-proof/receipt.yaml"
  evidenceRequired: "already has a live receipt; keep it fresh when chart, base, or cluster version changes"
  gitOps:
    argoCd: "PreSync · sync-wave -1"
    argoCdSnippet: "metadata:\n  annotations:\n    argocd.argoproj.io/hook: PreSync\n    argocd.argoproj.io/hook-delete-policy: HookSucceeded\n    argocd.argoproj.io/sync-wave: \"-1\""
    emitsControllerStep: true
    flux: "apply before the release (Kustomization dependsOn)"
  origin:
    type: "helm-render-intent"
    record: "data/helm-render-intents/intents/prometheus-community-kube-prometheus-stack-85-3-3-default.yaml"
    routeSourceVersion: "85.3.3"
  implementations:
    directApply:
      result: "pass"
      automatic: true
      executor: "scripts/run-kps-lifecycle-route-proof.mjs"
      evidence: "runs/kps-lifecycle-route-proof/receipt.yaml"
      observation: "Ran the chart's admission-create Job and observed the ca, cert, and key Secret."
    argoCd:
      result: "not-run"
      automatic: false
      evidence: ""
      observation: "No chart-specific Argo CD route receipt exists yet."
    flux:
      result: "not-run"
      automatic: false
      evidence: ""
      observation: "No chart-specific Flux route receipt exists yet."
