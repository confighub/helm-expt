apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "LifecycleRoute"
metadata:
  name: "upgrade-action-with-receipt"
  labels:
    app: "hooks-crds"
    chart: "prometheus-community-kube-prometheus-stack"
    base: "no-crds"
    lifecyclePhase: "pre-apply"
spec:
  chart: "prometheus-community/kube-prometheus-stack"
  version: "85.3.3"
  base: "no-crds"
  routeName: "upgrade-action-with-receipt"
  quirkClass: "hook-phase"
  lifecyclePhase: "pre-apply"
  actionKind: "run-job"
  executionMode: "user-executes"
  automatic: false
  whoRuns: "Your delivery — a GitOps PreSync/PostSync or cub action (receipted)"
  command: "kubectl apply -f <action-job>; kubectl wait --for=condition=complete job/<name>"
  disposition: "observed"
  alternatives:
    []
  evidence:
    - "data/hook-lifecycle/receipts/prometheus-community-kube-prometheus-stack/no-crds/latest.yaml"
    - "runs/kps-lifecycle-route-proof/no-crds-receipt.yaml"
    - "packages/prometheus-community/kube-prometheus-stack/85.3.3/prerequisites/kube-prometheus-stack-lifecycle/generation-receipt.yaml"
    - "recipes/prometheus-community/kube-prometheus-stack/85.3.3/revisions/no-crds/r001/rendered/release-objects.yaml"
    - "runs/kps-gitops-lifecycle-proof/receipt.yaml"
  evidenceRequired: "already has a live receipt; keep it fresh when chart, base, or cluster version changes"
  gitOps:
    argoCd: "PreSync"
    argoCdSnippet: "metadata:\n  annotations:\n    argocd.argoproj.io/hook: PreSync\n    argocd.argoproj.io/hook-delete-policy: HookSucceeded"
    emitsControllerStep: true
    flux: "apply before the release (Kustomization dependsOn)"
  origin:
    type: "helm-render-intent"
    record: "data/helm-render-intents/intents/prometheus-community-kube-prometheus-stack-85-3-3-no-crds.yaml"
    routeSourceVersion: "85.3.3"
  implementations:
    directApply:
      result: "not-run"
      automatic: false
      executor: ""
      evidence: "runs/kps-lifecycle-route-proof/no-crds-receipt.yaml"
      observation: "This receipt covers a fresh install only; chart upgrade behavior remains unproved."
    argoCd:
      result: "pass"
      automatic: false
      evidence: "runs/kps-gitops-lifecycle-proof/receipt.yaml"
      observation: "Argo CD upgraded 85.3.3 to 86.1.0, reran all four stages, and passed the runtime checks."
    flux:
      result: "pass"
      automatic: false
      evidence: "runs/kps-gitops-lifecycle-proof/receipt.yaml"
      observation: "Flux upgraded 85.3.3 to 86.1.0, reran all four stages, and passed the runtime checks."
