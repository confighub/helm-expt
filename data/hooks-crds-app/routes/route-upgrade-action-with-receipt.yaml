apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "LifecycleRoute"
metadata:
  name: "upgrade-action-with-receipt"
  labels:
    app: "hooks-crds"
    chart: "prometheus-community-kube-prometheus-stack"
    base: "no-crds"
    lifecyclePhase: "pre-apply"
spec:
  chart: "prometheus-community/kube-prometheus-stack"
  version: "85.3.3"
  base: "no-crds"
  routeName: "upgrade-action-with-receipt"
  quirkClass: "hook-phase"
  lifecyclePhase: "pre-apply"
  actionKind: "run-job"
  executionMode: "not-yet-executable"
  automatic: false
  whoRuns: "Not tested for this path"
  command: "kubectl apply -f <action-job>; kubectl wait --for=condition=complete job/<name>"
  disposition: "not-run"
  alternatives:
    []
  evidence:
    - "runs/kps-lifecycle-route-proof/no-crds-receipt.yaml"
  evidenceRequired: "run this route for the named path and capture a live receipt"
  gitOps:
    argoCd: "PreSync"
    argoCdSnippet: "metadata:\n  annotations:\n    argocd.argoproj.io/hook: PreSync\n    argocd.argoproj.io/hook-delete-policy: HookSucceeded"
    emitsControllerStep: true
    flux: "apply before the release (Kustomization dependsOn)"
  origin:
    type: "helm-render-intent"
    record: "data/helm-render-intents/intents/prometheus-community-kube-prometheus-stack-85-3-3-no-crds.yaml"
    routeSourceVersion: "85.3.3"
  implementations:
    directApply:
      result: "not-run"
      automatic: false
      executor: ""
      evidence: "runs/kps-lifecycle-route-proof/no-crds-receipt.yaml"
      observation: "This receipt covers a fresh install only; chart upgrade behavior remains unproved."
    argoCd:
      result: "not-run"
      automatic: false
      evidence: ""
      observation: "The 85.3.3 to 86.1.0 upgrade has not run through this controller."
    flux:
      result: "not-run"
      automatic: false
      evidence: ""
      observation: "The 85.3.3 to 86.1.0 upgrade has not run through this controller."
