apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "AiCustomFieldAnswer"
metadata:
  name: "redis-container-custom-field-no-fork"
spec:
  edit:
    containerName: "redis"
    key: "terminationMessagePolicy"
    location: "spec.template.spec.containers"
    targetObject: "apps/v1|StatefulSet|redis|redis-master"
    value: "FallbackToLogsOnError"
  fork: false
