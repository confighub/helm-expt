apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "AiCustomFieldReceipt"
metadata:
  name: "redis-custom-field-no-fork"
spec:
  question: "The chart does not expose the field I need. Must I fork it?"
  persona: "Application team"
  render:
    chart: "bitnami/redis 25.5.3"
    path: "recipes/bitnami/redis/25.5.3/revisions/default/r001/rendered/release-objects.yaml"
    sha256: "175caf404c4a005708398d2facd696a8500ef4280c47c682b7bae6273a91272e"
  edit:
    key: "example.com/backup-policy"
    location: "spec.template.metadata.annotations"
    targetObject: "apps/v1|StatefulSet|redis|redis-master"
    value: "nightly"
  gate:
    targetExists: true
    fieldAdded: true
    noFork: true
  result: "pass"
