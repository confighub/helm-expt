# Written by hand. See README.md beside this file for what a reading is and
# how it is checked. Run `npm run config-model:verify` after any change.
apiVersion: "evidence.confighub.com/v1alpha1"
kind: "PlanStepReadings"
metadata:
  name: "plan-step-readings"
  readAt: "2026-10-11"
  note: >-
    Each reading says what one base needs for one step that its flattening
    verdict file names, and who does it. The verdict's line comes from a sweep
    of the whole chart. The reading comes from the base's own retained objects
    and from one live run on a throwaway local cluster.
spec:
  readings:
    - record: "cloudnative-pg-cloudnative-pg-0-28-2-default"
      step: "webhook-certificate"
      reading: "workload-supplies"
      suppliedBy: "the CloudNativePG operator"
      instruction: "The CloudNativePG operator makes its own certificate after it starts and fills the caBundle of both webhook configurations, so you do nothing for this step."
      evidence:
        - path: "recipes/cloudnative-pg/cloudnative-pg/0.28.2/revisions/default/r001/rendered/release-objects.yaml"
          object: "Deployment default/cloudnative-pg"
          shows: "The volume 'webhook-certificates' mounts the Secret 'cnpg-webhook-cert' with 'optional: true'. The file holds no Secret of that name, so the operator starts without it."
        - path: "recipes/cloudnative-pg/cloudnative-pg/0.28.2/revisions/default/r001/rendered/release-objects.yaml"
          object: "ClusterRole cloudnative-pg"
          shows: "One rule grants 'get' and 'patch' on 'mutatingwebhookconfigurations' and 'validatingwebhookconfigurations'. Another grants 'create' on 'secrets'. The operator may make the Secret and write the caBundle."
        - path: "recipes/cloudnative-pg/cloudnative-pg/0.28.2/revisions/default/r001/rendered/release-objects.yaml"
          object: "MutatingWebhookConfiguration cnpg-mutating-webhook-configuration"
          shows: "None of its 4 webhooks has a 'caBundle', and the object has no 'cert-manager.io' annotation."
        - path: "recipes/cloudnative-pg/cloudnative-pg/0.28.2/revisions/default/r001/rendered/release-objects.yaml"
          object: "ValidatingWebhookConfiguration cnpg-validating-webhook-configuration"
          shows: "None of its 5 webhooks has a 'caBundle', and the object has no 'cert-manager.io' annotation."
      observed:
        log: "docs/user/live-walk-plan-step-readings-2026-10-11.md"
        result: "Run 1. Straight after the apply all 9 webhooks had an empty caBundle. 13 seconds after the apply the operator had created the Secrets cnpg-ca-secret and cnpg-webhook-cert and had written a caBundle into all 9. The Deployment rolled out with 1 Pod, and a server dry-run of a Cluster passed both webhooks."

