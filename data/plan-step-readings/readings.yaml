    # This reading has no observed block on purpose. The walk did not run the
    # hook Job. It did the Job's check by hand, so the step stays recorded as
    # not run and the log is cited as evidence instead.
    - record: "jetstack-cert-manager-v1-20-2-crds-enabled"
      step: "hooks"
      reading: "hook-job"
      instruction: "The chart's hooks all belong to one Job that only checks the cert-manager API after an install, and the retained file leaves it out, so check the API yourself afterwards."
      evidence:
        - path: "recipes/jetstack/cert-manager/v1.20.2/revisions/crds-enabled/r001/receipts/scan-receipt.yaml"
          shows: "The finding 'helm-hook|Job|cert-manager|cert-manager-startupapicheck' says the startup API check is a Helm post-install hook that '--no-hooks' left out of the render."
        - path: "recipes/jetstack/cert-manager/v1.20.2/chart-dossier.yaml"
          shows: "The maintained note says 'startup API check is a Helm post-install hook and is excluded from the rendered revision by --no-hooks'."
        - path: "recipes/jetstack/cert-manager/v1.20.2/revisions/crds-enabled/r001/rendered/release-objects.yaml"
          absentKinds:
            - "Job"
          shows: "The retained file holds no Job, so the check does not travel with the objects. The installer package under packages/jetstack/cert-manager/v1.20.2 ships no hook file either."
        - path: "recipes/jetstack/cert-manager/v1.20.2/source-lock.yaml"
          shows: "The chart package with the 'packageSHA256' recorded here holds 'templates/startupapicheck-job.yaml'. Its one container runs with the arguments 'check', 'api' and '--wait'. The three hook lines the sweep counted in 'values.yaml' are the default annotations of that Job, its RBAC and its ServiceAccount."
        - path: "runs/lifecycle-observations/cert-manager-eso/jetstack-cert-manager-crds-enabled/receipt.yaml"
          shows: "An earlier run of this base records the hook policy 'startupapicheck-becomes-post-apply-api-dry-run' and a passing server dry-run of an Issuer."
        - path: "docs/user/live-walk-plan-step-readings-2026-10-11.md"
          shows: "Run 7. No Job ran and none existed on the cluster. All three Deployments rolled out without the hook. The walk then did the hook's check by hand. It applied a self-signed Issuer and a Certificate 45 seconds after the apply, and the Certificate was ready at once."

