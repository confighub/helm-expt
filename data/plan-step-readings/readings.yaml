          object: "Secret default/elastic-operator-webhook-cert"
          shows: "The Secret has no data. It is a place for the operator to write its certificate."
        - path: "recipes/elastic/eck-operator/3.4.0/revisions/default/r001/rendered/release-objects.yaml"
          object: "StatefulSet default/elastic-operator"
          shows: "The environment variable 'WEBHOOK_SECRET' is 'elastic-operator-webhook-cert', and the volume 'cert' mounts that Secret at '/tmp/k8s-webhook-server/serving-certs'."
        - path: "recipes/elastic/eck-operator/3.4.0/revisions/default/r001/rendered/release-objects.yaml"
          object: "ConfigMap default/elastic-operator"
          shows: "The key 'eck.yaml' sets 'enable-webhook: true' and 'webhook-name: elastic-operator.default.k8s.elastic.co'. It does not turn off the operator's own management of the webhook certificate."
        - path: "recipes/elastic/eck-operator/3.4.0/revisions/default/r001/rendered/release-objects.yaml"
          object: "ClusterRole elastic-operator"
          shows: "Its rules grant 'update' and 'patch' on 'secrets' and on 'validatingwebhookconfigurations'."
        - path: "recipes/elastic/eck-operator/3.4.0/revisions/default/r001/rendered/release-objects.yaml"
          object: "ValidatingWebhookConfiguration elastic-operator.default.k8s.elastic.co"
          shows: "None of its 16 webhooks has a 'caBundle', and the object has no 'cert-manager.io' annotation."
      observed:
