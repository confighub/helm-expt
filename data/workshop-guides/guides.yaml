apiVersion: catalog.confighub.com/v1alpha1
kind: WorkshopGuideRegistry
metadata:
  name: workshop-guides
spec:
  description: Every Guide, a known path an agent walks with a person beside it, grouped by where the
    reader starts. Kept by hand outside the generated site until step 7 of site IA phase 4 gives each
    Guide front matter; the site generator turns it into site/guides.json. The five journeys come first.
  groups:
  - id: journeys
    title: The five journeys
  - id: start-here
    title: Start here
  - id: helm-questions
    title: Helm questions
  - id: formats
    title: Formats
  - id: gitops
    title: GitOps
  - id: stacks-and-platforms
    title: Stacks and platforms
  - id: confighub
    title: ConfigHub
  guides:
  - id: journey-values-did-nothing
    group: journeys
    title: My values did nothing
    summary: The assistant wrote my Helm values. Did they do anything? Three of seven did nothing, and
      Helm never said so.
    page: journey-values-did-nothing.html
  - id: journey-preserve-my-fixes
    group: journeys
    title: Preserve my fixes
    summary: The assistant rewrote my app. Are my fixes still there? Then ConfigHub carries the fixes
      through the rewrite.
    page: journey-preserve-my-fixes.html
  - id: journey-what-my-app-needs
    group: journeys
    title: What my app needs
    summary: Will my app run on the platform I picked? Refused for two real reasons, fixed on both sides,
      then checked.
    page: journey-what-my-app-needs.html
  - id: journey-before-gitops
    group: journeys
    title: Before GitOps takes over
    summary: My Redis has run fine for a month. Is it safe to hand to GitOps? Three problems, then a reviewed
      alternative from the Catalog.
    page: journey-before-gitops.html
  - id: journey-installs-never-starts
    group: journeys
    title: It installs but never starts
    summary: Every check passes. Should I install it? The image no longer exists, said before the install.
    page: journey-installs-never-starts.html
  - id: redis-intro
    group: start-here
    title: Walk the whole model once, with Redis
    summary: One chart, Redis, walked through the Catalog, flattening, OCI, variants, promotion, policy
      and stacks in one pass, marking which steps are free and local.
    page: d/docs/user/workshop-redis-intro-guide.html
  - id: try
    group: start-here
    title: 'Try it: Redis in ten minutes'
    summary: Render one public Redis catalog package and inspect its exact Kubernetes objects without
      contacting ConfigHub Server or Kubernetes.
    page: try.html
  - id: demo
    group: start-here
    title: From one chart to a governed fleet in ten minutes
    summary: In ten minutes you go from checking one chart to generating a governed fleet, checking a
      whole inference platform on the way, most of it free and copy-paste.
    page: demo.html
  - id: ai
    group: start-here
    title: Use ConfigHub Workshop with your AI agent
    summary: Install the ConfigHub Workshop agent skill, choose a configuration task, and keep exact objects,
      lifecycle work, checks, and limits visible.
    page: ai.html
  - id: testing
    group: start-here
    title: Find a starting configuration
    summary: Say what you need, try a simple Redis example, choose how to run a starting example, then
      continue in ConfigHub or on a platform.
    page: testing.html
  - id: helm-questions
    group: helm-questions
    title: Answer the ten questions Helm users ask
    summary: Walk the ten questions a Helm user asks, with the pain beneath each one and a check you run
      on your agent's answer.
    page: d/docs/user/workshop-helm-questions-guide.html
  - id: values
    group: helm-questions
    title: Find why a Helm value did not change the output
    summary: Compare a typo with the correct key in controlled renders, including a value the template
      transforms.
    page: d/docs/user/workshop-values-guide.html
  - id: why-did-helm-ignore-my-values
    group: helm-questions
    title: Why did Helm ignore my values?
    summary: Find values that Helm accepts but a chart does not use by comparing the rendered Kubernetes
      objects with and without each supplied key.
    page: why-did-helm-ignore-my-values.html
  - id: did-this-chart-version-change
    group: helm-questions
    title: Did this chart version change upstream?
    summary: Check whether an upstream publisher changed the package bytes behind an existing Helm chart
      version.
    page: did-this-chart-version-change.html
  - id: did-your-bitnami-chart-stop-pulling
    group: helm-questions
    title: Did your Bitnami chart stop pulling?
    summary: Find a tested, verified successor for a Bitnami chart that no longer pulls anonymously, with
      each successor linked to its catalog entry.
    page: did-your-bitnami-chart-stop-pulling.html
  - id: upgrade
    group: helm-questions
    title: Review a chart upgrade before promoting it
    summary: Compare retained versions and prepare a review packet that keeps missing promotion evidence
      visible.
    page: d/docs/user/workshop-upgrade-guide.html
  - id: adapt
    group: helm-questions
    title: Adapt a configuration and inspect the exact edit
    summary: Change one replica count, inspect the exact diff and spot an unexpected second edit.
    page: d/docs/user/workshop-adapt-guide.html
  - id: byo-charts
    group: helm-questions
    title: Render your own chart to exact objects, adapt them as data, and keep them
    summary: Render your own chart and values, an AI-written one included, then check, diff, adapt a field,
      and keep the reviewed objects for your own Argo CD or Flux.
    page: d/docs/user/workshop-byo-charts-guide.html
  - id: aicr
    group: formats
    title: Answer the questions AICR users ask
    summary: Compose an H100 training recipe's exact objects, compare three retained versions, and read
      the recorded accelerator-fit and component-order routes.
    page: d/docs/user/workshop-aicr-guide.html
  - id: timoni
    group: formats
    title: Answer the questions Timoni users ask
    summary: Build a typed module's exact objects, check the typed schema and the CRD ordering, and see
      which module bytes are digest-bound.
    page: d/docs/user/workshop-timoni-guide.html
  - id: yaml
    group: formats
    title: Answer the questions plain Kubernetes YAML users ask
    summary: Check what four files will install, compare two versions with one edit, and read why this
      base's lifecycle-route status is a recorded gap.
    page: d/docs/user/workshop-yaml-guide.html
  - id: kubara
    group: formats
    title: Answer the questions Kubara users ask
    summary: Check what a generated Kubara platform contains, and read its recorded CRD, secret and bootstrap
      routes. To govern a Kubara platform, use cub kubara.
    page: d/docs/user/workshop-kubara-guide.html
  - id: gitops-adopter
    group: gitops
    title: Use ConfigHub With Argo CD Or Flux
    summary: Keep the Argo CD or Flux you already run. ConfigHub publishes the reviewed Kubernetes objects
      as an OCI image for that controller to pull.
    page: d/docs/user/gitops-adopter-guide.html
  - id: deploy-with-flux-or-argo
    group: gitops
    title: Run it with Flux, Argo CD, or kubectl
    summary: Reconcile a published component with no account, render any catalog chart to an image your
      Flux, Argo CD, or kubectl consumes, and verify its receipt first.
    page: deploy-with-flux-or-argo.html
  - id: argocd-hardening
    group: gitops
    title: Harden Argo CD before production, as a variant you can check and keep
    summary: Turn security advice into a checked variant of the Catalog's Argo CD base, compare it with
      the base, and keep it with a staging and production path.
    page: d/docs/user/workshop-argocd-hardening-guide.html
  - id: compose
    group: stacks-and-platforms
    title: Compose and review a local workshop stack
    summary: Save a Kubara and Argo CD selection, move it, edit the app and retain a refusal when an API
      does not fit.
    page: d/docs/user/workshop-compose-guide.html
  - id: lifecycle
    group: stacks-and-platforms
    title: Find the hook and CRD work before delivery
    summary: Inspect a hook without running it, preserve an API refusal and identify what delivery still
      requires.
    page: d/docs/user/workshop-lifecycle-guide.html
  - id: match
    group: stacks-and-platforms
    title: Match a GPU workload with supplied facts
    summary: Keep candidate, mismatch and unknown results separately, with the input hashes behind each
      answer.
    page: d/docs/user/workshop-match-guide.html
  - id: compose-a-stack
    group: stacks-and-platforms
    title: Compose and check a stack
    summary: Get a stack, check it for conflicts and missing needs before anything runs, then run and
      govern it in ConfigHub. It includes the stacks made to be refused.
    page: compose-a-stack.html
  - id: try-aicr
    group: stacks-and-platforms
    title: Compare GPU nodes and pull an AICR config
    summary: Compare existing GPU nodes with a recipe, or pull and read a retained AICR configuration
      with ORAS.
    page: try-aicr.html
  - id: put-an-app-on-a-platform
    group: stacks-and-platforms
    title: Put an app on a platform
    summary: Check what an app needs, check it on a platform, take it into ConfigHub, or bring an app
      that already runs.
    page: put-an-app-on-a-platform.html
  - id: bring-kubara-into-confighub
    group: stacks-and-platforms
    title: Bring a Kubara platform into ConfigHub
    summary: Govern a Kubara platform with cub kubara, from plan to handover and check, without changing
      how Kubara works, or use it as a Workshop stack.
    page: bring-kubara-into-confighub.html
  - id: promote
    group: confighub
    title: Can I promote this configuration?
    summary: Compare current and proposed Kubernetes objects, see what changes, and choose the tests required
      before moving the change.
    page: promote.html
  - id: field-restore
    group: confighub
    title: Add one field and keep the original configuration
    summary: Review one added label, detect an object replacement and restore the exact original file.
    page: d/docs/user/workshop-field-restore-guide.html
  - id: does-cluster-match-approved-config
    group: confighub
    title: Does the cluster match what we approved?
    summary: Compare approved configuration with live cluster state while keeping the current field-coverage
      limits visible.
    page: does-cluster-match-approved-config.html
  - id: why-do-dev-and-prod-differ
    group: confighub
    title: Why do development and production differ?
    summary: Record development and production as related configurations so their exact differences and
      promotion history remain visible.
    page: why-do-dev-and-prod-differ.html
