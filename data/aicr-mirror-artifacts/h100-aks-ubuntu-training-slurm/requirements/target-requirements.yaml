      targetRevision: "1.2.0"
    -
      application: "slinky-slurm-operator"
      repoURL: "oci://ghcr.io/slinkyproject/charts/slurm-operator"
      chart: "slurm-operator"
      targetRevision: "1.2.0"
    -
      application: "slinky-slurm"
      repoURL: "oci://ghcr.io/slinkyproject/charts/slurm"
      chart: "slurm"
      targetRevision: "1.2.0"
  recipeCriteria:
    accelerator: "h100"
    intent: "training"
    os: "ubuntu"
    platform: "slurm"
    service: "aks"
  generationInputs:
    acceleratedNodeSelector: "nvidia.com/gpu.present=true"
    acceleratedNodeToleration: "nvidia.com/gpu:NoSchedule"
    repoURL: "oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/aicr-h100-aks-ubuntu-training-slurm"
    storageClass: "gp3"
    systemNodeSelector: "nodeGroup=system-worker"
    workloadSelector: "app.kubernetes.io/part-of=training"
  placeholders:
    -
      input: "systemNodeSelector"
      value: "nodeGroup=system-worker"
      changeTo: "the label on your own cluster's system node group"
      route: "routes/system-node-selector-placeholder.yaml"
  answeredRefusals:
    -
      input: "acceleratedNodeToleration"
      value: "nvidia.com/gpu:NoSchedule"
      valueOrigin: "The value is the keyed toleration AICR's own refusal names. It matches a GPU node taint of nvidia.com/gpu with effect NoSchedule, and a destination whose GPU nodes carry another taint needs another value."
  componentsLeftOutOfBundle:
    names:
      - "dra-node-labeler"
      - "mariadb-operator"
      - "mariadb-operator-crds"
      - "slurm-accounting-mariadb"
    route: "routes/components-left-out-of-bundle.yaml"
  literalCredentials:
    -
      application: "kube-prometheus-stack"
      file: "kube-prometheus-stack.yaml"
      key: "adminPassword"
      value: "admin"
      statement: "kube-prometheus-stack.yaml sets adminPassword to the literal admin in its chart values. Replace it for any destination that matters."
  automatedSync:
    applications: 20
    statement: "20 of the 20 Applications carry an automated sync policy with prune and self-heal. A destination has to accept that before they are applied."
  checked: "No destination has been checked against these requirements."
  provenance:
    emittedBy: "scripts/generate-aicr-mirror-artifacts.mjs"
    generatedFrom:
      - "examples/aicr/h100-aks-ubuntu-training-slurm/generation-receipt.yaml"
      - "examples/aicr/h100-aks-ubuntu-training-slurm/argocd-rendered/templates"
      - "examples/aicr/h100-aks-ubuntu-training-slurm/digest-index/platform-index.json"
