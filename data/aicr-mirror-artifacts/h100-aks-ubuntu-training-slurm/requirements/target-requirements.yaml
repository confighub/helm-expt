  deliveryRuntime:
    name: "Argo CD"
    api: "argoproj.io/v1alpha1 Application"
    namespace: "argocd"
    statement: "All 20 objects in this bundle are Argo CD Applications in the argocd namespace. Argo CD and its Application API must exist on the destination before they are applied."
  sourcePackage:
    reference: "oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/aicr-h100-aks-ubuntu-training-slurm/aicr-bundle:1.0.0"
    manifestDigest: "sha256:07146a4c5f882553a8ef4f8dc90c2c48596db0748ead6afa95f036375bdc009e"
    applications:
      - "aicr-stack"
      - "gpu-operator-post"
      - "network-operator-post"
      - "nodewright-customizations"
      - "slinky-slurm-pre"
    statement: "5 of the 20 Applications take their source from this Helm chart package. Argo CD must be able to pull it at that reference, and the bytes this bundle was built against have that manifest digest."
  upstreamCharts:
    -
      application: "cert-manager"
      repoURL: "https://charts.jetstack.io"
      chart: "cert-manager"
      targetRevision: "1.20.2"
    -
      application: "gpu-operator"
      repoURL: "https://helm.ngc.nvidia.com/nvidia"
      chart: "gpu-operator"
      targetRevision: "26.7.1"
    -
      application: "k8s-ephemeral-storage-metrics"
      repoURL: "https://jmcgrath207.github.io/k8s-ephemeral-storage-metrics/chart"
