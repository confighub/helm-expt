      chart: "nodewright"
      targetRevision: "v0.19.0"
    -
      application: "nvidia-dra-driver-gpu"
      repoURL: "oci://registry.k8s.io/dra-driver-nvidia/charts/dra-driver-nvidia-gpu"
      chart: "dra-driver-nvidia-gpu"
      targetRevision: "0.5.0"
    -
      application: "nvsentinel"
      repoURL: "oci://ghcr.io/nvidia/nvsentinel"
      chart: "nvsentinel"
      targetRevision: "v1.25.0"
    -
      application: "prometheus-adapter"
      repoURL: "https://prometheus-community.github.io/helm-charts"
      chart: "prometheus-adapter"
      targetRevision: "5.3.0"
    -
      application: "prometheus-operator-crds"
