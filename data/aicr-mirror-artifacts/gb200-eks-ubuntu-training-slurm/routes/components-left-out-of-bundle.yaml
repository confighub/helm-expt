apiVersion: "evidence.confighub.com/v1alpha1"
kind: "BundleRoute"
metadata:
  name: "aicr-gb200-eks-ubuntu-training-slurm-v1-0-0-argocd-components-left-out-of-bundle"
spec:
  quirkClass: "omitted-component"
  routeKind: "destination-decision"
  discharges: "The recipe AICR selected names 4 components that the bundle does not deploy. No Application exists for them, so a destination that needs one has to decide that before delivery."
  declaration:
    components:
      -
        name: "dra-node-labeler"
        reason: "AICR skipped it and logged the reason: DRA eviction is not opted in (--dra-eviction-node-label unset), so the eviction label it would apply is not selected on"
        dependedOnBy:
          - "nvidia-dra-driver-gpu"
      -
        name: "mariadb-operator"
        reason: "AICR logged this component as disabled in the recipe and skipped it."
        dependedOnBy:
          []
      -
        name: "mariadb-operator-crds"
        reason: "AICR logged this component as disabled in the recipe and skipped it."
        dependedOnBy:
          []
      -
        name: "slurm-accounting-mariadb"
        reason: "AICR logged this component as disabled in the recipe and skipped it."
        dependedOnBy:
          - "slinky-slurm"
    inThisBundle: false
  executedBy:
    invokedBy: "the platform operator, before the first sync on a destination"
    automatic: false
    evidenceState: "not-run"
  boundedness:
    - "The reasons are the ones AICR logged when it wrote the bundle. They were not checked against a cluster."
    - "Including one of these components means regenerating the bundle with the input AICR names, which changes the bundle bytes and every digest of this entry."
  provenance:
    emittedBy: "scripts/generate-aicr-mirror-artifacts.mjs"
    generatedFrom:
      - "examples/aicr/gb200-eks-ubuntu-training-slurm/generation-receipt.yaml"
      - "examples/aicr/gb200-eks-ubuntu-training-slurm/argocd-helm-bundle/recipe.yaml"
