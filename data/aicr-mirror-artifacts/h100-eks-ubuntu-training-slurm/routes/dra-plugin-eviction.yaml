    dependedOnBy:
      - "nvidia-dra-driver-gpu"
    toIncludeTheComponent: "Regenerate the bundle with --dra-eviction-node-label set to the node label your cluster uses for DRA eviction. That changes the bundle bytes and every digest of this entry."
    toLeaveItOut: "Record the decision to leave it off."
    inThisBundle: false
  executedBy:
    invokedBy: "the platform operator, before the first GPU driver upgrade or restart"
    automatic: false
    evidenceState: "not-run"
  boundedness:
    - "The reason is the one AICR logged when it wrote the bundle. It was not checked against a cluster."
    - "No bundle with an eviction label exists in the Catalog, and no destination has been asked which choice it needs."
