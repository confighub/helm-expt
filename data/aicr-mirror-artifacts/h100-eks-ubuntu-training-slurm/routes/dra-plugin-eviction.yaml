spec:
  quirkClass: "omitted-component"
  routeKind: "generation-input"
  discharges: "No DRA eviction node label was given at bundle time, so AICR left dra-node-labeler out of this bundle. The selected recipe still lists it, and nvidia-dra-driver-gpu depends on it in that recipe. A destination that wants the labeler supplies an eviction node label at bundle time."
