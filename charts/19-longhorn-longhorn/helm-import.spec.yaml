apiVersion: installer.confighub.com/v1alpha1
kind: HelmImportSpec
metadata:
  name: "19-longhorn-longhorn"
spec:
  chart:
    repositoryName: "longhorn"
    repositoryURL: "https://charts.longhorn.io"
    resolvedRepositoryURL: "https://charts.longhorn.io"
    name: "longhorn"
    version: "1.11.2"
  render:
    releaseName: "longhorn"
    namespace: "longhorn"
    kubeVersion: "1.30.0"
    apiVersions: []
    flags:
      - "--include-crds"
      - "--skip-tests"
      - "--no-hooks"
    valuesFiles:
      - values.yaml
