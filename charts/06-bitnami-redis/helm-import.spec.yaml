apiVersion: installer.confighub.com/v1alpha1
kind: HelmImportSpec
metadata:
  name: "06-bitnami-redis"
spec:
  chart:
    repositoryName: "bitnami"
    repositoryURL: "https://charts.bitnami.com/bitnami"
    resolvedRepositoryURL: "https://charts.bitnami.com/bitnami"
    name: "redis"
    version: "25.5.3"
  render:
    releaseName: "redis"
    namespace: "redis"
    kubeVersion: "1.30.0"
    apiVersions: []
    flags:
      - "--include-crds"
      - "--skip-tests"
      - "--no-hooks"
    valuesFiles:
      - values.yaml
