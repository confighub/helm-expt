apiVersion: installer.confighub.com/v1alpha1
kind: HelmImportSpec
metadata:
  name: "13-gitlab-gitlab"
spec:
  chart:
    repositoryName: "gitlab"
    repositoryURL: "http://charts.gitlab.io/"
    resolvedRepositoryURL: "http://charts.gitlab.io/"
    name: "gitlab"
    version: "10.0.0"
  render:
    releaseName: "gitlab"
    namespace: "gitlab"
    kubeVersion: "1.30.0"
    apiVersions: []
    flags:
      - "--include-crds"
      - "--skip-tests"
      - "--no-hooks"
    valuesFiles:
      - values.yaml
