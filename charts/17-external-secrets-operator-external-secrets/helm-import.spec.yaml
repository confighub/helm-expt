    repositoryName: "external-secrets-operator"
    repositoryURL: "https://charts.external-secrets.io/"
    resolvedRepositoryURL: "https://charts.external-secrets.io/"
    name: "external-secrets"
    version: "2.5.0"
  render:
    releaseName: "external-secrets"
    namespace: "external-secrets"
    kubeVersion: "1.30.0"
    apiVersions: []
    flags:
      - "--include-crds"
      - "--skip-tests"
      - "--no-hooks"
    valuesFiles:
      - values.yaml
