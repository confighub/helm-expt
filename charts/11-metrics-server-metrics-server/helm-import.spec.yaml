apiVersion: installer.confighub.com/v1alpha1
kind: HelmImportSpec
metadata:
  name: "11-metrics-server-metrics-server"
spec:
  chart:
    repositoryName: "metrics-server"
    repositoryURL: "https://kubernetes-sigs.github.io/metrics-server/"
    resolvedRepositoryURL: "https://kubernetes-sigs.github.io/metrics-server/"
    name: "metrics-server"
    version: "3.13.0"
  render:
    releaseName: "metrics-server"
    namespace: "metrics-server"
    kubeVersion: "1.30.0"
    apiVersions: []
    flags:
      - "--include-crds"
      - "--skip-tests"
      - "--no-hooks"
    valuesFiles:
      - values.yaml
