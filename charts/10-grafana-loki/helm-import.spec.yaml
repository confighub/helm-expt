apiVersion: installer.confighub.com/v1alpha1
kind: HelmImportSpec
metadata:
  name: "10-grafana-loki"
spec:
  chart:
    repositoryName: "grafana"
    repositoryURL: "https://grafana.github.io/helm-charts"
    resolvedRepositoryURL: "https://grafana.github.io/helm-charts"
    name: "loki"
    version: "7.0.0"
  render:
    releaseName: "loki"
    namespace: "loki"
    kubeVersion: "1.30.0"
    apiVersions: []
    flags:
      - "--include-crds"
      - "--skip-tests"
      - "--no-hooks"
    valuesFiles:
      - values.yaml
