apiVersion: installer.confighub.com/v1alpha1
kind: HelmImportSpec
metadata:
  name: "03-ingress-nginx-ingress-nginx"
spec:
  chart:
    repositoryName: "ingress-nginx"
    repositoryURL: "https://kubernetes.github.io/ingress-nginx"
    resolvedRepositoryURL: "https://kubernetes.github.io/ingress-nginx"
    name: "ingress-nginx"
    version: "4.15.1"
  render:
    releaseName: "ingress-nginx"
    namespace: "ingress-nginx"
    kubeVersion: "1.30.0"
    apiVersions: []
    flags:
      - "--include-crds"
      - "--skip-tests"
      - "--no-hooks"
    valuesFiles:
      - values.yaml
