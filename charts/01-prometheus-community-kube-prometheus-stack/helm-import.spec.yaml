apiVersion: installer.confighub.com/v1alpha1
kind: HelmImportSpec
metadata:
  name: "01-prometheus-community-kube-prometheus-stack"
spec:
  chart:
    repositoryName: "prometheus-community"
    repositoryURL: "https://prometheus-community.github.io/helm-charts"
    resolvedRepositoryURL: "https://prometheus-community.github.io/helm-charts"
    name: "kube-prometheus-stack"
    version: "85.3.0"
  render:
    releaseName: "kube-prometheus-stack"
    namespace: "kube-prometheus-stack"
    kubeVersion: "1.30.0"
    apiVersions: []
    flags:
      - "--include-crds"
      - "--skip-tests"
      - "--no-hooks"
    valuesFiles:
      - values.yaml
