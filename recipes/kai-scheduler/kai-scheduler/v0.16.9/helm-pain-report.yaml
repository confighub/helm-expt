  notes:
    - "This package is the exact kai-scheduler@v0.16.9 chart, locked by archive URL and SHA-256."
    - "With chart defaults kai-scheduler@v0.16.9 renders 37 objects as release kai-scheduler in namespace kai-scheduler: six CRDs, ten ClusterRoles, nine ClusterRoleBindings, four PriorityClasses, the kai-operator Deployment and ServiceAccount, a second Namespace named kai-resource-reservation with a ServiceAccount and RoleBinding in it, two Queue objects and one SchedulingShard. It renders no Secret and no webhook configuration."
    - "The same values also render Helm hook objects that no base holds: 9 pre-install and pre-upgrade, 5 post-install and post-upgrade, 4 post-delete. The kai.scheduler/v1 Config object named kai-config is not a chart object at all in this version: a post-install and post-upgrade hook Job applies it with kubectl from a hook ConfigMap. The hook objects are packaged under prerequisites/kai-scheduler-lifecycle with a lifecycle-actions.yaml record. Nothing runs them automatically and none has been run on a cluster."
    - "The aicr-eks-training base renders 37 objects with the values the AICR v1.0.0 EKS training entry supplies (examples/aicr/eks-h100-training-kubeflow-v1-0-0/argocd-helm-bundle/011-kai-scheduler/values.yaml): the default queues named, every pod selected onto the system-worker node group and tolerating every taint, and the post-delete cleanup hook off. The AICR v1.0.0 entry retains these values and no render of this component, so this base is bound to the bundle's checksum list and its Application pin and is not compared with an AICR render."
    - "The installer package adds no Namespace object for the release namespace, because the base already holds one, kai-resource-reservation. The kai-scheduler namespace must exist on the target before the base is applied."
    - "The Namespace, the two Queue objects and the SchedulingShard carry helm.sh/resource-policy: keep, so helm uninstall leaves them. A flattened copy has no such memory; deleting the delivered objects deletes them."
    - "The chart uses lookup three ways. It renders the kai-resource-reservation Namespace and ServiceAccount only when the cluster does not already have them, and it adds OpenShift settings when the cluster has the ClusterVersion CRD. The bases are the offline answers: Namespace and ServiceAccount present, no OpenShift settings."
    - "The retained root proves exact source bytes, deterministic rendering, and deterministic ConfigHub installer packaging. It does not claim publication, live convergence, or production support."
