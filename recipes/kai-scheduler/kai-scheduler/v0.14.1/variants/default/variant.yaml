apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Variant"
metadata:
  name: "default"
spec:
  recipe: "../../recipe.yaml"
  namespace: "kai-scheduler"
  releaseName: "kai-scheduler"
  valuesProfile: "../../effective-values.yaml"
  capabilityProfile:
    kubeVersion: "1.31.0"
    apiVersions:
      []
  hookPolicy: "no-hooks"
  targetFacts:
    requiredCRDs:
      -
        name: "bindrequests.scheduling.run.ai"
        sourceVariant: "default"
        purpose: "CRD included in this base; it must be established before Kubernetes accepts the rendered Queue and SchedulingShard objects and before the operator starts"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
      -
        name: "configs.kai.scheduler"
        sourceVariant: "default"
        purpose: "CRD included in this base; it must be established before Kubernetes accepts the rendered Queue and SchedulingShard objects and before the operator starts"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
      -
        name: "podgroups.scheduling.run.ai"
        sourceVariant: "default"
        purpose: "CRD included in this base; it must be established before Kubernetes accepts the rendered Queue and SchedulingShard objects and before the operator starts"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
      -
        name: "queues.scheduling.run.ai"
        sourceVariant: "default"
        purpose: "CRD included in this base; it must be established before Kubernetes accepts the rendered Queue and SchedulingShard objects and before the operator starts"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
      -
        name: "schedulingshards.kai.scheduler"
        sourceVariant: "default"
        purpose: "CRD included in this base; it must be established before Kubernetes accepts the rendered Queue and SchedulingShard objects and before the operator starts"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
      -
        name: "topologies.kai.scheduler"
        sourceVariant: "default"
        purpose: "CRD included in this base; it must be established before Kubernetes accepts the rendered Queue and SchedulingShard objects and before the operator starts"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
