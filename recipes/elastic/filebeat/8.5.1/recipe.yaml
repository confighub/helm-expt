apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Recipe"
metadata:
  name: "elastic-filebeat"
  version: "8.5.1"
  labels:
    confighub.io/chart-ref: "elastic/filebeat"
    confighub.io/chart-version: "8.5.1"
    confighub.io/proof-tier: "next80-full"
spec:
  chartRef:
    sourceLock: "source-lock.yaml"
    dependencyLock: "dependency-lock.yaml"
  importMode: "render-and-vendor"
  currentExecutableFixture:
    installerPackage: "packages/elastic/filebeat/8.5.1"
    setupCommand:
      - "cub"
      - "installer"
      - "setup"
      - "--pull"
      - "packages/elastic/filebeat/8.5.1"
      - "--non-interactive"
      - "--namespace"
      - "default"
  variants:
    - "variants/default/variant.yaml"
