    rationale: "Hand read of the chart against this base's render. The packaged chart has one template that renders an object, a DaemonSet, and it has no hook, no lookup, no capability branch, no generated value, no keep annotation, no webhook, no CRD, no Namespace template and no subchart. The render agrees: one DaemonSet, no Secret, no Job and no RBAC. Nothing is decided at render time. The DaemonSet carries no metadata.namespace because the template leaves it to Helm, so the delivery must apply it into kube-system; that is recorded as a precondition, not a route. The pod runs on the host network and mounts the kubelet device plugin directory, /dev/infiniband and /opt/aws/neuron from the host, which is the chart's design. This base uses the chart defaults, which run the container privileged as user 0 and allow node affinity over the long list of EFA instance types in the chart."
