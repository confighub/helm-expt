apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ChartDossier"
metadata:
  name: "eks-aws-efa-k8s-device-plugin-v0.5.29"
spec:
  chart: "eks/aws-efa-k8s-device-plugin"
  version: "v0.5.29"
  caveats:
    - "The image is 602401143452.dkr.ecr.us-west-2.amazonaws.com/eks/aws-efa-k8s-device-plugin:v0.5.20, in an Amazon ECR registry that is regional and needs AWS credentials. An EKS node in us-west-2 can pull it; another region or another cloud needs the image reference changed."
    - "The pod runs on the host network and mounts the kubelet device plugin directory. It does nothing useful on a node without EFA interfaces."
  maintainedNotes:
    - "This package is the exact aws-efa-k8s-device-plugin@v0.5.29 chart, locked by archive URL and SHA-256."
    - "With chart defaults aws-efa-k8s-device-plugin@v0.5.29 renders 1 object as release aws-efa: one DaemonSet. It renders no CRD, no Secret, no RBAC and no Helm hook."
    - "The archive's Chart.yaml names the version v0.5.29 and the application version v0.5.20. The AICR Applications ask for 0.5.29, which Helm resolves to this archive; the archive SHA-256 equals the one the AICR v0.20.0 nested-render receipt records."
    - "The aicr-eks-training base renders 1 objects with the values the AICR v0.20.0 and AICR v1.0.0 EKS training entries supply (examples/aicr/eks-h100-training-kubeflow-v0-20-0/argocd-helm-bundle/002-aws-efa/values.yaml and examples/aicr/eks-h100-training-kubeflow-v1-0-0/argocd-helm-bundle/002-aws-efa/values.yaml): the full name set to aws-efa-k8s-device-plugin, the DaemonSet selected onto nodes labelled nvidia.com/gpu.present and tolerating every taint, the image named explicitly, resource requests set, and the container security context tightened. Its objects equal the AICR v0.20.0 nested render of the same archive, object for object. The AICR v1.0.0 entry retains these values and no render of this component, so this base is bound to the bundle's checksum list and its Application pin and is not compared with an AICR render."
    - "The DaemonSet carries no metadata.namespace, because the chart template leaves it to Helm. A flattened copy must be applied into kube-system."
    - "The chart contains no lookup, no .Capabilities branch, no generated credential, no hook and no subchart."
    - "The retained root proves exact source bytes, deterministic rendering, and deterministic ConfigHub installer packaging. It does not claim publication, live convergence, or production support."
  knownControlPoints:
    - "source-lock"
    - "dependency-lock"
    - "capability-profile"
    - "target-facts"
    - "production-readiness-review"
