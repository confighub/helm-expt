apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Recipe"
metadata:
  name: "fluent-fluentd"
  version: "0.5.3"
  labels:
    confighub.io/chart-ref: "fluent/fluentd"
    confighub.io/chart-version: "0.5.3"
    confighub.io/proof-tier: "next80-full"
spec:
  chartRef:
    sourceLock: "source-lock.yaml"
    dependencyLock: "dependency-lock.yaml"
  importMode: "render-and-vendor"
  currentExecutableFixture:
    installerPackage: "packages/fluent/fluentd/0.5.3"
    setupCommand:
      - "cub"
      - "install"
      - "setup"
      - "--pull"
      - "packages/fluent/fluentd/0.5.3"
      - "--non-interactive"
      - "--namespace"
      - "default"
  variants:
    - "variants/default/variant.yaml"
