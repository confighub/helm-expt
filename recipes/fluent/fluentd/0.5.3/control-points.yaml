apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ControlPoints"
metadata:
  name: "fluent-fluentd-0-5-3"
spec:
  points:
    -
      category: "source-lock"
      status: "handled"
      evidence: "source-lock.yaml"
    -
      category: "dependency-lock"
      status: "handled"
      evidence: "dependency-lock.yaml"
      dependencyCount: 0
    -
      category: "capability-profile"
      status: "handled"
      kubeVersion: "1.30.0"
    -
      category: "variant-revision"
      status: "handled"
      evidence: "revisions/default/r001/variant-revision.yaml"
    -
      category: "rendered-manifest-scan"
      status: "handled"
      evidence: "revisions/default/r001/receipts/scan-receipt.yaml"
    -
      category: "helm-equivalence"
      status: "handled"
      evidence: "revisions/default/r001/receipts/helm-equivalence-receipt.yaml"
    -
      category: "tpl-extension-slots"
      status: "source-signal-recorded"
      note: "tpl use is recorded for review and variant analysis"
    -
      category: "lifecycle-policy"
      status: "handled-by-no-hooks-proof"
      policy: "no-hooks"
      note: "hook templates are excluded from the approved rendered object revision"
    -
      category: "cluster-rbac"
      status: "scan-and-review"
