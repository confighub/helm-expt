apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Recipe"
metadata:
  name: "gatekeeper-gatekeeper"
  version: "3.22.2"
  labels:
    confighub.io/chart-ref: "gatekeeper/gatekeeper"
    confighub.io/chart-version: "3.22.2"
    confighub.io/proof-tier: "next80-full"
spec:
  chartRef:
    sourceLock: "source-lock.yaml"
    dependencyLock: "dependency-lock.yaml"
  importMode: "render-and-vendor"
  currentExecutableFixture:
    installerPackage: "packages/gatekeeper/gatekeeper/3.22.2"
    setupCommand:
      - "cub"
      - "install"
      - "setup"
      - "--pull"
      - "packages/gatekeeper/gatekeeper/3.22.2"
      - "--non-interactive"
      - "--namespace"
      - "default"
  variants:
    - "variants/default/variant.yaml"
