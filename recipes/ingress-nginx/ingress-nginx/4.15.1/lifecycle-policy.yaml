apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "LifecyclePolicy"
metadata:
  name: "ingress-nginx-ingress-nginx-4.15.1"
  chart: "ingress-nginx/ingress-nginx"
  version: "4.15.1"
spec:
  summary: "The default ingress-nginx base preserves the admission webhook objects rendered by Helm, but Helm hook Jobs that create and patch the webhook certificate are not part of the rendered object set. Production use needs an explicit lifecycle route and fresh observation receipt."
  bases:
    default:
      status: "route-selected-observation-needed"
      selectedLiveParityRoute: "The two-cluster parity harness stages ingress-nginx/ingress-nginx-admission as an installer-side target fact, while regular Helm continues to create it through Helm hooks."
      renderedObjects:
        - "v1|Service|ingress-nginx|ingress-nginx-controller-admission"
        - "admissionregistration.k8s.io/v1|ValidatingWebhookConfiguration||ingress-nginx-admission"
      omittedHelmHookObjects:
        - "admission-create Job"
        - "admission-patch Job"
      observedFailureWhenMissingLifecycle: "MountVolume.SetUp failed for volume webhook-cert: secret ingress-nginx-admission not found."
      supportedRoutes:
        -
          route: "run-equivalent-webhook-cert-lifecycle"
          description: "Create and patch the admission webhook certificate Secret before or during apply, then observe the webhook Service and ValidatingWebhookConfiguration."
          requiredReceipts:
            - "lifecycle-operation-receipt"
            - "admission-webhook-observation-receipt"
            - "secret-preflight-receipt"
        -
          route: "use-target-certificate-provider"
          description: "Use a target-approved certificate provider, such as cert-manager, and record the Secret, CA bundle, and webhook readiness evidence."
          requiredReceipts:
            - "target-fact-receipt"
            - "admission-webhook-observation-receipt"
        -
          route: "choose-non-webhook-base"
          description: "Use admission-disabled or internal-clusterip when the target does not need the ingress-nginx admission webhook."
          requiredReceipts:
            - "variant-selection-receipt"
      mustObserve:
        - "Secret ingress-nginx/ingress-nginx-admission exists with tls.crt, tls.key, and ca"
        - "ValidatingWebhookConfiguration ingress-nginx-admission has caBundle populated"
        - "Service ingress-nginx/ingress-nginx-controller-admission has ready endpoints"
        - "controller Deployment is available after the webhook certificate route runs"
    admissionDisabled:
      status: "webhook-not-rendered"
      renderedObjects:
        []
      note: "This base deliberately removes the admission Service and ValidatingWebhookConfiguration."
      requiredReceipts:
        - "variant-selection-receipt"
    internalClusterIP:
      status: "webhook-not-rendered"
      renderedObjects:
        []
      note: "This base deliberately removes the admission webhook and changes the controller Service to ClusterIP for local or internal targets."
      requiredReceipts:
        - "variant-selection-receipt"
  notProvenBy:
    - "render parity alone"
    - "presence of a ValidatingWebhookConfiguration alone"
    - "one kubectl apply without the webhook certificate lifecycle route"
