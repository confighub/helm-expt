apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Variant"
metadata:
  name: "default"
spec:
  recipe: "../../recipe.yaml"
  namespace: "ingress-nginx"
  releaseName: "ingress-nginx"
  valuesProfile: "../../effective-values.yaml"
  capabilityProfile:
    kubeVersion: "1.30.0"
    apiVersions:
      []
  hookPolicy: "no-hooks"
  targetFacts:
    requiredSecrets:
      -
        namespace: "ingress-nginx"
        name: "ingress-nginx-admission"
        keys:
          - "cert"
          - "key"
          - "ca"
        purpose: "admission webhook certificate normally created by Helm hook jobs"
        deliveryLanes:
          - "cubInstallerApply"
