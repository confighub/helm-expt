apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ValueModel"
metadata:
  name: "aws-ebs-csi-driver-aws-ebs-csi-driver-2.59.0"
spec:
  checkedValues:
    -
      path: "<chart defaults>"
      variant: "default"
      disposition: "default-render-captured"
      reason: "the exact chart-default render of the locked archive is captured"
    -
      path: "<Kubernetes version>"
      disposition: "default-render-captured"
      reason: "From Kubernetes 1.33 the chart adds the MutableCSINodeAllocatableCount feature gate to the controller and nodeAllocatableUpdatePeriodSeconds to the CSIDriver. The bases are rendered for 1.33.0 and hold both."
      note: "a render for 1.32 or earlier differs at those two fields; the AICR nested render, made with Helm's own default version, has both"
      evidence: "templates/controller.yaml, templates/csidriver.yaml"
    -
      path: "defaultStorageClass.enabled"
      disposition: "variant-axis"
      reason: "False by chart default. The AICR values turn it on, which adds a StorageClass named ebs-csi-default-sc annotated as the cluster default."
      note: "a cluster that already has a default StorageClass then has two"
      evidence: "templates/ebs-csi-default-sc.yaml, values.yaml defaultStorageClass"
    -
      path: "node.enableWindows"
      disposition: "variant-axis"
      reason: "True by chart default, which renders a second node DaemonSet for Windows nodes. The AICR values turn it off."
      evidence: "templates/node-windows.yaml"
    -
      path: "<aicr-eks-training-v0-20-0 values>"
      variant: "aicr-eks-training-v0-20-0"
      disposition: "variant-axis"
      reason: "the values the AICR v0.20.0 EKS training entry supplies (examples/aicr/eks-h100-training-kubeflow-v0-20-0/argocd-helm-bundle/001-aws-ebs-csi-driver/values.yaml): a default StorageClass on, the Windows node DaemonSet off, the controller and node pods tolerating every taint, service account names and resource requests and limits set"
      note: "differs from the default base by removing apps/v1|DaemonSet|kube-system|ebs-csi-node-windows and adding storage.k8s.io/v1|StorageClass||ebs-csi-default-sc and by the fields those values reach; the proof checks the removed and added sets"
    -
      path: "<aicr-eks-training-v1-0-0 values>"
      variant: "aicr-eks-training-v1-0-0"
      disposition: "variant-axis"
      reason: "the values the AICR v1.0.0 EKS training entry supplies (examples/aicr/eks-h100-training-kubeflow-v1-0-0/argocd-helm-bundle/001-aws-ebs-csi-driver/values.yaml): the v0.20.0 values with the controller also selected onto the system-worker node group"
      note: "differs from the default base by removing apps/v1|DaemonSet|kube-system|ebs-csi-node-windows and adding storage.k8s.io/v1|StorageClass||ebs-csi-default-sc and by the fields those values reach; the proof checks the removed and added sets"
  unknownValues: "not-exhaustively-checked-by-aicr-nested-charts-coverage-proof"
  deadValues: "not-exhaustively-checked-by-aicr-nested-charts-coverage-proof"
  ignoredValues: "not-exhaustively-checked-by-aicr-nested-charts-coverage-proof"
