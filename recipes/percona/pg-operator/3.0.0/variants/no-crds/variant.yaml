        suggestedSource: "kubectl apply -f <pg-operator-crds.yaml>"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
      -
        name: "perconapgupgrades.pgv2.percona.com"
        sourceVariant: "default"
