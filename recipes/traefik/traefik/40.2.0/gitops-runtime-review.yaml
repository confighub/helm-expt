apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "GitOpsRuntimeReview"
metadata:
  name: "traefik-no-crds-argocd-health-watch"
  chart: "traefik/traefik"
  version: "40.2.0"
spec:
  base: "no-crds"
  controller: "Argo CD"
  targetShape: "kind proof rig"
  receipt: "runs/live-helm-confighub-compare/traefik-traefik-no-crds/receipt.yaml"
  observedResult: "watch"
  currentSummary:
    sync: "Synced"
    health: "Progressing"
    semanticParity: "pass"
    regularHelmRuntime: "pass"
    configHubDirectRuntime: "pass"
    configHubOciRuntime: "pass"
  passed:
    - "regular Helm reached readiness"
    - "ConfigHub direct apply reached readiness"
    - "ConfigHub OCI/Argo synced the uploaded Units"
    - "ConfigHub OCI/Argo workloads reached readiness"
    - "semantic object parity passed for direct apply and OCI/Argo"
    - "the no-crds base kept CRDs out of the rendered object set"
  watch:
    summary: "Argo aggregate health remains Progressing after the workload is ready."
    nextAction:
      - "Inspect the Argo application tree for the resource that keeps aggregate health Progressing."
      - "Decide whether this is an ingress/load-balancer target limitation, an Argo health customization gap, or a wait-policy issue."
      - "Keep the base as watch until Argo aggregate health becomes Healthy or the target limitation is explicitly accepted."
  diagnosis:
    summary: "This is a GitOps controller-health watch row, not a render parity defect and not a no-crds routing defect."
    interpretation: "The desired object set matched Helm semantically, direct Kubernetes readiness passed, and the workload was ready through ConfigHub OCI/Argo. The remaining question is why Argo aggregate health stayed Progressing for the synced application."
  notClaimed:
    - "This row does not prove Traefik production support for arbitrary clusters."
    - "This row does not prove that Argo CD aggregate health should be ignored in production."
    - "This row does not prove CRD lifecycle ownership for targets that need Traefik CRDs installed by this base."
