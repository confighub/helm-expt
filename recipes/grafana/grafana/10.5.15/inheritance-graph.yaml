      namespace: "grafana"
      name: "grafana-admin"
      keys:
        - "admin-user"
        - "admin-password"
      fact: "Secret/grafana/grafana-admin:admin-user+admin-password"
      purpose: "Grafana administrator username and password"
  generatedFactEdges:
