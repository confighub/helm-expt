apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Recipe"
metadata:
  name: "grafana-grafana"
  version: "10.5.15"
spec:
  chartRef:
    sourceLock: "source-lock.yaml"
    dependencyLock: "dependency-lock.yaml"
  importMode: "render-and-vendor"
  currentExecutableFixture:
    installerPackage: "../../../../packages/grafana/grafana/10.5.15"
    setupCommand:
      - "cub"
      - "install"
      - "setup"
      - "--pull"
      - "../../../../packages/grafana/grafana/10.5.15"
      - "--non-interactive"
      - "--namespace"
      - "grafana"
  variants:
    - "variants/generated-passwords/variant.yaml"
    - "variants/existing-secret-ingress/variant.yaml"
