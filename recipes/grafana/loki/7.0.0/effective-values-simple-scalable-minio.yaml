apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "EffectiveValues"
metadata:
  name: "grafana-loki-7.0.0-simple-scalable-minio"
spec:
  files:
    -
      path: "effective-values-simple-scalable-minio.yaml"
      source: "inline-proof"
      sha256: "b67bea99f0056ef16e432293be47d8e870cadb9b929d8df9a227777f6812bf28"
  mergedValuesCaptured: false
  values:
    backend:
      replicas: 1
    loki:
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          -
            from: "2024-04-01"
            index:
              period: "24h"
              prefix: "loki_index_"
            object_store: "s3"
            schema: "v13"
            store: "tsdb"
      storage:
        bucketNames:
          admin: "loki-admin"
          chunks: "loki-chunks"
          ruler: "loki-ruler"
        s3:
          accessKeyId: "loki"
          endpoint: "minio.loki.svc.cluster.local:9000"
          insecure: true
          s3ForcePathStyle: true
          secretAccessKey: "loki-secret"
        type: "s3"
    minio:
      enabled: true
    read:
      replicas: 1
    write:
      replicas: 1
