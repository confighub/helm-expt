apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "EffectiveValues"
metadata:
  name: "grafana-tempo-1.24.4-local-persistent"
spec:
  files:
    -
      path: "effective-values.yaml"
      source: "inline-proof"
      sha256: "b9e0cb1795d219201c502da4854ab8262fe38526dfb3c564c2684925ab6b8877"
  mergedValuesCaptured: false
  values:
    persistence:
      accessModes:
        - "ReadWriteOnce"
      annotations:
        {}
      enableStatefulSetAutoDeletePVC: false
      enabled: true
      size: "10Gi"
      storageClassName: "standard"
    tempo:
      reportingEnabled: false
      storage:
        trace:
          backend: "local"
          local:
            path: "/var/tempo/traces"
          wal:
            path: "/var/tempo/wal"
