apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "EffectiveValues"
metadata:
  name: "grafana-tempo-1.24.4-s3-query-observability"
spec:
  files:
    -
      path: "effective-values-s3-query-observability.yaml"
      source: "inline-proof"
      sha256: "6fc72bf032d344a631a6f12a0ba57c4b6880664e1502b17709841d9e8696d8d6"
  mergedValuesCaptured: false
  values:
    networkPolicy:
      enabled: true
    persistence:
      accessModes:
        - "ReadWriteOnce"
      annotations:
        {}
      enabled: true
      size: "10Gi"
      storageClassName: "standard"
    service:
      targetPort: 3200
    serviceMonitor:
      enabled: true
    tempo:
      extraEnv:
        -
          name: "AWS_ACCESS_KEY_ID"
          valueFrom:
            secretKeyRef:
              key: "access_key"
              name: "tempo-s3-credentials"
        -
          name: "AWS_SECRET_ACCESS_KEY"
          valueFrom:
            secretKeyRef:
              key: "secret_key"
              name: "tempo-s3-credentials"
      reportingEnabled: false
      storage:
        trace:
          backend: "s3"
          local: null
          s3:
            bucket: "tempo-traces"
            endpoint: "tempo-object-store.tempo.svc.cluster.local:9000"
            forcepathstyle: true
            insecure: true
            region: "us-east-1"
          wal:
            path: "/var/tempo/wal"
    tempoQuery:
      enabled: true
      ingress:
        enabled: true
        hosts:
          - "query.tempo.example.com"
        ingressClassName: "nginx"
