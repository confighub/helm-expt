apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Recipe"
metadata:
  name: "grafana-promtail"
  version: "6.17.1"
  labels:
    confighub.io/chart-ref: "grafana/promtail"
    confighub.io/chart-version: "6.17.1"
    confighub.io/proof-tier: "next80-full"
spec:
  chartRef:
    sourceLock: "source-lock.yaml"
    dependencyLock: "dependency-lock.yaml"
  importMode: "render-and-vendor"
  currentExecutableFixture:
    installerPackage: "packages/grafana/promtail/6.17.1"
    setupCommand:
      - "cub"
      - "installer"
      - "setup"
      - "--pull"
      - "packages/grafana/promtail/6.17.1"
      - "--non-interactive"
      - "--namespace"
      - "default"
  variants:
    - "variants/default/variant.yaml"
