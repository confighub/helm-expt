apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "RuntimeReview"
metadata:
  name: "pyroscope-default-namespace-runtime-watch"
  chart: "grafana/pyroscope"
  version: "2.0.2"
spec:
  base: "default"
  controller: "Argo CD"
  targetShape: "kind proof rig"
  receipt: "runs/live-helm-confighub-compare/grafana-pyroscope-default/receipt.yaml"
  observedResult: "watch"
  currentSummary:
    regularHelmRuntime: "pass"
    configHubDirectRuntime: "watch"
    configHubOciRuntime: "watch"
    configHubOciSync: "Synced"
    configHubOciHealth: "Progressing"
    semanticParity: "pass"
  passed:
    - "regular Helm reached readiness"
    - "ConfigHub direct apply rendered and applied the same desired object meaning"
    - "ConfigHub OCI/Argo synced the uploaded Units"
    - "semantic object parity passed for direct apply and OCI/Argo"
  watch:
    summary: "The ConfigHub-applied Pyroscope pod stayed Running but not Ready while the regular Helm leg became Ready."
    observedRuntime:
      - "ConfigHub direct apply: pyroscope-0 is 0/1 Running after the readiness wait"
      - "ConfigHub OCI/Argo: pyroscope-0 is 0/1 Running after the readiness wait"
      - "Argo CD reports the workload application Synced but Progressing"
    diagnostics:
      readinessProbe: "GET /ready on port 4040"
      logEvidence:
        - "Metastore not ready: terminated after 50 retries"
        - "component=metastore-client msg=\"no instances available, backoff and retry\""
  diagnosis:
    summary: "This is a runtime namespace-relocation watch row, not a render parity defect."
    interpretation: "The default package preserves chart-internal namespace references to default. In the live parity rig, regular Helm installs into default-helm and rewrites those references consistently, while the installer output creates the target Namespace object but does not relocate every namespace-sensitive value inside the rendered chart output."
    productBoundary: "A supported non-default-namespace Pyroscope base needs an explicit namespace relocation path, or this base should be advertised only for the namespace shape it actually proves."
    nextInvestigation:
      - "Decide whether Pyroscope default should be supported only in namespace default, or whether a new namespace-aware base should be generated."
      - "If namespace relocation is supported, verify service DNS, StatefulSet environment, Role/RoleBinding namespaces, and generated Alloy configuration all move together."
      - "Rerun live parity after the namespace route is modeled."
  evidence:
    configHubDirectLogs: "runs/live-helm-confighub-compare/grafana-pyroscope-default/runtime-diagnostics/confighub-direct-apply/default/pyroscope-0/logs.txt"
    configHubDirectDescribe: "runs/live-helm-confighub-compare/grafana-pyroscope-default/runtime-diagnostics/confighub-direct-apply/default/pyroscope-0/describe.txt"
    configHubOciLogs: "runs/live-helm-confighub-compare/grafana-pyroscope-default/runtime-diagnostics/confighub-oci-argo/default/pyroscope-0/logs.txt"
    configHubOciDescribe: "runs/live-helm-confighub-compare/grafana-pyroscope-default/runtime-diagnostics/confighub-oci-argo/default/pyroscope-0/describe.txt"
    argoCoreChildJson: "runs/live-helm-confighub-compare/grafana-pyroscope-default/argocd-core-child.json"
    argoCoreChildTree: "runs/live-helm-confighub-compare/grafana-pyroscope-default/argocd-core-child-tree.txt"
  notClaimed:
    - "This row does not prove Pyroscope production support."
    - "This row does not prove that namespace relocation is safe for this chart."
    - "This row does not prove that Argo CD aggregate health should be ignored in production."
