apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ChartDossier"
metadata:
  name: "velero-velero-12-0-1"
  labels:
    confighub.io/chart-ref: "velero/velero"
    confighub.io/chart-version: "12.0.1"
    confighub.io/proof-tier: "next80-full"
spec:
  chart: "velero/velero"
  version: "12.0.1"
  maintainedNotes:
    - "velero/velero@12.0.1 renders deterministically under Kubernetes 1.30.0 with hooks and tests excluded."
    - "The default variant is intended as a proof baseline; production promotion still follows scan/gate review."
    - "Chart source contains Helm hooks; the proof revision uses no-hooks so hook lifecycle must be handled separately before production."
    - "Chart source contains generated/random/time helpers; generated values must be captured before approval if activated by a variant."
    - "Chart source contains tpl; raw templating extension slots need explicit ownership and review."
    - "Rendered output includes 13 CRDs; CRD lifecycle must be reviewed before upgrade/promotion."
    - "Rendered output includes cluster-scoped RBAC; production promotion needs RBAC review."
  knownControlPoints:
    - "source-lock"
    - "dependency-lock"
    - "capability-profile"
    - "variant-revision"
    - "rendered-manifest-scan"
    - "helm-equivalence"
    - "generated-facts"
    - "tpl-extension-slots"
    - "lifecycle-policy"
    - "extension-slots"
    - "crds"
    - "cluster-rbac"
    - "secret-material"
  proofFocus: "backup controller, CRDs, cloud credentials"
