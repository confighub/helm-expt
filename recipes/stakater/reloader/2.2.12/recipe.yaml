apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Recipe"
metadata:
  labels:
    confighub.io/chart-ref: "stakater/reloader"
    confighub.io/chart-version: "2.2.12"
    confighub.io/proof-tier: "next80-full"
  name: "stakater-reloader"
  version: "2.2.12"
spec:
  chartRef:
    dependencyLock: "dependency-lock.yaml"
    sourceLock: "source-lock.yaml"
  currentExecutableFixture:
    installerPackage: "packages/stakater/reloader/2.2.12"
    setupCommand:
      - "cub"
      - "installer"
      - "setup"
      - "--pull"
      - "packages/stakater/reloader/2.2.12"
      - "--non-interactive"
      - "--namespace"
      - "default"
  importMode: "render-and-vendor"
  variants:
    - "variants/default/variant.yaml"
    - "variants/controller-default-reviewed/variant.yaml"
