apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Recipe"
metadata:
  name: "bitnami-spark"
  version: "10.0.3"
  labels:
    confighub.io/chart-ref: "bitnami/spark"
    confighub.io/chart-version: "10.0.3"
    confighub.io/proof-tier: "next80-full"
spec:
  chartRef:
    sourceLock: "source-lock.yaml"
    dependencyLock: "dependency-lock.yaml"
  importMode: "render-and-vendor"
  currentExecutableFixture:
    installerPackage: "packages/bitnami/spark/10.0.3"
    setupCommand:
      - "cub"
      - "installer"
      - "setup"
      - "--pull"
      - "packages/bitnami/spark/10.0.3"
      - "--non-interactive"
      - "--namespace"
      - "default"
  variants:
    - "variants/default/variant.yaml"
