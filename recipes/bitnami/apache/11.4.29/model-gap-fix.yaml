apiVersion: helm-expt.confighub.com/v1alpha1
kind: ModelGapFix
metadata:
  name: apache-11.4.29-model-gap-fix
  chart: bitnami/apache
  version: 11.4.29
spec:
  gap_kind: object-set-shape
  bases:
    - base: legacy
      lane: K
      failure_signature: "semantic object parity issue: missing=0 extra=1 diffs=1; extra=v1|Namespace||default; runtime also fails to pull docker.io/bitnami/apache"
      receipt: runs/live-kind-parity/bitnami-apache-legacy/receipt.yaml
  fix_class: applicable-fix-spec
  sibling_base_that_passes: "none"
