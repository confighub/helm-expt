  rerun_command: "npm run kind-parity:run -- --chart bitnami/apache --version 11.4.29 --base legacy --repo-url oci://registry-1.docker.io/bitnamicharts"
  automatic: false
  evidence:
    - runs/live-kind-parity/bitnami-apache-legacy/receipt.yaml
    - recipes/bitnami/apache/11.4.29/image-remediation.yaml
  not_claimed:
