  fix_spec: "Diff the legacy installer render against the regular Helm object set, classify the installer-added default Namespace as allowed normalization when appropriate, then reconcile or explicitly normalize the remaining object diff. Keep the image remediation card separate; this card only covers the model/object-set residue."
