apiVersion: "evidence.confighub.com/v1alpha1"
kind: "FlatteningSafetyVerdict"
metadata:
  name: "bitnami-contour-21.1.4"
spec:
  chart:
    repository: "bitnami"
    name: "contour"
    version: "21.1.4"
    packageSHA256: "dbb32d59417cb5800a337509521cce5ab2d37dac6e72e451190ced31b27986f8"
  witnessRef: "data/flattening-safety/witnesses/bitnami-contour-21.1.4.yaml"
  auditedBase: "default"
  dispositions:
    -
      class: "helm-hooks"
      finding: "present"
      detail: "templates/certgen/job.yaml runs at pre-install and pre-upgrade to mint the TLS material Contour and Envoy use to talk to each other, and no recorded observation exists to route it"
      disposition: "the catalog's observed lifecycle routes cover other charts; nothing here has been watched, so no companion can be named"
      evidence:
        - "templates/certgen/job.yaml:13"
        - "templates/certgen/rbac.yaml:15"
        - "templates/certgen/rbac.yaml:37"
        - "templates/certgen/serviceaccount.yaml:17"
    -
      class: "resource-policy-keep"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "lookup"
      finding: "present-gated"
      detail: "the remaining credential and certificate hits are in the default-backend TLS templates, off in the audited base"
      disposition: "no route needed for the audited base"
      evidence:
        - "charts/common/templates/_secrets.tpl:103"
        - "charts/common/templates/_secrets.tpl:166"
        - "charts/common/templates/_secrets.tpl:188"
    -
