apiVersion: helm-expt.confighub.com/v1alpha1
kind: ImageRemediation
metadata:
  name: contour-21.1.4-image-remediation
  chart: bitnami/contour
  version: 21.1.4
spec:
  residue: remote-image
  semantic_parity: passed
  remediation_class: registry-remap
  recommended: "Remap the removed docker.io/bitnami contour and envoy images to docker.io/bitnamilegacy — Bitnami's documented migration registry for the legacy free images it stopped publishing under docker.io/bitnami in Aug 2025. Verify the exact tags are retained under docker.io/bitnamilegacy and pin their digests. The pre-install certgen hook (contour-contour-certgen) uses one of these images, so the remap also unblocks that hook."
  override_path: "effective-values-legacy.yaml sets contour.image.repository=bitnamilegacy/contour, envoy.image.repository=bitnamilegacy/envoy, and global.security.allowInsecureImages=true. This reproduces the committed legacy render through ordinary Helm values."
  digest_resolution: "The packaged certgen action pins the multi-platform contour manifest at sha256:ab0665888c91c754030d46e7bbaf9a661bd1f16bbbbafcef59ce0fafdba871f1. The workload render still uses the frozen tags and needs production mirror/digest work."
  verify_non_live: "The recorded legacy values render the same contour and envoy image references as the committed legacy base. The strict two-cluster receipt proves both images pull, Helm's hook completes, the packaged action completes, and both workloads become ready."
  bases:
    - base: default
      lane: G/P
      missing_images: "docker.io/bitnami/contour:1.32.1-debian-12-r0; docker.io/bitnami/envoy:1.34.5-debian-12-r0"
      image_location: hook/lifecycle-job
      failure_signature: "remote-image: the pinned image(s) above could not be pulled on the target; the pre-install certgen hook (contour-contour-certgen) fails first with ImagePullBackOff; semantic object parity passed per the live comparison — a registry-retention/override issue, not a ConfigHub object-model defect"
      receipt: runs/live-helm-confighub-compare/bitnami-contour-default/receipt.yaml
      rerun_command: "npm run live-parity:run -- --recipe recipes/bitnami/contour/21.1.4 --base default --repo-url oci://registry-1.docker.io/bitnamicharts"
    - base: no-crds
      lane: G/P
      missing_images: "docker.io/bitnami/contour:1.32.1-debian-12-r0; docker.io/bitnami/envoy:1.34.5-debian-12-r0"
      image_location: hook/lifecycle-job
      failure_signature: "remote-image: the pinned image(s) above could not be pulled on the target; the pre-install certgen hook (contour-contour-certgen) fails first with ImagePullBackOff; semantic object parity passed per the live comparison — a registry-retention/override issue, not a ConfigHub object-model defect"
      receipt: runs/live-helm-confighub-compare/bitnami-contour-no-crds/receipt.yaml
      rerun_command: "npm run live-parity:run -- --recipe recipes/bitnami/contour/21.1.4 --base no-crds --repo-url oci://registry-1.docker.io/bitnamicharts"
  remediated_variant:
    name: legacy
    variant: recipes/bitnami/contour/21.1.4/variants/legacy/variant.yaml
    variant_revision: recipes/bitnami/contour/21.1.4/revisions/legacy/r001/variant-revision.yaml
    rendered_object_set_sha256: "d7df93e9094b4f918f3f97621beb90909c2d8f5a64ab8dc51b8f8dce0c934123"
    lane: K
    result: pass
    receipt: runs/live-kind-parity/bitnami-contour-legacy/receipt.yaml
    historical_local_receipt: runs/next80-local-kind/bitnami-contour-21.1.4-legacy/observation-receipt.yaml
    note: "The legacy values reproduce the image remap in ordinary Helm. On two fresh kind clusters, Helm ran its certgen hook and cub installer ran the packaged equivalent; both images pulled, all 5 CRDs established, both workloads became ready, and semantic object parity passed."
  automatic: false
  evidence:
    - runs/live-helm-confighub-compare/bitnami-contour-default/receipt.yaml
    - runs/live-helm-confighub-compare/bitnami-contour-no-crds/receipt.yaml
    - runs/live-helm-confighub-compare/bitnami-contour-legacy/receipt.yaml
    - runs/live-kind-parity/bitnami-contour-legacy/receipt.yaml
    - data/remote-image-runtime-workdown/workdown.csv
    - data/image-digest-workdown/summary.md
  cross_reference: "recipes/bitnami/contour/21.1.4/model-gap-fix.yaml covers the no-crds CRD set. recipes/bitnami/contour/21.1.4/lifecycle-route.yaml records the now-proven direct certgen action and the remaining Argo/Flux work."
  not_claimed:
    - "The frozen bitnamilegacy repositories receive no new security fixes and are not a production image source."
    - "The workload images are not yet digest-pinned in the legacy base."
    - "This does not prove the no-crds CRD ownership choice or controller-native execution of the certgen action."
