apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ChartDossier"
metadata:
  name: "bitnami-elasticsearch-22-1-6"
  labels:
    confighub.io/chart-ref: "bitnami/elasticsearch"
    confighub.io/chart-version: "22.1.6"
    confighub.io/proof-tier: "next80-full"
spec:
  chart: "bitnami/elasticsearch"
  version: "22.1.6"
  maintainedNotes:
    - "bitnami/elasticsearch@22.1.6 renders deterministically under Kubernetes 1.30.0 with hooks and tests excluded."
    - "The default variant is intended as a proof baseline; production promotion still follows scan/gate review."
    - "Chart source contains Helm hooks; the proof revision uses no-hooks so hook lifecycle must be handled separately before production."
    - "Chart source contains lookup; future variants using lookup paths must bind target facts in the recipe."
    - "Chart source contains generated/random/time helpers; generated values must be captured before approval if activated by a variant."
    - "Chart source contains tpl; raw templating extension slots need explicit ownership and review."
    - "Rendered output has stateful/storage behavior; rollback and upgrade plans must be explicit."
  knownControlPoints:
    - "source-lock"
    - "dependency-lock"
    - "capability-profile"
    - "variant-revision"
    - "rendered-manifest-scan"
    - "helm-equivalence"
    - "target-facts"
    - "generated-facts"
    - "tpl-extension-slots"
    - "lifecycle-policy"
    - "extension-slots"
    - "stateful-storage"
  proofFocus: "stateful search cluster, PVCs, topology"
