      static-passwords: "7/7"
      existing-secret: "6/6"
    scanGate: "warn-production-blocked"
    nextAction: "publish only after generated fact or target fact binding, dependency lock review, StatefulSet/PVC policy, and extension-slot review are satisfied"
  receipts:
    - "revisions/static-passwords/r001/receipts/helm-equivalence-receipt.yaml"
    - "revisions/static-passwords/r001/receipts/render-receipt.yaml"
    - "revisions/static-passwords/r001/receipts/scan-receipt.yaml"
    - "revisions/static-passwords/r001/receipts/install-gate.yaml"
    - "revisions/existing-secret/r001/receipts/helm-equivalence-receipt.yaml"
    - "revisions/existing-secret/r001/receipts/render-receipt.yaml"
    - "revisions/existing-secret/r001/receipts/scan-receipt.yaml"
    - "revisions/existing-secret/r001/receipts/install-gate.yaml"
