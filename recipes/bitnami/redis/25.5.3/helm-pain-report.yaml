      disposition: absorbed-into-recipe
      linkedReceipt: revisions/default/r001/receipts/helm-equivalence-receipt.yaml
      defaultVariantStatus: handled
    - id: mutable-image-tags
      detectedPainPoint: "chart renders mutable latest image tags"
      evidence:
        - revisions/default/r001/receipts/scan-receipt.yaml
      configHubHome: scan-gate
      disposition: handled-by-scan-or-gate
