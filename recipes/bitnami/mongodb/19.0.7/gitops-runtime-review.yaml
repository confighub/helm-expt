apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "GitOpsRuntimeReview"
metadata:
  name: "mongodb-existing-secret-replicaset-argocd-statefulset-sync"
  chart: "bitnami/mongodb"
  version: "19.0.7"
spec:
  base: "existing-secret-replicaset"
  controller: "Argo CD"
  targetShape: "cub-lk/kind proof rig with ConfigHub OCI source and staged mongodb-auth target fact Secret"
  receipt: "runs/live-helm-confighub-compare/bitnami-mongodb-existing-secret-replicaset/receipt.yaml"
  observedResult: "watch"
  passed:
    - "regular Helm live leg reached the expected runtime state"
    - "ConfigHub direct-apply leg reached the expected runtime state"
    - "ConfigHub OCI/Argo leg reached the expected workload runtime state"
    - "Helm-vs-ConfigHub semantic parity passed for the OCI/Argo leg"
    - "target fact Secret mongodb/mongodb-auth was staged with mongodb-root-password and mongodb-replica-set-key"
    - "MongoDB primary/secondary StatefulSet and arbiter StatefulSet became ready"
  gitOpsCondition:
    sync: "OutOfSync"
    health: "Healthy"
    unsyncedResource:
      apiVersion: "apps/v1"
      kind: "StatefulSet"
      namespace: "mongodb-oci"
      name: "mongodb"
  diagnosis:
    summary: "The desired and live MongoDB StatefulSet matched at the workload level, but Argo reported drift on server-defaulted fields and omitted/null-normalized fields after apply."
    observedDefaultedFields:
      - "spec.persistentVolumeClaimRetentionPolicy"
      - "spec.revisionHistoryLimit"
      - "env.valueFrom.fieldRef.apiVersion"
      - "container port protocol defaults"
      - "terminationMessagePath and terminationMessagePolicy"
      - "spec.template.spec.restartPolicy"
      - "spec.template.spec.dnsPolicy"
      - "spec.template.spec.schedulerName"
      - "spec.template.spec.terminationGracePeriodSeconds"
      - "secret defaultMode"
      - "volumeClaimTemplates apiVersion/kind/status/volumeMode defaults"
    observedNormalizedFields:
      - "null nodeAffinity and podAffinity entries were absent in live state"
      - "null subPath entry was absent in live state"
      - "empty supplementalGroups and sysctls entries were absent in live state"
    interpretation: "This is a GitOps/runtime normalization issue to validate, not evidence that the MongoDB recipe or target-fact handling changed Helm semantics."
  nextActions:
    - "Confirm whether Argo CD is comparing Kubernetes-defaulted StatefulSet fields and omitted null/empty values against the pre-apply desired manifest for server-side-applied OCI content."
    - "If confirmed, add a narrow Argo diff-normalization or ignore rule for known StatefulSet defaulting and null-elision in this proof target."
    - "Rerun mongodb/existing-secret-replicaset through the strict live parity lane after the normalization rule is in place."
  notClaimed:
    - "The GitOps row is not a pass until Argo reports Synced or the approved ignore/normalization rule is part of the proof target."
    - "This review does not prove production MongoDB backup, restore, storage class, retention, topology, or upgrade policy."
    - "This review does not generalize to every StatefulSet chart without a matching live receipt."
