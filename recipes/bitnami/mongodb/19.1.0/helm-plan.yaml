    - "revisions/static-passwords/r001/receipts/install-gate.yaml"
    - "revisions/existing-secret-replicaset/r001/receipts/helm-equivalence-receipt.yaml"
    - "revisions/existing-secret-replicaset/r001/receipts/render-receipt.yaml"
    - "revisions/existing-secret-replicaset/r001/receipts/scan-receipt.yaml"
    - "revisions/existing-secret-replicaset/r001/receipts/install-gate.yaml"
