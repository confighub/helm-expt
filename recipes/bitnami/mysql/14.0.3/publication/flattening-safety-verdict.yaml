      values: "auth.existingSecret, the catalog's static-passwords lane"
      effect: "an external Secret reference discharges the credential hazard; that base deserves a fresh verdict and trends flatten-with-routes"
  verdict:
    lane: "unsafe-to-flatten"
    rationale: "The credentials are lookup-or-generate at render time in the shared bitnami secret helpers: the chart reads an existing Secret and mints one when absent. That is the exact construct a public flattened artifact must never freeze, and it is the same finding that decided the audited redis 27.0.0."
  boundedness:
    - "immutable-field changes are a cross-version property; this verdict compares no second version (the CRD upgrade delta lane holds that precedent)"
    - "the scan is static and does not execute templates, so values-gated reachability is a recorded judgment, not a render"
    - "the witness scans the packaged chart including its vendored subcharts; charts pulled at deploy time are out of scope"
  provenance:
