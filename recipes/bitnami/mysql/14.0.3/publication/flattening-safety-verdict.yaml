      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "resource-policy-keep"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "lookup"
      finding: "present"
      detail: "the chart's own credential template calls the shared password-manage helper, which reads an existing Secret from the cluster before deciding whether to mint one"
