apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ValueModel"
metadata:
  name: "prometheus-community-prometheus-operator-crds-28.0.1"
spec:
  checkedValues:
    -
      path: "<chart defaults>"
      variant: "default"
      disposition: "default-render-captured"
      reason: "the exact chart-default render of the locked archive is captured"
    -
      path: "enabled"
      disposition: "left-at-default"
      reason: "The AICR values set enabled: true. The chart's values.yaml has no such key and no template reads it, so it changes nothing."
      note: "the aicr-eks-training base equals the default base object for object, and the proof checks that"
      evidence: "values.yaml, charts/crds/templates"
    -
      path: "crds.<name>.enabled"
      disposition: "left-at-default"
      reason: "Every CRD is on by chart default and in every base."
      evidence: "charts/crds/values.yaml"
    -
      path: "<aicr-eks-training values>"
      variant: "aicr-eks-training"
      disposition: "variant-axis"
      reason: "the values the AICR v0.20.0 and AICR v1.0.0 EKS training entries supply (examples/aicr/eks-h100-training-kubeflow-v0-20-0/argocd-helm-bundle/007-prometheus-operator-crds/values.yaml and examples/aicr/eks-h100-training-kubeflow-v1-0-0/argocd-helm-bundle/007-prometheus-operator-crds/values.yaml): one key, enabled: true, which the chart does not read, so the render equals the default base"
      note: "renders the same objects as the default base; the proof checks that no object is added, removed or changed"
  unknownValues: "not-exhaustively-checked-by-aicr-nested-charts-coverage-proof"
  deadValues: "not-exhaustively-checked-by-aicr-nested-charts-coverage-proof"
  ignoredValues: "not-exhaustively-checked-by-aicr-nested-charts-coverage-proof"
