apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ChartDossier"
metadata:
  name: "prometheus-community-prometheus-operator-crds-28.0.1"
spec:
  chart: "prometheus-community/prometheus-operator-crds"
  version: "28.0.1"
  caveats:
    - "This entry installs no operator. The CRDs do nothing until a Prometheus Operator runs."
    - "Deleting the delivered objects deletes the CRDs and with them every ServiceMonitor, PrometheusRule and other custom resource of these kinds in the cluster."
    - "The CRDs are large. Client-side kubectl apply can exceed the last-applied annotation limit, so the target facts ask for server-side apply."
  maintainedNotes:
    - "This package is the exact prometheus-operator-crds@28.0.1 chart, locked by archive URL and SHA-256."
    - "With chart defaults prometheus-operator-crds@28.0.1 renders 10 objects: the ten monitoring.coreos.com CRDs of Prometheus Operator v0.90.1, from the templates of its crds subchart. It renders nothing else: no workload, no RBAC, no Secret and no Helm hook."
    - "The CRDs are cluster-scoped, so the release namespace changes no object. The bases use monitoring, the namespace the AICR entries use."
    - "The aicr-eks-training base renders 10 objects with the values the AICR v0.20.0 and AICR v1.0.0 EKS training entries supply (examples/aicr/eks-h100-training-kubeflow-v0-20-0/argocd-helm-bundle/007-prometheus-operator-crds/values.yaml and examples/aicr/eks-h100-training-kubeflow-v1-0-0/argocd-helm-bundle/007-prometheus-operator-crds/values.yaml): one key, enabled: true, which the chart does not read, so the render equals the default base. Its objects equal the AICR v0.20.0 nested render of the same archive, object for object. The AICR v1.0.0 entry retains these values and no render of this component, so this base is bound to the bundle's checksum list and its Application pin and is not compared with an AICR render."
    - "The packaged Chart.lock lists one dependency, the crds subchart vendored in the archive with an empty repository."
    - "The AICR entries install this chart before kube-prometheus-stack 84.4.0 and set crds.enabled false there, so these are the CRDs that stack uses."
    - "The retained root proves exact source bytes, deterministic rendering, and deterministic ConfigHub installer packaging. It does not claim publication, live convergence, or production support."
  knownControlPoints:
    - "source-lock"
    - "dependency-lock"
    - "capability-profile"
    - "target-facts"
    - "production-readiness-review"
