      reason: "cluster-metrics-readonly is a values-profile rerender; this Helm value is pinned in effective-values-cluster-metrics-readonly.yaml and digest-bound by the variant revision."
    -
      path: "prometheus.monitor.additionalLabels"
      variant: "cluster-metrics-readonly"
      disposition: "required-render-input-modeled"
      reason: "cluster-metrics-readonly is a values-profile rerender; this Helm value is pinned in effective-values-cluster-metrics-readonly.yaml and digest-bound by the variant revision."
  deadValues: "not-exhaustively-checked-in-next80-lane"
  ignoredValues: "not-exhaustively-checked-in-next80-lane"
  sourceFeatureSignals:
    hasExtensionSlots: true
    usesCapabilities: true
    usesGeneratedFacts: true
    usesLookup: false
    usesTpl: true
  unknownValues: "not-exhaustively-checked-in-next80-lane"
