apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ValueModel"
metadata:
  name: "prometheus-community-prometheus-blackbox-exporter-11.18.0"
spec:
  checkedValues:
    -
      path: "<chart defaults>"
      variant: "default"
      disposition: "default-render-captured"
      reason: "the exact Kubara 3.0-selected chart default render is captured"
  unknownValues: "not-exhaustively-checked-by-kubara-3-0-coverage-proof"
  deadValues: "not-exhaustively-checked-by-kubara-3-0-coverage-proof"
  ignoredValues: "not-exhaustively-checked-by-kubara-3-0-coverage-proof"
