apiVersion: helm-expt.confighub.com/v1alpha1
kind: ModelGapFix
metadata:
  name: kube-prometheus-stack-86.1.0-model-gap-fix
  chart: prometheus-community/kube-prometheus-stack
  version: 86.1.0
spec:
  gap_kind: crd-lifecycle
  bases:
    - base: default
      lane: K
      failure_signature: "semantic object parity issue: missing=0 extra=11 diffs=0; extra Prometheus Operator CRDs are present in the installer-applied set"
      receipt: runs/live-kind-parity/prometheus-community-kube-prometheus-stack-default/receipt.yaml
  fix_class: base-scope-decision
  sibling_base_that_passes: "no-crds (K pass)"
  decision: "Use no-crds when the platform owns the Prometheus Operator CRDs. The public package now carries the version-specific CRDs and admission Jobs, and the no-crds path has a live 85.3.3 to 86.1.0 Argo CD and Flux upgrade receipt. The default base still needs a fresh strict K-lane run through its packaged lifecycle route before that lane can be marked pass."
  fix_spec: "Keep CRD ownership explicit. The default base owns the ten CRDs and must apply them before dependent objects. The no-crds base leaves them to the platform. Both bases carry the same chart-specific certificate and webhook patch steps."
  verify_non_live: "Verify the versioned package lifecycle receipt, render both bases, and compare their Prometheus Operator CRD sets before selecting a support route."
  rerun_command: "npm run kind-parity:run -- --chart prometheus-community/kube-prometheus-stack --version 86.1.0 --base default"
  automatic: false
  evidence:
    - runs/live-kind-parity/prometheus-community-kube-prometheus-stack-default/receipt.yaml
    - runs/live-kind-parity/prometheus-community-kube-prometheus-stack-no-crds-86-1-0/receipt.yaml
    - runs/kps-gitops-lifecycle-proof/receipt.yaml
    - config-catalog/package-extras/prometheus-community/kube-prometheus-stack/86.1.0/generation-receipt.yaml
  not_claimed:
    - "This card does not mark the default strict K cell as passing."
    - "The controller receipt proves the no-crds upgrade route, not every target or values profile."
