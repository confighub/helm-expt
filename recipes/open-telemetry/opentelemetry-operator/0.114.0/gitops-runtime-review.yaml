apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "GitOpsRuntimeReview"
metadata:
  name: "opentelemetry-operator-no-crds-cert-manager-pass"
  chart: "open-telemetry/opentelemetry-operator"
  version: "0.114.0"
spec:
  base: "no-crds"
  controller: "Argo CD"
  targetShape: "cub-managed kind proof cluster with target profile kind-cert-manager"
  receipt: "runs/live-helm-confighub-compare/open-telemetry-opentelemetry-operator-no-crds/receipt.yaml"
  observedResult: "pass"
  targetProfile:
    name: "kind-cert-manager"
    sourcePackage: "jetstack/cert-manager@v1.20.2"
    sourceBase: "crds-enabled"
    provides:
      - "the six cert-manager CRDs"
      - "the cert-manager, cainjector, and webhook controllers"
      - "a controller that reconciles the chart's Issuer and Certificate"
  currentSummary:
    regularHelmRuntime: "pass"
    configHubDirectRuntime: "pass"
    configHubOciSync: "Synced"
    configHubOciHealth: "Healthy"
    semanticParity: "pass"
  passed:
    - "regular Helm reached readiness"
    - "ConfigHub direct apply reached readiness"
    - "ConfigHub published the workload Space and cluster Space as OCI releases"
    - "ConfigHub OCI/Argo synced all rendered Units and reported Healthy"
    - "the OpenTelemetry Operator Deployment reached readiness"
    - "the chart's Issuer and Certificate were reconciled by cert-manager"
    - "semantic object parity passed with zero object diffs for direct apply and OCI/Argo"
  previousObservation:
    base: "default"
    receipt: "runs/live-helm-confighub-compare/open-telemetry-opentelemetry-operator-default/receipt.yaml"
    result: "watch"
    detail: "On a plain kind target without a cert-manager controller, the operator ran but Argo remained Progressing because the chart's Certificate was never reconciled."
  diagnosis:
    summary: "The earlier watch was caused by a missing target prerequisite, not by a render difference."
    interpretation: "Use the no-crds preset when the platform owns both cert-manager and the OpenTelemetry CRDs. Install and verify those controllers and CRDs first; the operator can then be delivered by Helm, direct apply, or ConfigHub OCI through Argo."
  nextActions:
    - "Use a target profile with a working cert-manager controller whenever the chart manages its webhook certificate through cert-manager."
    - "Keep the OpenTelemetry CRDs under explicit platform ownership when using the no-crds preset."
    - "Replace the local kind profile with evidence from the real target's cert-manager, certificate policy, and CRD lifecycle before making a production claim."
  evidence:
    argoCoreChildJson: "runs/live-helm-confighub-compare/open-telemetry-opentelemetry-operator-no-crds/argocd-core-child.json"
    argoCoreChildTree: "runs/live-helm-confighub-compare/open-telemetry-opentelemetry-operator-no-crds/argocd-core-child-tree.txt"
    argoCoreRootJson: "runs/live-helm-confighub-compare/open-telemetry-opentelemetry-operator-no-crds/argocd-core-root.json"
    argoCoreRootTree: "runs/live-helm-confighub-compare/open-telemetry-opentelemetry-operator-no-crds/argocd-core-root-tree.txt"
  notClaimed:
