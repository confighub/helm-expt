apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Variant"
metadata:
  name: "default"
  labels:
    confighub.io/chart-ref: "open-telemetry/opentelemetry-operator"
    confighub.io/chart-version: "0.114.0"
    confighub.io/proof-tier: "next80-full"
    confighub.io/variant: "default"
spec:
  recipe: "../../recipe.yaml"
  namespace: "default"
  releaseName: "opentelemetry-operator"
  valuesProfile: "../../effective-values.yaml"
  capabilityProfile:
    kubeVersion: "1.30.0"
    apiVersions:
      []
  hookPolicy: "no-hooks"
  targetFacts:
    requiredCRDs:
      -
        name: "certificates.cert-manager.io"
        sourceVariant: "cert-manager"
        purpose: "cert-manager Certificate CRD required by the chart-rendered serving certificate object"
        suggestedSource: "Install cert-manager or apply the cert-manager Certificate CRD before applying this base"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
      -
        name: "issuers.cert-manager.io"
        sourceVariant: "cert-manager"
        purpose: "cert-manager Issuer CRD required by the chart-rendered self-signed issuer object"
        suggestedSource: "Install cert-manager or apply the cert-manager Issuer CRD before applying this base"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
