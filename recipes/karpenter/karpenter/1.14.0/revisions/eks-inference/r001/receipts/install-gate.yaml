  renderedObjectSetSHA256: "27259c2a0af970cd3b87623fa209ccd9d1e37dec693f1d6b0f0bc904958db64c"
  decision: "blocked"
  allowedScopes:
    - "local-test"
  blockedScopes:
    - "staging"
