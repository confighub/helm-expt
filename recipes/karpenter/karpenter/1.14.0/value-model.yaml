apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ValueModel"
metadata:
  name: "karpenter-karpenter-1.14.0"
spec:
  checkedValues:
    -
      path: "settings.clusterName"
      variant: "default"
      disposition: "environment-owned-placeholder"
      reason: "required with no chart default; the deployment template wraps it in a required guard and the chart refuses to render without it, so the default base carries the confighubplaceholder sentinel"
    -
      path: "controller.env"
      variant: "eks-inference"
      disposition: "environment-owned-placeholder"
      reason: "the chart supplies no AWS_REGION; under EKS Pod Identity the IMDS fallback is unreachable and the controller panics on startup, so the eks bases inject it as a placeholder env entry (crds-managed shares this)"
    -
      path: "settings.interruptionQueue"
      variant: "eks-inference"
      disposition: "deliberately-empty"
      reason: "optional; empty string disables interruption handling and the INTERRUPTION_QUEUE env is simply not rendered. The eks bases leave it deliberately empty to avoid pulling SQS and EventBridge into the platform"
    -
      path: "replicas"
      variant: "eks-inference"
      disposition: "target-fit-override"
      reason: "chart defaults to 2 combined with required pod anti-affinity, which needs two schedulable non-Karpenter nodes; the eks bases set 1 to fit a two-node system nodegroup that also hosts CoreDNS"
    -
      path: "serviceAccount.name"
      variant: "eks-inference"
      disposition: "load-bearing-identity"
      reason: "default is a generated fullname; the eks bases pin it to karpenter because it must match the PodIdentityAssociation, and renaming it silently removes AWS credentials from the controller"
    -
      path: "affinity"
      variant: "all"
      disposition: "chart-default-kept"
      reason: "the default node affinity requires karpenter.sh/nodepool DoesNotExist, forbidding scheduling onto Karpenter-provisioned nodes, so the controller always needs a pre-existing nodegroup; all three bases keep the default"
    -
      path: "serviceMonitor.enabled"
      variant: "all"
      disposition: "gated-off-in-audited-renders"
      reason: "false by default, and the template additionally gates on a monitoring.coreos.com/v1 capability check; all audited renders pin kubeVersion 1.31.0 with no extra api-versions, so the guard stays closed"
    -
      path: "controller.image"
      variant: "all"
      disposition: "chart-default-digest-pinned"
      reason: "single controller image, digest-pinned in chart defaults; the render carries the tag and the sha256 digest together"
    -
      path: "controller.resources"
      variant: "eks-inference"
      disposition: "target-fit-override"
      reason: "empty by default; the eks bases set cpu 200m request and 512Mi request and limit to make the controller schedulable and bounded on the small system nodegroup"
    -
      path: "settings.featureGates"
      variant: "all"
      disposition: "chart-default-kept"
      reason: "six gates render into one FEATURE_GATES env string; only reservedCapacity is on by default and all bases keep chart defaults"
    -
      path: "priorityClassName"
      variant: "all"
      disposition: "chart-default-kept"
      reason: "defaults to system-cluster-critical, which only resolves in a cluster that grants that priority class, consistent with the kube-system namespace placement"
    -
      path: "hostNetwork"
      variant: "all"
      disposition: "not-exercised"
      reason: "false by default; the chart comments it is required when using a custom CNI. Not exercised by any audited base"
  unknownValues: "extraVolumes, controller.sidecarContainer, additionalClusterRoleRules, initContainers, dnsConfig, logOutputPaths, and the remaining settings.* are not exhaustively checked; no audited base sets them"
  deadValues: "not-checked"
  ignoredValues: "not-checked"
