---
# Source: surveyor/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: surveyor
  labels:
    helm.sh/chart: surveyor-0.20.9
    app.kubernetes.io/name: surveyor
    app.kubernetes.io/instance: surveyor
    app.kubernetes.io/version: "0.9.9"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: surveyor
      app.kubernetes.io/instance: surveyor
  template:
    metadata:
      labels:
        helm.sh/chart: surveyor-0.20.9
        app.kubernetes.io/name: surveyor
        app.kubernetes.io/instance: surveyor
        app.kubernetes.io/version: "0.9.9"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: surveyor
      securityContext:
        {}
      containers:
        - name: surveyor
          securityContext:
            {}
          image: natsio/nats-surveyor:0.9.9
          imagePullPolicy: IfNotPresent
          args:
            - -p
            - "7777"
            - -s=nats://nats:4222
            - --timeout=3s
            - -c=1
          ports:
            - name: http
              containerPort: 7777
              protocol: TCP
          env:
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:

          resources:
            {}
      volumes:
