apiVersion: v1
kind: Service
metadata:
  name: surveyor
  labels:
    helm.sh/chart: surveyor-0.20.9
    app.kubernetes.io/name: surveyor
    app.kubernetes.io/instance: surveyor
    app.kubernetes.io/version: "0.9.9"
