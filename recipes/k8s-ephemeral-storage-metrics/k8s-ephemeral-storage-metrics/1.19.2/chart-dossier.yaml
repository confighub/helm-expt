  version: "1.19.2"
  caveats:
    - "The ClusterRole lets the pod read node stats through the API server's node proxy for every node."
    - "Whether a Prometheus scrapes the ServiceMonitor depends on that Prometheus's selectors. The AICR values label it for a release named kube-prometheus-stack; chart defaults label it for kube-prometheus-stack as well."
  maintainedNotes:
    - "This package is the exact k8s-ephemeral-storage-metrics@1.19.2 chart, locked by archive URL and SHA-256."
    - "With chart defaults k8s-ephemeral-storage-metrics@1.19.2 renders 6 objects as release k8s-ephemeral-storage-metrics in namespace monitoring, the names the AICR entries use: a Deployment, a ServiceAccount, a ClusterRole, a ClusterRoleBinding, a Service and a ServiceMonitor. It renders no CRD, no Secret and no Helm hook."
    - "The aicr-eks-training-v0-20-0 base renders 6 objects with the values the AICR v0.20.0 EKS training entry supplies (examples/aicr/eks-h100-training-kubeflow-v0-20-0/argocd-helm-bundle/010-k8s-ephemeral-storage-metrics/values.yaml): the ServiceMonitor labelled for the kube-prometheus-stack release, seven metrics named, and the pod tolerating every taint. Its objects equal the AICR v0.20.0 nested render of the same archive, object for object."
    - "The aicr-eks-training-v1-0-0 base renders 6 objects with the values the AICR v1.0.0 EKS training entry supplies (examples/aicr/eks-h100-training-kubeflow-v1-0-0/argocd-helm-bundle/010-k8s-ephemeral-storage-metrics/values.yaml): the v0.20.0 values with the pod also selected onto the system-worker node group. The AICR v1.0.0 entry retains these values and no render of this component, so this base is bound to the bundle's checksum list and its Application pin and is not compared with an AICR render."
    - "The chart contains no lookup, no .Capabilities branch, no generated credential, no keep annotation, no webhook, no Namespace template and no subchart."
    - "The chart is published by a single maintainer under the MIT licence. Its Chart.yaml states the licence in an Artifact Hub annotation."
    - "The retained root proves exact source bytes, deterministic rendering, and deterministic ConfigHub installer packaging. It does not claim publication, live convergence, or production support."
  knownControlPoints:
