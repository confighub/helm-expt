spec:
  chart:
    repository: "minio-operator"
    name: "tenant"
    version: "7.1.1"
    packageSHA256: "931dfbbf19871ffd687b4eca1ed23b977928b52fc9710bb3250cb381716fc0ea"
  witnessRef: "data/flattening-safety/witnesses/minio-operator-tenant-7.1.1.yaml"
  auditedBase: "default"
  dispositions:
    -
      class: "helm-hooks"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "resource-policy-keep"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "lookup"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "webhook-ca"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "capabilities-api-versions"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "generated-secrets"
      finding: "present"
      detail: "the rendered configuration Secret carries MINIO_ROOT_USER and MINIO_ROOT_PASSWORD as literal values from the chart's defaults"
      disposition: "a flattened bundle would publish a working root credential in bytes that read as certified"
    -
      class: "crd-ordering"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "immutable-fields"
      finding: "not-evaluated"
      detail: "cross-version property; see boundedness"
      disposition: "versioned replacement route when an upgrade pair is audited"
    -
      class: "namespace-creation"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "subchart-conditions"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "test-hooks"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
  variantScope:
    -
      values: "a configuration Secret supplied from outside the render"
      effect: "removes the credential from the bytes; that base trends flatten-with-routes with an external secret reference"
  verdict:
    lane: "do-not-flatten"
    rationale: "The audited base writes the tenant's root credential into the rendered bytes as a literal value. That is worse than a generated one: every consumer of a published bundle would get the same known root password, from an artifact whose whole point is that it can be trusted. The installer package is this chart's certified route, because it renders at install time where the value can be replaced without republishing anything."
  boundedness:
    - "immutable-field changes are a cross-version property; this verdict compares no second version (the CRD upgrade delta lane holds that precedent)"
    - "the scan is static and does not execute templates, so values-gated reachability is a recorded judgment, not a render"
    - "the witness scans the packaged chart including its vendored subcharts; charts pulled at deploy time are out of scope"
  provenance:
    emittedBy: "scripts/generate-flattening-safety-verdicts.mjs"
    generatedFrom:
      - "data/flattening-safety/witnesses/minio-operator-tenant-7.1.1.yaml"
      - "recipes/minio-operator/tenant/7.1.1/source-lock.yaml"
