apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Variant"
metadata:
  name: "default"
  labels:
    confighub.io/chart-ref: "minio-operator/tenant"
    confighub.io/chart-version: "7.1.1"
    confighub.io/proof-tier: "next80-full"
    confighub.io/variant: "default"
spec:
  recipe: "../../recipe.yaml"
  namespace: "default"
  releaseName: "tenant"
  valuesProfile: "../../effective-values.yaml"
  capabilityProfile:
    kubeVersion: "1.30.0"
    apiVersions:
      []
  hookPolicy: "no-hooks"
  targetFacts:
    requiredCRDs:
      -
        name: "tenants.minio.min.io"
        sourcePath: "../../operator/7.1.1/revisions/default/r001/rendered/release-objects.yaml"
        sourceVariant: "minio-operator/operator@7.1.1/default"
        purpose: "MinIO Tenant CRD required before tenant custom resources can be applied"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
