apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ControlPoints"
metadata:
  name: "metrics-server-metrics-server-3.13.0"
spec:
  points:
    -
      category: "source-lock"
      status: "handled"
      evidence: "source-lock.yaml"
    -
      category: "dependency-lock"
      status: "handled"
      evidence: "dependency-lock.yaml"
      note: "chart has no subchart dependencies"
    -
      category: "generated-facts"
      status: "avoided-by-current-variants"
      evidence: "variants/default/variant.yaml and variants/external-tls-ca/variant.yaml"
      note: "tls.type=helm would use genSelfSignedCert and lookup; the supported bases avoid that path. default uses runtime certificate behavior, and external-tls-ca uses an explicit target Secret."
    -
      category: "target-facts"
      status: "required-for-external-tls-ca"
      evidence: "variants/external-tls-ca/variant.yaml"
      required:
        -
          kind: "Secret"
          namespace: "kube-system"
          name: "metrics-server-tls"
          keys:
            - "tls.crt"
            - "tls.key"
    -
      category: "lookup"
      status: "avoided"
      note: "external-tls-ca sets tls.existingSecret.lookup=false; default keeps lookup path inactive"
    -
      category: "capability-profile"
      status: "handled"
      kubeVersion: "1.30.0"
    -
      category: "hook-policy"
      status: "handled"
      policy: "no-hooks"
    -
      category: "apiservice"
      status: "observed-for-default-target-review-required"
      object: "apiregistration.k8s.io/v1|APIService||v1beta1.metrics.k8s.io"
      evidence: "runs/live-helm-confighub-compare/metrics-server-metrics-server-default/receipt.yaml and runs/derived-variant-target-bound/metrics-server-prod-us-east/receipt.yaml"
    -
      category: "cluster-rbac"
      status: "disposition-accepted-for-production-review-input"
      evidence: "data/production-disposition/receipts/metrics-server-metrics-server/cluster-rbac-review.yaml"
    -
      category: "installer-support-object"
      status: "handled"
      object: "v1|Namespace||kube-system"
