apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ValueModel"
metadata:
  name: "node-feature-discovery-node-feature-discovery-0.19.0"
spec:
  checkedValues:
    -
      path: "<chart defaults>"
      variant: "default"
      disposition: "default-render-captured"
      reason: "the exact chart-default render of the locked archive is captured"
    -
      path: "topologyUpdater.enable / topologyUpdater.createCRDs"
      disposition: "variant-axis"
      reason: "Both false by chart default. The AICR values turn both on, which adds the topology updater DaemonSet, its ServiceAccount, ClusterRole, ClusterRoleBinding and ConfigMap, and the NodeResourceTopology CRD."
      note: "the two AICR bases hold those six objects; the default base does not"
      evidence: "templates/topologyupdater.yaml, templates/topologyupdater-crds.yaml, templates/clusterrole.yaml, values.yaml topologyUpdater"
    -
      path: "postDeleteCleanup"
      disposition: "left-at-default"
      reason: "True by chart default and in every base. It renders a post-delete hook: a Job that removes the labels, annotations, taints and extended resources NFD put on nodes, with its ServiceAccount, ClusterRole and ClusterRoleBinding."
      note: "packaged as a recorded lifecycle action, not automatic and not run"
      evidence: "templates/post-delete-job.yaml"
    -
      path: "<aicr-eks-training-v0-20-0 values>"
      variant: "aicr-eks-training-v0-20-0"
      disposition: "variant-axis"
      reason: "the values the AICR v0.20.0 EKS training entry supplies (examples/aicr/eks-h100-training-kubeflow-v0-20-0/argocd-helm-bundle/004-nfd/values.yaml): the topology updater on with its CRD and resource requests and limits, and the master, worker, garbage collector and topology updater tolerating every taint"
      note: "differs from the default base by adding apiextensions.k8s.io/v1|CustomResourceDefinition||noderesourcetopologies.topology.node.k8s.io, apps/v1|DaemonSet|node-feature-discovery|nfd-node-feature-discovery-topology-updater, rbac.authorization.k8s.io/v1|ClusterRoleBinding||nfd-node-feature-discovery-topology-updater, rbac.authorization.k8s.io/v1|ClusterRole||nfd-node-feature-discovery-topology-updater, v1|ConfigMap|node-feature-discovery|nfd-node-feature-discovery-topology-updater-conf, v1|ServiceAccount|node-feature-discovery|nfd-node-feature-discovery-topology-updater and by the fields those values reach; the proof checks the removed and added sets"
    -
      path: "<aicr-eks-training-v1-0-0 values>"
      variant: "aicr-eks-training-v1-0-0"
      disposition: "variant-axis"
      reason: "the values the AICR v1.0.0 EKS training entry supplies (examples/aicr/eks-h100-training-kubeflow-v1-0-0/argocd-helm-bundle/004-nfd/values.yaml): the v0.20.0 values with the master and the garbage collector also selected onto the system-worker node group"
      note: "differs from the default base by adding apiextensions.k8s.io/v1|CustomResourceDefinition||noderesourcetopologies.topology.node.k8s.io, apps/v1|DaemonSet|node-feature-discovery|nfd-node-feature-discovery-topology-updater, rbac.authorization.k8s.io/v1|ClusterRoleBinding||nfd-node-feature-discovery-topology-updater, rbac.authorization.k8s.io/v1|ClusterRole||nfd-node-feature-discovery-topology-updater, v1|ConfigMap|node-feature-discovery|nfd-node-feature-discovery-topology-updater-conf, v1|ServiceAccount|node-feature-discovery|nfd-node-feature-discovery-topology-updater and by the fields those values reach; the proof checks the removed and added sets"
  unknownValues: "not-exhaustively-checked-by-aicr-nested-charts-coverage-proof"
  deadValues: "not-exhaustively-checked-by-aicr-nested-charts-coverage-proof"
  ignoredValues: "not-exhaustively-checked-by-aicr-nested-charts-coverage-proof"
