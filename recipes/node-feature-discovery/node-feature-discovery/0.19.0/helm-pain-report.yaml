  notes:
    - "This package is the exact node-feature-discovery@0.19.0 chart, locked by archive URL and SHA-256."
    - "With chart defaults node-feature-discovery@0.19.0 renders 17 objects as release nfd in namespace node-feature-discovery, the names the AICR entries use: three CRDs from the chart's crds directory, the master Deployment, the worker DaemonSet, the garbage collector Deployment, three ServiceAccounts, two ConfigMaps and RBAC. It renders no Secret and no webhook configuration."
    - "The same values also render four post-delete Helm hook objects that no base holds: the prune Job with its ServiceAccount, ClusterRole and ClusterRoleBinding. They are packaged under prerequisites/node-feature-discovery-lifecycle with a lifecycle-actions.yaml record. Nothing runs them automatically and none has been run on a cluster."
    - "The aicr-eks-training-v0-20-0 base renders 23 objects with the values the AICR v0.20.0 EKS training entry supplies (examples/aicr/eks-h100-training-kubeflow-v0-20-0/argocd-helm-bundle/004-nfd/values.yaml): the topology updater on with its CRD and resource requests and limits, and the master, worker, garbage collector and topology updater tolerating every taint. Its objects equal the AICR v0.20.0 nested render of the same archive, object for object, once the 4 Helm hook objects that render also holds are set aside."
    - "The aicr-eks-training-v1-0-0 base renders 23 objects with the values the AICR v1.0.0 EKS training entry supplies (examples/aicr/eks-h100-training-kubeflow-v1-0-0/argocd-helm-bundle/004-nfd/values.yaml): the v0.20.0 values with the master and the garbage collector also selected onto the system-worker node group. The AICR v1.0.0 entry retains these values and no render of this component, so this base is bound to the bundle's checksum list and its Application pin and is not compared with an AICR render."
    - "The chart contains no lookup, no .Capabilities branch, no generated credential, no keep annotation, no Namespace template and no subchart."
    - "The gpu-operator chart vendors this chart as a subchart. A cluster that takes the gpu-operator default base already runs node-feature-discovery; this entry is for running it separately, as the AICR entries do with the gpu-operator's own copy turned off."
    - "The retained root proves exact source bytes, deterministic rendering, and deterministic ConfigHub installer packaging. It does not claim publication, live convergence, or production support."
