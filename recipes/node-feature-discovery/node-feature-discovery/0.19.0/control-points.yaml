apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ControlPoints"
metadata:
  name: "node-feature-discovery-node-feature-discovery-0.19.0"
spec:
  points:
    -
      category: "source-lock"
      status: "handled"
      evidence: "source-lock.yaml"
    -
      category: "dependency-lock"
      status: "handled"
      evidence: "dependency-lock.yaml"
      dependencyCount: 0
    -
      category: "capability-profile"
      status: "handled"
      kubeVersion: "1.31.0"
    -
      category: "lifecycle-policy"
      status: "attention-required"
      policy: "no-hooks"
      note: "the bases are rendered with --no-hooks; every base's values also render 4 post-delete Helm hook objects. They are packaged under prerequisites/node-feature-discovery-lifecycle with a lifecycle-actions.yaml record, and nothing runs them automatically. No hook has been run on a cluster for this entry."
    -
      category: "crd-lifecycle"
      status: "review-required"
      count: 3
    -
      category: "target-facts"
      status: "review-required"
      note: "the CRDs must be established before the master and the workers start; the four post-delete hook objects are a packaged lifecycle action, not part of the base"
    -
      category: "catalog-coverage"
      status: "packaged-with-controls"
      note: "exact source and deterministic package are retained; publication, live qualification and production support remain separate gates"
