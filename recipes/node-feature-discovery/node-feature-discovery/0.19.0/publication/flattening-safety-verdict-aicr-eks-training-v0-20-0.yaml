  verdict:
    lane: "flatten-with-routes"
    rationale: "Hand read of the chart against this base's render, as release nfd in namespace node-feature-discovery. The packaged chart has no lookup, no capability branch, no generated value, no keep annotation, no webhook, no Namespace template and no subchart, and the render agrees: no Secret and no Job. Nothing is decided at render time. What flattening drops is the four post-delete hook objects, and what it needs is the CRDs applied before the master and the workers start. The namespace is named on the namespaced objects and no Namespace object is rendered, so it must exist before the base is applied. The worker (and the topology updater, where it renders) reads the host through hostPath mounts; that is the chart's design and moves no flattening finding. This base uses the values the AICR v0.20.0 EKS training entry supplies. Against the default base it adds the topology updater (a DaemonSet, a ServiceAccount, a ClusterRole, a ClusterRoleBinding, a ConfigMap and the noderesourcetopologies CRD, which comes from a chart template and not from the crds directory), gives the worker and the garbage collector a tolerate-everything toleration and gives the master the same in place of the control-plane toleration. The base renders 23 objects."
