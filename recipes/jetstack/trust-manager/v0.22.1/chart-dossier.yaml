apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ChartDossier"
metadata:
  name: "jetstack-trust-manager-v0-22-1"
  labels:
    confighub.io/chart-ref: "jetstack/trust-manager"
    confighub.io/chart-version: "v0.22.1"
    confighub.io/proof-tier: "next80-full"
spec:
  chart: "jetstack/trust-manager"
  version: "v0.22.1"
  maintainedNotes:
    - "jetstack/trust-manager@v0.22.1 renders deterministically under Kubernetes 1.30.0 with hooks and tests excluded."
    - "The default variant is intended as a proof baseline; production promotion still follows scan/gate review."
    - "Chart source contains generated/random/time helpers; generated values must be captured before approval if activated by a variant."
    - "Chart source contains tpl; raw templating extension slots need explicit ownership and review."
    - "Rendered output includes 1 CRDs; CRD lifecycle must be reviewed before upgrade/promotion."
    - "Rendered output includes cluster-scoped RBAC; production promotion needs RBAC review."
    - "Rendered output includes admission webhooks; live readiness/certificate observations are required after apply."
  knownControlPoints:
    - "source-lock"
    - "dependency-lock"
    - "capability-profile"
    - "variant-revision"
    - "rendered-manifest-scan"
    - "helm-equivalence"
    - "generated-facts"
    - "tpl-extension-slots"
    - "extension-slots"
    - "crds"
    - "cluster-rbac"
    - "webhooks"
  proofFocus: "trust bundle controller, CRDs, RBAC"
