apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Variant"
metadata:
  name: "default"
  labels:
    confighub.io/chart-ref: "kyverno/kyverno-policies"
    confighub.io/chart-version: "3.8.0"
    confighub.io/proof-tier: "next80-full"
    confighub.io/variant: "default"
spec:
  recipe: "../../recipe.yaml"
  namespace: "default"
  releaseName: "kyverno-policies"
  valuesProfile: "../../effective-values.yaml"
  capabilityProfile:
    kubeVersion: "1.30.0"
    apiVersions:
      []
  hookPolicy: "no-hooks"
  targetFacts:
    requiredCRDs:
      -
        name: "clusterpolicies.kyverno.io"
        sourcePath: "../../kyverno/3.8.1/revisions/default/r001/rendered/release-objects.yaml"
        sourceVariant: "kyverno/kyverno@3.8.1/default"
        purpose: "Kyverno ClusterPolicy CRD required before kyverno-policies ClusterPolicy objects can be applied"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
