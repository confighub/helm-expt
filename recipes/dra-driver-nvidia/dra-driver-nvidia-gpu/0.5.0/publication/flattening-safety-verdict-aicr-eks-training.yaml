  variantScope:
    -
      values: "gpuResourcesEnabledOverride true with resources.gpus.enabled true (the gpu-resources base)"
      effect: "adds three DeviceClass objects for GPUs, MIG devices and VFIO GPUs and changes the kubelet plugin DaemonSet; the driver must then not share a node with the standard GPU device plugin"
    -
      values: "resourceApiVersion set"
      effect: "the DeviceClass objects render at that resource.k8s.io version instead of v1; the finding set does not move"
    -
      values: "webhook.enabled true"
      effect: "adds a ValidatingWebhookConfiguration, a webhook Deployment and Service, and either cert-manager objects or a Secret reference; that base needs its own verdict"
  verdict:
    lane: "flatten-with-routes"
    rationale: "Hand read of the chart against this base's render. The chart has no hook, no lookup, no generated value, no keep annotation, no Namespace template and no subchart, and no Secret renders. One thing is decided at render time: the resource.k8s.io version of the DeviceClass objects, which follows the render's capability set and is v1 here. So the companions are the two CRDs before the controller, and a target that serves resource.k8s.io/v1, recorded as a target fact. The kubelet plugin also needs NVIDIA drivers on the node, which this chart does not install. This base uses the values the AICR v1.0.0 EKS training entry supplies. Like the default base it has resources.gpus.enabled false and gpuResourcesEnabledOverride false. The values also rename the objects, point the driver root at /run/nvidia/driver, select the kubelet plugin onto GPU nodes and add tolerations and annotations; none reaches a hazard. The AICR v1.0.0 entry retains these values and no render of this component, so this base was not compared with an AICR render."
    routes:
      - "CRD ordering declaration: the two resource.nvidia.com CRDs are established before the controller starts, from the packaged CRD bundle"
  boundedness:
    - "immutable-field changes are a cross-version property; this verdict compares no second version (the CRD upgrade delta lane holds that precedent)"
    - "the scan is static and does not execute templates, so values-gated reachability is a recorded judgment, not a render"
    - "the witness scans the packaged chart including its vendored subcharts; charts pulled at deploy time are out of scope"
