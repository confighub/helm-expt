    - "revisions/eks-inference/r001/receipts/helm-equivalence-receipt.yaml"
    - "revisions/eks-inference/r001/receipts/render-receipt.yaml"
    - "revisions/eks-inference/r001/receipts/scan-receipt.yaml"
    - "revisions/eks-inference/r001/receipts/install-gate.yaml"
