apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ValueModel"
metadata:
  name: "aws-controllers-k8s-ec2-chart-1.18.4"
spec:
  checkedValues:
    -
      path: "deletionPolicy"
      variant: "eks-inference"
      disposition: "retain-under-pruning-reconciler"
      reason: "The eks-inference base sets retain so a pruning reconciler cannot delete cloud infrastructure by pruning a manifest."
      evidence: "values.yaml L134; templates/deployment.yaml DELETION_POLICY env (L128-129, L74-75); rendered eks-inference release-objects.yaml shows value: retain"
    -
      path: "deletionPolicy"
      variant: "default"
      disposition: "chart-default-delete"
      reason: "Chart default is delete, which removes the AWS resource before the Kubernetes resource goes away; the single most consequential values choice for this chart under a pruning reconciler."
      evidence: "values.yaml L134; templates/deployment.yaml DELETION_POLICY env (L128-129, L74-75); rendered default release-objects.yaml shows value: delete"
    -
      path: "aws.region"
      variant: "eks-inference"
      disposition: "environment-placeholder-input"
      reason: "Deliberately renders the ConfigHub sentinel so an unfilled region fails vet-placeholders instead of reaching a cluster; bound per environment by a set-env-var link that addresses AWS_REGION by name."
      evidence: "values.yaml L91; templates/deployment.yaml L116-117; rendered eks-inference Deployment env AWS_REGION value: confighubplaceholder; variants/eks-inference/values.yaml comment documents the set-env-var by-name link"
    -
      path: "aws.region"
      variant: "default"
      disposition: "empty-at-chart-default"
      reason: "Empty by default, which renders an empty AWS_REGION env var."
      evidence: "values.yaml L91; templates/deployment.yaml L116-117"
    -
      path: "aws.credentials.secretName"
      variant: "eks-inference"
      disposition: "target-secret-reference"
      reason: "Set to aws-creds, which gates a Secret volume, a read-only mount at /var/run/secrets/aws, and the AWS_SHARED_CREDENTIALS_FILE plus AWS_PROFILE env vars. The Secret itself is never rendered; it must pre-exist in ack-system."
      evidence: "values.yaml L97; templates/deployment.yaml L156-161 and L214-220; templates/_helpers.tpl aws.credentials.secret_mount_path L41-43"
    -
      path: "aws.credentials.secretName"
      variant: "default"
      disposition: "inactive"
      reason: "Empty by default; no credential wiring renders at all."
      evidence: "values.yaml L97; templates/deployment.yaml L156-161"
    -
      path: "aws.credentials.secretKey"
      variant: "default, eks-inference"
      disposition: "checked-consistent"
      reason: "Set to credentials in both the chart default and eks-inference; it becomes the file name inside the mounted Secret and the tail of AWS_SHARED_CREDENTIALS_FILE."
      evidence: "values.yaml L99; templates/_helpers.tpl aws.credentials.path L46-49"
    -
      path: "installScope"
      variant: "default, eks-inference"
      disposition: "checked-at-cluster-scope"
      reason: "cluster in both audited bases, so the controller ClusterRole and ClusterRoleBinding render and ACK_WATCH_NAMESPACE renders empty. Setting namespace instead flips the RBAC shape and makes watchNamespace live."
      evidence: "values.yaml L111; templates/_helpers.tpl watch-namespace L34-38; templates/cluster-role-controller.yaml; both rendered inventories contain ClusterRole ack-ec2-ec2-chart"
    -
      path: "watchNamespace"
      variant: "default, eks-inference"
      disposition: "inactive-at-audited-values"
      reason: "Only consulted when installScope is namespace; empty falls back to the release namespace. Inactive at both audited bases."
      evidence: "values.yaml L116; templates/_helpers.tpl L34-38"
    -
      path: "serviceAccount.annotations"
      variant: "default, eks-inference"
      disposition: "alternate-credential-path-not-used"
      reason: "Empty in both bases. This is the IRSA hook (eks.amazonaws.com/role-arn); the eks-inference base uses the shared-credentials Secret path instead, so the two credential mechanisms do not overlap in the audited renders."
      evidence: "values.yaml L179-180 including the commented role-arn example; templates/service-account.yaml"
    -
      path: "metrics.service.create"
      variant: "default, eks-inference"
      disposition: "disabled-no-service-rendered"
      reason: "false in both bases, so no Service object renders and the object count excludes metrics-service.yaml."
      evidence: "values.yaml L76; templates/metrics-service.yaml; neither object inventory contains a Service"
    -
      path: "reconcile.resources"
      variant: "default, eks-inference"
      disposition: "chart-default-full-set"
      reason: "Lists all 20 EC2 kinds, joined into the RECONCILE_RESOURCES env var, so the controller reconciles its full surface at both bases."
      evidence: "values.yaml L152-172; templates/deployment.yaml L126-127"
    -
      path: "leaderElection.enabled"
      variant: "default, eks-inference"
      disposition: "checked-consistent-with-single-replica"
      reason: "false in both bases, so the leader-election args are absent. Safe because deployment.replicas stays 1; raising replicas without enabling leader election is the chart's own documented hazard."
      evidence: "values.yaml L188 and L18-21; templates/deployment.yaml L76-80"
    -
      path: "resourceTags"
      variant: "default, eks-inference"
      disposition: "runtime-substituted-passthrough"
      reason: "Four tag templates containing %TOKEN% markers (for example %CONTROLLER_VERSION%) render verbatim into ACK_RESOURCE_TAGS. The controller substitutes them at runtime; Helm does not. They look like unexpanded template variables in the rendered YAML but are intentional."
      evidence: "values.yaml L122-129; templates/deployment.yaml L134-135; rendered Deployment env ACK_RESOURCE_TAGS"
    -
      path: "image.repository, image.tag"
      variant: "default, eks-inference"
      disposition: "checked-pinned"
      reason: "Pinned to public.ecr.aws/aws-controllers-k8s/ec2-controller:1.18.4, matching the chart version and appVersion. Single image in the whole release."
      evidence: "values.yaml L5-8; rendered Deployment image line; Chart.yaml appVersion 1.18.4"
    -
      path: "featureGates"
      variant: "default, eks-inference"
      disposition: "chart-default-checked"
      reason: "Map rendered to a CSV FEATURE_GATES env var by a helper. Defaults enable ReadOnlyResources and ResourceAdoption and disable ServiceLevelCARM, TeamLevelCARM, and IAMRoleSelector. Both bases keep the defaults."
      evidence: "values.yaml L205-215; templates/_helpers.tpl feature-gates L163-169; templates/deployment.yaml L152-155"
    -
      path: "enableCARM, enableCrossNamespace"
      variant: "default, eks-inference"
      disposition: "chart-default-checked"
      reason: "Both true by default and passed straight into controller flags rather than env vars. Unchanged in both bases."
      evidence: "values.yaml L195 and L200; templates/deployment.yaml L101-102"
    -
      path: "everything-else"
      variant: "default, eks-inference"
      disposition: "not-exhaustively-checked"
      reason: "All remaining values (deployment.annotations, labels, tolerations, affinity, strategy, extraVolumes, extraVolumeMounts, extraEnvVars, hostNetwork, dnsPolicy, priorityClassName, log.enable_development_logging, aws.endpoint_url, aws.identity_endpoint_url, watchSelectors, reconcile resync maps, nameOverride, fullnameOverride, role.labels, image.pullSecrets) sit at chart defaults in both audited bases."
      evidence: "values.yaml; no override in variants/default/values.yaml or variants/eks-inference/values.yaml"
  unknownValues: "not-checked"
  deadValues: "not-checked"
  ignoredValues: "not-checked"
