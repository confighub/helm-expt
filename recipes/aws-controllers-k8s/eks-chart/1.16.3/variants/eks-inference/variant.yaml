apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Variant"
metadata:
  name: "eks-inference"
spec:
  recipe: "../../recipe.yaml"
  namespace: "ack-system"
  releaseName: "ack-eks"
  valuesProfile: "../../effective-values-eks-inference.yaml"
  capabilityProfile:
    kubeVersion: "1.31.0"
    apiVersions:
      []
  hookPolicy: "hooks-rendered-visible"
  targetFacts:
    requiredSecrets:
      -
        namespace: "ack-system"
        name: "aws-creds"
        keys:
          - "credentials"
        purpose: "AWS shared credentials file mounted read-only at /var/run/secrets/aws"
    requiredValues:
      -
        path: "aws.region"
        purpose: "AWS region for the controller's API calls; rendered as the confighubplaceholder sentinel and filled per target"
        stage: "setup"
        installerInput: "awsRegion"
