apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ChartDossier"
metadata:
  name: "autoscaler-vertical-pod-autoscaler-0-9-0"
  labels:
    confighub.io/chart-ref: "autoscaler/vertical-pod-autoscaler"
    confighub.io/chart-version: "0.9.0"
    confighub.io/proof-tier: "next80-full"
spec:
  chart: "autoscaler/vertical-pod-autoscaler"
  version: "0.9.0"
  maintainedNotes:
    - "autoscaler/vertical-pod-autoscaler@0.9.0 renders deterministically under Kubernetes 1.30.0 with hooks and tests excluded."
    - "The default variant is intended as a proof baseline; production promotion still follows scan/gate review."
    - "Chart source contains Helm hooks; the proof revision uses no-hooks so hook lifecycle must be handled separately before production."
    - "Chart source contains generated/random/time helpers; generated values must be captured before approval if activated by a variant."
    - "Rendered output includes 2 CRDs; CRD lifecycle must be reviewed before upgrade/promotion."
    - "Rendered output includes cluster-scoped RBAC; production promotion needs RBAC review."
    - "Rendered output includes admission webhooks; live readiness/certificate observations are required after apply."
  knownControlPoints:
    - "source-lock"
    - "dependency-lock"
    - "capability-profile"
    - "variant-revision"
    - "rendered-manifest-scan"
    - "helm-equivalence"
    - "generated-facts"
    - "lifecycle-policy"
    - "extension-slots"
    - "crds"
    - "cluster-rbac"
    - "webhooks"
  proofFocus: "VPA controllers, CRDs, admission webhook"
