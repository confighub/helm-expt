apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Variant"
metadata:
  name: "controller-default-reviewed"
  labels:
    confighub.io/chart-ref: "autoscaler/cluster-autoscaler"
    confighub.io/chart-version: "9.57.0"
    confighub.io/proof-tier: "next80-full"
    confighub.io/variant: "controller-default-reviewed"
    helm-expt.confighub.com/useful-base-status: "values-profile-rerender"
spec:
  recipe: "../../recipe.yaml"
  namespace: "default"
  releaseName: "cluster-autoscaler"
  valuesProfile: "../../effective-values-controller-default-reviewed.yaml"
  capabilityProfile:
    kubeVersion: "1.30.0"
    apiVersions:
      []
  hookPolicy: "no-hooks"
  targetFacts:
    requiredValues:
      -
        path: "autoDiscovery.clusterName"
        value: "kind"
        purpose: "Enables the chart's node-group autodiscovery path so the controller Deployment is rendered."
      -
        path: "awsRegion"
        value: "us-east-1"
        purpose: "Supplies the AWS region value required by this chart's default cloud-provider path."
  usefulBase:
    realizationStrategy: "values-profile-rerender"
    userJob: "Install Cluster Autoscaler as a controller with explicit AWS autodiscovery values."
    renderTimeChoices:
      - "autoDiscovery.clusterName"
      - "awsRegion"
    addedObjects:
      - "apps/v1|Deployment|default|cluster-autoscaler-aws-cluster-autoscaler"
