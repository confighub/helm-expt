apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Variant"
metadata:
  labels:
    confighub.io/chart-ref: "autoscaler/cluster-autoscaler"
    confighub.io/chart-version: "9.57.0"
    confighub.io/proof-tier: "next80-full"
    confighub.io/variant: "controller-default-reviewed"
    helm-expt.confighub.com/useful-base-status: "realized-alias-base"
  name: "controller-default-reviewed"
spec:
  capabilityProfile:
    apiVersions:
      []
    kubeVersion: "1.30.0"
  hookPolicy: "no-hooks"
  namespace: "default"
  recipe: "../../recipe.yaml"
  releaseName: "cluster-autoscaler"
  valuesProfile: "../../effective-values.yaml"
  usefulBase:
    realizationStrategy: "alias-of-default-render"
    sourceBase: "default"
    userJob: "install a cluster controller with explicit CRD, RBAC, and lifecycle boundaries"
    renderTimeChoices:
      - "CRD ownership"
      - "admission/webhook behavior"
      - "RBAC scope"
      - "leader-election or HA flags"
      - "required values"
    remainingBeforeCatalog:
      - "required render-time values: autoDiscovery.clusterName or autoscalingGroups[]"
      - "re-render as a non-alias base"
      - "ConfigHub proof lane"
      - "selected live lane"
      - "production disposition"
    note: "Strict live parity shows this alias base has object parity but no controller workload. The chart requires autoDiscovery.clusterName or autoscalingGroups[] before it becomes a functional install."
