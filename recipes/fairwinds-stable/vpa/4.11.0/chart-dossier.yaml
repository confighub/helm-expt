apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ChartDossier"
metadata:
  name: "fairwinds-stable-vpa-4-11-0"
  labels:
    confighub.io/chart-ref: "fairwinds-stable/vpa"
    confighub.io/chart-version: "4.11.0"
    confighub.io/proof-tier: "next80-full"
spec:
  chart: "fairwinds-stable/vpa"
  version: "4.11.0"
  maintainedNotes:
    - "fairwinds-stable/vpa@4.11.0 renders deterministically under Kubernetes 1.30.0 with hooks and tests excluded."
    - "The default variant is intended as a proof baseline; production promotion still follows scan/gate review."
    - "Chart source contains Helm hooks; the proof revision uses no-hooks so hook lifecycle must be handled separately before production."
    - "Chart source contains lookup; future variants using lookup paths must bind target facts in the recipe."
    - "Chart source contains tpl; raw templating extension slots need explicit ownership and review."
    - "Rendered output includes 2 CRDs; CRD lifecycle must be reviewed before upgrade/promotion."
    - "Rendered output includes cluster-scoped RBAC; production promotion needs RBAC review."
    - "Rendered output includes admission webhooks; live readiness/certificate observations are required after apply."
  knownControlPoints:
    - "source-lock"
    - "dependency-lock"
    - "capability-profile"
    - "variant-revision"
    - "rendered-manifest-scan"
    - "helm-equivalence"
    - "target-facts"
    - "tpl-extension-slots"
    - "lifecycle-policy"
    - "crds"
    - "cluster-rbac"
    - "webhooks"
  proofFocus: "vertical pod autoscaler CRDs and admission"
