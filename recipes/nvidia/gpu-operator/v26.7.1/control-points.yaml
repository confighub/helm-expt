apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ControlPoints"
metadata:
  name: "nvidia-gpu-operator-v26.7.1"
spec:
  points:
    -
      category: "source-lock"
      status: "handled"
      evidence: "source-lock.yaml"
    -
      category: "dependency-lock"
      status: "handled"
      evidence: "dependency-lock.yaml"
      dependencyCount: 1
    -
      category: "capability-profile"
      status: "handled"
      kubeVersion: "1.31.0"
      note: "the packaged chart has no .Capabilities branch, so the render does not depend on the pinned Kubernetes version"
    -
      category: "lifecycle-policy"
      status: "attention-required"
      policy: "no-hooks"
      note: "the bases are rendered with --no-hooks; default renders 27 objects (8 CRDs) and 9 Helm hook objects. The hook objects are packaged under prerequisites/gpu-operator-lifecycle with a lifecycle-actions.yaml record, and nothing runs them automatically. No hook has been run on a cluster for this entry."
    -
      category: "crd-lifecycle"
      status: "review-required"
      count: 8
      note: "the bases include their CRDs, and each base records them as target facts with a packaged CRD bundle so they can be established before the ClusterPolicy object is applied"
    -
      category: "operator-managed-operands"
      status: "review-required"
      note: "the ClusterPolicy object tells the operator which driver, container toolkit, device plugin, DCGM and validator workloads to create on GPU nodes. Those privileged DaemonSets are created at run time and appear in no render."
    -
      category: "catalog-coverage"
      status: "packaged-with-controls"
      note: "exact source and deterministic package are retained; publication, live qualification and production support remain separate gates"
    -
      category: "installer-support-object"
      status: "handled"
      object: "v1|Namespace||gpu-operator"
