apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Variant"
metadata:
  name: "preinstalled-driver-and-toolkit"
spec:
  recipe: "../../recipe.yaml"
  namespace: "gpu-operator"
  releaseName: "gpu-operator"
  valuesProfile: "../../effective-values-preinstalled-driver-and-toolkit.yaml"
  capabilityProfile:
    kubeVersion: "1.31.0"
    apiVersions:
      []
  hookPolicy: "no-hooks"
  targetFacts:
    requiredCRDs:
      -
        name: "clusterpolicies.nvidia.com"
        sourceVariant: "preinstalled-driver-and-toolkit"
        purpose: "gpu-operator CRD included in this base; it must be established before Kubernetes accepts the rendered ClusterPolicy object"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
      -
        name: "computedomaincliques.resource.nvidia.com"
        sourceVariant: "preinstalled-driver-and-toolkit"
        purpose: "CRD included in this base and applied before the workloads that use it"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
      -
        name: "computedomains.resource.nvidia.com"
        sourceVariant: "preinstalled-driver-and-toolkit"
        purpose: "CRD included in this base and applied before the workloads that use it"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
      -
        name: "gpuclusters.nvidia.com"
        sourceVariant: "preinstalled-driver-and-toolkit"
        purpose: "CRD included in this base and applied before the workloads that use it"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
      -
        name: "nodefeaturegroups.nfd.k8s-sigs.io"
        sourceVariant: "preinstalled-driver-and-toolkit"
        purpose: "CRD included in this base and applied before the workloads that use it"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
      -
        name: "nodefeaturerules.nfd.k8s-sigs.io"
        sourceVariant: "preinstalled-driver-and-toolkit"
        purpose: "CRD included in this base and applied before the workloads that use it"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
      -
        name: "nodefeatures.nfd.k8s-sigs.io"
