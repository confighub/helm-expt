apiVersion: "evidence.confighub.com/v1alpha1"
kind: "FlatteningSafetyVerdict"
metadata:
  name: "nvidia-gpu-operator-v25.10.1-external-nfd"
spec:
  chart:
    repository: "nvidia"
    name: "gpu-operator"
    version: "v25.10.1"
    packageSHA256: "9532cc4dd59248e0eb2a0cd4baa6a7e8ed4258b5d7588ae9c13f5c839482efe5"
  witnessRef: "data/flattening-safety/witnesses/nvidia-gpu-operator-v25.10.1.yaml"
  auditedBase: "external-nfd"
  dispositions:
    -
      class: "helm-hooks"
      finding: "present"
      detail: "the pre-upgrade Job that applies the CRD files inside the operator image renders with these values, with its ServiceAccount, ClusterRole and ClusterRoleBinding, and is not in the base; the node-feature-discovery post-delete prune set does not render because nfd.enabled is false"
      disposition: "packaged lifecycle action under prerequisites/gpu-operator-lifecycle, marked not automatic; it has not been run on a cluster"
      evidence:
        - "charts/node-feature-discovery/templates/post-delete-job.yaml:10"
        - "charts/node-feature-discovery/templates/post-delete-job.yaml:20"
        - "charts/node-feature-discovery/templates/post-delete-job.yaml:41"
        - "charts/node-feature-discovery/templates/post-delete-job.yaml:60"
        - "templates/cleanup_crd.yaml:8"
        - "templates/upgrade_crd.yaml:8"
    -
      class: "resource-policy-keep"
      finding: "present-gated"
      detail: "the keep annotation is on the ClusterPolicy only when operator.cleanupCRD is true, which these values leave false"
      disposition: "no route needed for the audited base"
      evidence:
        - "templates/clusterpolicy.yaml:12"
    -
      class: "lookup"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "webhook-ca"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "capabilities-api-versions"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "generated-secrets"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "crd-ordering"
      finding: "present"
      detail: "two CRDs render in this base beside a ClusterPolicy object of one of them"
      disposition: "ordering declaration ships with the bundle: the base's target facts name the CRDs and the package carries them as a CRD bundle"
      evidence:
        - "3 crds-directory file(s), 6 CRD document(s)"
    -
      class: "immutable-fields"
      finding: "not-evaluated"
      detail: "cross-version property; see boundedness"
      disposition: "versioned replacement route when an upgrade pair is audited"
    -
      class: "namespace-creation"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "subchart-conditions"
      finding: "present"
      detail: "1 occurrence(s) in the packaged chart"
      disposition: "the flatten step must render with this base's condition set; these values turn node-feature-discovery off"
      evidence:
        - "node-feature-discovery gated by nfd.enabled"
    -
      class: "test-hooks"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
  variantScope:
    -
      values: "nfd.enabled true (the default base)"
      effect: "node-feature-discovery, three more CRDs and the post-delete prune hook enter the render"
    -
      values: "driver.version"
      effect: "changes one field, ClusterPolicy /spec/driver/version, and does not move the finding set"
  verdict:
    lane: "flatten-with-routes"
    rationale: "Hand read of the chart against this base's render. This base is the default base with nfd.enabled false, for a cluster that already runs Node Feature Discovery. Fifteen node-feature-discovery objects leave the render, three of them CRDs, no object that stays changes, and the proof checks both. Nothing is decided at render time. What is left for a companion is the pre-upgrade CRD Job and the two CRDs before the ClusterPolicy, and all of them are in the package. The packaged pre-upgrade Job is the one these values render, which no longer applies the node-feature-discovery CRD files. None has been run on a cluster, and the target must already run Node Feature Discovery, which this base does not install."
    routes:
      - "CRD ordering declaration: the two CRDs are established before the ClusterPolicy object, from the packaged CRD bundle"
      - "pre-upgrade lifecycle action that moves the CRDs to the new version, recorded in the package and not yet run"
  boundedness:
    - "immutable-field changes are a cross-version property; this verdict compares no second version (the CRD upgrade delta lane holds that precedent)"
    - "the scan is static and does not execute templates, so values-gated reachability is a recorded judgment, not a render"
    - "the witness scans the packaged chart including its vendored subcharts; charts pulled at deploy time are out of scope"
  provenance:
    emittedBy: "scripts/generate-flattening-safety-verdicts.mjs"
    generatedFrom:
      - "data/flattening-safety/witnesses/nvidia-gpu-operator-v25.10.1.yaml"
      - "recipes/nvidia/gpu-operator/v25.10.1/source-lock.yaml"
