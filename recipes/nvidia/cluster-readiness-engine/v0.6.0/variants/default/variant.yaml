      -
        name: "logprofiles.nvcre.nvidia.com"
        sourceVariant: "default"
        purpose: "CRD included in this base; it must be established before Kubernetes accepts the four rendered LogProfile objects"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
      -
        name: "workflows.nvcre.nvidia.com"
        sourceVariant: "default"
