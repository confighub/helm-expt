        name: "certifications.nvcre.nvidia.com"
        sourceVariant: "default"
        purpose: "CRD included in this base and applied before the controller that reconciles it"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
      -
        name: "goodputmeasurements.nvcre.nvidia.com"
        sourceVariant: "default"
        purpose: "CRD included in this base and applied before the controller that reconciles it"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
      -
        name: "jobs.nvcre.nvidia.com"
        sourceVariant: "default"
        purpose: "CRD included in this base and applied before the controller that reconciles it"
        deliveryLanes:
          - "regularHelm"
