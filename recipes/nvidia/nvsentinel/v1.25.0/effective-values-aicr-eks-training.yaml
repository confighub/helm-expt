apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "EffectiveValues"
metadata:
  name: "nvidia-nvsentinel-v1.25.0-aicr-eks-training"
spec:
  files:
    -
      path: "effective-values-aicr-eks-training.yaml"
      source: "inline-proof"
      sha256: "e02d1557fb234d239132306af7427991dd13b23faff32ac075ad146599a80272"
  mergedValuesCaptured: false
  values:
    fullnameOverride: "nvsentinel"
    global:
      initContainerImage:
        repository: "docker.io/library/busybox"
        tag: "1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"
      systemNodeSelector:
        nodeGroup: "system-worker"
      systemNodeTolerations:
        -
          operator: "Exists"
      tolerations:
        -
          operator: "Exists"
    janitor-provider:
      csp:
        provider: "generic"
    networkPolicy:
      enabled: false
    platformConnector:
      maxUnavailable: 1
      resources:
        limits:
          cpu: "200m"
          memory: "512Mi"
        requests:
          cpu: "200m"
          memory: "512Mi"
      updateStrategy: "RollingUpdate"
    syslog-health-monitor:
      enabledChecks:
        - "SysLogsXIDError"
        - "SysLogsSXIDError"
        - "SysLogsGPUFallenOff"
        - "SysLogsNICDriverError"
      nicDriverDetection:
        patterns:
          -
            enabled: true
            name: "cmd_exec_timeout"
            processingStrategy: "STORE_ONLY"
          -
            enabled: true
            name: "health_poll_failed"
            processingStrategy: "STORE_ONLY"
          -
            enabled: true
            name: "unrecoverable_err"
            processingStrategy: "STORE_ONLY"
          -
            enabled: true
            name: "netdev_watchdog"
            processingStrategy: "STORE_ONLY"
          -
            enabled: true
            name: "pci_power_insufficient"
            processingStrategy: "STORE_ONLY"
          -
            enabled: true
            name: "port_module_high_temp"
            processingStrategy: "STORE_ONLY"
          -
            enabled: true
            name: "access_reg_failed"
            processingStrategy: "STORE_ONLY"
          -
            enabled: true
            name: "module_unplugged"
            processingStrategy: "STORE_ONLY"
          -
            enabled: true
            name: "mlx5_tx_timeout_detected"
            processingStrategy: "STORE_ONLY"
          -
            enabled: true
            name: "mlx5_rx_timeout_detected"
            processingStrategy: "STORE_ONLY"
          -
            enabled: true
            name: "mlx5_napi_soft_lockup"
            processingStrategy: "STORE_ONLY"
