        - "charts/mongodb-store/charts/mongodb/charts/common/templates/_capabilities.tpl:221"
        - "charts/mongodb-store/charts/mongodb/charts/common/templates/_capabilities.tpl:222"
        - "charts/mongodb-store/charts/mongodb/charts/common/templates/_compatibility.tpl:14"
