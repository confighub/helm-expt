        - "templates/node-condition-cleanup-hook.yaml:25"
        - "templates/node-condition-cleanup-hook.yaml:38"
        - "templates/node-condition-cleanup-hook.yaml:68"
        - "templates/node-condition-cleanup-hook.yaml:90"
    -
      class: "resource-policy-keep"
      finding: "present-gated"
      detail: "every keep annotation sits in the mongodb-store and postgresql subcharts, which these values leave off"
      disposition: "no route needed for the audited base"
      evidence:
        - "charts/mongodb-store/charts/mongodb/templates/backup/pvc.yaml:29"
        - "charts/mongodb-store/charts/mongodb/templates/standalone/pvc.yaml:16"
        - "charts/mongodb-store/charts/psmdb-operator/templates/namespace.yaml:8"
