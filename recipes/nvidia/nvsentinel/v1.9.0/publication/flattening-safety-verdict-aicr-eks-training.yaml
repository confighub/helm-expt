        - "charts/preflight/templates/mutatingwebhook.yaml:15"
    -
      class: "capabilities-api-versions"
      finding: "present-gated"
      detail: "the branches sit in the mongodb-store and postgresql subcharts, which are off, and in a syslog-health-monitor helper reached only when xidSideCar.enabled is true, which is false in these values"
      disposition: "no route needed for the audited base"
      evidence:
