    -
      class: "lookup"
      finding: "present-gated"
      detail: "every lookup call sits in the mongodb-store and postgresql subcharts, which these values leave off"
      disposition: "no route needed for the audited base"
      evidence:
        - "charts/mongodb-store/charts/mongodb/charts/common/templates/_secrets.tpl:100"
        - "charts/mongodb-store/charts/mongodb/charts/common/templates/_secrets.tpl:159"
        - "charts/mongodb-store/charts/mongodb/charts/common/templates/_secrets.tpl:181"
        - "charts/mongodb-store/charts/mongodb/templates/networkpolicy.yaml:45"
        - "charts/mongodb-store/charts/psmdb-operator/templates/NOTES.txt:19"
        - "charts/postgresql/charts/common/templates/_secrets.tpl:100"
    -
      class: "webhook-ca"
      finding: "present-gated"
      detail: "the webhook configurations belong to the janitor and preflight subcharts, both off in these values"
      disposition: "no route needed for the audited base"
      evidence:
