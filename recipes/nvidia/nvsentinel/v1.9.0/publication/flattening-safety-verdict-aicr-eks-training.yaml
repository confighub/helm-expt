      finding: "present-gated"
      detail: "every generated credential sits in the mongodb-store and postgresql subcharts, which these values leave off; this base renders no Secret"
      disposition: "no route needed for the audited base"
      evidence:
        - "charts/mongodb-store/charts/mongodb/charts/common/templates/_secrets.tpl:70"
        - "charts/mongodb-store/charts/mongodb/charts/common/templates/_secrets.tpl:92"
        - "charts/mongodb-store/charts/mongodb/charts/common/templates/_secrets.tpl:125"
        - "charts/mongodb-store/charts/mongodb/charts/common/templates/_secrets.tpl:126"
        - "charts/mongodb-store/charts/mongodb/charts/common/templates/_secrets.tpl:130"
        - "charts/mongodb-store/charts/mongodb/templates/secrets-ca.yaml:29"
    -
      class: "crd-ordering"
      finding: "present-gated"
      detail: "the CRDs ship in the crds directories of subcharts that these values leave off; this base renders none"
      disposition: "no route needed for the audited base"
      evidence:
        - "5 crds-directory file(s), 7 CRD document(s)"
    -
      class: "immutable-fields"
      finding: "not-evaluated"
      detail: "cross-version property; see boundedness"
      disposition: "versioned replacement route when an upgrade pair is audited"
    -
      class: "namespace-creation"
      finding: "present-gated"
      detail: "the Namespace template belongs to the psmdb-operator subchart inside mongodb-store, which is off"
      disposition: "no route needed for the audited base"
      evidence:
        - "charts/mongodb-store/charts/psmdb-operator/templates/namespace.yaml:4"
    -
      class: "subchart-conditions"
      finding: "present"
      detail: "20 occurrence(s) in the packaged chart"
      disposition: "the flatten step must render with the audited base's condition set; every subchart has its own flag and these values leave most of them off"
      evidence:
        - "gpu-health-monitor gated by global.gpuHealthMonitor.enabled"
        - "mongodb-store gated by global.mongodbStore.enabled"
        - "postgresql gated by postgresql.enabled"
        - "fault-quarantine gated by global.faultQuarantine.enabled"
        - "node-drainer gated by global.nodeDrainer.enabled"
        - "fault-remediation gated by global.faultRemediation.enabled"
        - "health-events-analyzer gated by global.healthEventsAnalyzer.enabled"
        - "csp-health-monitor gated by global.cspHealthMonitor.enabled"
        - "syslog-health-monitor gated by global.syslogHealthMonitor.enabled"
        - "incluster-file-server gated by global.inclusterFileServer.enabled"
        - "labeler gated by global.labeler.enabled"
        - "janitor gated by global.janitor.enabled"
        - "janitor-provider gated by global.janitorProvider.enabled"
        - "metadata-collector gated by global.metadataCollector.enabled"
        - "kubernetes-object-monitor gated by global.kubernetesObjectMonitor.enabled"
        - "event-exporter gated by global.eventExporter.enabled"
        - "preflight gated by global.preflight.enabled"
        - "k8sdatastore-crds gated by global.k8sdatastoreCrds.enabled"
        - "slurm-drain-monitor gated by global.slurmDrainMonitor.enabled"
        - "nic-health-monitor gated by global.nicHealthMonitor.enabled"
    -
      class: "test-hooks"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
  variantScope:
    -
      values: "global.mongodbStore.enabled or postgresql.enabled"
      effect: "brings in lookup-or-generate credentials, keep-annotated volumes, setup Jobs and operator CRDs; that base needs its own verdict"
    -
      values: "global.janitor.enabled or global.preflight.enabled"
      effect: "adds admission webhooks and CRDs; that base needs a certificate route and an ordering declaration"
    -
      values: "nodeConditionCleanup.enabled true"
      effect: "adds a post-upgrade hook Job with its own RBAC; that base needs a recorded lifecycle action"
    -
      values: "podMonitor.enabled false"
      effect: "removes the PodMonitor and with it the Prometheus Operator CRD precondition"
  verdict:
    lane: "safe-to-flatten"
    rationale: "Hand read of the chart against this base's render, which uses the values the AICR v0.19.0 EKS training recipe supplies. Those values turn on no subchart that chart defaults leave off. Against the default base the render drops the metrics-access NetworkPolicy and changes the labeler Deployment; it adds nothing. So every hazard still sits in a subchart or template that stays off, and the render agrees: no hook, no CRD, no Secret, no webhook, no Namespace. The objects equal the AICR nested render of the same archive. Two things stay outside the bundle and are recorded as preconditions, not routes: the Prometheus Operator PodMonitor CRD must exist on the target, and the objects carry no namespace, so they must be applied into nvsentinel."
  boundedness:
    - "immutable-field changes are a cross-version property; this verdict compares no second version (the CRD upgrade delta lane holds that precedent)"
    - "the scan is static and does not execute templates, so values-gated reachability is a recorded judgment, not a render"
    - "the witness scans the packaged chart including its vendored subcharts; charts pulled at deploy time are out of scope"
  provenance:
    emittedBy: "scripts/generate-flattening-safety-verdicts.mjs"
    generatedFrom:
      - "data/flattening-safety/witnesses/nvidia-nvsentinel-v1.9.0.yaml"
      - "recipes/nvidia/nvsentinel/v1.9.0/source-lock.yaml"
