    status: "packaged-with-controls"
    chart: "nvidia/nvsentinel"
    version: "v1.26.0"
    variants:
      - "default"
      - "no-pod-monitor"
    helmObjectsByVariant:
      default: 22
      no-pod-monitor: 21
    cubInstallObjectsByVariant:
      default: 23
      no-pod-monitor: 22
    helmMatchByVariant:
      default: "22/22"
      no-pod-monitor: "21/21"
    scanGate: "warn-production-blocked"
