  receipts:
    - "revisions/default/r001/receipts/helm-equivalence-receipt.yaml"
    - "revisions/default/r001/receipts/render-receipt.yaml"
    - "revisions/default/r001/receipts/scan-receipt.yaml"
    - "revisions/default/r001/receipts/install-gate.yaml"
    - "revisions/no-pod-monitor/r001/receipts/helm-equivalence-receipt.yaml"
    - "revisions/no-pod-monitor/r001/receipts/render-receipt.yaml"
    - "revisions/no-pod-monitor/r001/receipts/scan-receipt.yaml"
    - "revisions/no-pod-monitor/r001/receipts/install-gate.yaml"
