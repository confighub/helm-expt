  notes:
    - "This package is the exact nodewright@v0.17.1 chart, locked by archive URL and SHA-256."
    - "With chart defaults nodewright@v0.17.1 renders 18 objects as release nodewright-operator in namespace skyhook, the release name and namespace the AICR entry that pins this version uses: 2 CRDs from the chart's templates directory, the controller-manager Deployment, its ServiceAccount and RBAC, a metrics Service and a webhook Service, a MutatingWebhookConfiguration and a ValidatingWebhookConfiguration, a NetworkPolicy, a LimitRange and a PodDisruptionBudget. It renders no Secret."
    - "The same values also render six Helm hook objects that no base holds: four pre-upgrade (the selector-migration Job with its ServiceAccount, Role and RoleBinding) and two pre-delete Jobs. They are packaged under prerequisites/nodewright-lifecycle with a lifecycle-actions.yaml record. Nothing runs them automatically and none has been run on a cluster."
    - "The aicr-eks-training base renders 18 objects with the values the AICR v0.20.0 EKS training entry supplies (examples/aicr/eks-h100-training-kubeflow-v0-20-0/argocd-helm-bundle/005-nodewright-operator/values.yaml): the full name overridden to skyhook-operator, the manager given CPU and memory requests and limits and tolerating every taint, and the namespace LimitRange defaults set. Its objects equal the AICR v0.20.0 nested render of the same archive, object for object, once the 6 Helm hook objects that render also holds are set aside."
    - "The webhook configurations carry no CA bundle. The operator mints a self-signed serving certificate at run time, stores it in a Secret named webhook-cert and writes the CA into both configurations. That Secret is not in any base."
    - "No object carries a keep annotation."
    - "The PodDisruptionBudget carries no metadata.namespace, because the chart template leaves it to Helm. A flattened copy must be applied into the release namespace."
    - "The chart contains no lookup, no .Capabilities branch, no generated credential and no subchart."
    - "The retained root proves exact source bytes, deterministic rendering, and deterministic ConfigHub installer packaging. It does not claim publication, live convergence, or production support."
