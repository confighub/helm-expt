apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ChartDossier"
metadata:
  name: "kedacore-keda-2-19-0"
  labels:
    confighub.io/chart-ref: "kedacore/keda"
    confighub.io/chart-version: "2.19.0"
    confighub.io/proof-tier: "next80-full"
spec:
  chart: "kedacore/keda"
  version: "2.19.0"
  maintainedNotes:
    - "kedacore/keda@2.19.0 renders deterministically under Kubernetes 1.30.0 with hooks and tests excluded."
    - "The default variant is intended as a proof baseline; production promotion still follows scan/gate review."
    - "Chart source contains lookup; future variants using lookup paths must bind target facts in the recipe."
    - "Chart source contains tpl; raw templating extension slots need explicit ownership and review."
    - "Rendered output includes 6 CRDs; CRD lifecycle must be reviewed before upgrade/promotion."
    - "Rendered output includes cluster-scoped RBAC; production promotion needs RBAC review."
    - "Rendered output includes admission webhooks; live readiness/certificate observations are required after apply."
  knownControlPoints:
    - "source-lock"
    - "dependency-lock"
    - "capability-profile"
    - "variant-revision"
    - "rendered-manifest-scan"
    - "helm-equivalence"
    - "target-facts"
    - "tpl-extension-slots"
    - "extension-slots"
    - "crds"
    - "cluster-rbac"
    - "webhooks"
    - "apiservice"
  proofFocus: "autoscaling controller, CRDs, webhooks, RBAC"
