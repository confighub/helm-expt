apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ChartDossier"
metadata:
  name: "cloudpirates-rabbitmq-0-21-13"
  labels:
    confighub.io/chart-ref: "cloudpirates/rabbitmq"
    confighub.io/chart-version: "0.21.13"
    confighub.io/proof-tier: "successor-full"
spec:
  chart: "cloudpirates/rabbitmq"
  version: "0.21.13"
  category: "message broker"
  licenses:
    chart:
      evidence: "artifacthub license annotation read from the pulled chart"
      spdx: "Apache-2.0"
    images:
      -
        component: "rabbitmq"
        note: "upstream RabbitMQ server license; management image digest-pinned by the chart default"
        spdx: "MPL-2.0"
  maintainedNotes:
    - "cloudpirates/rabbitmq@0.21.13 renders deterministically under Kubernetes 1.30.0 with hooks and tests excluded."
    - "The default variant is intended as a proof baseline; production promotion still follows scan/gate review."
    - "The default variant pins auth.erlangCookie, auth.password to fixed demo values recorded in effective-values.yaml because the chart default generates random material at render time; replace these before any real use."
    - "Chart source contains lookup; future variants using lookup paths must bind target facts in the recipe."
    - "Chart source contains generated/random/time helpers; generated values must be captured before approval if activated by a variant."
    - "Chart source contains tpl; raw templating extension slots need explicit ownership and review."
    - "Rendered output has stateful/storage behavior; rollback and upgrade plans must be explicit."
  knownControlPoints:
    - "source-lock"
    - "dependency-lock"
    - "capability-profile"
    - "variant-revision"
    - "rendered-manifest-scan"
    - "helm-equivalence"
    - "target-facts"
    - "generated-facts"
    - "tpl-extension-slots"
    - "extension-slots"
    - "stateful-storage"
    - "secret-material"
  proofFocus: "message broker StatefulSet, rendered credential Secret, headless plus client Services"
