    name: "redis"
    version: "0.34.11"
    packageSHA256: "b7677d3692b8126a34113498f1a3ff1674a69899a2fd68c9542755ad1e90845f"
  witnessRef: "data/flattening-safety/witnesses/cloudpirates-redis-0.34.11.yaml"
  auditedBase: "default"
  dispositions:
    -
      class: "helm-hooks"
      finding: "present-gated"
      detail: "the post-install and post-upgrade cluster-init Job renders only when architecture is cluster, and the audited base is standalone"
      disposition: "no route needed for the audited base"
      evidence:
