    -
      class: "resource-policy-keep"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "lookup"
      finding: "present"
      detail: "templates/secret.yaml reads any existing Secret of the same name before it writes one; the audited base leaves auth.existingSecret unset, so that Secret renders"
      disposition: "named companion artifact required"
      evidence:
        - "charts/common/templates/_secrets.tpl:16"
        - "templates/secret.yaml:15"
    -
      class: "webhook-ca"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "capabilities-api-versions"
      finding: "present-gated"
      detail: "the OpenShift helper reads route.openshift.io/v1, and no template in this chart calls it"
      disposition: "no route needed for the audited base"
      evidence:
        - "charts/common/templates/_helpers.tpl:296"
    -
      class: "generated-secrets"
      finding: "present"
      detail: "the same template falls back to randAlphaNum 16 when neither an existing Secret nor auth.password supplies the password, so two renders of this base differ"
      disposition: "named companion artifact required"
      evidence:
        - "templates/secret.yaml:20"
    -
      class: "crd-ordering"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "immutable-fields"
      finding: "not-evaluated"
      detail: "cross-version property; see boundedness"
      disposition: "versioned replacement route when an upgrade pair is audited"
    -
      class: "namespace-creation"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "subchart-conditions"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
    -
      class: "test-hooks"
      finding: "absent"
      detail: "absent from the packaged chart"
      disposition: "none required"
  variantScope:
    -
      values: "auth.existingSecret set (the catalog's reuse-existing-secret base)"
      effect: "the Secret template is skipped entirely, and the lookup and the generated password go with it"
    -
      values: "architecture: cluster"
      effect: "the cluster-init Job renders as a post-install and post-upgrade hook, and needs a lifecycle route"
  verdict:
