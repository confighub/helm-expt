apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Recipe"
metadata:
  name: "mysql-mysql-operator"
  version: "2.3.0"
  labels:
    confighub.io/chart-ref: "mysql/mysql-operator"
    confighub.io/chart-version: "2.3.0"
    confighub.io/proof-tier: "successor-full"
spec:
  chartRef:
    sourceLock: "source-lock.yaml"
    dependencyLock: "dependency-lock.yaml"
  importMode: "render-and-vendor"
  currentExecutableFixture:
    installerPackage: "packages/mysql/mysql-operator/2.3.0"
    setupCommand:
      - "cub"
      - "installer"
      - "setup"
      - "--pull"
      - "packages/mysql/mysql-operator/2.3.0"
      - "--non-interactive"
      - "--namespace"
      - "mysql-operator"
  variants:
    - "variants/default/variant.yaml"
