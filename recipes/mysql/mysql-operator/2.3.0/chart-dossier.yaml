apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ChartDossier"
metadata:
  name: "mysql-mysql-operator-2-3-0"
  labels:
    confighub.io/chart-ref: "mysql/mysql-operator"
    confighub.io/chart-version: "2.3.0"
    confighub.io/proof-tier: "successor-full"
spec:
  chart: "mysql/mysql-operator"
  version: "2.3.0"
  category: "database operator"
  licenses:
    chart:
      evidence: "Release repository LICENSE: https://github.com/mysql/mysql-operator/blob/26.7.0-2.3.0/LICENSE; no LICENSE file is shipped inside the chart archive."
      spdx: "UPL-1.0"
    images:
      -
        component: "MySQL Operator for Kubernetes 26.7.0 Community"
        note: "Operator product license: https://github.com/mysql/mysql-operator/blob/26.7.0-2.3.0/LICENSE; the same file lists separate third-party notices. MySQL Server images are separate and are not installed by this operator-only entry."
        spdx: "UPL-1.0"
  maintainedNotes:
    - "mysql/mysql-operator@2.3.0 renders deterministically under Kubernetes 1.30.0 with hooks and tests excluded."
    - "The default variant is intended as a proof baseline; production promotion still follows scan/gate review."
    - "Chart source contains lookup; future variants using lookup paths must bind target facts in the recipe."
    - "Rendered output includes 5 CRDs; CRD lifecycle must be reviewed before upgrade/promotion."
    - "Rendered output includes cluster-scoped RBAC; production promotion needs RBAC review."
  knownControlPoints:
    - "source-lock"
    - "dependency-lock"
    - "capability-profile"
    - "variant-revision"
    - "rendered-manifest-scan"
    - "helm-equivalence"
    - "target-facts"
    - "extension-slots"
    - "crds"
    - "cluster-rbac"
  proofFocus: "operator-only deployment and CRDs in a dedicated namespace; the companion InnoDBCluster chart and database readiness are separate work"
