apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "InheritanceGraph"
metadata:
  name: "hashicorp-vault-0.32.0"
spec:
  chart: "hashicorp/vault"
  version: "0.32.0"
  recipe: "recipe.yaml"
  baseVariant: "default"
  variants:
    -
      name: "default"
      variant: "variants/default/variant.yaml"
      valuesProfile: "effective-values.yaml"
    -
      name: "ha-raft-ui"
      variant: "variants/ha-raft-ui/variant.yaml"
      valuesProfile: "effective-values-ha-raft-ui.yaml"
  edges:
    -
      from: "default"
      to: "default"
      type: "base-self"
      inheritedValuePaths:
        []
      overriddenValuePaths:
        []
      addedValuePaths:
        []
      removedValuePaths:
        []
      valueSourceMapCoverage:
        []
    -
      from: "default"
      to: "ha-raft-ui"
      type: "inherits-with-overrides"
      inheritedValuePaths:
        []
      overriddenValuePaths:
        []
      addedValuePaths:
        - "server.ha.enabled"
        - "server.ha.raft.enabled"
        - "ui.enabled"
      removedValuePaths:
        []
      valueSourceMapCoverage:
        []
  targetFactEdges:
    []
  generatedFactEdges:
    []
  fieldReachability:
    []
  notes:
    - "This graph is recovered from checked-in recipe artifacts."
    - "It is a desired-state graph fragment, not a live-cluster observation."
    - "Field reachability is limited to charts that have value-source-map.yaml coverage."
