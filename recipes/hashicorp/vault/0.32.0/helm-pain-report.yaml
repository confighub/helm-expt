      linkedReceipt: "revisions/dev-mode/r001/receipts/install-gate.yaml"
      supportedVariantStatus: "scan-and-review"
    -
      id: "cluster-rbac"
      detectedPainPoint: "cluster-rbac affects rbac.authorization.k8s.io/v1|ClusterRole||vault-agent-injector-clusterrole"
      evidence:
        - "rbac.authorization.k8s.io/v1|ClusterRole||vault-agent-injector-clusterrole"
      configHubHome: "scan-gate"
      disposition: "handled-by-scan-or-gate"
      linkedReceipt: "revisions/dev-mode/r001/receipts/scan-receipt.yaml"
      supportedVariantStatus: "scan-and-review"
    -
      id: "operate-policy"
      detectedPainPoint: "Vault init, unseal, seal migration, recovery material, and freshness evidence are post-render operating controls."
      evidence:
        - "operating-policy.yaml"
      configHubHome: "recipe"
      disposition: "needs-operator-decision"
      linkedReceipt: "revisions/dev-mode/r001/receipts/install-gate.yaml"
      supportedVariantStatus: "policy-required"
    -
      id: "target-topology"
      detectedPainPoint: "The ha-raft-ui base renders three Vault server replicas. A one-node kind target is useful for object parity, but HA live readiness needs a target that can schedule the declared topology plus an init/unseal operating path."
      evidence:
        - "control-points.yaml"
      configHubHome: "target-fact-requirement"
      disposition: "handled-by-target-fact-values"
      linkedReceipt: "value-model.yaml"
      supportedVariantStatus: "target-review"
    -
      id: "extension-slots"
      detectedPainPoint: "extra environment, Secret, volume, plugin, init, and sidecar slots are empty in promoted variants."
      evidence:
