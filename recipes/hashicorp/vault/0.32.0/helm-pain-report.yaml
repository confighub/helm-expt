      configHubHome: "lifecycle-policy"
      disposition: "handled-by-scan-or-gate"
      linkedReceipt: "revisions/dev-mode/r001/receipts/install-gate.yaml"
      supportedVariantStatus: "scan-and-review"
    -
      id: "service-exposure"
      detectedPainPoint: "service-exposure affects v1|Service|vault|vault-ui"
