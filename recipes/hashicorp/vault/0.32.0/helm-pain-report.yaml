      linkedReceipt: "revisions/dev-mode/r001/receipts/render-receipt.yaml"
      supportedVariantStatus: "handled"
    -
      id: "stateful-workload"
      detectedPainPoint: "stateful-workload affects apps/v1|StatefulSet|vault|vault"
      evidence:
