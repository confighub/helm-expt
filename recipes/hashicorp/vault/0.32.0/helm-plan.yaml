    status: "usable-with-controls"
    chart: "hashicorp/vault"
    version: "0.32.0"
    variants:
      - "dev-mode"
      - "default"
      - "ha-raft-ui"
    helmObjectsByVariant:
      dev-mode: 11
      default: 12
      ha-raft-ui: 18
    cubInstallObjectsByVariant:
      dev-mode: 12
      default: 13
      ha-raft-ui: 19
