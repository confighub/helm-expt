      fact: "Secret/consul/consul-gossip-encryption-key:key"
      purpose: "Consul gossip encryption key"
    -
      variant: "secure-mesh-existing-secrets"
      kind: "Secret"
      namespace: "consul"
      name: "consul-bootstrap-acl-token"
      keys:
