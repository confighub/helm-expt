        - "tls.crt"
      fact: "Secret/consul/consul-ca-cert:tls.crt"
      purpose: "Consul TLS CA certificate"
    -
      variant: "secure-mesh-existing-secrets"
      kind: "Secret"
      namespace: "consul"
      name: "consul-server-cert"
