apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "EffectiveValues"
metadata:
  name: "hashicorp-consul-2.0.0-secure-mesh-existing-secrets"
spec:
  files:
    -
      path: "effective-values-secure-mesh-existing-secrets.yaml"
      source: "inline-proof"
      sha256: "0cba1e10cc0756e73164feb81c7bae9d8b7066585fd1be6f9631b92b05a09768"
  mergedValuesCaptured: false
  values:
    global:
      acls:
        bootstrapToken:
          secretKey: "token"
          secretName: "consul-bootstrap-acl-token"
        manageSystemACLs: true
      gossipEncryption:
        autoGenerate: false
        secretKey: "key"
        secretName: "consul-gossip-encryption-key"
      tls:
        caCert:
          secretKey: "tls.crt"
          secretName: "consul-ca-cert"
        enabled: true
    ingressGateways:
      defaults:
        service:
          type: "ClusterIP"
      enabled: true
    meshGateway:
      enabled: true
      service:
        type: "ClusterIP"
    server:
      bootstrapExpect: 3
      replicas: 3
      serverCert:
        secretName: "consul-server-cert"
    terminatingGateways:
      enabled: true
    ui:
      ingress:
        enabled: true
        hosts:
          -
            host: "consul.example.invalid"
            paths:
              - "/"
