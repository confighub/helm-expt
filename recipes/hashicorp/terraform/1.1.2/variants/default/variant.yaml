apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Variant"
metadata:
  name: "default"
  labels:
    confighub.io/chart-ref: "hashicorp/terraform"
    confighub.io/chart-version: "1.1.2"
    confighub.io/proof-tier: "next80-full"
    confighub.io/variant: "default"
spec:
  recipe: "../../recipe.yaml"
  namespace: "default"
  releaseName: "terraform"
  targetFacts:
    requiredSecrets:
      -
        namespace: "default"
        name: "terraformrc"
        keys:
          - "credentials"
        purpose: "Terraform CLI credentials mounted at /etc/terraform/.terraformrc"
        suggestedSource: "kubectl -n default create secret generic terraformrc --from-file=credentials=<path-to-terraform-cli-config>"
        sourcePath: "../../target-prerequisite-plan.yaml"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        evidence:
          - "runs/live-helm-confighub-compare/hashicorp-terraform-default/receipt.yaml"
          - "runs/live-kind-parity/hashicorp-terraform-default/receipt.yaml"
      -
        namespace: "default"
        name: "workspacesecrets"
        purpose: "Sensitive Terraform workspace variables mounted at /tmp/secrets"
        suggestedSource: "kubectl -n default apply -f <workspacesecrets-manifest.yaml>"
        sourcePath: "../../target-prerequisite-plan.yaml"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        evidence:
          - "runs/live-helm-confighub-compare/hashicorp-terraform-default/receipt.yaml"
          - "runs/live-kind-parity/hashicorp-terraform-default/receipt.yaml"
  valuesProfile: "../../effective-values.yaml"
  capabilityProfile:
    kubeVersion: "1.30.0"
    apiVersions:
      []
  hookPolicy: "no-hooks"
