apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Recipe"
metadata:
  labels:
    confighub.io/chart-ref: "hashicorp/terraform"
    confighub.io/chart-version: "1.1.2"
    confighub.io/proof-tier: "next80-full"
  name: "hashicorp-terraform"
  version: "1.1.2"
spec:
  chartRef:
    dependencyLock: "dependency-lock.yaml"
    sourceLock: "source-lock.yaml"
  currentExecutableFixture:
    installerPackage: "packages/hashicorp/terraform/1.1.2"
    setupCommand:
      - "cub"
      - "installer"
      - "setup"
      - "--pull"
      - "packages/hashicorp/terraform/1.1.2"
      - "--non-interactive"
      - "--namespace"
      - "default"
  importMode: "render-and-vendor"
  variants:
    - "variants/default/variant.yaml"
    - "variants/no-crds/variant.yaml"
