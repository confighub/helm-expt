apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ChartDossier"
metadata:
  name: "hashicorp-terraform-1-1-2"
  labels:
    confighub.io/chart-ref: "hashicorp/terraform"
    confighub.io/chart-version: "1.1.2"
    confighub.io/proof-tier: "next80-full"
spec:
  chart: "hashicorp/terraform"
  version: "1.1.2"
  maintainedNotes:
    - "hashicorp/terraform@1.1.2 renders deterministically under Kubernetes 1.30.0 with hooks and tests excluded."
    - "The default variant is intended as a proof baseline; production promotion still follows scan/gate review."
    - "Chart source contains Helm hooks; the proof revision uses no-hooks so hook lifecycle must be handled separately before production."
    - "Rendered output includes 1 CRDs; CRD lifecycle must be reviewed before upgrade/promotion."
  knownControlPoints:
    - "source-lock"
    - "dependency-lock"
    - "capability-profile"
    - "variant-revision"
    - "rendered-manifest-scan"
    - "helm-equivalence"
    - "lifecycle-policy"
    - "crds"
  proofFocus: "controller workload, Secret/config, RBAC"
