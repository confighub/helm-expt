apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ChartDossier"
metadata:
  name: "istio-istiod-1-30-0"
  labels:
    confighub.io/chart-ref: "istio/istiod"
    confighub.io/chart-version: "1.30.0"
    confighub.io/proof-tier: "next80-full"
spec:
  chart: "istio/istiod"
  version: "1.30.0"
  maintainedNotes:
    - "istio/istiod@1.30.0 renders deterministically under Kubernetes 1.30.0 with hooks and tests excluded."
    - "The default variant is intended as a proof baseline; production promotion still follows scan/gate review."
    - "Chart source contains generated/random/time helpers; generated values must be captured before approval if activated by a variant."
    - "Chart source contains tpl; raw templating extension slots need explicit ownership and review."
    - "Rendered output includes cluster-scoped RBAC; production promotion needs RBAC review."
    - "Rendered output includes admission webhooks; live readiness/certificate observations are required after apply."
  knownControlPoints:
    - "source-lock"
    - "dependency-lock"
    - "capability-profile"
    - "variant-revision"
    - "rendered-manifest-scan"
    - "helm-equivalence"
    - "generated-facts"
    - "tpl-extension-slots"
    - "cluster-rbac"
    - "webhooks"
  proofFocus: "service mesh control plane, webhooks, RBAC"
