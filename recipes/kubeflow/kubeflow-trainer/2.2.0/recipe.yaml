apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Recipe"
metadata:
  name: "kubeflow-kubeflow-trainer"
  version: "2.2.0"
spec:
  chartRef:
    sourceLock: "source-lock.yaml"
    dependencyLock: "dependency-lock.yaml"
  importMode: "render-and-vendor"
  currentExecutableFixture:
    installerPackage: "../../../../packages/kubeflow/kubeflow-trainer/2.2.0"
    setupCommand:
      - "cub"
      - "installer"
      - "setup"
      - "--pull"
      - "../../../../packages/kubeflow/kubeflow-trainer/2.2.0"
      - "--non-interactive"
      - "--namespace"
      - "kubeflow"
  variants:
    - "variants/default/variant.yaml"
    - "variants/aicr-eks-training-v0-20-0/variant.yaml"
    - "variants/aicr-eks-training-v1-0-0/variant.yaml"
