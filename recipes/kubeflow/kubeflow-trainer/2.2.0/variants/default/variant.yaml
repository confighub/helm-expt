apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "Variant"
metadata:
  name: "default"
spec:
  recipe: "../../recipe.yaml"
  namespace: "kubeflow"
  releaseName: "kubeflow-trainer"
  valuesProfile: "../../effective-values.yaml"
  capabilityProfile:
    kubeVersion: "1.31.0"
    apiVersions:
      []
  hookPolicy: "no-hooks"
  targetFacts:
    requiredCRDs:
      -
        name: "clustertrainingruntimes.trainer.kubeflow.org"
        sourceVariant: "default"
        purpose: "CRD included in this base and applied before the controllers that reconcile it"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
      -
        name: "jobsets.jobset.x-k8s.io"
        sourceVariant: "default"
        purpose: "CRD included in this base and applied before the controllers that reconcile it"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
      -
        name: "trainingruntimes.trainer.kubeflow.org"
        sourceVariant: "default"
        purpose: "CRD included in this base and applied before the controllers that reconcile it"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
      -
        name: "trainjobs.trainer.kubeflow.org"
        sourceVariant: "default"
        purpose: "CRD included in this base and applied before the controllers that reconcile it"
        deliveryLanes:
          - "regularHelm"
          - "cubInstallerApply"
          - "configHubKubectlApply"
          - "configHubOciArgo"
        applyMode: "server-side"
