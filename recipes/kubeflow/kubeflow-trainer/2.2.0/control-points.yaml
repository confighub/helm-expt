apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ControlPoints"
metadata:
  name: "kubeflow-kubeflow-trainer-2.2.0"
spec:
  points:
    -
      category: "source-lock"
      status: "handled"
      evidence: "source-lock.yaml"
    -
      category: "dependency-lock"
      status: "handled"
      evidence: "dependency-lock.yaml"
      dependencyCount: 2
    -
      category: "capability-profile"
      status: "handled"
      kubeVersion: "1.31.0"
    -
      category: "lifecycle-policy"
      status: "handled"
      policy: "no-hooks"
      note: "no base's render contains a Helm hook object, with or without --no-hooks"
    -
      category: "crd-lifecycle"
      status: "review-required"
      count: 4
    -
      category: "target-facts"
      status: "review-required"
      note: "the four CRDs must be established before the two controllers start; each controller writes its own webhook certificate into a Secret the base creates empty, and until it has, the webhook configurations reject writes to its custom resources"
    -
      category: "catalog-coverage"
      status: "packaged-with-controls"
      note: "exact source and deterministic package are retained; publication, live qualification and production support remain separate gates"
