    chart: "longhorn/longhorn"
    version: "1.12.1"
    variants:
      - "default"
    helmObjectsByVariant:
      default: 50
    cubInstallObjectsByVariant:
      default: 51
    helmMatchByVariant:
      default: "50/50"
