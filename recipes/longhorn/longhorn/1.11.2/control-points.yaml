apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ControlPoints"
metadata:
  name: "longhorn-longhorn-1.11.2"
spec:
  points:
    -
      category: "source-lock"
      status: "handled"
      evidence: "source-lock.yaml"
    -
      category: "dependency-lock"
      status: "handled"
      evidence: "dependency-lock.yaml"
      note: "chart has no subchart dependencies"
    -
      category: "capability-profile"
      status: "handled"
      kubeVersion: "1.30.0"
      note: "render is bound to the named Kubernetes capability profile."
    -
      category: "crd-policy"
      status: "variant-controlled"
      variants:
        default: 22
        ui-ingress: 22
      note: "Longhorn CRDs are ordinary rendered objects in both promoted variants and still need lifecycle/upgrade policy."
    -
      category: "hook-policy"
      status: "handled-for-render"
      policy: "no-hooks"
      note: "pre-upgrade checker hooks are excluded from the render proof; lifecycle policy must handle them before production."
    -
      category: "admission-webhook"
      status: "scan-and-observe"
      objects:
        - "v1|Service|longhorn-system|longhorn-admission-webhook"
        - "v1|Service|longhorn-system|longhorn-recovery-backend"
    -
      category: "cluster-rbac"
      status: "scan-and-review"
      object: "rbac.authorization.k8s.io/v1|ClusterRole||longhorn-role"
    -
      category: "privileged-storage-workload"
      status: "scan-and-review"
      object: "apps/v1|DaemonSet|longhorn-system|longhorn-manager"
    -
      category: "storageclass-policy"
      status: "scan-and-review"
      object: "v1|ConfigMap|longhorn-system|longhorn-storageclass"
    -
      category: "ui-ingress-policy"
      status: "variant-controlled"
      object: "networking.k8s.io/v1|Ingress|longhorn-system|longhorn-ingress"
    -
      category: "installer-support-object"
      status: "handled"
      object: "v1|Namespace||longhorn-system"
