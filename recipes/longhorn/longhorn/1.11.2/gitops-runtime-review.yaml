apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "GitOpsRuntimeReview"
metadata:
  name: "longhorn-ui-ingress-argocd-ingress-and-storage-health"
  chart: "longhorn/longhorn"
  version: "1.11.2"
spec:
  base: "ui-ingress"
  controller: "Argo CD"
  targetShape: "cub-lk/kind proof rig with target profile kind-ingress-nginx"
  receipt: "runs/live-helm-confighub-compare/longhorn-longhorn-ui-ingress/receipt.yaml"
  observedResult: "pass"
  targetProfile:
    name: "kind-ingress-nginx"
    provides:
      - "Ingress controller for ingressClassName=nginx"
      - "Ingress status.loadBalancer.ingress=localhost on kind"
  passed:
    - "regular Helm live leg reached the harness-defined runtime state"
    - "ConfigHub direct-apply leg reached the harness-defined runtime state"
    - "ConfigHub OCI/Argo leg reached the harness-defined workload runtime state"
    - "Helm-vs-ConfigHub semantic parity passed for the OCI/Argo leg"
    - "Argo CD reported the application Synced"
    - "Argo CD reported the application Healthy"
    - "Longhorn manager, driver deployer, engine image, UI, and CSI workloads became ready in the chart's longhorn-system namespace"
    - "Longhorn UI Ingress was rendered and applied with host longhorn.example.test and ingressClassName nginx"
    - "Longhorn UI Ingress received status.loadBalancer.ingress=localhost"
  gitOpsCondition:
    sync: "Synced"
    health: "Healthy"
    healthResource:
      apiVersion: "networking.k8s.io/v1"
      kind: "Ingress"
      namespace: "longhorn-system"
      name: "longhorn-ingress"
  diagnosis:
    summary: "The previous watch row was target-fit, not parity. When the proof target includes the kind-ingress-nginx profile, the UI Ingress receives a localhost address and Argo reports Healthy."
    observedIngress:
      ingressClassName: "nginx"
      host: "longhorn.example.test"
      statusLoadBalancer:
        ingress:
          - hostname: "localhost"
    namespaceModel:
      requestedOciNamespace: "longhorn-system-oci"
      chartResourceNamespace: "longhorn-system"
      interpretation: "Longhorn is namespace-sensitive and renders several resources into longhorn-system. The supported target scope must treat longhorn-system as the authoritative workload namespace."
    storageRuntimeCaution:
      observedDuringRetainedRun: "CSI provisioner pods in an alternate Helm namespace failed RBAC when the chart was exercised outside its expected longhorn-system namespace."
      logSignal: "csistoragecapacities.storage.k8s.io is forbidden for system:serviceaccount:longhorn-system-helm:longhorn-service-account"
      interpretation: "This reinforces the namespace/topology requirement. It is not a ConfigHub semantic-diff finding for the supported longhorn-system scope."
    lifecycleCaution:
      observedDuringProfileRun: "Deleting an alternate Longhorn Helm namespace can be delayed by Longhorn's own validating webhook protecting default resources."
      interpretation: "Longhorn production support still needs explicit uninstall, upgrade, backup, and storage lifecycle policy even when install parity and UI ingress are green."
  nextActions:
    - "Use kind-ingress-nginx for local live proof of the UI ingress base when ingress behavior is part of the test."
    - "Keep longhorn-system as the supported workload namespace unless a separate recipe/base proves another namespace and RBAC model."
    - "Expand the Longhorn runtime check before production promotion so CSI provisioner, CSI plugin, manager, UI, admission webhook, CRDs, StorageClass policy, and UI ingress all have explicit observed conditions."
  notClaimed:
    - "This row does not prove external UI reachability through a production ingress controller."
    - "This row does not prove production storage safety, backup/restore, replica placement, disk scheduling, or upgrade policy."
    - "This row does not prove Longhorn can be safely installed into arbitrary namespaces."
