      - "cub"
      - "installer"
      - "setup"
      - "--pull"
      - "../../../../packages/longhorn/longhorn/1.11.2"
      - "--non-interactive"
      - "--namespace"
      - "longhorn-system"
  variants:
    - "variants/default/variant.yaml"
    - "variants/ui-ingress/variant.yaml"
