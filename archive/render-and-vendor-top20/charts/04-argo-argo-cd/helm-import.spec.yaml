apiVersion: installer.confighub.com/v1alpha1
kind: HelmImportSpec
metadata:
  name: "04-argo-argo-cd"
spec:
  chart:
    repositoryName: "argo"
    repositoryURL: "https://argoproj.github.io/argo-helm"
    resolvedRepositoryURL: "https://argoproj.github.io/argo-helm"
    name: "argo-cd"
    version: "9.5.15"
  render:
    releaseName: "argo-cd"
    namespace: "argo-cd"
    kubeVersion: "1.30.0"
    apiVersions: []
    flags:
      - "--include-crds"
      - "--skip-tests"
      - "--no-hooks"
    valuesFiles:
      - values.yaml
