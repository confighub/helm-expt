apiVersion: installer.confighub.com/v1alpha1
kind: HelmImportSpec
metadata:
  name: "09-k8s-dashboard-kubernetes-dashboard"
spec:
  chart:
    repositoryName: "k8s-dashboard"
    repositoryURL: "https://kubernetes.github.io/dashboard"
    resolvedRepositoryURL: "https://kubernetes.github.io/dashboard"
    name: "kubernetes-dashboard"
    version: "7.14.0"
  render:
    releaseName: "kubernetes-dashboard"
    namespace: "kubernetes-dashboard"
    kubeVersion: "1.30.0"
    apiVersions: []
    flags:
      - "--include-crds"
      - "--skip-tests"
      - "--no-hooks"
    valuesFiles:
      - values.yaml
