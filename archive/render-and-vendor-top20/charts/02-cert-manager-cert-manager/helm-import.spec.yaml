apiVersion: installer.confighub.com/v1alpha1
kind: HelmImportSpec
metadata:
  name: "02-cert-manager-cert-manager"
spec:
  chart:
    repositoryName: "cert-manager"
    repositoryURL: "https://charts.jetstack.io"
    resolvedRepositoryURL: "https://charts.jetstack.io"
    name: "cert-manager"
    version: "1.20.2"
  render:
    releaseName: "cert-manager"
    namespace: "cert-manager"
    kubeVersion: "1.30.0"
    apiVersions: []
    flags:
      - "--include-crds"
      - "--skip-tests"
      - "--no-hooks"
    valuesFiles:
      - values.yaml
