apiVersion: installer.confighub.com/v1alpha1
kind: HelmImportSpec
metadata:
  name: "08-traefik-traefik"
spec:
  chart:
    repositoryName: "traefik"
    repositoryURL: "https://traefik.github.io/charts"
    resolvedRepositoryURL: "https://traefik.github.io/charts"
    name: "traefik"
    version: "40.2.0"
  render:
    releaseName: "traefik"
    namespace: "traefik"
    kubeVersion: "1.30.0"
    apiVersions: []
    flags:
      - "--include-crds"
      - "--skip-tests"
      - "--no-hooks"
    valuesFiles:
      - values.yaml
