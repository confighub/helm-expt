name: Anonymous OCI CI proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/anonymous-oci-ci-proof.yml
      - scripts/run-anonymous-oci-ci-proof.mjs
      - package.json

permissions:
  contents: read

jobs:
  prove-anonymous-oci-work:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUB_VERSION: v0.2.1
      INSTALLER_COMMIT: 0b553b3c35bd629bad1784e07dfe0bc77af7432c
      PROOF_HOME: /tmp/anonymous-oci-home

    steps:
      - name: Check out helm-expt
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
        with:
          version: 1.3.2

      - name: Install YAML support
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Install cub and its installer plugin
        env:
          HOME: ${{ env.PROOF_HOME }}
        run: |
          mkdir -p "$HOME/.confighub/plugins"
          export VERSION="$CUB_VERSION"
          curl -fsSL https://hub.confighub.com/cub/install.sh | bash
          git init "$HOME/.confighub/plugins/installer"
          git -C "$HOME/.confighub/plugins/installer" remote add origin https://github.com/confighub/installer.git
          git -C "$HOME/.confighub/plugins/installer" fetch --depth 1 origin "$INSTALLER_COMMIT"
          git -C "$HOME/.confighub/plugins/installer" checkout --detach FETCH_HEAD
          make -C "$HOME/.confighub/plugins/installer" build
          GOBIN="$HOME/.confighub/bin" go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
          echo "$HOME/.confighub/bin" >> "$GITHUB_PATH"

      - name: Prove OCI to work to OCI
        env:
          HOME: ${{ env.PROOF_HOME }}
          HELM_EXPT_PROOF_ARTIFACT_DIR: artifacts/anonymous-oci-ci-proof
        run: node scripts/run-anonymous-oci-ci-proof.mjs --run

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-oci-ci-proof
          path: artifacts/anonymous-oci-ci-proof
          if-no-files-found: error
