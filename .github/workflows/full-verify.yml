name: Full verify chain

# The repository's gates live in one chain, `npm run verify`, and CI ran six of
# them. Everything else was checked only by whoever remembered to run the chain
# locally, which meant a lane could go red on main and stay there. Several had:
# turning this on found gates failing on main that no pull request had ever been
# told about.
#
# This runs the whole chain on every pull request, in shards. End to end the
# chain takes around forty minutes, which as a single job would be a tax rather
# than a safety net, and that cost is what kept most of it out of CI in the
# first place. Every step is a read-only check over committed bytes, so the
# order they run in carries no meaning and the chain splits cleanly.
#
# Two jobs rather than one. Most gates need nothing beyond Node, git and a YAML
# reader, and they run as a matrix on bare runners. Thirty-two of them re-render
# a package through the cub installer, read an OCI artifact through oras, or
# template a chart through helm, and none of that can be done by reading files.
# Those run in their own job so the install cost is paid once instead of six
# times, and so a hiccup reaching hub.confighub.com cannot mask a real failure
# in the offline gates.
#
# Twenty-four gates were already failing on main when this was written, with
# nothing in CI to notice. They are declared in tests/verify-chain-known-red.yaml
# and carried rather than fixed here, because the alternative was to leave the
# chain out of CI until someone worked through them. A declared gate that starts
# passing fails the run, so the list can only shrink.
#
# This does not replace the site and text gates. A three-minute answer about a
# stale rendered page is worth more than the same answer inside a longer run,
# and both start at once.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to what the other workflows already install, so a gate that shells
  # out here meets the same toolchain it meets there. Assert, never assume.
  CUB_VERSION: v0.2.1
  INSTALLER_COMMIT: 0b553b3c35bd629bad1784e07dfe0bc77af7432c
  ORAS_VERSION: 1.3.2
  ORAS_LINUX_AMD64_SHA256: 9229ccc6d17bb282039ad4a69abb16dcb887a5bce567c075d731d9b3c7ad8eaf
  HELM_VERSION: "4.1.4"
  EXPECTED_HELM_VERSION: "v4.1.4+g05fa379"

jobs:
  offline-gates:
    name: gates ${{ matrix.shard }} of 6
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # One red shard is the answer; the others finish so a run reports every
      # independent failure rather than only the first to trip.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Check out helm-expt
        uses: actions/checkout@v6
        with:
          # Several gates run `git ls-files` and `git grep` over tracked files,
          # including the gitignored-but-tracked receipts under runs/.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install the YAML reader the generators shell out to
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Run this shard of the verify chain
        run: node scripts/run-verify-shard.mjs --shard ${{ matrix.shard }} --of 6 --without-cli --allow-known-red

  cli-gates:
    name: gates needing a command-line tool
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out helm-expt
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install the YAML reader the generators shell out to
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install Helm
        run: |
          archive="$RUNNER_TEMP/helm.tar.gz"
          curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" -o "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
          actual="$(helm version --short)"
          if [ "$actual" != "$EXPECTED_HELM_VERSION" ]; then
            echo "Helm build $actual is not the one the receipts record, $EXPECTED_HELM_VERSION" >&2
            exit 1
          fi

      - name: Install ORAS
        run: |
          archive="$RUNNER_TEMP/oras.tar.gz"
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" -o "$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" oras
          sudo install -m 0755 "$RUNNER_TEMP/oras" /usr/local/bin/oras

      - name: Install cub and its installer plugin
        run: |
          mkdir -p "$HOME/.confighub/plugins"
          export VERSION="$CUB_VERSION"
          curl -fsSL https://hub.confighub.com/cub/install.sh | bash
          git init "$HOME/.confighub/plugins/installer"
          git -C "$HOME/.confighub/plugins/installer" remote add origin https://github.com/confighub/installer.git
          git -C "$HOME/.confighub/plugins/installer" fetch --depth 1 origin "$INSTALLER_COMMIT"
          git -C "$HOME/.confighub/plugins/installer" checkout --detach FETCH_HEAD
          make -C "$HOME/.confighub/plugins/installer" build
          echo "$HOME/.confighub/bin" >> "$GITHUB_PATH"

      - name: Run the gates that shell out
        run: node scripts/run-verify-shard.mjs --shard 1 --of 1 --only-cli --allow-known-red
