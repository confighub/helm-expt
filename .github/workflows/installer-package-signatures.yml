name: Installer package signatures

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COSIGN_VERSION: "3.1.3"
  COSIGN_LINUX_AMD64_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71

jobs:
  verify:
    name: verify package and index signatures
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out helm-expt
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install the YAML reader
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      - name: Install pinned cosign
        run: |
          binary="$RUNNER_TEMP/cosign"
          curl -fsSL "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" -o "$binary"
          echo "$COSIGN_LINUX_AMD64_SHA256  $binary" | sha256sum -c -
          sudo install -m 0755 "$binary" /usr/local/bin/cosign
          cosign version

      - name: Check committed signature evidence
        run: |
          npm run installer-oci:signatures:verify
          npm run installer-oci:signatures:self-test
          npm run installer-oci:index-signature:verify
          npm run installer-oci:index-signature:self-test

      - name: Verify signatures cryptographically
        run: |
          npm run installer-oci:signatures:verify-crypto
          npm run installer-oci:signatures:crypto-self-test
          npm run installer-oci:index-signature:verify-crypto
          npm run installer-oci:index-signature:crypto-self-test
