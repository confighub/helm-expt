name: Anonymous OCI transformation proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/anonymous-oci-transform-proof.yml
      - scripts/transform-config-oci.mjs
      - scripts/run-anonymous-oci-transform-proof.mjs
      - data/byo-helm-values-review/reviewed-render.yaml
      - data/anonymous-oci-transform-proof/**
      - examples/anonymous-oci-transform/**
      - runs/byo-helm-values-proof/public-oci-receipt.yaml
      - runs/anonymous-oci-transform-proof/**
      - package.json

permissions:
  contents: read

jobs:
  prove-anonymous-oci-transformation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORAS_VERSION: 1.3.2
      ORAS_LINUX_AMD64_SHA256: 9229ccc6d17bb282039ad4a69abb16dcb887a5bce567c075d731d9b3c7ad8eaf
      PROOF_HOME: /tmp/anonymous-oci-transform-home

    steps:
      - name: Check out helm-expt
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install YAML support
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Install ORAS
        run: |
          archive="$RUNNER_TEMP/oras.tar.gz"
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" -o "$archive"
          echo "$ORAS_LINUX_AMD64_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" oras
          sudo install -m 0755 "$RUNNER_TEMP/oras" /usr/local/bin/oras

      - name: Verify the committed receipt and OCI
        run: npm run anonymous-oci-transform:verify

      - name: Pull, change, check, rebuild, and pull back
        env:
          HOME: ${{ env.PROOF_HOME }}
          HELM_EXPT_PROOF_ARTIFACT_DIR: artifacts/anonymous-oci-transform-proof
        run: npm run anonymous-oci-transform:proof

      - name: Upload receipt and output OCI
        uses: actions/upload-artifact@v6
        with:
          name: anonymous-oci-transform-proof
          path: artifacts/anonymous-oci-transform-proof
          if-no-files-found: error
