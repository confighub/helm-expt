name: Public configuration question
description: Send a public Helm, AICR, OCI, or Kubernetes configuration case that should become a checked answer, named refusal, or documented limit.
title: "Problem chart: <repo/chart> <version>"
labels:
  - chart-analysis
  - product-proof
  - challenge-intake
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sending a configuration question. Public cases that expose a missing answer or a wrong assumption help improve the Catalog.

        Please do not paste private values, secrets, credentials, private repository URLs, or customer data. If the chart or values are private, describe the shape and use a managed/private support channel instead.

        We aim to acknowledge a complete report within two business days and post a Catalog answer, refusal, or evidence decision within seven days. Rendering alone does not make a case known-good; a maintainer must reproduce and classify it first.
  - type: dropdown
    id: question_code
    attributes:
      label: What decision were you trying to make?
      options:
        - "ai-values: AI wrote these values. What did they actually change?"
        - "ignored-values: I set a value. Why did the rendered object not change?"
        - "upgrade-risk: Can I upgrade this chart without breaking production?"
        - "custom-field: The chart does not expose the field I need. Must I fork it?"
        - "lifecycle-work: How should Argo CD or Flux handle this chart's hooks and CRDs?"
        - "rollback-history: Can I roll back to exactly what ran before?"
        - "config-diff: How is this candidate different from production?"
        - "fleet-image: Where does this vulnerable image run, and how can I update it safely?"
        - "install-shape: What will this install, and what must already exist?"
        - "supply-drift: Do these version and digest records identify the same bytes?"
        - "other: Another question"
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What were you trying to find out?
      description: State the question in your own words. This helps us improve the catalog around real decisions rather than chart names alone.
      placeholder: "Why did replicas stay at one after I set replicaCount to three?"
    validations:
      required: true
  - type: input
    id: chart
    attributes:
      label: Public source
      description: Helm repository/name, Artifact Hub link, AICR recipe, OCI reference, public Git path, or other public source.
      placeholder: "bitnami/redis or oci://registry/repository@sha256:..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Exact version or digest
      placeholder: "25.5.3 or sha256:..."
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Inputs and choices
      description: Public values, flags, source choices, capability profile, namespace, release name, and whether hooks/CRDs were included.
      placeholder: |
        helm template ...
        values.yaml:
          ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What the source tool does, or what you expected the configuration to produce.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: What did Config Workshop, the Catalog, the package, the check, or ConfigHub do instead?
    validations:
      required: true
  - type: dropdown
    id: failure_type
    attributes:
      label: What kind of issue is this?
      options:
        - Render differs from Helm
        - Installer package differs from captured render
        - Live cluster behavior differs
        - Hook or lifecycle behavior is missing
        - CRD/API/capability behavior is wrong
        - Secret/target prerequisite is unclear
        - Variant choice is missing or confusing
        - Documentation or command is wrong
        - AICR, OCI, or Kubernetes YAML case is missing
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Commands and links needed to reproduce with public inputs.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Logs, diffs, receipts, or screenshots
      description: Attach or paste public artifacts only. Redact secrets.
    validations:
      required: false
  - type: checkboxes
    id: public_only
    attributes:
      label: Public-data check
      options:
        - label: I have not included secrets, credentials, private repository URLs, private values, or customer data.
          required: true
