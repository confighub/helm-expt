name: Site feedback
description: Comments, questions, or corrections for the ConfigHub Helm Ops site.
title: "Site feedback: <page or topic>"
labels: ["site-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for anything about the public site: wording, navigation, broken links, confusing pages, or questions.
        For a chart that fails or misbehaves, use the "Problem chart report" template instead.
  - type: input
    id: page
    attributes:
      label: Page
      description: The page this is about, if any.
      placeholder: https://confighub.github.io/helm-expt/site/try.html
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you were trying to do or find.
    validations:
      required: false
  - type: textarea
    id: found
    attributes:
      label: What you found
      description: What was wrong, missing, or confusing.
    validations:
      required: true
