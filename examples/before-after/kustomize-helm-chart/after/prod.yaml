apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: checkout-cache
    app.kubernetes.io/name: checkout-cache
    app.kubernetes.io/part-of: storefront
    environment: prod
  name: checkout-cache
  namespace: storefront-prod
spec:
  ports:
  - name: cache
    port: 6379
    targetPort: cache
  selector:
    app.kubernetes.io/instance: checkout-cache
    app.kubernetes.io/name: checkout-cache
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: checkout-cache
    app.kubernetes.io/name: checkout-cache
    app.kubernetes.io/part-of: storefront
    app.kubernetes.io/version: "7.4"
    environment: prod
  name: checkout-cache
  namespace: storefront-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: checkout-cache
      app.kubernetes.io/name: checkout-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: checkout-cache
        app.kubernetes.io/name: checkout-cache
    spec:
      containers:
      - args:
        - --maxmemory
        - 128mb
        - --maxmemory-policy
        - allkeys-lru
        image: redis:7.4-alpine
        imagePullPolicy: IfNotPresent
        name: cache
        ports:
        - containerPort: 6379
          name: cache
        resources:
          limits:
            cpu: 200m
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 64Mi
