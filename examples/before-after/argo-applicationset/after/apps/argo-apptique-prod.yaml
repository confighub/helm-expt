# What the ApplicationSet's template renders for this cluster, written by
# `cub argo apply`. move-applications.sh makes a joined cluster's Unit from it.
metadata:
  labels:
    app.kubernetes.io/instance: apptique-prod
    app.kubernetes.io/name: apptique
    environment: prod
  name: apptique-prod
spec:
  destination:
    namespace: apptique-prod
    server: https://kubernetes.default.svc
  project: default
  source:
    path: gitops/argo/beginner-applicationset/apps/apptique/overlays/prod
    repoURL: https://github.com/confighub/examples.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
