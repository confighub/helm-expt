apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/part-of: apptique-examples
    environment: prod
  name: apptique-prod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: apptique
    app.kubernetes.io/name: apptique
    app.kubernetes.io/part-of: apptique-examples
    component: frontend
    environment: prod
  name: frontend
  namespace: apptique-prod
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: apptique
    app.kubernetes.io/name: apptique
    app.kubernetes.io/part-of: apptique-examples
    component: frontend
    environment: prod
  name: frontend
  namespace: apptique-prod
spec:
  ports:
  - name: http
    port: 80
    targetPort: 80
  selector:
    app: apptique
    component: frontend
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: apptique
    app.kubernetes.io/name: apptique
    app.kubernetes.io/part-of: apptique-examples
    component: frontend
    environment: prod
  name: frontend
  namespace: apptique-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: apptique
      component: frontend
  template:
    metadata:
      labels:
        app: apptique
        component: frontend
    spec:
      containers:
      - image: ghcr.io/confighub/apptique-frontend:v1.3.0
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
        name: server
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
        resources:
          limits:
            cpu: 400m
            memory: 256Mi
          requests:
            cpu: 200m
            memory: 128Mi
      serviceAccountName: frontend
