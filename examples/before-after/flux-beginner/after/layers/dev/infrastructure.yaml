# infrastructure on dev: what Flux runs for this layer, reading flux-infrastructure-dev.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  insecure: __CONFIGHUB_OCI_INSECURE__
  interval: 1m
  ref:
    tag: latest
  secretRef:
    name: confighub-flux-targets
  url: oci://__CONFIGHUB_OCI__/space/flux-infrastructure-dev
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./
  prune: true
  sourceRef:
    kind: OCIRepository
    name: infrastructure
