# image-automation on dev-1: what Flux runs for this layer, reading flux-image-automation-dev-1.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: image-automation
  namespace: flux-system
spec:
  insecure: __CONFIGHUB_OCI_INSECURE__
  interval: 1m
  ref:
    tag: latest
  secretRef:
    name: confighub-flux-targets
  url: oci://__CONFIGHUB_OCI__/space/flux-image-automation-dev-1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  dependsOn:
    - name: apps
  interval: 10m
  path: ./
  prune: true
  sourceRef:
    kind: OCIRepository
    name: image-automation
