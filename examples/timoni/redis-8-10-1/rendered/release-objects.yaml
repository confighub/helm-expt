apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 0.0.0-devel
  name: redis
  namespace: redis
---
apiVersion: v1
data:
  redis.conf: |
    maxmemory 512mb
    maxmemory-policy allkeys-lru

    dir /data
    save ""
    appendonly yes

    protected-mode no
    rename-command CONFIG ""
immutable: true
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 0.0.0-devel
  name: redis-dafa22b4
  namespace: redis
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 0.0.0-devel
  name: redis
  namespace: redis
spec:
  ports:
  - name: redis
    port: 6379
    protocol: TCP
    targetPort: redis
  selector:
    app.kubernetes.io/name: redis-master
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: master
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 0.0.0-devel
  name: redis-master
  namespace: redis
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-master
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-master
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: redis-master
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - command:
        - redis-server
        - /redis-master/redis.conf
        image: docker.io/redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 2
          tcpSocket:
            port: redis
          timeoutSeconds: 2
        name: redis
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 2
          timeoutSeconds: 5
        resources:
          limits:
            memory: 544Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /redis-master
          name: config
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: redis
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-master
      - configMap:
          items:
          - key: redis.conf
            path: redis.conf
          name: redis-dafa22b4
        name: config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/component: master
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 0.0.0-devel
  name: redis-master
  namespace: redis
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: replica
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 0.0.0-devel
  name: redis-replica
  namespace: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-replica
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-replica
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: redis-replica
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - command:
        - redis-server
        - --replicaof
        - redis.redis.svc.cluster.local
        - "6379"
        - --include
        - /redis-replica/redis.conf
        image: docker.io/redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 2
          tcpSocket:
            port: redis
          timeoutSeconds: 2
        name: redis
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 2
          timeoutSeconds: 5
        resources:
          limits:
            memory: 544Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /redis-replica
          name: config
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: redis
      volumes:
      - emptyDir: {}
        name: data
      - configMap:
          items:
          - key: redis.conf
            path: redis.conf
          name: redis-dafa22b4
        name: config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: readonly
    app.kubernetes.io/managed-by: timoni
    app.kubernetes.io/name: redis
    app.kubernetes.io/version: 0.0.0-devel
  name: redis-readonly
  namespace: redis
spec:
  ports:
  - name: redis
    port: 6379
    protocol: TCP
    targetPort: redis
  selector:
    app.kubernetes.io/name: redis-replica
  type: ClusterIP
---
