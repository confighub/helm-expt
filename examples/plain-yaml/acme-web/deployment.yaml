apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-web
  namespace: acme-web
  labels:
    app.kubernetes.io/name: acme-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: acme-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acme-web
    spec:
      containers:
        - name: nginx
          image: registry-1.docker.io/bitnami/nginx@sha256:805bcc863fc3f602589fc75cae91eeedebad234d5ce5a476c96b03a747821e7f
          env:
            - name: WELCOME_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: acme-web-content
                  key: welcome
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
