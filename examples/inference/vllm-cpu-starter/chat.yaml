apiVersion: v1
kind: ConfigMap
metadata:
  name: chat
  namespace: inference
  annotations:
    argocd.argoproj.io/sync-wave: "30"
data:
  request: |
    #!/bin/sh
    set -eu
    curl -fsS "$VLLM_URL/v1/chat/completions" \
      -H 'Content-Type: application/json' \
      -d '{"model":"Qwen/Qwen2.5-0.5B-Instruct","messages":[{"role":"user","content":"What is two plus two? Reply with only the number."}],"temperature":0,"max_tokens":8}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  namespace: inference
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
          args:
            - apk add --no-cache curl jq >/dev/null 2>&1 && install -m 0755 /cm/request /usr/local/bin/request-model && exec sleep infinity
          env:
            - name: VLLM_URL
              value: http://vllm-qwen.inference.svc.cluster.local:8000
          volumeMounts:
            - name: cm
              mountPath: /cm
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: cm
          configMap:
            name: chat
            defaultMode: 0755
