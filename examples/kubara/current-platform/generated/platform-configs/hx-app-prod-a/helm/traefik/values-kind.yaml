# Kind proof override: expose Traefik through cub's reserved NodePort window.
traefik:
  service:
    spec:
      type: NodePort
  ports:
    web:
      nodePort: 30020
    websecure:
      nodePort: 30021
  providers:
    kubernetesIngress:
      publishedService:
        enabled: false
      ingressEndpoint:
        hostname: hx-app-prod-a.traefik.me
