apiVersion: "v1"
kind: "Namespace"
metadata:
  name: "c3agent"
  labels:
    app.kubernetes.io/part-of: "c3agent"
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "coding-fleet-config"
  namespace: "c3agent"
  labels:
    app: "c3agent"
    fleet: "coding-fleet"
data:
  AGENT_IMAGE: "ghcr.io/confighubai/c3agent/agent@sha256:b4b997b1401ee2766186b0b0aaa8005a0beae4d7fe69e54175f8e7a01e51163d"
  AGENT_MODEL: "claude-sonnet-4-20250514"
  MAX_BUDGET_USD: "5"
  MAX_CONCURRENT_TASKS: "2"
  SCHEDULE_INTERVAL_SECONDS: "5"
---
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "coding-fleet-controlplane"
  namespace: "c3agent"
  labels:
    app: "c3agent"
    fleet: "coding-fleet"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "Role"
metadata:
  name: "coding-fleet-job-manager"
  namespace: "c3agent"
  labels:
    app: "c3agent"
    fleet: "coding-fleet"
rules:
  -
    apiGroups:
      - "batch"
    resources:
      - "jobs"
    verbs:
      - "create"
      - "get"
      - "list"
      - "delete"
  -
    apiGroups:
      - ""
    resources:
      - "pods"
    verbs:
      - "get"
      - "list"
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "RoleBinding"
metadata:
  name: "coding-fleet-job-manager"
  namespace: "c3agent"
  labels:
    app: "c3agent"
    fleet: "coding-fleet"
subjects:
  -
    kind: "ServiceAccount"
    name: "coding-fleet-controlplane"
    namespace: "c3agent"
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: "Role"
  name: "coding-fleet-job-manager"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "coding-fleet-controlplane"
  namespace: "c3agent"
  labels:
    app: "c3agent"
    fleet: "coding-fleet"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: "coding-fleet-controlplane"
      fleet: "coding-fleet"
  template:
    metadata:
      labels:
        app: "coding-fleet-controlplane"
        fleet: "coding-fleet"
    spec:
      serviceAccountName: "coding-fleet-controlplane"
      containers:
        -
          name: "controlplane"
          image: "ghcr.io/confighubai/c3agent/controlplane@sha256:1445e300634146b4529b9158e765b0ef2c90f65f502194280b169caf8ad27b27"
          envFrom:
            -
              configMapRef:
                name: "coding-fleet-config"
          env:
            -
              name: "ANTHROPIC_API_KEY"
              valueFrom:
                secretKeyRef:
                  name: "c3agent-runtime-secrets"
                  key: "anthropic-api-key"
            -
              name: "GH_TOKEN"
              valueFrom:
                secretKeyRef:
                  name: "c3agent-runtime-secrets"
                  key: "gh-token"
                  optional: true
          ports:
            -
              name: "grpc"
              containerPort: 50050
            -
              name: "http"
              containerPort: 8080
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "coding-fleet-controlplane"
  namespace: "c3agent"
  labels:
    app: "c3agent"
    fleet: "coding-fleet"
spec:
  selector:
    app: "coding-fleet-controlplane"
    fleet: "coding-fleet"
  ports:
    -
      name: "grpc"
      port: 50050
      targetPort: 50050
    -
      name: "http"
      port: 8080
      targetPort: 8080
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "coding-fleet-gateway"
  namespace: "c3agent"
  labels:
    app: "c3agent"
    fleet: "coding-fleet"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: "coding-fleet-gateway"
      fleet: "coding-fleet"
  template:
    metadata:
      labels:
        app: "coding-fleet-gateway"
        fleet: "coding-fleet"
    spec:
      serviceAccountName: "coding-fleet-controlplane"
      containers:
        -
          name: "gateway"
          image: "ghcr.io/confighubai/c3agent/gateway@sha256:5563a8ecc65c277a58dd3b5185429170375a5f2819571abdd98c269dd5a5b6ac"
          envFrom:
            -
              configMapRef:
                name: "coding-fleet-config"
          env:
            -
              name: "ANTHROPIC_API_KEY"
              valueFrom:
                secretKeyRef:
                  name: "c3agent-runtime-secrets"
                  key: "anthropic-api-key"
            -
              name: "GH_TOKEN"
              valueFrom:
                secretKeyRef:
                  name: "c3agent-runtime-secrets"
                  key: "gh-token"
                  optional: true
          ports:
            -
              name: "grpc"
              containerPort: 50052
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "coding-fleet-gateway"
  namespace: "c3agent"
  labels:
    app: "c3agent"
    fleet: "coding-fleet"
spec:
  selector:
    app: "coding-fleet-gateway"
    fleet: "coding-fleet"
  ports:
    -
      name: "grpc"
      port: 50052
      targetPort: 50052
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "coding-fleet-job-template"
  namespace: "c3agent"
  labels:
    app: "c3agent"
    fleet: "coding-fleet"
data:
  image: "ghcr.io/confighubai/c3agent/agent@sha256:b4b997b1401ee2766186b0b0aaa8005a0beae4d7fe69e54175f8e7a01e51163d"
  secretName: "c3agent-runtime-secrets"
  note: "The control plane creates agent Jobs from this recorded runtime selection."
