apiVersion: helm-expt.confighub.com/v1alpha1
kind: Stack
metadata:
  name: kubara-platform
spec:
  description: "The composition proposal's second stage-one target: a Kubara platform of cert-manager, Traefik, and metrics-server, composed from the catalog's certified renders. A second producer's parts through the same verbs."
  components:
    # Each render is the exact committed object set a certified-bundle receipt
    # names and the verify chain re-checks on every pull request. The receipt
    # field carries the provenance even though the render form reads the
    # committed file directly.
    - name: cert-manager
      order: 0
      render: "packages/jetstack/cert-manager/v1.21.0/bases/crds-enabled/upstream.yaml"
      receipt: data/certified-bundles/receipts/catalog/cert-manager-v1.21.0-crds-enabled/receipt.yaml
    - name: traefik
      order: 1
      render: "packages/traefik/traefik/41.0.2/bases/default/upstream.yaml"
      receipt: data/certified-bundles/receipts/catalog/traefik-traefik-41.0.2-default/receipt.yaml
    - name: metrics-server
      order: 2
      render: "packages/metrics-server/metrics-server/3.13.1/bases/default/upstream.yaml"
      receipt: data/certified-bundles/receipts/catalog/metrics-server-3.13.1-default/receipt.yaml
