apiVersion: helm-expt.confighub.com/v1alpha1
kind: Stack
metadata:
  name: app-platform
spec:
  description: "A full platform for a web application: database, cache, ingress, certificates, and monitoring. The shape a Spring Boot app lands on."
  components:
    - name: cert-manager
      render: "data/adversarial10/charts/jetstack-cert-manager-v1.20.2/rendered/default.yaml"
    - name: ingress-nginx
      render: "data/adversarial10/charts/ingress-nginx-ingress-nginx-4.15.1/rendered/default.yaml"
    - name: postgresql
      render: "data/adversarial10/charts/bitnami-postgresql-18.6.7/rendered/default.yaml"
    - name: redis
      render: "data/adversarial10/charts/bitnami-redis-25.5.3/rendered/default.yaml"
    - name: kube-prometheus-stack
      render: "data/adversarial10/charts/prometheus-community-kube-prometheus-stack-85.3.3/rendered/default.yaml"
