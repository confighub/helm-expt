apiVersion: helm-expt.confighub.com/v1alpha1
kind: Stack
metadata:
  name: gitops-secrets
spec:
  description: "A delivery control plane: Argo CD, External Secrets, and cert-manager, three CRD-shipping components composed together."
  components:
    - name: cert-manager
      render: "data/adversarial10/charts/jetstack-cert-manager-v1.20.2/rendered/default.yaml"
    - name: external-secrets
      render: "data/adversarial10/charts/external-secrets-external-secrets-2.5.0/rendered/default.yaml"
    - name: argo-cd
      render: "data/adversarial10/charts/argo-cd-argo-cd-9.5.15/rendered/default.yaml"
