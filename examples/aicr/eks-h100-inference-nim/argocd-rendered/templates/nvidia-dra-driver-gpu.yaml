---
# Source: aicr-bundle/templates/nvidia-dra-driver-gpu.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "16"
    name: nvidia-dra-driver-gpu
    namespace: argocd
spec:
    destination:
        namespace: nvidia-dra-driver
        server: https://kubernetes.default.svc
    project: default
    source:
        chart: nvidia-dra-driver-gpu
        helm:
            values: |-
                controller:
                  affinity:
                    nodeAffinity: null
                  podAnnotations:
                    aicr.nvidia.com/gpu-operator-chart-version: v26.3.1
                  priorityClassName: ""
                  tolerations:
                  - operator: Exists
                fullnameOverride: nvidia-dra-driver-gpu
                gpuResourcesEnabledOverride: true
                kubeletPlugin:
                  nodeSelector:
                    nvidia.com/gpu.present: "true"
                  podAnnotations:
                    aicr.nvidia.com/gpu-operator-chart-version: v26.3.1
                  priorityClassName: ""
                  tolerations:
                  - operator: Exists
                nvidiaDriverRoot: /run/nvidia/driver
                resources:
                  gpus:
                    enabled: true
        repoURL: https://helm.ngc.nvidia.com/nvidia
        targetRevision: 25.12.0
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
