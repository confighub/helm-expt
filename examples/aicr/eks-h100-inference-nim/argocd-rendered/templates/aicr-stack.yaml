---
# Source: aicr-bundle/templates/aicr-stack.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "aicr-stack"
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt/aicr-bundle"
    targetRevision: "0.14.0"
    path: "."
    helm:
      valuesObject:
        repoURL: oci://europe-west1-docker.pkg.dev/nth-fort-499605-q5/helm-expt
        targetRevision: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply: required for charts whose CRDs exceed kubectl's
      # 262144-byte client-side annotation cap. See application.yaml.tmpl
      # in the upstream argocd deployer for the full rationale.
      - ServerSideApply=true
