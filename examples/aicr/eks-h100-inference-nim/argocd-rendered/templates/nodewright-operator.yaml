---
# Source: aicr-bundle/templates/nodewright-operator.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "8"
    name: nodewright-operator
    namespace: argocd
spec:
    destination:
        namespace: skyhook
        server: https://kubernetes.default.svc
    project: default
    source:
        chart: skyhook-operator
        helm:
            values: |-
                controllerManager:
                  manager:
                    resources:
                      limits:
                        cpu: 1000m
                        memory: 4000Mi
                      requests:
                        cpu: 1000m
                        memory: 2000Mi
                  tolerations:
                  - operator: Exists
                fullnameOverride: skyhook-operator
                limitRange:
                  default:
                    cpu: "1"
                    memory: 1Gi
                  defaultRequest:
                    cpu: 500m
                    memory: 512Mi
        repoURL: https://helm.ngc.nvidia.com/nvidia/skyhook
        targetRevision: 0.15.1
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
