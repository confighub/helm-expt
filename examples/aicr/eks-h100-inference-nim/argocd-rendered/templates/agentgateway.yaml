---
# Source: aicr-bundle/templates/agentgateway.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "5"
    name: agentgateway
    namespace: argocd
spec:
    destination:
        namespace: agentgateway-system
        server: https://kubernetes.default.svc
    project: default
    source:
        chart: agentgateway
        helm:
            values: |-
                fullnameOverride: agentgateway
                inferenceExtension:
                  enabled: true
                resources:
                  limits:
                    cpu: 500m
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
                tolerations:
                - operator: Exists
        repoURL: oci://cr.agentgateway.dev/charts/agentgateway
        targetRevision: v2.2.1
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
