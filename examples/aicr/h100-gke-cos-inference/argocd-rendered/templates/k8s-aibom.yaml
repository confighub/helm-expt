---
# Source: aicr-bundle/templates/k8s-aibom.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "1"
    name: 'k8s-aibom'
    namespace: argocd
spec:
    destination:
        namespace: k8s-aibom-system
        server: 'https://kubernetes.default.svc'
    project: 'default'
    source:
        chart: k8s-aibom
        helm:
            values: |-
                config:
                  bomGeneration:
                    inlineThresholdBytes: 262144
                    staleThresholdReconciles: 3
                  discovery: {}
                  logging:
                    format: json
                    level: info
                  sinks: []
                image:
                  digest: sha256:f8e48d4edc44e6ee8e40a2ac6c5f60b190aa18d411a75702dc5798a77a039e8d
                  repository: ghcr.io/googlecloudplatform/k8s-aibom
                  tag: ""
                nodeSelector: {}
                podSecurityContext:
                  fsGroup: 2000
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                rbac:
                  sinkSecretAccess: false
                readiness:
                  strictConfig: true
                resources:
                  limits:
                    cpu: "1"
                    memory: 256Mi
                  requests:
                    cpu: 50m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 65532
                tolerations:
                - operator: Exists
        repoURL: oci://ghcr.io/googlecloudplatform/charts/k8s-aibom
        targetRevision: 1.3.0
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
