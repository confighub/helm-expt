---
# Source: aicr-bundle/templates/k8s-aibom.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "1"
    name: 'k8s-aibom'
    namespace: argocd
spec:
    destination:
        namespace: k8s-aibom-system
        server: 'https://kubernetes.default.svc'
    project: 'default'
    source:
        chart: k8s-aibom
        helm:
            values: |-
                config:
                  bomGeneration:
                    inlineThresholdBytes: 262144
                    staleThresholdReconciles: 3
                  discovery: {}
                  logging:
                    format: json
                    level: info
                  sinks: []
                image:
                  digest: sha256:7b02731563a5ec524ed3396a07a524b02e3f51e17c976e02e65fc680b51e8164
                  repository: ghcr.io/googlecloudplatform/k8s-aibom
                  tag: ""
                nodeSelector:
                  nodeGroup: system-worker
                podSecurityContext:
                  fsGroup: 2000
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                rbac:
                  sinkSecretAccess: false
                readiness:
                  strictConfig: true
                resources:
                  limits:
                    cpu: "1"
                    memory: 256Mi
                  requests:
                    cpu: 50m
                    memory: 128Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 65532
                tolerations:
                - operator: Exists
        repoURL: oci://ghcr.io/googlecloudplatform/charts/k8s-aibom
        targetRevision: 1.5.1
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
