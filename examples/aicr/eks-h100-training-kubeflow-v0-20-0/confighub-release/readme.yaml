    # Publish the approved AICR v0.20.0 production release

    Production receives the same named ChangeOrder as staging, requires approval, and publishes the accepted configuration as an immutable OCI release.

    Use this Space to confirm the approved production configuration and the OCI release built from it.

    ## Why this example exists

    Promotion and deployment are separate decisions. Promotion moves reviewed configuration into production; release publication creates the OCI artifact a controller can consume.

    Keeping both records makes it possible to prove which change was accepted and which bytes were published.

    ## What this example shows

    - Production follows staging in the recorded variant chain.
    - The same ChangeOrder identifies the revision range promoted through both environments.
    - ConfigHub requires approval before it can publish the system configuration.
    - The release OCI is pulled by manifest digest and compared with all 17 promoted Applications.

    ## Where each setting comes from

    | Place | What this Space records |
    | --- | --- |
    | Starting configuration | Open the upstream Space or source link named on this page. That is the configuration this Space started from. |
    | ConfigHub changes | Open Unit revision history. It records changes made after the starting configuration was saved. |
    | Install work | Use the linked chart or route evidence for required Secrets, CRDs, hooks, setup jobs, and target facts. |
    | Live cluster | Use target observations to compare the cluster with the reviewed Units. A live-only edit is drift until it is recorded or removed. |

    If an upstream change and a local ConfigHub revision touch the same field, review the overlap before promotion.

    ## What to inspect in Hub

    - This README.
    - The configuration Unit and revision history.
    - The ChangeOrder and promotion receipt.
    - The release record and OCI manifest digest.
    - The lifecycle plans before connecting an EKS destination.

    ## Evidence and source

    - [AICR v0.20.0 guide](https://github.com/confighub/helm-expt/blob/main/docs/demo/aicr/eks-h100-training-kubeflow-v0-20-0.md)
    - [Development-to-production promotion](https://github.com/confighub/helm-expt/blob/main/examples/aicr/eks-h100-training-kubeflow-v0-20-0/promotion-readiness-receipt.yaml)
    - [Required-approval check](https://github.com/confighub/helm-expt/blob/main/examples/aicr/eks-h100-training-kubeflow-v0-20-0/apply-policy-receipt.yaml)
    - [Approved ConfigHub release OCI](https://github.com/confighub/helm-expt/blob/main/examples/aicr/eks-h100-training-kubeflow-v0-20-0/confighub-release-oci-receipt.yaml)
    - [Destination lifecycle plans](https://github.com/confighub/helm-expt/blob/main/data/aicr-v0-20-0-route-resolution/summary.md)

    ## Limits

    - The release OCI proves publication and content. It does not prove that Argo CD or Flux reconciled it.
    - EKS, H100 runtime, training, observation, and rollback remain untested for this configuration.
