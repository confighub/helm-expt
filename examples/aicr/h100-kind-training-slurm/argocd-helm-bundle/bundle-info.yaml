apiVersion: aicr.run/v1
build:
  deployer: argocd-helm
  recipe:
    digest: sha256:5ead2b26e285e65a0991d1f2f3a2dfdd9b9eedb5f47aff102d6ac0299d4d1230
    path: recipe.yaml
    version: 1.0.0
  settings:
    appName: aicr-stack
    attested: false
    checksums: true
    nodeScheduling:
      accelerated:
        selector:
          nvidia.com/gpu.present: "true"
        tolerations:
          - operator: Exists
      system:
        selector:
          nodeGroup: system-worker
        tolerations:
          - operator: Exists
    readinessHooks: false
    serial: false
    storageClass: gp3
    vendorCharts: false
kind: BundleInfo
layout:
  entrypoint: Chart.yaml
  releases:
    - component: cert-manager
      manifest: templates/cert-manager.yaml
      name: cert-manager
      namespace: cert-manager
      path: 001-cert-manager
    - component: nfd
      manifest: templates/nfd.yaml
      name: nfd
      namespace: node-feature-discovery
      path: 002-nfd
    - component: network-operator
      manifest: templates/network-operator.yaml
      name: network-operator
      namespace: nvidia-network-operator
      path: 003-network-operator
    - component: nodewright-operator
      manifest: templates/nodewright-operator.yaml
      name: nodewright-operator
      namespace: nodewright
      path: 004-nodewright-operator
    - component: prometheus-operator-crds
      manifest: templates/prometheus-operator-crds.yaml
      name: prometheus-operator-crds
      namespace: monitoring
      path: 005-prometheus-operator-crds
    - component: kube-prometheus-stack
      manifest: templates/kube-prometheus-stack.yaml
      name: kube-prometheus-stack
      namespace: monitoring
      path: 006-kube-prometheus-stack
    - component: gpu-operator
      manifest: templates/gpu-operator.yaml
      name: gpu-operator
      namespace: gpu-operator
      path: 007-gpu-operator
    - component: k8s-ephemeral-storage-metrics
      manifest: templates/k8s-ephemeral-storage-metrics.yaml
      name: k8s-ephemeral-storage-metrics
      namespace: monitoring
      path: 008-k8s-ephemeral-storage-metrics
    - component: kai-scheduler
      manifest: templates/kai-scheduler.yaml
      name: kai-scheduler
      namespace: kai-scheduler
      path: 009-kai-scheduler
    - component: nvidia-dra-driver-gpu
      manifest: templates/nvidia-dra-driver-gpu.yaml
      name: nvidia-dra-driver-gpu
      namespace: nvidia-dra-driver
      path: 010-nvidia-dra-driver-gpu
    - component: nvsentinel
      manifest: templates/nvsentinel.yaml
      name: nvsentinel
      namespace: nvsentinel
      path: 011-nvsentinel
    - component: prometheus-adapter
      manifest: templates/prometheus-adapter.yaml
      name: prometheus-adapter
      namespace: monitoring
      path: 012-prometheus-adapter
    - component: slinky-slurm-operator-crds
      manifest: templates/slinky-slurm-operator-crds.yaml
      name: slinky-slurm-operator-crds
      namespace: slinky
      path: 013-slinky-slurm-operator-crds
    - component: slinky-slurm-operator
      manifest: templates/slinky-slurm-operator.yaml
      name: slinky-slurm-operator
      namespace: slinky
      path: 014-slinky-slurm-operator
    - component: slinky-slurm
      manifest: templates/slinky-slurm-pre.yaml
      name: slinky-slurm-pre
      namespace: slurm
      path: 015-slinky-slurm-pre
    - component: slinky-slurm
      manifest: templates/slinky-slurm.yaml
      name: slinky-slurm
      namespace: slurm
      path: 016-slinky-slurm
    - component: slinky-topograph
      manifest: templates/slinky-topograph.yaml
      name: slinky-topograph
      namespace: topograph
      path: 017-slinky-topograph
metadata:
  version: 1.0.0
