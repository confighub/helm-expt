---
# Source: aicr-bundle/templates/slinky-slurm.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "9"
    name: 'slinky-slurm'
    namespace: argocd
spec:
    destination:
        namespace: slurm
        server: 'https://kubernetes.default.svc'
    project: 'default'
    source:
        chart: slurm
        helm:
            values: |-
                accounting:
                  enabled: false
                  podSpec:
                    nodeSelector: {}
                    tolerations:
                    - operator: Exists
                  storageConfig:
                    database: slurm_acct_db
                    host: mariadb
                    passwordKeyRef:
                      key: password
                      name: mariadb-password
                    port: 3306
                    username: slurm
                configFiles:
                  cgroup.conf: |
                    CgroupPlugin=autodetect
                    IgnoreSystemd=yes
                    EnableControllers=yes
                    ConstrainCores=yes
                    ConstrainRAMSpace=yes
                    ConstrainDevices=yes
                    ConstrainSwapSpace=yes
                    AllowedRAMSpace=95.0
                    AllowedSwapSpace=100.0
                  gres.conf: |
                    AutoDetect=nvidia
                  plugstack.conf: |
                    include /usr/share/pyxis/*
                  topology.conf: |
                    # Managed by NVIDIA Topograph (engine: slinky). Pre-sync placeholder.
                    SwitchName=aicr-preseed Nodes=aicr-preseed-node
                controller:
                  extraConfMap:
                    ScronParameters: enable
                    SelectType: select/cons_tres
                    TopologyPlugin: topology/tree
                  inplaceReconfigure: true
                  logfile:
                    image:
                      tag: 3.23.3
                  metrics:
                    enabled: true
                  persistence:
                    accessModes:
                    - ReadWriteOnce
                    enabled: true
                    resources:
                      requests:
                        storage: 4Gi
                    storageClassName: null
                  podSpec:
                    nodeSelector: {}
                    tolerations:
                    - operator: Exists
                enroot:
                  config:
                    ENROOT_MOUNT_HOME: "yes"
                    ENROOT_REMAP_ROOT: "yes"
                  env:
                    NCCL_DEBUG: WARN
                loginsets:
                  slinky:
                    enabled: true
                    extraSshdConfig: |
                      PasswordAuthentication no
                      PermitEmptyPasswords no
                      ChallengeResponseAuthentication no
                    initconf:
                      image:
                        tag: 3.23.3
                    login:
                      image:
                        digest: sha256:9e782d1a645aff1dedc498d7a3256733cde55a152659f44716e8a5f0dca02028
                        repository: ghcr.io/slinkyproject/login-pyxis
                        tag: 26.05-ubuntu26.04
                      volumeMounts:
                      - mountPath: /etc/enroot/enroot.conf
                        name: enroot-config
                        readOnly: true
                        subPath: enroot.conf
                      - mountPath: /etc/enroot/environ.d/99-aicr-defaults.env
                        name: enroot-config
                        readOnly: true
                        subPath: 99-aicr-defaults.env
                    podSpec:
                      nodeSelector: {}
                      tolerations:
                      - operator: Exists
                      volumes:
                      - configMap:
                          name: slinky-slurm-enroot-config
                        name: enroot-config
                    replicas: 1
                    rootSshAuthorizedKeys: |
                      # PLACEHOLDER -- override via valuesFile or --set before deploy
                      # ssh-ed25519 AAAA... user@example.com
                nodesets:
                  slinky:
                    enabled: true
                    logfile:
                      image:
                        tag: 3.23.3
                    partition:
                      configMap:
                        Default: "YES"
                        MaxTime: "24:00:00"
                        State: UP
                      enabled: true
                    podSpec:
                      nodeSelector: {}
                      tolerations:
                      - operator: Exists
                      volumes:
                      - configMap:
                          name: slinky-slurm-enroot-config
                        name: enroot-config
                    replicas: 1
                    scalingMode: StatefulSet
                    slurmd:
                      image:
                        digest: sha256:0c03f87d5b5725df2d11392702fb647922b3060c076e9ce4b4f13c9a67c904b3
                        repository: ghcr.io/slinkyproject/slurmd-pyxis
                        tag: 26.05-ubuntu26.04
                      volumeMounts:
                      - mountPath: /etc/enroot/enroot.conf
                        name: enroot-config
                        readOnly: true
                        subPath: enroot.conf
                      - mountPath: /etc/enroot/environ.d/99-aicr-defaults.env
                        name: enroot-config
                        readOnly: true
                        subPath: 99-aicr-defaults.env
                restapi:
                  podSpec:
                    nodeSelector: {}
                    tolerations:
                    - operator: Exists
                  replicas: 1
                  service:
                    spec:
                      type: ClusterIP
                  slurmrestd:
                    resources:
                      limits:
                        cpu: 500m
                        memory: 512Mi
                      requests:
                        cpu: 100m
                        memory: 128Mi
                sssd:
                  conf: |
                    [sssd]
                    config_file_version = 2
                    services = nss,pam
                    domains = LOCAL
                
                    [nss]
                    filter_groups = root,slurm
                    filter_users = root,slurm
                
                    [pam]
                
                    [domain/LOCAL]
                    id_provider = files
                    auth_provider = files
                storage:
                  data:
                    name: shared-data
                    size: 100Gi
                    storageClassName: ""
                  enabled: false
                  home:
                    name: shared-home
                    size: 100Gi
                    storageClassName: ""
                vendor:
                  nvidia:
                    dcgm:
                      enabled: false
        repoURL: oci://ghcr.io/slinkyproject/charts/slurm
        targetRevision: 1.2.0
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
