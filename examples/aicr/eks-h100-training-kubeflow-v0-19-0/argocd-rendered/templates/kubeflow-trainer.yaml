---
# Source: aicr-eks-h100-training-kubeflow-argocd/templates/kubeflow-trainer.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "13"
    name: 'kubeflow-trainer'
    namespace: argocd
spec:
    destination:
        namespace: kubeflow
        server: 'https://kubernetes.default.svc'
    project: 'default'
    source:
        chart: kubeflow-trainer
        helm:
            values: |-
                acceleratedNodeSelector:
                  nvidia.com/gpu.present: "true"
                acceleratedTolerations:
                - operator: Exists
                crds:
                  install: true
                fullnameOverride: kubeflow-trainer
                jobset:
                  controller:
                    tolerations:
                    - operator: Exists
                  enabled: true
                manager:
                  leaderElection:
                    enabled: true
                  logging:
                    verbosity: 0
                  metrics:
                    enabled: true
                    serviceMonitor:
                      enabled: true
                  podSecurityContext:
                    runAsNonRoot: true
                  resources:
                    limits:
                      cpu: 500m
                      memory: 512Mi
                    requests:
                      cpu: 100m
                      memory: 256Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
                    readOnlyRootFilesystem: true
                  serviceAccount:
                    annotations: {}
                    create: true
                    name: ""
                  tolerations:
                  - operator: Exists
                webhook:
                  enabled: true
                  port: 9443
        repoURL: oci://ghcr.io/kubeflow/charts/kubeflow-trainer
        targetRevision: 2.2.0
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
