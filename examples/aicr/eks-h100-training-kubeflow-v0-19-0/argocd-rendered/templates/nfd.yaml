---
# Source: aicr-eks-h100-training-kubeflow-argocd/templates/nfd.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "1"
    name: 'nfd'
    namespace: argocd
spec:
    destination:
        namespace: node-feature-discovery
        server: 'https://kubernetes.default.svc'
    project: 'default'
    source:
        chart: node-feature-discovery
        helm:
            values: |-
                gc:
                  enable: true
                  tolerations:
                  - operator: Exists
                master:
                  enable: true
                  tolerations:
                  - operator: Exists
                topologyUpdater:
                  createCRDs: true
                  enable: true
                  kubeletStateDir: ""
                  resources:
                    limits:
                      memory: 256Mi
                    requests:
                      cpu: 50m
                      memory: 128Mi
                  tolerations:
                  - operator: Exists
                worker:
                  enable: true
                  tolerations:
                  - operator: Exists
        repoURL: https://kubernetes-sigs.github.io/node-feature-discovery/charts
        targetRevision: 0.19.0
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
