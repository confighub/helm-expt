apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    confighub.com/origin: "{\"spaceId\":\"aea74e5a-26f9-4f7b-8251-16d568d9f304\",\"spaceSlug\":\"aicr-eks-h100-training-kubeflow-v0-19-0-argocd-staging\",\"unitId\":\"1abf38f1-f744-4d9e-bdf0-7f1b78552d2a\",\"unitSlug\":\"aicr-eks-h100-training-kubeflow\",\"revisionNum\":3}"
  name: 'prometheus-adapter'
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: 'https://kubernetes.default.svc'
  project: 'default'
  source:
    chart: prometheus-adapter
    helm:
      values: |-
        metricsRelistInterval: 30s
        prometheus:
          port: 9090
          url: http://kube-prometheus-prometheus
        replicas: 1
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        rules:
          custom:
          - metricsQuery: last_over_time(<<.Series>>[1m])
            name:
              as: gpu_utilization
              matches: DCGM_FI_DEV_GPU_UTIL
            resources:
              overrides:
                namespace:
                  resource: namespace
                pod:
                  resource: pod
            seriesQuery: DCGM_FI_DEV_GPU_UTIL{namespace!="",pod!=""}
          - metricsQuery: last_over_time(<<.Series>>[1m])
            name:
              as: gpu_memory_used
              matches: DCGM_FI_DEV_FB_USED
            resources:
              overrides:
                namespace:
                  resource: namespace
                pod:
                  resource: pod
            seriesQuery: DCGM_FI_DEV_FB_USED{namespace!="",pod!=""}
          - metricsQuery: last_over_time(<<.Series>>[1m])
            name:
              as: gpu_power_usage
              matches: DCGM_FI_DEV_POWER_USAGE
            resources:
              overrides:
                namespace:
                  resource: namespace
                pod:
                  resource: pod
            seriesQuery: DCGM_FI_DEV_POWER_USAGE{namespace!="",pod!=""}
          - metricsQuery: last_over_time(<<.Series>>{<<.LabelMatchers>>}[1m])
            name:
              as: workload_gpu_utilization
              matches: DCGM_FI_DEV_GPU_UTIL
            resources:
              overrides:
                exported_namespace:
                  resource: namespace
                exported_pod:
                  resource: pod
            seriesQuery: DCGM_FI_DEV_GPU_UTIL{exported_namespace!="",exported_pod!=""}
          - metricsQuery: last_over_time(<<.Series>>{<<.LabelMatchers>>}[1m])
            name:
              as: workload_gpu_memory_used
              matches: DCGM_FI_DEV_FB_USED
            resources:
              overrides:
                exported_namespace:
                  resource: namespace
                exported_pod:
                  resource: pod
            seriesQuery: DCGM_FI_DEV_FB_USED{exported_namespace!="",exported_pod!=""}
          default: false
          external:
          - metricsQuery: avg(avg_over_time(DCGM_FI_DEV_GPU_UTIL[2m]))
            name:
              as: dcgm_gpu_utilization
              matches: DCGM_FI_DEV_GPU_UTIL
            resources:
              namespaced: false
            seriesQuery: DCGM_FI_DEV_GPU_UTIL
          - metricsQuery: avg(avg_over_time(DCGM_FI_DEV_FB_USED[2m]))
            name:
              as: dcgm_gpu_memory_used
              matches: DCGM_FI_DEV_FB_USED
            resources:
              namespaced: false
            seriesQuery: DCGM_FI_DEV_FB_USED
          - metricsQuery: avg(avg_over_time(DCGM_FI_DEV_POWER_USAGE[2m]))
            name:
              as: dcgm_gpu_power_usage
              matches: DCGM_FI_DEV_POWER_USAGE
            resources:
              namespaced: false
            seriesQuery: DCGM_FI_DEV_POWER_USAGE
        tolerations:
        - operator: Exists
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 5.3.0
