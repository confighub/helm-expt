        imagePullPolicy: IfNotPresent
        args:
          - --metrics-bind-address=:8080
          - --health-probe-bind-address=:8081
          - --leader-elect=false
          - --qps=50
          - --burst=300
          - --namespace=kai-scheduler
        env:
        - name: WATCH_NAMESPACE
          value: kai-scheduler
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: "kai-operator"
        - name: MS_REPOSITORY
          value: ghcr.io/kai-scheduler/kai-scheduler
        - name: MS_TAG
          value: v0.14.1
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: probe
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
      tolerations:
        - operator: Exists
