apiVersion: kai.scheduler/v1
kind: Config
metadata:
  name: kai-config
  namespace: kai-scheduler
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "3"
spec:
  namespace: kai-scheduler
  global:
    tolerations:
      - operator: Exists
    replicaCount: 1
    vpa:
      enabled: false
      resourcePolicy:
        containerPolicies:
        - containerName: '*'
          maxAllowed:
            cpu: 2
            memory: 5Gi
          minAllowed:
            cpu: 50m
            memory: 500Mi
      updatePolicy:
        minReplicas: 1
        updateMode: InPlaceOrRecreate

  binder:
    service:
      enabled: true
      image:
        name: binder
        repository: ghcr.io/kai-scheduler/kai-scheduler
        tag: v0.14.1
        pullPolicy: IfNotPresent
    metricsPort: 8080
    resourceReservation:
      namespace: kai-resource-reservation
      serviceAccountName: kai-resource-reservation
      appLabel: kai-resource-reservation
      image:
        name: resourcereservation
        repository: ghcr.io/kai-scheduler/kai-scheduler
        tag: v0.14.1
        pullPolicy: IfNotPresent

  podGrouper:
    service:
      enabled: true
      image:
        name: podgrouper
        repository: ghcr.io/kai-scheduler/kai-scheduler
        tag: v0.14.1
        pullPolicy: IfNotPresent

  podGroupController:
    service:
      enabled: true
      image:
        name: podgroupcontroller
        repository: ghcr.io/kai-scheduler/kai-scheduler
        tag: v0.14.1
        pullPolicy: IfNotPresent

  queueController:
    service:
      enabled: true
      image:
        name: queuecontroller
        repository: ghcr.io/kai-scheduler/kai-scheduler
        tag: v0.14.1
        pullPolicy: IfNotPresent

  admission:
    service:
      enabled: true
      image:
        name: admission
        repository: ghcr.io/kai-scheduler/kai-scheduler
        tag: v0.14.1
        pullPolicy: IfNotPresent
    gpuSharing: false
    queueLabelSelector: false
    webhook:
      port: 443
      targetPort: 9443
      probePort: 8081
      metricsPort: 8080
    gpuPodRuntimeClassName: ""

  nodeScaleAdjuster:
    service:
      enabled: false
      image:
        name: nodescaleadjuster
        repository: ghcr.io/kai-scheduler/kai-scheduler
        tag: v0.14.1
        pullPolicy: IfNotPresent
    args:
      nodeScaleNamespace: kai-scale-adjust
      scalingPodImage:
        name: scalingpod
        repository: ghcr.io/kai-scheduler/kai-scheduler
        tag: v0.14.1
        pullPolicy: IfNotPresent

  scheduler:
    service:
      image:
        name: scheduler
        repository: ghcr.io/kai-scheduler/kai-scheduler
        tag: v0.14.1
        pullPolicy: IfNotPresent
    schedulerService:
      port: 8080
