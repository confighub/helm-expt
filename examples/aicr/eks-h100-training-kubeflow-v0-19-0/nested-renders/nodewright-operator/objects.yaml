apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyhook-operator-controller-manager
  namespace: "skyhook"
  annotations:
    checkov.io/skip1: CKV_K8S_43=Image digest not required - we use tags
  labels:
    app: skyhook-operator-controller-manager
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: skyhook-operator
    app.kubernetes.io/part-of: skyhook-operator
    control-plane: controller-manager
    helm.sh/chart: nodewright-v0.17.1
    app.kubernetes.io/name: nodewright
    app.kubernetes.io/instance: nodewright-operator
    app.kubernetes.io/version: "v0.17.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    # Deployment.spec.selector is immutable. These labels are sourced from the
    # shared chart.managerSelectorLabels helper so the selector-migration
    # pre-upgrade hook compares against the exact same set; if the chart name or
    # release name ever changes the selector, that hook deletes the stale
    # Deployment so `helm upgrade` can recreate it.
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: nodewright
      app.kubernetes.io/instance: nodewright-operator
  template:
    metadata:
      labels:
        app: skyhook-operator-controller-manager
        control-plane: controller-manager
        app.kubernetes.io/name: nodewright
        app.kubernetes.io/instance: nodewright-operator
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:

      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      tolerations:
      - operator: Exists
      containers:
      - command:
        - /manager
        env:
        - name: METRICS_PORT
          value: ":8080"
        - name: PROBE_PORT
          value: ":8081"
        - name: LEADER_ELECTION
          value: "true"
        - name: LOG_LEVEL
          value: "info"
        - name: ENABLE_WEBHOOKS
          value: "true"
        - name: NAMESPACE
          value: skyhook
        - name: IMAGE_PULL_SECRET
          value: ""
        - name: COPY_DIR_ROOT
          value: "/var/lib/skyhook"
        - name: REAPPLY_ON_REBOOT
          value: "false"
        - name: RUNTIME_REQUIRED_TAINT
          value: "skyhook.nvidia.com=runtime-required:NoSchedule"
        - name: PAUSE_IMAGE
          value: "registry.k8s.io/pause:3.10"
        - name: AGENT_IMAGE
          value: ghcr.io/nvidia/nodewright/agent:v6.4.2@sha256:7cd80f5ef351266dc08c3979e802f9dc936a1ed9fd02e199233e7968a3a0de3e
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: "cluster.local"
        image: ghcr.io/nvidia/nodewright/operator:v0.17.0@sha256:1511449bf51f2844b6bb3a03bde3d5590caf2ca283e3e39c0745a8016af2132f
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
        - mountPath: /tmp
          name: webhook-certs
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 20
          successThreshold: 1
          failureThreshold: 2
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 1000m
            memory: 4000Mi
          requests:
            cpu: 1000m
            memory: 2000Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
