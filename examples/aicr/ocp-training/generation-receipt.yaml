      bundledRecipe: "sha256:fd247a3fd3da6cca1b4285a59bf0cd84c82d7cd755a1396447441a3089c67f57"
      note: "The bundled recipe is the selected recipe without the components the bundle leaves out. bundle-info.yaml records its digest, and the rendered sync-waves are compared with it."
    bundleNotes:
      - "Warning: AICR did not configure automatic eviction for nvidia-dra-driver-gpu-ocp: no DRA eviction node label is set, so the kubelet plugin is not descheduled before a GPU driver container restart. The plugin runs on every accelerated node and needs no extra node label. On a driver upgrade the module unload can fail with \"failed to uninstall nvidia driver components\"; on an unchanged-config restart the stale driver rootfs is unmounted underneath the running plugin, which upstream documents as leaving NodePrepareResources unable to build CDI specs for full-GPU allocation, with no error at restart time. Set --dra-eviction-node-label (or scheduling.draEvictionNodeLabel) to opt in; the bundle then carries dra-node-labeler, which applies the label from GFD's nvidia.com/gpu.present, so no node-pool labeling is needed (pass --set dra-node-labeler:enabled=false to provision it yourself)"
      - "Warning: gpu-operator-ocp installs a GPU-managed driver with driver.enabled=true and driver.rdma.enabled=true while network-operator-ocp installs OFED/DOCA, but component readiness gating is disabled. dependencyRefs only orders manifest submission; it does not wait for NicClusterPolicy.status.state=ready before deploying gpu-operator-ocp. Use --readiness-hooks with Helm or Argo CD, or provide an equivalent external barrier; Flux, Helmfile, and the bundle REST API cannot request this gate yet (#2499)."
