---
# Source: aicr-bundle/templates/agentgateway-crds.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "1"
    name: 'agentgateway-crds'
    namespace: argocd
spec:
    destination:
        namespace: agentgateway-system
        server: 'https://kubernetes.default.svc'
    project: 'default'
    source:
        chart: agentgateway-crds
        helm:
            values: |-
                enabled: true
        repoURL: oci://cr.agentgateway.dev/charts/agentgateway-crds
        targetRevision: v1.5.0
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
