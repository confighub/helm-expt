apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "4"
    name: nodewright-operator
    namespace: argocd
spec:
    destination:
        namespace: skyhook
        server: https://kubernetes.default.svc
    project: default
    source:
        chart: skyhook-operator
        helm:
            values: |-
                {{- $static := (.Files.Get "static/nodewright-operator.yaml") | fromYaml | default dict -}}
                {{- $dynamic := index .Values "nodewright" | default dict -}}
                {{- mustMergeOverwrite $static $dynamic | toYaml | nindent 16 }}
        repoURL: https://helm.ngc.nvidia.com/nvidia/skyhook
        targetRevision: 0.15.1
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
