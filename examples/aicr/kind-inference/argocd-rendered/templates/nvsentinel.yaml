---
# Source: aicr-bundle/templates/nvsentinel.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        argocd.argoproj.io/sync-wave: "13"
    name: 'nvsentinel'
    namespace: argocd
spec:
    destination:
        namespace: nvsentinel
        server: 'https://kubernetes.default.svc'
    project: 'default'
    source:
        chart: nvsentinel
        helm:
            values: |-
                fullnameOverride: nvsentinel
                global:
                  initContainerImage:
                    repository: docker.io/library/busybox
                    tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
                  systemNodeSelector:
                    nodeGroup: system-worker
                  systemNodeTolerations:
                  - operator: Exists
                  tolerations:
                  - operator: Exists
                janitor-provider:
                  csp:
                    provider: generic
                labeler:
                  assumeDriverInstalled: true
                networkPolicy:
                  enabled: false
                platformConnector:
                  maxUnavailable: 1
                  resources:
                    limits:
                      cpu: 200m
                      memory: 512Mi
                    requests:
                      cpu: 100m
                      memory: 256Mi
                  updateStrategy: RollingUpdate
                syslog-health-monitor:
                  enabledChecks:
                  - SysLogsXIDError
                  - SysLogsSXIDError
                  - SysLogsGPUFallenOff
                  - SysLogsNICDriverError
                  nicDriverDetection:
                    patterns:
                    - enabled: true
                      name: cmd_exec_timeout
                      processingStrategy: STORE_ONLY
                    - enabled: true
                      name: health_poll_failed
                      processingStrategy: STORE_ONLY
                    - enabled: true
                      name: unrecoverable_err
                      processingStrategy: STORE_ONLY
                    - enabled: true
                      name: netdev_watchdog
                      processingStrategy: STORE_ONLY
                    - enabled: true
                      name: pci_power_insufficient
                      processingStrategy: STORE_ONLY
                    - enabled: true
                      name: port_module_high_temp
                      processingStrategy: STORE_ONLY
                    - enabled: true
                      name: access_reg_failed
                      processingStrategy: STORE_ONLY
                    - enabled: true
                      name: module_unplugged
                      processingStrategy: STORE_ONLY
                    - enabled: true
                      name: mlx5_tx_timeout_detected
                      processingStrategy: STORE_ONLY
                    - enabled: true
                      name: mlx5_rx_timeout_detected
                      processingStrategy: STORE_ONLY
                    - enabled: true
                      name: mlx5_napi_soft_lockup
                      processingStrategy: STORE_ONLY
        repoURL: oci://ghcr.io/nvidia/nvsentinel
        targetRevision: v1.25.0
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
