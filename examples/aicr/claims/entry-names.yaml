apiVersion: catalog.confighub.com/v1alpha1
kind: EntryNamingRegister
metadata:
  name: aicr-entry-naming
spec:
  description: >-
    What each AICR entry is called in prose, and the retained version a page
    has to name when it talks about that entry. The catalog retains exact
    versions, so "the training entry" is only unambiguous while one training
    entry exists. A second retained version turns every version-free reference
    into a guess, and the cheapest time to fix that is before the second entry
    lands rather than after.
  scope:
    pages:
      - docs/demo/aicr
      - docs/reference
    prefix: aicr-
    note: >-
      Pages under docs/demo/aicr are all in scope. Under docs/reference only
      files whose name starts with the prefix are, because that directory holds
      much more than AICR.

  entries:
    - id: eks-h100-training-kubeflow
      page: docs/demo/aicr/eks-h100-training-kubeflow.md
      retainedVersion: v0.14.0
      versionSource: >-
        AICR's own release tag, recorded in the entry's generation receipt and
        in the published platform evidence record.
      names:
        - training entry
        - EKS + H100 + Kubeflow
      # A page that mentions this entry has to name this version somewhere on
      # it. Naming the version once is enough, because the page then reads
      # naturally instead of repeating a tag in every sentence.

    - id: eks-h100-training-kubeflow-v0-18-0
      page: docs/demo/aicr/eks-h100-training-kubeflow-v0-18-0.md
      retainedVersion: v0.18.0
      versionSource: >-
        AICR's release tag. This is the second retained version of the same
        platform, generated from the same criteria as the v0.14.0 entry, and
        its directory carries the version because two entries now share one
        description. The v0.14.0 entry keeps its original path so its receipts,
        control points and published references stay valid, and this register
        is where its version is recorded instead.
      names:
        - v0.18.0 training entry
        - AICR v0.18.0 entry

    - id: eks-h100-training-kubeflow-v0-19-0
      page: docs/demo/aicr/eks-h100-training-kubeflow-v0-19-0.md
      retainedVersion: v0.19.0
      versionSource: >-
        AICR's release tag. This append-only entry uses the same EKS, H100,
        Ubuntu, training, and Kubeflow criteria as the two earlier retained
        versions. Its source verification also binds the signed v0.19.0 CLI
        binary and recipe catalog.
      names:
        - v0.19.0 training entry
        - AICR v0.19.0 entry

    - id: eks-h100-training-kubeflow-v0-20-0
      page: docs/demo/aicr/eks-h100-training-kubeflow-v0-20-0.md
      retainedVersion: v0.20.0
      versionSource: >-
        AICR's release tag. This append-only entry uses the same EKS, H100,
        Ubuntu, training, and Kubeflow criteria as the earlier versions. Its
        source verification binds the signed v0.20.0 CLI, recipe catalog,
        SBOM, generated Applications, and published OCI artifacts.
      names:
        - v0.20.0 training entry
        - AICR v0.20.0 entry

    - id: eks-h100-inference-nim
      page: docs/demo/aicr/eks-h100-inference-nim.md
      retainedVersion: v0.14.0
      versionSource: >-
        The same AICR release as the training entry, since both were generated
        by one pinned binary.
      names:
        - AICR-native inference entry
        - AICR-native NIM platform

    - id: kserve-nim-inference
      page: docs/demo/aicr/kserve-nim-inference.md
      retainedVersion: 3ef33472
      versionSource: >-
        This entry retains a GitHub subtree rather than a release, so its
        version is the exact upstream commit the retention receipt pins. The
        short form is what prose uses, and the receipt carries the full hash.
      names:
        - KServe entry
        - NIM on KServe

    - id: cpu-starter
      page: docs/demo/aicr/cpu-starter.md
      retainedVersion: v0.14.0
      versionSource: >-
        The starter is derived rather than retained, so it carries the version
        of the entry it was derived from. The derivation receipt records that
        source, and the decision on whether the starter tracks one version or
        forks is still open.
      names:
        - CPU starter
        - starter entry

    - id: eks-inference
      page: docs/demo/aicr/eks-inference.md
      retainedVersion: v0.21.0
      versionSource: >-
        AICR's own release tag, recorded in this entry's generation receipt. Mirrored
