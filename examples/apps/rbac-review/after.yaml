apiVersion: v1
kind: Namespace
metadata:
  name: rbac-review
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-reader
  namespace: rbac-review
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-report
  namespace: rbac-review
data:
  status: ready
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: report-reader
  namespace: rbac-review
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: report-reader
  namespace: rbac-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: report-reader
subjects:
  - kind: ServiceAccount
    name: report-reader
    namespace: rbac-review
