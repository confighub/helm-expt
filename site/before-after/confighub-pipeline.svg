<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Today versus with ConfigHub in your delivery pipeline</title>
  <rect width="880" height="236" rx="10" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6e6659"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3b74ad"/>
    </marker>
  </defs>

  <text x="64" y="64" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#6e6659" text-anchor="middle">TODAY</text>

  <rect x="124" y="20" width="212" height="78" rx="9" fill="#f8f6f2" stroke="#d5cec2" stroke-width="1.5"/>
  <text x="230" y="46" font-size="14.5" font-weight="700" fill="#221c15" text-anchor="middle">Git</text>
  <text x="230" y="66" font-size="12" fill="#6e6659" text-anchor="middle">Chart templates, values</text>
  <text x="230" y="82" font-size="12" fill="#6e6659" text-anchor="middle">or Kustomize overlays</text>

  <text x="368" y="50" font-size="11" fill="#6e6659" text-anchor="middle">read</text>
  <path d="M340,59 H394" stroke="#6e6659" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="400" y="20" width="220" height="78" rx="9" fill="#f8f6f2" stroke="#d5cec2" stroke-width="1.5"/>
  <text x="510" y="46" font-size="14.5" font-weight="700" fill="#221c15" text-anchor="middle">Helm, Argo CD or Flux</text>
  <text x="510" y="66" font-size="12" fill="#6e6659" text-anchor="middle">Renders templates or patches</text>
  <text x="510" y="82" font-size="12" fill="#6e6659" text-anchor="middle">at deploy time</text>

  <text x="650" y="50" font-size="11" fill="#6e6659" text-anchor="middle">apply</text>
  <path d="M624,59 H674" stroke="#6e6659" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="680" y="20" width="184" height="78" rx="9" fill="#f7ecd8" stroke="#b5761a" stroke-width="1.5"/>
  <text x="772" y="46" font-size="14.5" font-weight="700" fill="#7c4f0d" text-anchor="middle">Cluster</text>
  <text x="772" y="66" font-size="12" fill="#7c4f0d" text-anchor="middle">Final YAML exists only</text>
  <text x="772" y="82" font-size="12" fill="#7c4f0d" text-anchor="middle">once it runs</text>

  <line x1="16" y1="116" x2="864" y2="116" stroke="#e4dfd5" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="64" y="170" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#1f4d7a" text-anchor="middle">WITH</text>
  <text x="64" y="186" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#1f4d7a" text-anchor="middle">CONFIGHUB</text>

  <rect x="124" y="134" width="146" height="82" rx="9" fill="#ffffff" stroke="#221c15" stroke-width="1.5"/>
  <text x="197" y="159" font-size="13" font-weight="700" fill="#221c15" text-anchor="middle">Git + CI or Catalog</text>
  <text x="197" y="179" font-size="11.5" fill="#6e6659" text-anchor="middle">App code stays in Git;</text>
  <text x="197" y="195" font-size="11.5" fill="#6e6659" text-anchor="middle">render YAML once</text>

  <text x="296" y="166" font-size="10.5" fill="#6e6659" text-anchor="middle">upload</text>
  <path d="M273,175 H317" stroke="#6e6659" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="323" y="130" width="178" height="90" rx="9" fill="#e3edf7" stroke="#3b74ad" stroke-width="2"/>
  <text x="412" y="154" font-size="15" font-weight="700" fill="#1f4d7a" text-anchor="middle">ConfigHub</text>
  <text x="412" y="173" font-size="11.5" fill="#1f4d7a" text-anchor="middle">Base + copy per env;</text>
  <text x="412" y="189" font-size="11.5" fill="#1f4d7a" text-anchor="middle">history and approvals</text>
  <text x="412" y="206" font-size="10.5" fill="#3b74ad" text-anchor="middle">no cluster credentials</text>

  <text x="527" y="166" font-size="10.5" fill="#3b74ad" text-anchor="middle">publish</text>
  <path d="M504,175 H548" stroke="#3b74ad" stroke-width="1.8" marker-end="url(#b)"/>

  <rect x="554" y="134" width="112" height="82" rx="9" fill="#fbe9df" stroke="#ba3d03" stroke-width="1.5"/>
  <text x="610" y="160" font-size="13.5" font-weight="700" fill="#8f2f02" text-anchor="middle">OCI Release</text>
  <text x="610" y="180" font-size="11.5" fill="#8f2f02" text-anchor="middle">Pinned digest</text>
  <text x="610" y="196" font-size="11.5" fill="#8f2f02" text-anchor="middle">of plain YAML</text>

  <text x="688" y="166" font-size="10.5" fill="#6e6659" text-anchor="middle">pull</text>
  <path d="M669,175 H705" stroke="#6e6659" stroke-width="1.8" marker-end="url(#a)"/>

  <rect x="711" y="134" width="153" height="82" rx="9" fill="#e4f3ea" stroke="#1f8a4c" stroke-width="1.5"/>
  <text x="787.5" y="158" font-size="13.5" font-weight="700" fill="#14613a" text-anchor="middle">Argo CD or Flux</text>
  <text x="787.5" y="178" font-size="11.5" fill="#14613a" text-anchor="middle">Pulls release into</text>
  <text x="787.5" y="194" font-size="11.5" fill="#14613a" text-anchor="middle">your cluster</text>
</svg>
