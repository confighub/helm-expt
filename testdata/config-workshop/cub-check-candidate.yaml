apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
  namespace: demo
data:
  MESSAGE: "review <before> & deploy"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: example.com/app:v1
