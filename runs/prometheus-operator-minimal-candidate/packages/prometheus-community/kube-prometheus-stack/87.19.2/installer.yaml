apiVersion: "installer.confighub.com/v1alpha1"
kind: "Package"
metadata:
  name: "kube-prometheus-stack-kube-prometheus-stack"
  version: "87.19.2"
spec:
  bases:
    -
      name: "minimal"
      path: "bases/minimal"
      default: true
      description: "kube-prometheus-stack minimal Prometheus Operator platform variant rendered from prometheus-community/kube-prometheus-stack@87.19.2"
      externalRequires:
        -
          kind: "ClusterFeature"
          name: "CRD alertmanagerconfigs.monitoring.coreos.com"
          suggestedSource: "package://prerequisites/kube-prometheus-stack-lifecycle/default-crds.yaml"
          applyMode: "server-side-force-conflicts"
        -
          kind: "ClusterFeature"
          name: "CRD alertmanagers.monitoring.coreos.com"
          suggestedSource: "package://prerequisites/kube-prometheus-stack-lifecycle/default-crds.yaml"
          applyMode: "server-side-force-conflicts"
        -
          kind: "ClusterFeature"
          name: "CRD podmonitors.monitoring.coreos.com"
          suggestedSource: "package://prerequisites/kube-prometheus-stack-lifecycle/default-crds.yaml"
          applyMode: "server-side-force-conflicts"
        -
          kind: "ClusterFeature"
          name: "CRD probes.monitoring.coreos.com"
          suggestedSource: "package://prerequisites/kube-prometheus-stack-lifecycle/default-crds.yaml"
          applyMode: "server-side-force-conflicts"
        -
          kind: "ClusterFeature"
          name: "CRD prometheusagents.monitoring.coreos.com"
          suggestedSource: "package://prerequisites/kube-prometheus-stack-lifecycle/default-crds.yaml"
          applyMode: "server-side-force-conflicts"
        -
          kind: "ClusterFeature"
          name: "CRD prometheuses.monitoring.coreos.com"
          suggestedSource: "package://prerequisites/kube-prometheus-stack-lifecycle/default-crds.yaml"
          applyMode: "server-side-force-conflicts"
        -
          kind: "ClusterFeature"
          name: "CRD prometheusrules.monitoring.coreos.com"
          suggestedSource: "package://prerequisites/kube-prometheus-stack-lifecycle/default-crds.yaml"
          applyMode: "server-side-force-conflicts"
        -
          kind: "ClusterFeature"
          name: "CRD scrapeconfigs.monitoring.coreos.com"
          suggestedSource: "package://prerequisites/kube-prometheus-stack-lifecycle/default-crds.yaml"
          applyMode: "server-side-force-conflicts"
        -
          kind: "ClusterFeature"
          name: "CRD servicemonitors.monitoring.coreos.com"
          suggestedSource: "package://prerequisites/kube-prometheus-stack-lifecycle/default-crds.yaml"
          applyMode: "server-side-force-conflicts"
        -
          kind: "ClusterFeature"
          name: "CRD thanosrulers.monitoring.coreos.com"
          suggestedSource: "package://prerequisites/kube-prometheus-stack-lifecycle/default-crds.yaml"
          applyMode: "server-side-force-conflicts"
        -
          kind: "ClusterFeature"
          name: "Secret monitoring/kube-prometheus-stack-admission keys ca,cert,key"
          namespace: "monitoring"
          suggestedSource: "package://prerequisites/kube-prometheus-stack-lifecycle/prepare.sh"
  collector:
    command: "/bin/sh"
    args:
      - "collector/target-facts.sh"
    description: "Records target-fact bindings and can live-check cluster-visible Secret and CRD requirements."
