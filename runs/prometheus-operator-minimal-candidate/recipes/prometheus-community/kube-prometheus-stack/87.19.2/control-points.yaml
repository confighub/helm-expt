apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ControlPoints"
metadata:
  name: "kube-prometheus-stack-kube-prometheus-stack-87.19.2"
spec:
  points:
    -
      category: "source-lock"
      status: "handled"
      evidence: "source-lock.yaml"
    -
      category: "dependency-lock"
      status: "handled"
      evidence: "dependency-lock.yaml"
      note: "minimal retains the chart dependency lock while disabling optional components."
    -
      category: "capability-profile"
      status: "handled"
      kubeVersion: "1.30.0"
      note: "The minimal platform render is bound to the named Kubernetes capability profile."
    -
      category: "crd-policy"
      status: "variant-controlled-and-target-fact"
      variants:
        minimal: 10
      note: "minimal renders ten Prometheus Operator CRDs as ordinary objects."
    -
      category: "admission-webhook"
      status: "target-fact-and-observe"
      objects:
        - "admissionregistration.k8s.io/v1|MutatingWebhookConfiguration||kube-prometheus-stack-admission"
        - "admissionregistration.k8s.io/v1|ValidatingWebhookConfiguration||kube-prometheus-stack-admission"
      note: "Config-only delivery stages the admission TLS Secret because Helm creates it through hook lifecycle."
    -
      category: "cluster-rbac"
      status: "scan-and-review"
      evidence: "scan receipts"
    -
      category: "installer-support-object"
      status: "handled"
      object: "v1|Namespace||monitoring"
