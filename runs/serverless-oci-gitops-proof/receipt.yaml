  conclusion: "Proven: a no-login serverless render pushed to an OCI registry was pulled and applied by an existing Flux controller — no kubectl apply of the workload from us. The Secret rode along in the bundle (delivered, but now in the registry). So the 'push to OCI for existing Argo/Flux' mode works serverlessly for a vanilla chart; the honest caveats are secret-in-registry and that hook/CRD charts still need the lifecycle routes."
