    reconcile:
      ok: true
      detail: "OCIRepository Ready=True + Flux applied the serverless-pushed bundle: redis StatefulSet/Service present in ns redis"
    secret:
      ok: true
      detail: "Secret delivered through the OCI bundle (secret/redis) — serverless push ships it; tradeoff: it lives in the registry"
    workload:
      result: "pass"
