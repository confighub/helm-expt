apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ManagedSetupGuidanceReceipt"
metadata:
  name: "managed-setup-guidance-2026-06-30"
spec:
  observedAt: "2026-06-30T20:35:50.113Z"
  result: "pass"
  claim: "The two non-delivery adoption findings are manageable at the setup edge. Customize friction (#1009): every Helm idiom cub rejects (`unknown flag: --set`, `unknown input`) maps to a plain migration hint. Shared placeholder password (#1012): the safer package default uses the existing-secret base, so a normal setup does not bake the shared demo password. The suggested Secret commands generate fresh values before apply."
  customizeGuidance:
    totalIdioms: 5
    guided: 5
    samples:
      -
        idiom: "--set replicaCount=2"
        cubError: "Error: unknown flag: --set"
        guidance: "cub has no `--set`. Declared inputs use `--input KEY=VALUE` (`cub installer doc <pkg>` lists them); most values are set by choosing or editing a kustomize base, not a flag. See docs/user/helm-to-cub-migration.md."
      -
        idiom: "--values values.yaml"
        cubError: "Error: unknown flag: --values"
        guidance: "cub has no values file. Configuration lives in the base (kustomize) — pick or edit a base instead of a `values.yaml`. See docs/user/helm-to-cub-migration.md."
      -
        idiom: "-f values.yaml"
        cubError: "Error: unknown shorthand flag: 'f' in -f"
        guidance: "cub rejected this input. cub uses declared `--input`s plus kustomize bases rather than Helm's `--set`/values files; see docs/user/helm-to-cub-migration.md."
      -
        idiom: "--set-string image.tag=7.4"
        cubError: "Error: unknown flag: --set-string"
        guidance: "cub has no `--set`. Declared inputs use `--input KEY=VALUE` (`cub installer doc <pkg>` lists them); most values are set by choosing or editing a kustomize base, not a flag. See docs/user/helm-to-cub-migration.md."
      -
        idiom: "--input replicaCount=2"
        cubError: "Error: unknown input \"replicaCount\""
        guidance: "cub rejects non-declared inputs by design — this is the typo guard that catches what Helm silently absorbs. To set it: confirm it's a declared input (`cub installer doc <pkg>`), or edit the base."
  secretGuidance:
    charts:
      -
        chart: "bitnami"
        defaultBase: "reuse-existing-secret"
        bakesPassword: false
        passwordKeyCount: 0
        reuseBase: "reuse-existing-secret"
        warning: "No baked password Secret in the default base (`reuse-existing-secret`)."
      -
        chart: "bitnami"
        defaultBase: "existing-secret"
        bakesPassword: false
        passwordKeyCount: 0
        reuseBase: "existing-secret"
        warning: "No baked password Secret in the default base (`existing-secret`)."
    warned: 0
    note: "Secret VALUES are never decoded or printed — only password key names/counts are read, to honor the credential-handling constraint."
  determinismTension: "cub's deterministic render (#1011) and Helm's random-per-install password are different safety models. The package answer is reuse-existing-secret: create or supply the Secret before apply, keep the Secret material outside the rendered chart, and make fixed-password demo bases explicit."
  conclusion: "Both non-delivery findings are managed: opaque Helm-idiom rejections become guided migration hints, and the normal setup path no longer bakes the shared placeholder password. With the delivery applier (managed-cub-direct), all five adoption findings now have a concrete 'manage it'."
