apiVersion: "helm-expt.confighub.com/v1alpha1"
kind: "ManagedSetupGuidanceReceipt"
metadata:
  name: "managed-setup-guidance-2026-06-21"
spec:
  observedAt: "2026-06-21T19:41:55.590Z"
  result: "pass"
  claim: "The two non-delivery adoption findings are manageable at the setup edge. Customize friction (#1009): every Helm idiom cub rejects (`unknown flag: --set`, `unknown input`) maps to a plain migration hint — opaque becomes guided. Shared placeholder password (#1012): the default base bakes a shared placeholder password Secret; the managed layer detects the baked key (without decoding the value) and points to the reuse-existing-secret base. The determinism tension is why cub cannot just generate a random password like Helm — a deterministic render and a random-per-install secret are mutually exclusive — so the honest fix is supply/reference your own secret, and rename the misleading generated-passwords base."
  customizeGuidance:
    totalIdioms: 5
    guided: 5
    samples:
      -
        idiom: "--set replicaCount=2"
        cubError: "Error: unknown flag: --set"
        guidance: "cub has no `--set`. Declared inputs use `--input KEY=VALUE` (`cub installer doc <pkg>` lists them); most values are set by choosing or editing a kustomize base, not a flag. See docs/user/helm-to-cub-migration.md."
      -
        idiom: "--values values.yaml"
        cubError: "Error: unknown flag: --values"
        guidance: "cub has no values file. Configuration lives in the base (kustomize) — pick or edit a base instead of a `values.yaml`. See docs/user/helm-to-cub-migration.md."
      -
        idiom: "-f values.yaml"
        cubError: "Error: unknown shorthand flag: 'f' in -f"
        guidance: "cub rejected this input. cub uses declared `--input`s plus kustomize bases rather than Helm's `--set`/values files; see docs/user/helm-to-cub-migration.md."
      -
        idiom: "--set-string image.tag=7.4"
        cubError: "Error: unknown flag: --set-string"
        guidance: "cub has no `--set`. Declared inputs use `--input KEY=VALUE` (`cub installer doc <pkg>` lists them); most values are set by choosing or editing a kustomize base, not a flag. See docs/user/helm-to-cub-migration.md."
      -
        idiom: "--input replicaCount=2"
        cubError: "Error: unknown input \"replicaCount\""
        guidance: "cub rejects non-declared inputs by design — this is the typo guard that catches what Helm silently absorbs. To set it: confirm it's a declared input (`cub installer doc <pkg>`), or edit the base."
  secretGuidance:
    charts:
      -
        chart: "bitnami"
        defaultBase: "default"
        bakesPassword: true
        passwordKeyCount: 1
        reuseBase: "reuse-existing-secret"
        warning: "The default base (`default`) bakes a password Secret (1 password key(s)) — a shared placeholder, identical for everyone. Use the `reuse-existing-secret` base and supply your own Secret, or replace the placeholder before prod."
      -
        chart: "bitnami"
        defaultBase: "generated-passwords"
        bakesPassword: true
        passwordKeyCount: 2
        reuseBase: "existing-secret"
        warning: "The default base (`generated-passwords`) bakes a password Secret (2 password key(s)) — a shared placeholder, identical for everyone. Use the `existing-secret` base and supply your own Secret, or replace the placeholder before prod."
    warned: 2
    note: "Secret VALUES are never decoded or printed — only password key names/counts are read, to honor the credential-handling constraint."
  determinismTension: "cub's deterministic render (#1011, a real win) and Helm's random-per-install password are mutually exclusive from one render. So the secret answer is reuse-existing-secret (supply/reference your own), not generate-random-in-render. The `generated-passwords` base name promises what determinism forbids and should be renamed."
  conclusion: "Both non-delivery findings are managed: opaque Helm-idiom rejections become guided migration hints, and the baked placeholder password is detected and routed to reuse-existing-secret. With the delivery applier (managed-cub-direct), all five adoption findings now have a concrete 'manage it'."
