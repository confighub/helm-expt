apiVersion: v1
data:
  nginx.conf: "gzip_static  on;\ngzip on;\ngzip_min_length 50000;\ngzip_proxied expired\
    \ no-cache no-store private auth;\ngzip_types\n    application/atom+xml\n    application/geo+json\n\
    \    application/javascript\n    application/x-javascript\n    application/json\n\
    \    application/ld+json\n    application/manifest+json\n    application/rdf+xml\n\
    \    application/rss+xml\n    application/vnd.ms-fontobject\n    application/wasm\n\
    \    application/x-web-app-manifest+json\n    application/xhtml+xml\n    application/xml\n\
    \    font/eot\n    font/otf\n    font/ttf\n    image/bmp\n    image/svg+xml\n\
    \    text/cache-manifest\n    text/calendar\n    text/css\n    text/javascript\n\
    \    text/markdown\n    text/plain\n    text/xml\n    text/x-component\n    text/x-cross-domain-policy;\n\
    \nupstream model {\n        server opencost.default:9003;\n}\n\nserver {\n   \
    \ server_name _;\n    root /var/www;\n    index index.html;\n    large_client_header_buffers\
    \ 4 32k;\n    add_header Cache-Control \"must-revalidate\";\n\n    error_page\
    \ 504 /custom_504.html;\n    location = /custom_504.html {\n        internal;\n\
    \    }\n\n    add_header Cache-Control \"max-age=300\";\n    location / {\n  \
    \      alias /var/www/;\n        try_files $uri /index.html;\n    }\n\n    add_header\
    \ ETag \"1.96.0\";\n    listen 9090;\n    listen [::]:9090;\n    resolver 127.0.0.1\
    \ valid=5s;\n    location /healthz {\n        access_log /dev/null;\n        return\
    \ 200 'OK';\n    }\n    location /model/ {\n        proxy_connect_timeout    \
    \   180;\n        proxy_send_timeout          180;\n        proxy_read_timeout\
    \          180;\n        proxy_pass http://model/;\n        proxy_redirect off;\n\
    \        proxy_http_version 1.1;\n        proxy_set_header Connection \"\";\n\
    \        proxy_set_header  X-Real-IP  $remote_addr;\n        proxy_set_header\
    \  X-Forwarded-For $proxy_add_x_forwarded_for;\n    }\n}\n"
kind: ConfigMap
metadata:
  name: opencost-ui-nginx-config
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checksum/configs: cec26490d4d2e1cbac772c42cbadb405854201371302d413664f32107fa0611c
  labels:
    app.kubernetes.io/instance: opencost
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: opencost
    app.kubernetes.io/part-of: opencost
    app.kubernetes.io/version: 1.120.2
    helm.sh/chart: opencost-2.5.21
  name: opencost
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: opencost
      app.kubernetes.io/name: opencost
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: opencost
        app.kubernetes.io/name: opencost
    spec:
      automountServiceAccountToken: true
      containers:
      - args: null
        env:
        - name: LOG_LEVEL
          value: info
        - name: CUSTOM_COST_ENABLED
          value: 'false'
        - name: INSTALL_NAMESPACE
          value: default
        - name: PROMETHEUS_QUERY_RESOLUTION_SECONDS
          value: '300'
        - name: API_PORT
          value: '9003'
        - name: PROMETHEUS_SERVER_ENDPOINT
          value: http://prometheus-server.prometheus-system.svc.cluster.local:80
        - name: INSECURE_SKIP_VERIFY
          value: 'false'
        - name: CLUSTER_ID
          value: default-cluster
        - name: RESOLUTION_1D_RETENTION
          value: '15'
        - name: RESOLUTION_1H_RETENTION
          value: '49'
        - name: CLOUD_COST_ENABLED
          value: 'false'
        - name: CLOUD_COST_MONTH_TO_DATE_INTERVAL
          value: '6'
        - name: CLOUD_COST_REFRESH_RATE_HOURS
          value: '6'
        - name: CLOUD_COST_QUERY_WINDOW_DAYS
          value: '7'
        - name: CLOUD_COST_RUN_WINDOW_DAYS
          value: '3'
        - name: MCP_SERVER_ENABLED
          value: 'true'
        - name: MCP_HTTP_PORT
          value: '8081'
        image: ghcr.io/opencost/opencost:1.120.2@sha256:5f37f689557dbb6737a9182b70625bba55bbba843a2caaba5a79746945a56cc6
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9003
          initialDelaySeconds: 10
          periodSeconds: 20
        name: opencost
        ports:
        - containerPort: 9003
          name: http
        - containerPort: 8081
          name: mcp-server
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9003
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 10m
            memory: 55Mi
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: 9003
          initialDelaySeconds: 10
          periodSeconds: 5
      - env:
        - name: API_PORT
          value: '9003'
        - name: UI_PORT
          value: '9090'
        image: ghcr.io/opencost/opencost-ui:1.120.2@sha256:3e7fc176315a25e7acca47b670fa78b2620480981e8d34c2e8f64ca6371c8bcc
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        name: opencost-ui
        ports:
        - containerPort: 9090
          name: http-ui
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 10m
            memory: 55Mi
        volumeMounts:
        - mountPath: /etc/nginx/conf.d/default.nginx.conf
          name: opencost-ui-nginx-config-volume
          subPath: default.nginx.conf
      initContainers: null
      serviceAccountName: opencost
      volumes:
      - configMap:
          items:
          - key: nginx.conf
            path: default.nginx.conf
          name: opencost-ui-nginx-config
        name: opencost-ui-nginx-config-volume
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: opencost
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: opencost
    app.kubernetes.io/part-of: opencost
    app.kubernetes.io/version: 1.120.2
    helm.sh/chart: opencost-2.5.21
  name: opencost
  namespace: default
spec:
  ports:
  - name: http
    port: 9003
    targetPort: 9003
  - name: mcp-server
    port: 8081
    targetPort: 8081
  - name: http-ui
    port: 9090
    targetPort: 9090
  selector:
    app.kubernetes.io/instance: opencost
    app.kubernetes.io/name: opencost
  type: ClusterIP
---
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: opencost
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: opencost
