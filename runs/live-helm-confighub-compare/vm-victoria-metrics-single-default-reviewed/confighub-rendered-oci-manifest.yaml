apiVersion: v1
kind: Namespace
metadata:
  name: default-oci
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: victoria-metrics-single
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/version: v1.144.0
    helm.sh/chart: victoria-metrics-single-0.39.0
  name: victoria-metrics-single-server
  namespace: default
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8428
      protocol: TCP
      targetPort: http
  selector:
    app: server
    app.kubernetes.io/instance: victoria-metrics-single
    app.kubernetes.io/name: victoria-metrics-single
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: victoria-metrics-single-0.39.0
  name: victoria-metrics-single-server
  namespace: default
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: victoria-metrics-single
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/version: v1.144.0
    helm.sh/chart: victoria-metrics-single-0.39.0
  name: victoria-metrics-single-server
  namespace: default
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  selector:
    matchLabels:
      app: server
      app.kubernetes.io/instance: victoria-metrics-single
      app.kubernetes.io/name: victoria-metrics-single
  serviceName: victoria-metrics-single-server
  template:
    metadata:
      labels:
        app: server
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: victoria-metrics-single
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-single
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - --envflag.enable
            - --envflag.prefix=VM_
            - --httpListenAddr=:8428
            - --loggerFormat=json
            - --retentionPeriod=1
            - --storageDataPath=/storage
          image: victoriametrics/victoria-metrics:v1.144.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 10
            initialDelaySeconds: 30
            periodSeconds: 30
            tcpSocket:
              port: http
            timeoutSeconds: 5
          name: vmsingle
          ports:
            - containerPort: 8428
              name: http
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext: {}
          volumeMounts:
            - mountPath: /storage
              name: server-volume
      securityContext: {}
      serviceAccountName: victoria-metrics-single-server
      terminationGracePeriodSeconds: 60
      volumes: null
  updateStrategy: {}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: server-volume
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 16Gi
