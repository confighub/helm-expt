            - mountPath: /opt/bitnami/spark/work
              name: empty-dir
              subPath: app-work-dir
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
        seLinuxOptions: {}
        supplementalGroups: []
