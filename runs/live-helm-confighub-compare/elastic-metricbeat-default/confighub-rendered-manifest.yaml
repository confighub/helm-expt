apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: metricbeat-metricbeat
    chart: metricbeat-8.5.1
    heritage: Helm
    release: metricbeat
  name: metricbeat-metricbeat
spec:
  selector:
    matchLabels:
      app: metricbeat-metricbeat
      release: metricbeat
  template:
    metadata:
      annotations:
        configChecksum: 6f110f5ec7f649873ae4d0a93d60f20155932eb45624bca7822f7aac07b03e3
      labels:
        app: metricbeat-metricbeat
        chart: metricbeat-8.5.1
        heritage: Helm
        release: metricbeat
      name: metricbeat-metricbeat
    spec:
      affinity: {}
      containers:
        - args:
            - -e
            - -E
            - http.enabled=true
            - --system.hostfs=/hostfs
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: elasticsearch-master-credentials
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: elasticsearch-master-credentials
          envFrom: []
          image: docker.elastic.co/beats/metricbeat:8.5.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  #!/usr/bin/env bash -e
                  curl --fail 127.0.0.1:5066
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          name: metricbeat
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  #!/usr/bin/env bash -e
                  metricbeat test output
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
          securityContext:
            privileged: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /usr/share/metricbeat/certs/
              name: elasticsearch-master-certs
            - mountPath: /usr/share/metricbeat/metricbeat.yml
              name: metricbeat-config
              readOnly: true
              subPath: metricbeat.yml
            - mountPath: /usr/share/metricbeat/data
              name: data
            - mountPath: /var/run/docker.sock
              name: varrundockersock
              readOnly: true
            - mountPath: /hostfs/proc
              name: proc
              readOnly: true
            - mountPath: /hostfs/sys/fs/cgroup
              name: cgroup
              readOnly: true
      nodeSelector: {}
      serviceAccountName: metricbeat-metricbeat
      terminationGracePeriodSeconds: 30
      tolerations: []
      volumes:
        - name: elasticsearch-master-certs
          secret:
            secretName: elasticsearch-master-certs
        - configMap:
            defaultMode: 384
            name: metricbeat-metricbeat-daemonset-config
          name: metricbeat-config
        - hostPath:
            path: /var/lib/metricbeat-metricbeat-default-data
            type: DirectoryOrCreate
          name: data
        - hostPath:
            path: /var/run/docker.sock
          name: varrundockersock
        - hostPath:
            path: /proc
          name: proc
        - hostPath:
            path: /sys/fs/cgroup
          name: cgroup
  updateStrategy:
    type: RollingUpdate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
