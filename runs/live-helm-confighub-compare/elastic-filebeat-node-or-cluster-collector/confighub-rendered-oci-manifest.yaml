apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: filebeat-filebeat
    chart: filebeat-8.5.1
    heritage: Helm
    release: filebeat
  name: filebeat-filebeat-cluster-role
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - nodes
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: filebeat-filebeat
    chart: filebeat-8.5.1
    heritage: Helm
    release: filebeat
  name: filebeat-filebeat-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: filebeat-filebeat-cluster-role
subjects:
  - kind: ServiceAccount
    name: filebeat-filebeat
    namespace: default
---
apiVersion: v1
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: container
      paths:
        - /var/log/containers/*.log
      processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
          - logs_path:
              logs_path: "/var/log/containers/"

    output.elasticsearch:
      host: '${NODE_NAME}'
      hosts: '["https://${ELASTICSEARCH_HOSTS:elasticsearch-master:9200}"]'
      username: '${ELASTICSEARCH_USERNAME}'
      password: '${ELASTICSEARCH_PASSWORD}'
      protocol: https
      ssl.certificate_authorities: ["/usr/share/filebeat/certs/ca.crt"]
kind: ConfigMap
metadata:
  labels:
    app: filebeat-filebeat
    chart: filebeat-8.5.1
    heritage: Helm
    release: filebeat
  name: filebeat-filebeat-daemonset-config
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: filebeat-filebeat
    chart: filebeat-8.5.1
    heritage: Helm
    release: filebeat
  name: filebeat-filebeat
spec:
  selector:
    matchLabels:
      app: filebeat-filebeat
      release: filebeat
  template:
    metadata:
      annotations:
        configChecksum: c88755a4c60c24e519a9ead083dd5eeadf884b224f64126bb9aae2ca30cd7ed
      labels:
        app: filebeat-filebeat
        chart: filebeat-8.5.1
        heritage: Helm
        release: filebeat
      name: filebeat-filebeat
    spec:
      affinity: {}
      containers:
        - args:
            - -e
            - -E
            - http.enabled=true
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: elasticsearch-master-credentials
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: elasticsearch-master-credentials
          envFrom: []
          image: docker.elastic.co/beats/filebeat:8.5.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  #!/usr/bin/env bash -e
                  curl --fail 127.0.0.1:5066
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          name: filebeat
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  #!/usr/bin/env bash -e
                  filebeat test output
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
          securityContext:
            privileged: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /usr/share/filebeat/certs/
              name: elasticsearch-master-certs
            - mountPath: /usr/share/filebeat/filebeat.yml
              name: filebeat-config
              readOnly: true
              subPath: filebeat.yml
            - mountPath: /usr/share/filebeat/data
              name: data
            - mountPath: /var/lib/docker/containers
              name: varlibdockercontainers
              readOnly: true
            - mountPath: /var/log
              name: varlog
              readOnly: true
            - mountPath: /var/run/docker.sock
              name: varrundockersock
              readOnly: true
      nodeSelector: {}
      serviceAccountName: filebeat-filebeat
      terminationGracePeriodSeconds: 30
      tolerations: []
      volumes:
        - name: elasticsearch-master-certs
          secret:
            secretName: elasticsearch-master-certs
        - configMap:
            defaultMode: 384
            name: filebeat-filebeat-daemonset-config
          name: filebeat-config
        - hostPath:
            path: /var/lib/filebeat-filebeat-default-data
            type: DirectoryOrCreate
          name: data
        - hostPath:
            path: /var/lib/docker/containers
          name: varlibdockercontainers
        - hostPath:
            path: /var/log
          name: varlog
        - hostPath:
            path: /var/run/docker.sock
          name: varrundockersock
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
---
apiVersion: v1
kind: Namespace
metadata:
  name: default-oci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app: filebeat-filebeat
  name: filebeat-filebeat-role
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app: filebeat-filebeat
    chart: filebeat-8.5.1
    heritage: Helm
    release: filebeat
  name: filebeat-filebeat-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: filebeat-filebeat-role
subjects:
  - kind: ServiceAccount
    name: filebeat-filebeat
    namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: filebeat-filebeat
    chart: filebeat-8.5.1
    heritage: Helm
    release: filebeat
  name: filebeat-filebeat
