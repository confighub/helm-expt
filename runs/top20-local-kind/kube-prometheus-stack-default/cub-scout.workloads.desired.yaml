            -
              name: "GF_PATHS_DATA"
              value: "/var/lib/grafana/"
            -
              name: "GF_PATHS_LOGS"
              value: "/var/log/grafana"
            -
              name: "GF_PATHS_PLUGINS"
              value: "/var/lib/grafana/plugins"
            -
              name: "GF_PATHS_PROVISIONING"
              value: "/etc/grafana/provisioning"
            -
              name: "GF_UNIFIED_STORAGE_INDEX_PATH"
              value: "/var/lib/grafana-search/bleve"
          image: "docker.io/grafana/grafana:13.0.1-security-01"
          imagePullPolicy: "IfNotPresent"
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: "/api/health"
              port: "grafana"
            initialDelaySeconds: 60
            timeoutSeconds: 30
          name: "grafana"
          ports:
            -
              containerPort: 3000
              name: "grafana"
              protocol: "TCP"
            -
              containerPort: 9094
              name: "gossip-tcp"
              protocol: "TCP"
            -
              containerPort: 9094
              name: "gossip-udp"
              protocol: "UDP"
            -
              containerPort: 6060
              name: "profiling"
