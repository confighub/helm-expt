              value: "/etc/grafana/provisioning/datasources"
            -
              name: "RESOURCE"
              value: "both"
            -
              name: "REQ_USERNAME"
              valueFrom:
                secretKeyRef:
                  key: "admin-user"
                  name: "kube-prometheus-stack-grafana"
            -
              name: "REQ_PASSWORD"
              valueFrom:
                secretKeyRef:
                  key: "admin-password"
                  name: "kube-prometheus-stack-grafana"
            -
              name: "REQ_URL"
              value: "http://localhost:3000/api/admin/provisioning/datasources/reload"
            -
              name: "REQ_METHOD"
              value: "POST"
