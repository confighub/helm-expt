    chart: "kube-prometheus-stack-85.3.3"
    heritage: "Helm"
    release: "kube-prometheus-stack"
  name: "kube-prometheus-stack-operator"
  namespace: "monitoring"
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: "kube-prometheus-stack-operator"
      release: "kube-prometheus-stack"
