              path: "/api/health"
              port: "grafana"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            privileged: false
            seccompProfile:
              type: "RuntimeDefault"
          volumeMounts:
