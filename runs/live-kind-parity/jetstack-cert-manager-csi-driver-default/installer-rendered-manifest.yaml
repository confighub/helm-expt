apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: cert-manager-csi-driver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cert-manager-csi-driver
    app.kubernetes.io/version: v0.14.0
    helm.sh/chart: cert-manager-csi-driver-v0.14.0
  name: cert-manager-csi-driver
rules:
  - apiGroups:
      - cert-manager.io
    resources:
      - certificaterequests
    verbs:
      - watch
      - create
      - delete
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/instance: cert-manager-csi-driver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cert-manager-csi-driver
    app.kubernetes.io/version: v0.14.0
    helm.sh/chart: cert-manager-csi-driver-v0.14.0
  name: cert-manager-csi-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-csi-driver
subjects:
  - kind: ServiceAccount
    name: cert-manager-csi-driver
    namespace: default
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  labels:
    app.kubernetes.io/instance: cert-manager-csi-driver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cert-manager-csi-driver
    app.kubernetes.io/version: v0.14.0
    helm.sh/chart: cert-manager-csi-driver-v0.14.0
  name: csi.cert-manager.io
spec:
  podInfoOnMount: true
  volumeLifecycleModes:
    - Ephemeral
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/instance: cert-manager-csi-driver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cert-manager-csi-driver
    app.kubernetes.io/version: v0.14.0
    helm.sh/chart: cert-manager-csi-driver-v0.14.0
  name: cert-manager-csi-driver
  namespace: default
spec:
  selector:
    matchLabels:
      app: cert-manager-csi-driver
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: cert-manager-csi-driver
      labels:
        app: cert-manager-csi-driver
        app.kubernetes.io/instance: cert-manager-csi-driver
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: cert-manager-csi-driver
        app.kubernetes.io/version: v0.14.0
        helm.sh/chart: cert-manager-csi-driver-v0.14.0
    spec:
      containers:
        - args:
            - -v=1
            - --csi-address=/plugin/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/cert-manager-csi-driver/csi.sock
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          image: quay.io/jetstack/csi-node-driver-registrar:v2.16.0
          imagePullPolicy: IfNotPresent
          name: node-driver-registrar
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 0
          volumeMounts:
            - mountPath: /plugin
              name: plugin-dir
            - mountPath: /registration
              name: registration-dir
        - args:
            - --csi-address=/plugin/csi.sock
            - --probe-timeout=3s
            - --health-port=9809
            - -v=1
          image: quay.io/jetstack/livenessprobe:v2.18.0
          imagePullPolicy: IfNotPresent
          name: liveness-probe
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 0
          volumeMounts:
            - mountPath: /plugin
              name: plugin-dir
        - args:
            - --log-level=1
            - --driver-name=csi.cert-manager.io
            - --node-id=$(NODE_ID)
            - --endpoint=$(CSI_ENDPOINT)
            - --data-root=csi-data-dir
            - --use-token-request=false
            - --continue-on-not-ready=false
            - --metrics-bind-address=:9402
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CSI_ENDPOINT
              value: unix://plugin/csi.sock
          image: quay.io/jetstack/cert-manager-csi-driver:v0.14.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            timeoutSeconds: 5
          name: cert-manager-csi-driver
          ports:
            - containerPort: 9809
              name: healthz
            - containerPort: 9402
              name: http-metrics
          securityContext:
            capabilities:
              drop:
                - ALL
            privileged: true
            readOnlyRootFilesystem: true
            runAsUser: 0
          volumeMounts:
            - mountPath: /plugin
              name: plugin-dir
            - mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
              name: pods-mount-dir
            - mountPath: /csi-data-dir
              mountPropagation: Bidirectional
              name: csi-data-dir
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: cert-manager-csi-driver
      volumes:
        - hostPath:
            path: /var/lib/kubelet/plugins/cert-manager-csi-driver
            type: DirectoryOrCreate
          name: plugin-dir
        - hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
          name: pods-mount-dir
        - hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
          name: registration-dir
        - hostPath:
            path: /tmp/cert-manager-csi-driver
            type: DirectoryOrCreate
          name: csi-data-dir
---
apiVersion: v1
kind: Namespace
metadata:
  name: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: cert-manager-csi-driver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cert-manager-csi-driver
    app.kubernetes.io/version: v0.14.0
    helm.sh/chart: cert-manager-csi-driver-v0.14.0
  name: cert-manager-csi-driver
  namespace: default
