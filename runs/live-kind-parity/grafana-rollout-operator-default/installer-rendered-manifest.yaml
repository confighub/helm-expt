apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: replicatemplates.rollout-operator.grafana.com
spec:
  group: rollout-operator.grafana.com
  names:
    categories:
      - all
    kind: ReplicaTemplate
    plural: replicatemplates
    singular: replicatemplate
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: Status replicas
          jsonPath: .status.replicas
          name: StatusReplicas
          type: string
        - description: Spec replicas
          jsonPath: .spec.replicas
          name: SpecReplicas
          type: string
      name: v1
      schema:
        openAPIV3Schema:
          properties:
            spec:
              properties:
                labelSelector:
                  type: string
                replicas:
                  default: 1
                  minimum: 0
                  type: integer
              type: object
            status:
              properties:
                replicas:
                  type: integer
              type: object
          type: object
      served: true
      storage: true
      subresources:
        scale:
          labelSelectorPath: .spec.labelSelector
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
        status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zoneawarepoddisruptionbudgets.rollout-operator.grafana.com
spec:
  group: rollout-operator.grafana.com
  names:
    kind: ZoneAwarePodDisruptionBudget
    plural: zoneawarepoddisruptionbudgets
    shortNames:
      - zdpb
    singular: zoneawarepoddisruptionbudget
  scope: Namespaced
  versions:
    - name: v1
      schema:
        openAPIV3Schema:
          properties:
            spec:
              properties:
                maxUnavailable:
                  description: The number of pods that can be unavailable within a zone or partition.
                  minimum: 0
                  type: integer
                maxUnavailablePercentage:
                  description: Calculate the maxUnavailable value as a percentage of the StatefulSet's spec.Replica count. This option is not supported when using podNamePartitionRegex.
                  maximum: 100
                  minimum: 0
                  type: integer
                podNamePartitionRegex:
                  description: A regular expression for returning a partition name given a pod name. This field is optional and should only be used when the ZoneAwarePodDisruptionBudget is to be scoped to a partition, such as a multi-zone ingester deployment with ingest_storage_enabled. Enabling this changes the ZPDB functionality such that minAvailability is applied across ALL zones for a given partition. When not enabled, the minAvailability is applied to pods within the eviction zone assuming there are no disruptions in the other zones.
                  type: string
                podNameRegexGroup:
                  description: The regular expression group number that contains the partition name. This field is only required when the podNamePartitionRegex field is set and has more then one subexpression grouping. The default value is 1.
                  minimum: 1
                  type: integer
                selector:
                  description: A selector for finding pods and statefulsets that this ZoneAwarePodDisruptionBudget applies to.
                  properties:
                    matchLabels:
                      additionalProperties:
                        type: string
                      type: object
                  required:
                    - matchLabels
                  type: object
              required:
                - selector
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: rollout-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rollout-operator
    app.kubernetes.io/version: v0.36.2
    helm.sh/chart: rollout-operator-0.49.0
  name: rollout-operator
  namespace: default
spec:
  minReadySeconds: 10
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: rollout-operator
      app.kubernetes.io/name: rollout-operator
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: rollout-operator
        app.kubernetes.io/name: rollout-operator
      namespace: default
    spec:
      containers:
        - args:
            - -kubernetes.namespace=default
            - -server-tls.enabled=true
            - -server-tls.self-signed-cert.secret-name=certificate
            - -server-tls.self-signed-cert.dns-name=rollout-operator.default.svc
          image: docker.io/grafana/rollout-operator:v0.36.2
          imagePullPolicy: IfNotPresent
          name: rollout-operator
          ports:
            - containerPort: 8001
              name: http-metrics
              protocol: TCP
            - containerPort: 8443
              name: https
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 5
            timeoutSeconds: 1
          resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
          securityContext: {}
      securityContext: {}
      serviceAccountName: rollout-operator
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  labels:
    app.kubernetes.io/instance: rollout-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: rollout-operator
    app.kubernetes.io/version: v0.36.2
    grafana.com/inject-rollout-operator-ca: "true"
    grafana.com/namespace: default
    helm.sh/chart: rollout-operator-0.49.0
  name: prepare-downscale-default
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: rollout-operator
        namespace: default
        path: /admission/prepare-downscale
        port: 443
    failurePolicy: Fail
    matchPolicy: Equivalent
    name: prepare-downscale-default.grafana.com
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: default
    rules:
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - statefulsets
          - statefulsets/scale
        scope: Namespaced
    sideEffects: NoneOnDryRun
    timeoutSeconds: 10
---
