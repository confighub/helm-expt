apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  labels:
    app.kubernetes.io/component: "master"
    app.kubernetes.io/instance: "redis"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/name: "redis"
    app.kubernetes.io/version: "8.8.0"
    helm.sh/chart: "redis-27.0.0"
  name: "redis-master"
  namespace: "redis"
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: "master"
      app.kubernetes.io/instance: "redis"
      app.kubernetes.io/name: "redis"
  serviceName: "redis-headless"
  template:
    metadata:
      annotations:
        checksum/configmap: "62ff2843192643ad74a96fbad607a0b92db3dc81d3a369deaa3fb9aebbd24ddc"
        checksum/health: "a2fc61ae99390643dac0673ed97203805136d4460b2319e7beff10546c1e1140"
        checksum/scripts: "b4230d7912970032380858b68faf87b6171144b993066fe53c7a324fadf43b36"
        checksum/secret: "1b06207570b460c8397883d7d7fcfe0de24bd49091f591a96c1e555dce639d27"
      labels:
        app.kubernetes.io/component: "master"
        app.kubernetes.io/instance: "redis"
        app.kubernetes.io/managed-by: "Helm"
        app.kubernetes.io/name: "redis"
        app.kubernetes.io/version: "8.8.0"
        helm.sh/chart: "redis-27.0.0"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            -
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: "master"
                    app.kubernetes.io/instance: "redis"
                    app.kubernetes.io/name: "redis"
                topologyKey: "kubernetes.io/hostname"
              weight: 1
      automountServiceAccountToken: false
      containers:
        -
          args:
            - "-ec"
            - "/opt/bitnami/scripts/start-scripts/start-master.sh"
          command:
            - "/bin/bash"
          env:
            -
              name: "BITNAMI_DEBUG"
              value: "false"
            -
              name: "REDIS_REPLICATION_MODE"
              value: "master"
            -
              name: "ALLOW_EMPTY_PASSWORD"
              value: "no"
            -
              name: "OPENSSL_FIPS"
              value: "yes"
            -
              name: "REDIS_PASSWORD_FILE"
              value: "/opt/bitnami/redis/secrets/redis-password"
            -
              name: "REDIS_TLS_ENABLED"
              value: "no"
            -
              name: "REDIS_PORT"
              value: "6379"
          image: "registry-1.docker.io/bitnami/redis@sha256:6e7a020f1f6504698a7272c58783bdc2c23588c49febbae5aca1bb8dfa10af25"
          imagePullPolicy: "IfNotPresent"
          livenessProbe:
            exec:
              command:
                - "/bin/bash"
                - "-ec"
                - "/health/ping_liveness_local.sh 5"
            failureThreshold: 5
            initialDelaySeconds: 20
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 6
          name: "redis"
          ports:
            -
              containerPort: 6379
              name: "redis"
          readinessProbe:
            exec:
              command:
                - "/bin/bash"
                - "-ec"
                - "/health/ping_readiness_local.sh 1"
            failureThreshold: 5
            initialDelaySeconds: 20
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 2
          resources:
            limits:
              cpu: "150m"
              ephemeral-storage: "2Gi"
              memory: "192Mi"
            requests:
              cpu: "100m"
              ephemeral-storage: "50Mi"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seLinuxOptions:
              {}
            seccompProfile:
              type: "RuntimeDefault"
          volumeMounts:
            -
              mountPath: "/opt/bitnami/scripts/start-scripts"
              name: "start-scripts"
            -
              mountPath: "/health"
              name: "health"
            -
              mountPath: "/opt/bitnami/redis/secrets/"
              name: "redis-password"
            -
              mountPath: "/data"
              name: "redis-data"
            -
              mountPath: "/opt/bitnami/redis/mounted-etc"
              name: "config"
            -
              mountPath: "/opt/bitnami/redis/etc/"
              name: "empty-dir"
              subPath: "app-conf-dir"
            -
              mountPath: "/tmp"
              name: "empty-dir"
              subPath: "tmp-dir"
      enableServiceLinks: true
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: "Always"
      serviceAccountName: "redis-master"
      terminationGracePeriodSeconds: 30
      volumes:
        -
          configMap:
            defaultMode: 493
            name: "redis-scripts"
          name: "start-scripts"
        -
          configMap:
            defaultMode: 493
            name: "redis-health"
          name: "health"
        -
          name: "redis-password"
          secret:
            items:
              -
                key: "redis-password"
                path: "redis-password"
            secretName: "redis"
        -
          configMap:
            name: "redis-configuration"
          name: "config"
        -
          emptyDir:
            {}
          name: "empty-dir"
  updateStrategy:
    type: "RollingUpdate"
  volumeClaimTemplates:
    -
      apiVersion: "v1"
      kind: "PersistentVolumeClaim"
      metadata:
        labels:
          app.kubernetes.io/component: "master"
          app.kubernetes.io/instance: "redis"
          app.kubernetes.io/name: "redis"
        name: "redis-data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "8Gi"
