apiVersion: apps/v1
kind: Deployment
metadata:
  name: candidate-metrics-app
  namespace: monitoring
  labels:
    app.kubernetes.io/name: candidate-metrics-app
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: candidate-metrics-app
      release: kube-prometheus-stack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: candidate-metrics-app
        release: kube-prometheus-stack
    spec:
      containers:
        - name: metrics-app
          image: python:3.13.2-alpine3.21
          command:
            - python
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer

              body = b"# HELP candidate_fixture_info Synthetic static fixture.\n# TYPE candidate_fixture_info gauge\ncandidate_fixture_info{fixture=\"prometheus-operator-minimal\"} 1\n"

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/metrics":
                          self.send_error(404)
                          return
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain; version=0.0.4")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def log_message(self, format, *args):
                      pass

              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - name: metrics
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: candidate-metrics-app
  namespace: monitoring
  labels:
    app.kubernetes.io/name: candidate-metrics-app
    release: kube-prometheus-stack
spec:
  selector:
    app.kubernetes.io/name: candidate-metrics-app
    release: kube-prometheus-stack
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: candidate-metrics-app
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: candidate-metrics-app
      release: kube-prometheus-stack
  endpoints:
    - port: metrics
