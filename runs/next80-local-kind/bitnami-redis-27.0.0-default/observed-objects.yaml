imeout -s 15 $timeout redis-cli \\\"${args[@]}\\\" \\\"$@\\\"\\n}\\n\\n[[ -f $REDIS_PASSWORD_FILE ]] \\u0026\\u0026 export REDIS_PASSWORD=\\\"$(\\u003c \\\"${REDIS_PASSWORD_FILE}\\\")\\\"\\n[[ -n \\\"$REDIS_PASSWORD\\\" ]] \\u0026\\u0026 export REDISCLI_AUTH=\\\"$REDIS_PASSWORD\\\"\\nresponse=$(run_redis_command ping)\\nif [ \\\"$?\\\" -eq \\\"124\\\" ]; then\\n  echo \\\"Timed out\\\"\\n  exit 1\\nfi\\nif [ \\\"$response\\\" != \\\"PONG\\\" ]; then\\n  echo \\\"$response\\\"\\n  exit 1\\nfi\",\"ping_readiness_local_and_master.sh\":\"script_dir=\\\"$(dirname \\\"$0\\\")\\\"\\nexit_status=0\\n\\\"$script_dir/ping_readiness_local.sh\\\" $1 || exit_status=$?\\n\\\"$script_dir/ping_readiness_master.sh\\\" $1 || exit_status=$?\\nexit $exit_status\",\"ping_readiness_master.sh\":\"#!/bin/bash\\n\\n[[ -f $REDIS_MASTER_PASSWORD_FILE ]] \\u0026\\u0026 export REDIS_MASTER_PASSWORD=\\\"$(\\u003c \\\"${REDIS_MASTER_PASSWORD_FILE}\\\")\\\"\\n[[ -n \\\"$REDIS_MASTER_PASSWORD\\\" ]] \\u0026\\u0026 export REDISCLI_AUTH=\\\"$REDIS_MASTER_PASSWORD\\\"\\nresponse=$(\\n  timeout -s 15 $1 \\\\\\n  redis-cli \\\\\\n    -h $REDIS_MASTER_HOST \\\\\\n    -p $REDIS_MASTER_PORT_NUMBER \\\\\\n    ping\\n)\\nif [ \\\"$?\\\" -eq \\\"124\\\" ]; then\\n  echo \\\"Timed out\\\"\\n  exit 1\\nfi\\nif [ \\\"$response\\\" != \\\"PONG\\\" ]; then\\n  echo \\\"$response\\\"\\n  exit 1\\nfi\"},\"kind\":\"ConfigMap\",\"metadata\":{\"annotations\":{},\"labels\":{\"app.kubernetes.io/instance\":\"redis\",\"app.kubernetes.io/managed-by\":\"Helm\",\"app.kubernetes.io/name\":\"redis\",\"app.kubernetes.io/version\":\"8.8.0\",\"helm.sh/chart\":\"redis-27.0.0\"},\"name\":\"redis-health\",\"namespace\":\"redis\"}}\n"
