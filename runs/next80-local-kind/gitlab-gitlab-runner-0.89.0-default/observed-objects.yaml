ts/gcs-application-credentials-file\\\"\\nelse\\n  if [[ -f /secrets/gcs-access-id \\u0026\\u0026 -f /secrets/gcs-private-key ]]; then\\n    export CACHE_GCS_ACCESS_ID=$(cat /secrets/gcs-access-id)\\n    # echo -e used to make private key multiline (in google json auth key private key is oneline with \\\\n)\\n    export CACHE_GCS_PRIVATE_KEY=$(echo -e $(cat /secrets/gcs-private-key))\\n  fi\\nfi\\n\\nif [[ -f /secrets/azure-account-name \\u0026\\u0026 -f /secrets/azure-account-key ]]; then\\n  export CACHE_AZURE_ACCOUNT_NAME=$(cat /secrets/azure-account-name)\\n  export CACHE_AZURE_ACCOUNT_KEY=$(cat /secrets/azure-account-key)\\nfi\\n\\nif [[ -f /secrets/runner-registration-token ]]; then\\n  export REGISTRATION_TOKEN=$(cat /secrets/runner-registration-token)\\nfi\\n\\nif [[ -f /secrets/runner-token ]]; then\\n  export CI_SERVER_TOKEN=$(cat /secrets/runner-token)\\nfi\\nif ! sh /configmaps/register-the-runner; then\\n  exit 1\\nfi\\n\\n# Run pre-entrypoint-script\\nif ! bash /configmaps/pre-entrypoint-script; then\\n  exit 1\\nfi\\n\\n# Start the runner\\nexec /entrypoint run \\\\\\n  --working-directory=/home/gitlab-runner\\n\",\"pre-entrypoint-script\":\"\",\"register-the-runner\":\"#!/bin/sh\\nsignal_handler() {\\n  if [ ! -d \\\"/proc/$register_pid\\\" ]; then\\n    wait $register_pid\\n  fi\\n  exit\\n}\\ntrap 'signal_handler' QUIT INT\\n\\nMAX_REGISTER_ATTEMPTS=30\\n\\n# Reset/unset the not needed flags when an authentication token\\nRUN_UNTAGGED=\\\"\\\"\\nACCESS_LEVEL=\\\"\\\"\\n\\nif [ -n \\\"$CI_SERVER_TOKEN\\\" ] \\u0026\\u0026 [ \\\"${CI_SERVER_TOKEN#glrt-}\\\" != \\\"$CI_SERVER_TOKEN\\\" ]; then\\n  RUN_UNTAGGED=\\\"\\\"\\n  ACCESS_LEVEL=\\\"\\\"\\n  unset REGISTER_LOCKED\\n  unset RUNNER_TAG_LIST\\nfi\\n\\nfor i in $(seq 1 \\\"${MAX_REGISTER_ATTEMPTS}\\\"); do\\n  echo \\\"Registration attempt ${i} of ${MAX_REGISTER_ATTEMPTS}\\\"\\n  /entrypoint register \\\\\\n    ${RUN_UNTAGGED} \\\\\\n    ${ACCESS_LEVEL} \\\\\\n    --template-config /configmaps/config.template.toml \\\\\\n    --non-interactive \\u0026\\n\\n  register_pid=$!\\n  wait $register_pid\\n  retval=$?\\n\\n  if [ ${retval} = 0 ]; then\\n    break\\n  elif [ ${i} = ${MAX_REGISTER_ATTEMPTS} ]; then\\n    exit 1\\n  fi\\n\\n  sleep 5\\ndone\\n\"},\"kind\":\"ConfigMap\",\"metadata\":{\"annotations\":{},\"labels\":{\"app\":\"gitlab-runner\",\"chart\":\"gitlab-runner-0.89.0\",\"heritage\":\"Helm\",\"release\":\"gitlab-runner\"},\"name\":\"gitlab-runner\",\"namespace\":\"default\"}}\n"
