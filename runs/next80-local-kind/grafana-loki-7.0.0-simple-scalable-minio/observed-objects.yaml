cached-client._tcp.loki-results-cache.loki.svc.cluster.local\\n        consistent_hash: true\\n        timeout: 500ms\\n        update_interval: 1m\\nruler:\\n  storage:\\n    s3:\\n      bucketnames: ruler\\n    type: s3\\n  wal:\\n    dir: /var/loki/ruler-wal\\nruntime_config:\\n  file: /etc/loki/runtime-config/runtime-config.yaml\\nschema_config:\\n  configs:\\n  - from: \\\"2024-04-01\\\"\\n    index:\\n      period: 24h\\n      prefix: loki_index_\\n    object_store: s3\\n    schema: v13\\n    store: tsdb\\nserver:\\n  grpc_listen_port: 9095\\n  http_listen_port: 3100\\n  http_server_read_timeout: 600s\\n  http_server_write_timeout: 600s\\nstorage_config:\\n  bloom_shipper:\\n    working_directory: /var/loki/data/bloomshipper\\n  boltdb_shipper:\\n    index_gateway_client:\\n      server_address: dns+loki-backend-headless.loki.svc.cluster.local:9095\\n  hedging:\\n    at: 250ms\\n    max_per_second: 20\\n    up_to: 3\\n  tsdb_shipper:\\n    index_gateway_client:\\n      server_address: dns+loki-backend-headless.loki.svc.cluster.local:9095\\n  use_thanos_objstore: false\\ntracing:\\n  enabled: false\\n\"},\"kind\":\"ConfigMap\",\"metadata\":{\"annotations\":{},\"labels\":{\"app.kubernetes.io/instance\":\"loki\",\"app.kubernetes.io/name\":\"loki\",\"app.kubernetes.io/version\":\"3.6.7\",\"helm.sh/chart\":\"loki-7.0.0\"},\"name\":\"loki\",\"namespace\":\"loki\"}}\n"
