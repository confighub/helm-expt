        kubectl.kubernetes.io/last-applied-configuration: "{\"apiVersion\":\"v1\",\"data\":{\"add-policy\":\"#!/bin/sh\\nset -e ; # Have script exit in the event of a failed command.\\nMC_CONFIG_DIR=\\\"/etc/minio/mc/\\\"\\nMC=\\\"/usr/bin/mc --insecure --config-dir ${MC_CONFIG_DIR}\\\"\\n\\n# connectToMinio\\n# Use a check-sleep-check loop to wait for MinIO service to be available\\nconnectToMinio() {\\n  SCHEME=$1\\n  ATTEMPTS=0 ; LIMIT=29 ; # Allow 30 attempts\\n  set -e ; # fail if we can't read the keys.\\n  ACCESS=$(cat /config/rootUser) ; SECRET=$(cat /config/rootPassword) ;\\n  set +e ; # The connections to minio are allowed to fail.\\n  echo \\\"Connecting to MinIO server: $SCHEME://$MINIO_ENDPOINT:$MINIO_PORT\\\" ;\\n  MC_COMMAND=\\\"${MC} alias set myminio $SCHEME://$MINIO_ENDPOINT:$MINIO_PORT $ACCESS $SECRET\\\" ;\\n  $MC_COMMAND ;\\n  STATUS=$? ;\\n  until [ $STATUS = 0 ]\\n  do\\n    ATTEMPTS=`expr $ATTEMPTS + 1` ;\\n    echo \\\\\\\"Failed attempts: $ATTEMPTS\\\\\\\" ;\\n    if [ $ATTEMPTS -gt $LIMIT ]; then\\n      exit 1 ;\\n    fi ;\\n    sleep 2 ; # 1 second intervals between attempts\\n    $MC_COMMAND ;\\n    STATUS=$? ;\\n  done ;\\n  set -e ; # reset `e` as active\\n  return 0\\n}\\n\\n# checkPolicyExists ($policy)\\n# Check if the policy exists, by using the exit code of `mc admin policy info`\\ncheckPolicyExists() {\\n  POLICY=$1\\n  CMD=$(${MC} admin policy info myminio $POLICY \\u003e /dev/null 2\\u003e\\u00261)\\n  return $?\\n}\\n\\n# createPolicy($name, $filename)\\ncreatePolicy () {\\n  NAME=$1\\n  FILENAME=$2\\n\\n  # Create the name if it does not exist\\n  echo \\\"Checking policy: $NAME (in /config/$FILENAME.json)\\\"\\n  if ! checkPolicyExists $NAME ; then\\n    echo \\\"Creating policy '$NAME'\\\"\\n  else\\n    echo \\\"Policy '$NAME' already exists.\\\"\\n  fi\\n  ${MC} admin policy create myminio $NAME /config/$FILENAME.json\\n\\n}\\n\\n# Try connecting to MinIO instance\\nscheme=http\\nconnectToMinio $scheme\",\"add-svcacct\":\"#!/bin/sh\\nset -e ; # Have script exit in the event of a failed command.\\nMC_CONFIG_DIR=\\\"/etc/minio/mc/\\\"\\nMC=\\\"/usr/bin/mc --insecure --config-dir ${MC_CONFIG_DIR}\\\"\\n\\n# AccessKey and secretkey credentials file are added to prevent shell execution errors caused by special characters.\\n# Special characters for example : ',\\\",\\u003c,\\u003e,{,}\\nMINIO_ACCESSKEY_SECRETKEY_TMP=\\\"/tmp/accessKey_and_secretKey_svcacct_tmp\\\"\\n\\n# connectToMinio\\n# Use a check-sleep-check loop to wait for MinIO service to be available\\nconnectToMinio() {\\n  SCHEME=$1\\n  ATTEMPTS=0 ; LIMIT=29 ; # Allow 30 attempts\\n  set -e ; # fail if we can't read the keys.\\n  ACCESS=$(cat /config/rootUser) ; SECRET=$(cat /config/rootPassword) ;\\n  set +e ; # The connections to minio are allowed to fail.\\n  echo \\\"Connecting to MinIO server: $SCHEME://$MINIO_ENDPOINT:$MINIO_PORT\\\" ;\\n  MC_COMMAND=\\\"${MC} alias set myminio $SCHEME://$MINIO_ENDPOINT:$MINIO_PORT $ACCESS $SECRET\\\" ;\\n  $MC_COMMAND ;\\n  STATUS=$? ;\\n  until [ $STATUS = 0 ]\\n  do\\n    ATTEMPTS=`expr $ATTEMPTS + 1` ;\\n    echo \\\\\\\"Failed attempts: $ATTEMPTS\\\\\\\" ;\\n    if [ $ATTEMPTS -gt $LIMIT ]; then\\n      exit 1 ;\\n    fi ;\\n    sleep 2 ; # 2 second intervals between attempts\\n    $MC_COMMAND ;\\n    STATUS=$? ;\\n  done ;\\n  set -e ; # reset `e` as active\\n  return 0\\n}\\n\\n# checkSvcacctExists ()\\n# Check if the svcacct exists, by using the exit code of `mc admin user svcacct info`\\ncheckSvcacctExists() {\\n  CMD=$(${MC} admin user svcacct info myminio $(head -1 $MINIO_ACCESSKEY_SECRETKEY_TMP) \\u003e /dev/null 2\\u003e\\u00261)\\n  return $?\\n}\\n\\n# createSvcacct ($user)\\ncreateSvcacct () {\\n  USER=$1\\n  FILENAME=$2\\n  #check accessKey_and_secretKey_tmp file\\n  if [[ ! -f $MINIO_ACCESSKEY_SECRETKEY_TMP ]];then\\n    echo \\\"credentials file does not exist\\\"\\n    return 1\\n  fi\\n  if [[ $(cat $MINIO_ACCESSKEY_SECRETKEY_TMP|wc -l) -ne 2 ]];then\\n    echo \\\"credentials file is invalid\\\"\\n    rm -f $MINIO_ACCESSKEY_SECRETKEY_TMP\\n    return 1\\n  fi\\n  SVCACCT=$(head -1 $MINIO_ACCESSKEY_SECRETKEY_TMP)\\n  # Create the svcacct if it does not exist\\n  if ! checkSvcacctExists ; then\\n    echo \\\"Creating svcacct '$SVCACCT'\\\"\\n    # Check if policy file is define\\n    if [ -z $FILENAME ]; then\\n      ${MC} admin user svcacct add --access-key $(head -1 $MINIO_ACCESSKEY_SECRETKEY_TMP) --secret-key $(tail -n1 $MINIO_ACCESSKEY_SECRETKEY_TMP) myminio $USER\\n    else\\n      ${MC} admin user svcacct add --access-key $(head -1 $MINIO_ACCESSKEY_SECRETKEY_TMP) --secret-key $(tail -n1 $MINIO_ACCESSKEY_SECRETKEY_TMP) --policy /config/$FILENAME.json myminio $USER\\n    fi\\n  else\\n    echo \\\"Svcacct '$SVCACCT' already exists.\\\"\\n  fi\\n  #clean up credentials files.\\n  rm -f $MINIO_ACCESSKEY_SECRETKEY_TMP\\n}\\n\\n# Try connecting to MinIO instance\\nscheme=http\\nconnectToMinio $scheme\",\"add-user\":\"#!/bin/sh\\nset -e ; # Have script exit in the event of a failed command.\\nMC_CONFIG_DIR=\\\"/etc/minio/mc/\\\"\\nMC=\\\"/usr/bin/mc --insecure --config-dir ${MC_CONFIG_DIR}\\\"\\n\\n# AccessKey and secretkey credentials file are added to prevent shell execution errors caused by special characters.\\n# Special characters for example : ',\\\",\\u003c,\\u003e,{,}\\nMINIO_ACCESSKEY_SECRETKEY_TMP=\\\"/tmp/accessKey_and_secretKey_tmp\\\"\\n\\n# connectToMinio\\n# Use a check-sleep-check loop to wait for MinIO service to be available\\nconnectToMinio() {\\n  SCHEME=$1\\n  ATTEMPTS=0 ; LIMIT=29 ; # Allow 30 attempts\\n  set -e ; # fail if we can't read the keys.\\n  ACCESS=$(cat /config/rootUser) ; SECRET=$(cat /config/rootPassword) ;\\n  set +e ; # The connections to minio are allowed to fail.\\n  echo \\\"Connecting to MinIO server: $SCHEME://$MINIO_ENDPOINT:$MINIO_PORT\\\" ;\\n  MC_COMMAND=\\\"${MC} alias set myminio $SCHEME://$MINIO_ENDPOINT:$MINIO_PORT $ACCESS $SECRET\\\" ;\\n  $MC_COMMAND ;\\n  STATUS=$? ;\\n  until [ $STATUS = 0 ]\\n  do\\n    ATTEMPTS=`expr $ATTEMPTS + 1` ;\\n    echo \\\\\\\"Failed attempts: $ATTEMPTS\\\\\\\" ;\\n    if [ $ATTEMPTS -gt $LIMIT ]; then\\n      exit 1 ;\\n    fi ;\\n    sleep 2 ; # 1 second intervals between attempts\\n    $MC_COMMAND ;\\n    STATUS=$? ;\\n  done ;\\n  set -e ; # reset `e` as active\\n  return 0\\n}\\n\\n# checkUserExists ()\\n# Check if the user exists, by using the exit code of `mc admin user info`\\ncheckUserExists() {\\n  CMD=$(${MC} admin user info myminio $(head -1 $MINIO_ACCESSKEY_SECRETKEY_TMP) \\u003e /dev/null 2\\u003e\\u00261)\\n  return $?\\n}\\n\\n# createUser ($policy)\\ncreateUser() {\\n  POLICY=$1\\n  #check accessKey_and_secretKey_tmp file\\n  if [[ ! -f $MINIO_ACCESSKEY_SECRETKEY_TMP ]];then\\n    echo \\\"credentials file does not exist\\\"\\n    return 1\\n  fi\\n  if [[ $(cat $MINIO_ACCESSKEY_SECRETKEY_TMP|wc -l) -ne 2 ]];then\\n    echo \\\"credentials file is invalid\\\"\\n    rm -f $MINIO_ACCESSKEY_SECRETKEY_TMP\\n    return 1\\n  fi\\n  USER=$(head -1 $MINIO_ACCESSKEY_SECRETKEY_TMP)\\n  # Create the user if it does not exist\\n  if ! checkUserExists ; then\\n    echo \\\"Creating user '$USER'\\\"\\n    cat $MINIO_ACCESSKEY_SECRETKEY_TMP | ${MC} admin user add myminio\\n  else\\n    echo \\\"User '$USER' already exists.\\\"\\n  fi\\n  #clean up credentials files.\\n  rm -f $MINIO_ACCESSKEY_SECRETKEY_TMP\\n\\n  # set policy for user\\n  if [ ! -z $POLICY -a $POLICY != \\\" \\\" ] ; then\\n      echo \\\"Adding policy '$POLICY' for '$USER'\\\"\\n      set +e ; # policy already attach errors out, allow it.\\n      ${MC} admin policy attach myminio $POLICY --user=$USER\\n      set -e\\n  else\\n      echo \\\"User '$USER' has no policy attached.\\\"\\n  fi\\n}\\n\\n# Try connecting to MinIO instance\\nscheme=http\\nconnectToMinio $scheme\\n\\n\\n\\n# Create the users\\necho logs-user \\u003e $MINIO_ACCESSKEY_SECRETKEY_TMP\\necho supersecretpassword \\u003e\\u003e $MINIO_ACCESSKEY_SECRETKEY_TMP\\ncreateUser readwrite\",\"custom-command\":\"#!/bin/sh\\nset -e ; # Have script exit in the event of a failed command.\\nMC_CONFIG_DIR=\\\"/etc/minio/mc/\\\"\\nMC=\\\"/usr/bin/mc --insecure --config-dir ${MC_CONFIG_DIR}\\\"\\n\\n# connectToMinio\\n# Use a check-sleep-check loop to wait for MinIO service to be available\\nconnectToMinio() {\\n  SCHEME=$1\\n  ATTEMPTS=0 ; LIMIT=29 ; # Allow 30 attempts\\n  set -e ; # fail if we can't read the keys.\\n  ACCESS=$(cat /config/rootUser) ; SECRET=$(cat /config/rootPassword) ;\\n  set +e ; # The connections to minio are allowed to fail.\\n  echo \\\"Connecting to MinIO server: $SCHEME://$MINIO_ENDPOINT:$MINIO_PORT\\\" ;\\n  MC_COMMAND=\\\"${MC} alias set myminio $SCHEME://$MINIO_ENDPOINT:$MINIO_PORT $ACCESS $SECRET\\\" ;\\n  $MC_COMMAND ;\\n  STATUS=$? ;\\n  until [ $STATUS = 0 ]\\n  do\\n    ATTEMPTS=`expr $ATTEMPTS + 1` ;\\n    echo \\\\\\\"Failed attempts: $ATTEMPTS\\\\\\\" ;\\n    if [ $ATTEMPTS -gt $LIMIT ]; then\\n      exit 1 ;\\n    fi ;\\n    sleep 2 ; # 1 second intervals between attempts\\n    $MC_COMMAND ;\\n    STATUS=$? ;\\n  done ;\\n  set -e ; # reset `e` as active\\n  return 0\\n}\\n\\n# runCommand ($@)\\n# Run custom mc command\\nrunCommand() {\\n  ${MC} \\\"$@\\\"\\n  return $?\\n}\\n\\n# Try connecting to MinIO instance\\nscheme=http\\nconnectToMinio $scheme\",\"initialize\":\"#!/bin/sh\\nset -e # Have script exit in the event of a failed command.\\nMC_CONFIG_DIR=\\\"/etc/minio/mc/\\\"\\nMC=\\\"/usr/bin/mc --insecure --config-dir ${MC_CONFIG_DIR}\\\"\\n\\n# connectToMinio\\n# Use a check-sleep-check loop to wait for MinIO service to be available\\nconnectToMinio() {\\n\\tSCHEME=$1\\n\\tATTEMPTS=0\\n\\tLIMIT=29 # Allow 30 attempts\\n\\tset -e   # fail if we can't read the keys.\\n\\tACCESS=$(cat /config/rootUser)\\n\\tSECRET=$(cat /config/rootPassword)\\n\\tset +e # The connections to minio are allowed to fail.\\n\\techo \\\"Connecting to MinIO server: $SCHEME://$MINIO_ENDPOINT:$MINIO_PORT\\\"\\n\\tMC_COMMAND=\\\"${MC} alias set myminio $SCHEME://$MINIO_ENDPOINT:$MINIO_PORT $ACCESS $SECRET\\\"\\n\\t$MC_COMMAND\\n\\tSTATUS=$?\\n\\tuntil [ $STATUS = 0 ]; do\\n\\t\\tATTEMPTS=$(expr $ATTEMPTS + 1)\\n\\t\\techo \\\\\\\"Failed attempts: $ATTEMPTS\\\\\\\"\\n\\t\\tif [ $ATTEMPTS -gt $LIMIT ]; then\\n\\t\\t\\texit 1\\n\\t\\tfi\\n\\t\\tsleep 2 # 1 second intervals between attempts\\n\\t\\t$MC_COMMAND\\n\\t\\tSTATUS=$?\\n\\tdone\\n\\tset -e # reset `e` as active\\n\\treturn 0\\n}\\n\\n# checkBucketExists ($bucket)\\n# Check if the bucket exists, by using the exit code of `mc ls`\\ncheckBucketExists() {\\n\\tBUCKET=$1\\n\\tCMD=$(${MC} stat myminio/$BUCKET \\u003e/dev/null 2\\u003e\\u00261)\\n\\treturn $?\\n}\\n\\n# createBucket ($bucket, $policy, $purge)\\n# Ensure bucket exists, purging if asked to\\ncreateBucket() {\\n\\tBUCKET=$1\\n\\tPOLICY=$2\\n\\tPURGE=$3\\n\\tVERSIONING=$4\\n\\tOBJECTLOCKING=$5\\n\\n\\t# Purge the bucket, if set \\u0026 exists\\n\\t# Since PURGE is user input, check explicitly for `true`\\n\\tif [ $PURGE = true ]; then\\n\\t\\tif checkBucketExists $BUCKET; then\\n\\t\\t\\techo \\\"Purging bucket '$BUCKET'.\\\"\\n\\t\\t\\tset +e # don't exit if this fails\\n\\t\\t\\t${MC} rm -r --force myminio/$BUCKET\\n\\t\\t\\tset -e # reset `e` as active\\n\\t\\telse\\n\\t\\t\\techo \\\"Bucket '$BUCKET' does not exist, skipping purge.\\\"\\n\\t\\tfi\\n\\tfi\\n\\n\\t# Create the bucket if it does not exist and set objectlocking if enabled (NOTE: versioning will be not changed if OBJECTLOCKING is set because it enables versioning to the Buckets created)\\n\\tif ! checkBucketExists $BUCKET; then\\n\\t\\tif [ ! -z $OBJECTLOCKING ]; then\\n\\t\\t\\tif [ $OBJECTLOCKING = true ]; then\\n\\t\\t\\t\\techo \\\"Creating bucket with OBJECTLOCKING '$BUCKET'\\\"\\n\\t\\t\\t\\t${MC} mb --with-lock myminio/$BUCKET\\n\\t\\t\\telif [ $OBJECTLOCKING = false ]; then\\n\\t\\t\\t\\techo \\\"Creating bucket '$BUCKET'\\\"\\n\\t\\t\\t\\t${MC} mb myminio/$BUCKET\\n\\t\\t\\tfi\\n\\t\\telif [ -z $OBJECTLOCKING ]; then\\n\\t\\t\\techo \\\"Creating bucket '$BUCKET'\\\"\\n\\t\\t\\t${MC} mb myminio/$BUCKET\\n\\t\\telse\\n\\t\\t\\techo \\\"Bucket '$BUCKET' already exists.\\\"\\n\\t\\tfi\\n\\tfi\\n\\n\\t# set versioning for bucket if objectlocking is disabled or not set\\n\\tif [ $OBJECTLOCKING = false ]; then\\n\\t\\tif [ ! -z $VERSIONING ]; then\\n\\t\\t\\tif [ $VERSIONING = true ]; then\\n\\t\\t\\t\\techo \\\"Enabling versioning for '$BUCKET'\\\"\\n\\t\\t\\t\\t${MC} version enable myminio/$BUCKET\\n\\t\\t\\telif [ $VERSIONING = false ]; then\\n\\t\\t\\t\\techo \\\"Suspending versioning for '$BUCKET'\\\"\\n\\t\\t\\t\\t${MC} version suspend myminio/$BUCKET\\n\\t\\t\\tfi\\n\\t\\tfi\\n\\telse\\n\\t\\techo \\\"Bucket '$BUCKET' versioning unchanged.\\\"\\n\\tfi\\n\\n\\t# At this point, the bucket should exist, skip checking for existence\\n\\t# Set policy on the bucket\\n\\techo \\\"Setting policy of bucket '$BUCKET' to '$POLICY'.\\\"\\n\\t${MC} anonymous set $POLICY myminio/$BUCKET\\n}\\n\\n# Try connecting to MinIO instance\\nscheme=http\\nconnectToMinio $scheme\\n\\n\\n\\n# Create the buckets\\ncreateBucket chunks \\\"none\\\" false false false\\ncreateBucket ruler \\\"none\\\" false false false\\ncreateBucket admin \\\"none\\\" false false false\"},\"kind\":\"ConfigMap\",\"metadata\":{\"annotations\":{},\"labels\":{\"app\":\"minio\",\"chart\":\"minio-5.4.0\",\"heritage\":\"Helm\",\"release\":\"loki\"},\"name\":\"loki-minio\",\"namespace\":\"loki\"}}\n"
