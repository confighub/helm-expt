      01_sources.conf: "## logs from podman\n<source>\n  @type tail\n  @id in_tail_container_logs\n  @label @KUBERNETES\n  path /var/log/containers/*.log\n  pos_file /var/log/fluentd-containers.log.pos\n  tag kubernetes.*\n  read_from_head true\n  <parse>\n    @type multi_format\n    <pattern>\n      format json\n      time_key time\n      time_type string\n      time_format \"%Y-%m-%dT%H:%M:%S.%NZ\"\n      keep_time_key false\n    </pattern>\n    <pattern>\n      format regexp\n      expression /^(?<time>.+) (?<stream>stdout|stderr)( (.))? (?<log>.*)$/\n      time_format '%Y-%m-%dT%H:%M:%S.%NZ'\n      keep_time_key false\n    </pattern>\n  </parse>\n  emit_unmatched_lines true\n</source>\n\n# expose metrics in prometheus format\n<source>\n  @type prometheus\n  bind 0.0.0.0\n  port 24231\n  metrics_path /metrics\n</source>"
      02_filters.conf: "<label @KUBERNETES>\n  <match kubernetes.var.log.containers.fluentd**>\n    @type relabel\n    @label @FLUENT_LOG\n  </match>\n\n  # <match kubernetes.var.log.containers.**_kube-system_**>\n  #   @type null\n  #   @id ignore_kube_system_logs\n  # </match>\n\n  <filter kubernetes.**>\n    @type kubernetes_metadata\n    @id filter_kube_metadata\n    skip_labels false\n    skip_container_metadata false\n    skip_namespace_metadata true\n    skip_master_url true\n  </filter>\n\n  <match **>\n    @type relabel\n    @label @DISPATCH\n  </match>\n</label>"
      03_dispatch.conf: "<label @DISPATCH>\n  <filter **>\n    @type prometheus\n    <metric>\n      name fluentd_input_status_num_records_total\n      type counter\n      desc The total number of incoming records\n      <labels>\n        tag ${tag}\n        hostname ${hostname}\n      </labels>\n    </metric>\n  </filter>\n\n  <match **>\n    @type relabel\n    @label @OUTPUT\n  </match>\n</label>"
      04_outputs.conf: "<label @OUTPUT>\n  <match **>\n    @type elasticsearch\n    host \"elasticsearch-master\"\n    port 9200\n    path \"\"\n    user elastic\n    password changeme\n    # Don't wait for elastic to start up.\n    verify_es_version_at_startup false\n  </match>\n</label>"
    kind: "ConfigMap"
