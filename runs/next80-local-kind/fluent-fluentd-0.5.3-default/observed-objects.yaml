+)\\\\s+\\\\d+ (?\\u003cfile\\u003e[a-zA-Z-_.]+):(?\\u003cline\\u003e[\\\\d]+)\\\\]\\\\s+(?\\u003clog\\u003e.*)$/\\n    \\u003c/parse\\u003e\\n    reserve_data true\\n    reserve_time true\\n  \\u003c/filter\\u003e\\n\\n  \\u003cfilter etcd.systemd\\u003e\\n    @type parser\\n    key_name message\\n    \\u003cparse\\u003e\\n      @type regexp\\n      expression /^([^ ]+\\\\s[^ ]+) (?\\u003clevel\\u003e[A-Z]) \\\\| (?\\u003ccomponent\\u003e[a-zA-Z-_.]+): (?\\u003clog\\u003e.*)$/\\n    \\u003c/parse\\u003e\\n    reserve_data true\\n    reserve_time true\\n  \\u003c/filter\\u003e\\n\\n  \\u003cfilter **\\u003e\\n    @type record_transformer\\n    enable_ruby\\n    \\u003crecord\\u003e\\n      raw ${record[\\\"message\\\"]}\\n    \\u003c/record\\u003e\\n    remove_keys message\\n  \\u003c/filter\\u003e\\n\\n  \\u003cmatch **\\u003e\\n    @type relabel\\n    @label @DISPATCH\\n  \\u003c/match\\u003e\\n\\u003c/label\\u003e\"},\"kind\":\"ConfigMap\",\"metadata\":{\"annotations\":{},\"labels\":{\"app.kubernetes.io/instance\":\"fluentd\",\"app.kubernetes.io/managed-by\":\"Helm\",\"app.kubernetes.io/name\":\"fluentd\",\"app.kubernetes.io/version\":\"v1.17.1\",\"helm.sh/chart\":\"fluentd-0.5.3\"},\"name\":\"fluentd-systemd-conf-fluentd\",\"namespace\":\"default\"}}\n"
