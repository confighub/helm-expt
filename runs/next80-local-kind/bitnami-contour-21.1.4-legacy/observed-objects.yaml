                                  enum:
                                    - "Strict"
                                    - "Lax"
                                    - "None"
                                  type: "string"
                                secure:
                                  description: "Secure enables rewriting the Set-Cookie Secure element.\nIf not set, Secure attribute will not be rewritten."
                                  type: "boolean"
