t MONGODB_EXTRA_PASSWORDS=\\\"\\\"\\n    export MONGODB_ROOT_PASSWORD_FILE=\\\"\\\"\\n    export MONGODB_EXTRA_USERNAMES_FILE=\\\"\\\"\\n    export MONGODB_EXTRA_DATABASES_FILE=\\\"\\\"\\n    export MONGODB_EXTRA_PASSWORDS_FILE=\\\"\\\"\\nfi\\nexec /opt/bitnami/scripts/mongodb/entrypoint.sh /opt/bitnami/scripts/mongodb/run.sh\"},\"kind\":\"ConfigMap\",\"metadata\":{\"annotations\":{},\"labels\":{\"app.kubernetes.io/component\":\"mongodb\",\"app.kubernetes.io/instance\":\"mongodb\",\"app.kubernetes.io/managed-by\":\"Helm\",\"app.kubernetes.io/name\":\"mongodb\",\"app.kubernetes.io/version\":\"8.3.2\",\"helm.sh/chart\":\"mongodb-19.0.7\"},\"name\":\"mongodb-scripts\",\"namespace\":\"mongodb\"}}\n"
