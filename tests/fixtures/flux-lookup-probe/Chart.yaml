apiVersion: v2
name: flux-lookup-probe
description: >-
  Minimal probe chart that records whether Helm's lookup() resolved a live
  cluster Secret. It makes the install-time vs template-time lookup difference
  observable: Flux helm-controller runs `helm upgrade --install` (a live read,
  lookup resolves) while Argo CD renders with `helm template` (no cluster read,
  lookup returns empty). Used by scripts/run-flux-lookup-proof.mjs.
type: application
version: 0.1.0
appVersion: "1.0"
