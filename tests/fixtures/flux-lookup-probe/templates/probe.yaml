{{- /*
  Record whether lookup() resolved the pre-created Secret "flux-lookup-probe".
  - helm install / Flux helm-controller (helm upgrade --install): live read -> found
  - helm template / Argo CD server-side render: no cluster read -> empty -> not found
*/ -}}
{{- $sec := (lookup "v1" "Secret" .Release.Namespace "flux-lookup-probe") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-lookup-probe-result
  labels:
    app.kubernetes.io/name: flux-lookup-probe
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  secret-found: {{ if $sec }}"true"{{ else }}"false"{{ end }}
  observed-token: {{ if $sec }}{{ (index $sec.data "token") | default "" | quote }}{{ else }}""{{ end }}
  lookup-namespace: {{ .Release.Namespace | quote }}
  release: {{ .Release.Name | quote }}
  explanation: >-
    secret-found is "true" only when this chart was rendered with a live cluster
    read (helm install, or Flux helm-controller's helm upgrade --install). A
    template-only render (helm template, or Argo CD's server-side render) cannot
    read the cluster, so lookup() returns empty and secret-found is "false".
