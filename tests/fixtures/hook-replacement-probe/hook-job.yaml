# The routed post-install Job, expressed as the RECOMMENDED replacement rather
# than a Helm hook:
#   - Argo CD reads `argocd.argoproj.io/hook: PostSync` and runs it after the
#     workload syncs (BeforeHookCreation keeps the Completed Job observable).
#   - Flux and kubectl have no notion of that annotation, so they simply apply
#     the Job and it runs once — same outcome.
# scripts/run-hook-replacement-proof.mjs delivers this via each path and checks
# the Job reached succeeded=1 and the workload ConfigMap is present.
apiVersion: batch/v1
kind: Job
metadata:
  name: hook-replacement-migration
  labels:
    app.kubernetes.io/name: hook-replacement-probe
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hook-replacement-probe
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command: ["sh", "-c", "echo 'hook-replacement: migration ran'"]
