apiVersion: catalog.confighub.com/v1alpha1
kind: CredentialBoundaryPolicy
metadata:
  name: credential-boundary
spec:
  description: >-
    No committed configuration in this repository assigns a literal value to a
    credential-shaped environment variable. Secret surfaces carry names or
    substitutions, and the value arrives at install time. The AICR inference
    compiler has enforced this for one entry since the NGC license read. This
    policy is that rule applied to every producer.
  scope:
    include: [".yaml", ".yml"]
    includePrefixes:
      - "packages/"
      - "recipes/"
      - "examples/"
      - "config-catalog/"
      - "tests/"
      - "docs/"
    note: >-
      The scope is what this catalog authors and ships. Rendered analysis output
      under data/ and the generated site both derive from these sources, so a
      finding there would be the same finding twice, and scanning them would add
      minutes to every run for no new information. A literal credential can only
      reach a rendered artifact by coming from one of the directories above,
      where this lane will find it first.

  # A variable whose name matches one of these is treated as a secret surface.
  credentialNamePatterns:
    - password
    - passwd
    - token
    - secret
    - api[_-]?key
    - access[_-]?key
    - credential

  # A value in one of these shapes is not a credential, and the reason each one
  # is here matters more than the pattern.
  # Patterns are matched case-insensitively, so they carry no inline flags.
  notAValue:
    - id: substitution
      pattern: "^(\\$|\\{\\{)"
      reason: >-
        A shell or template substitution is the upstream-intended shape. The
        value arrives at install time, which is the behaviour this policy wants.
    - id: filesystem-path
      pattern: "^/"
      reason: >-
        A path names where a credential will be read from. Container images
        commonly take a path rather than a value, and that is the safer shape.
    - id: boolean-or-empty
      pattern: "^(yes|no|true|false|0|1|none|disabled|enabled|required|optional)$"
      reason: >-
        These variables switch behaviour rather than carry a secret, as in
        ALLOW_EMPTY_PASSWORD=no.

  # A name in one of these shapes describes a credential without holding one.
  notASecretValueName:
    - id: file-or-path-suffix
      pattern: "(_FILE|_PATH)$"
      reason: The variable holds where to read the credential, not the credential.
    - id: switch
      pattern: "(_ENABLED|_REQUIRED|_MODE|_SECURE_|_UPDATE_|^ALLOW_)"
      reason: The variable switches behaviour rather than carrying a secret.
    - id: identifier
      pattern: "(_TYPE|_NAME|_KEY_ID)$"
      reason: The variable names or classifies a credential rather than holding one.

  # Everything the scan still finds. Each exception says why the value is not a
  # credential in that place. The lane refuses an exception that matches
  # nothing, so a stale exemption cannot outlive the thing it excused.
  exceptions:
    - id: ai-change-review-placeholder
      variable: AI_API_KEY
      value: confighubplaceholder
      reason: >-
        A declared placeholder in the AI change-review demonstration. It is the
        literal string a reader is meant to replace, and it authenticates to
        nothing.

    - id: byo-values-review-finding
      variable: AI_API_KEY
      value: sk-prod-old-key-rotate-me
      reason: >-
        Deliberate demonstration input. The bring-your-own-values review flags
        this exact line as its embedded-AI-API-key finding, so removing it would
        delete the evidence that the review catches embedded keys. The value
        authenticates to nothing and its own text says to rotate it.

    - id: consul-login-metadata
      variable: DP_CREDENTIAL_LOGIN_META1
      value: pod=$(NAMESPACE)/$(POD_NAME)
      reason: >-
        Consul dataplane login metadata. The value is downward-API references
        describing which pod is logging in, and it carries no secret. It escapes
        the substitution rule only because the references sit after a prefix.

    - id: consul-login-metadata-component-ingress
      variable: DP_CREDENTIAL_LOGIN_META2
      value: component=ingress-gateway
      reason: Consul dataplane login metadata naming the component, not a secret.

    - id: consul-login-metadata-component-mesh
      variable: DP_CREDENTIAL_LOGIN_META2
      value: component=mesh-gateway
      reason: Consul dataplane login metadata naming the component, not a secret.

    - id: consul-login-metadata-component-terminating
      variable: DP_CREDENTIAL_LOGIN_META2
      value: component=terminating-gateway
      reason: Consul dataplane login metadata naming the component, not a secret.

    - id: eck-webhook-secret-name
      variable: WEBHOOK_SECRET
      value: elastic-operator-webhook-cert
      reason: >-
        The name of the Secret holding the webhook certificate, which is the
        shape this policy wants. The variable name says SECRET and the value is
        a reference.

    - id: vault-dev-mode-root-token
      variable: VAULT_DEV_ROOT_TOKEN_ID
      value: root
      reason: >-
        Upstream's own dev-mode default, in a base whose entire purpose is dev
        mode. Vault in dev mode holds nothing durable and announces this token
        on startup. The base is named dev-mode so nobody reaches it by accident,
        and rewriting upstream's value would misrepresent what the chart ships.
